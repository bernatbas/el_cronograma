  };
  function detectLang(){
    try{
      const saved=localStorage.getItem(LANG_KEY);
      if(saved && I18N_SUPPORTED.indexOf(saved)>=0) return saved;
      const navs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
      for(let i=0;i<navs.length;i++){ const c=String(navs[i]||'').slice(0,2).toLowerCase(); if(I18N_SUPPORTED.indexOf(c)>=0) return c; }
    }catch(_){}
    return I18N_DEFAULT;
  }
  let LANG=detectLang();
  try{ document.documentElement.lang=LANG; }catch(_){}
  // t(clau[,vars]): valor de l'idioma actiu amb fallback a I18N_DEFAULT. Accepta funcions i {var}.
  // Si la clau falta a l'idioma actiu cau al catala, i si no hi es enlloc torna '' (alguns llocs
  // hi compten). En tots dos casos AVISA per consola, un sol cop per clau: un text que cau al
  // catala dins d'una pagina en castella no fa cap error i, sense l'avis, no es veuria.
  // Pseudotraduccio (?lang=xx): l'idioma real segueix sent el catala (Wikidata, ordre alfabetic),
  // pero tot el que passa per t() surt entre ⟦ ⟧ i el que passa per L() entre ⟪ ⟫. Qualsevol text
  // de la pantalla sense marca no passa pel diccionari. Eina de revisio, no un idioma.
  const I18N_PSEUDO=(function(){ try{ return /[?&]lang=xx(&|$)/.test(location.search); }catch(_){ return false; } })();
  const I18N_AVISAT={};
  function i18nAvisa(key,que){ if(I18N_AVISAT[key]) return; I18N_AVISAT[key]=1; try{ console.warn('[i18n] «'+key+'» '+que); }catch(_){} }
  function t(key,vars){
    const d=I18N[LANG]||I18N[I18N_DEFAULT];
    let v=(d&&d[key]!=null)?d[key]:null;
    if(v==null){
      v=I18N[I18N_DEFAULT]?I18N[I18N_DEFAULT][key]:null;
      i18nAvisa(key, v==null?'no existeix al diccionari':'no esta traduida a '+LANG+' (surt en '+I18N_DEFAULT+')');
    }
    if(v==null) return '';
    if(typeof v==='function') v=v(vars||{});
    else if(vars) v=v.replace(/\{(\w+)\}/g,function(m,k){ return vars[k]!=null?vars[k]:m; });
    return I18N_PSEUDO?'⟦'+v+'⟧':v;
  }
  function setLang(code){ if(I18N_SUPPORTED.indexOf(code)<0) return; LANG=code; try{ localStorage.setItem(LANG_KEY,code); document.documentElement.lang=code; }catch(_){} }
  // Prioritat d'idiomes per a Wikidata segons l'idioma actiu (p.ex. 'en' => 'en|ca|es').
  // 'mul' al final: Wikidata va migrar els noms en alfabet llati a UNA etiqueta multilingue
  // i va esborrar les per idioma. Sense aixo, isValid() descartava l'Einstein, la Marie
  // Curie i el Mozart —creia que no tenien nom— i no podien ser personatge del dia.
  function wdLangs(){ const base=['ca','es','en','mul']; return [LANG].concat(base.filter(function(l){return l!==LANG;})).join('|'); }
  // Aplica els textos estatics marcats amb data-i18n / data-i18n-title / data-i18n-aria.
  function applyI18nStatic(scope){
    const s=scope||document;
    s.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    s.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.title=t(el.getAttribute('data-i18n-title')); });
    s.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label',t(el.getAttribute('data-i18n-aria'))); });
    try{ document.title=t('doc_title'); }catch(_){}
  }

  // --- Catàleg de jocs ---
  // Només hi ha d'haver jocs que FUNCIONIN. Una targeta que no fa res no crea expectativa,
  // resta credibilitat: és el primer senyal que això encara no està acabat.
  // El mecanisme del distintiu «🚧 Pròximament» es queda (qualsevol joc sense mòdul el rep,
  // veure badge()), així que tornar a posar-n'hi un és afegir la línia i prou.
  // Tret del hub el 14/11/2026: 'personatge' («Endevina el personatge»), que no té mòdul.
  // Les seves claus t_personatge/d_personatge es queden al diccionari, a punt.
  const GAMES=[
    {id:'ordena',       ic:'🕰️', titleKey:'t_ordena',        descKey:'d_ordena'},
    {id:'abansdespres', ic:'⚖️', titleKey:'t_abansdespres',  descKey:'d_abansdespres'},
    {id:'memory',       ic:'🃏', titleKey:'t_memory',        descKey:'d_memory'},
    {id:'contemporanis',ic:'🤝', titleKey:'t_contemporanis', descKey:'d_contemporanis'},
    {id:'personatgedia',ic:'🎭', titleKey:'t_personatgedia', descKey:'d_personatgedia', discover:true}   // a l'última des del 21/11/2026 (menú i «Següent joc»)
  ];
  const app=document.getElementById('app');
  let activeModule=null;
  let hubCd=null;

  function dataOk(){return !!(window.HB_DATA && HB_DATA.PEOPLE && HB_DATA.EVENTS);}

  // ---- Utils compartits ----
  const fmtYear = y => y<0 ? Math.abs(y)+' '+t('bce') : String(y);
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } }
  function writeLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }

  // ---- Utils del repte diari: determinisme per data (mitjanit LOCAL de cada jugador) ----
  function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return todayStr(d); }
  // RATXA = dies seguits ACABANT el joc, guanyis o perdis (decisio d'en Bernat, 16/11/2026). Es marca
  // en acabar; fallar no la trenca mai, i qui no havia jugat o feia dies que no jugava comenca a 1.
  // Idempotent: cridar-la mes d'un cop el mateix dia no suma res. {last, days}
  // ===== Final de partida, igual a tots els jocs (17/11/2026) =====
  // Títol (4 nivells, el 1 és el millor; cada joc hi posa els seus llindars, veure ESTRATEGIA_JOC.md)
  // + marcador de DUES xifres: el resultat del joc i la ratxa. Sense «Ja has jugat…»: ho diu el compte enrere.
  function resTitol(n,tag){ tag=tag||'div'; return '<'+tag+' class="rtitle'+(n===1?' perfect':'')+'">'+t('res_lvl'+n)+'</'+tag+'>'; }
  function resMarcador(v1,k1,days){
    return '<div class="stats"><div class="stat"><div class="v">'+ICO_DIANA+v1+'</div><div class="k">'+k1+'</div></div>'
      +'<div class="stat"><div class="v">'+ICO_FLAMA+days+'</div><div class="k">'+t('streak_days',{n:days})+'</div></div></div>';
  }
  // ===== Text de compartir, igual a tots els jocs (17/11/2026) =====
  // Targeta sense frase, estil Wordle (decisió d'en Bernat, sense el títol del nivell):
  //   ⚖️ Abans o després? · 17/11
  //   🎯 7 encerts · 🔥 12 dies seguits
  //   🟩🟩🟨🟥…            (només els jocs que en tenen)
  //   babilinia.com/jocs/abansdespres
  // No revela cap resposta. L'enllaç és FIX, no surt de `location`: des del .github.io antic o
  // obrint el fitxer amb doble clic sortiria una altra adreça o cap.
  function shareCard(id, extra, ds, v1, k1, days, quadrets){
    const g=GAMES.find(function(x){ return x.id===id; })||{ic:'',titleKey:''};
    const a=(ds||todayStr()).split('-');
    const cap=g.ic+' '+t(g.titleKey)+(extra?' ('+extra+')':'')+' · '+a[2]+'/'+a[1];
    const marc='🎯 '+v1+' '+k1+' · 🔥 '+days+' '+t('streak_days',{n:days});
    return [cap, marc, quadrets||'', 'babilinia.com/jocs/'+id].filter(Boolean).join('\n');   // enllaç curt: carpeta /jocs/<joc>/ que redirigeix a joc.html#/<joc>
  }
  function tocaRatxa(key){
    const today=todayStr(), st=readLS(key);
    if(st && st.last===today && st.days) return st.days;
    const days = (st && st.last===yesterdayStr() && st.days) ? st.days+1 : 1;
    writeLS(key,{last:today,days:days}); return days;
  }
  function ddmm(s){ const a=s.split('-'); return a[2]+'/'+a[1]+'/'+a[0]; }
  // Llavor estable a partir de la data (FNV-1a) + PRNG mulberry32 + barreja sembrada.
  function seedFromStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seededShuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function msToMidnight(){ const now=new Date(); const mid=new Date(now); mid.setHours(24,0,0,0); return mid-now; }
  function fmtDur(ms){ if(ms<0) ms=0; let s=Math.floor(ms/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); const ss=s-m*60; const p=n=>String(n).padStart(2,'0'); return p(h)+':'+p(m)+':'+p(ss); }

  // Pool d'items per als jocs cronològics: esdeveniments + persones (naixement i mort).
  // NO incloem marcs/eres: els seus anys d'inici/fi són massa imprecisos.
  function buildPool(){
    const pool=[];
    (HB_DATA.EVENTS||[]).forEach(e=>{
      if(typeof e.year==='number') pool.push({key:'ev:'+e.id,kind:'event',name:e.name,year:e.year,desc:e.desc});
    });
    (HB_DATA.PEOPLE||[]).forEach(p=>{
      const ap=!!p.approx;   // data que no ens crèiem del tot: veure APX_GAP
      if(typeof p.birth==='number') pool.push({key:'pe:'+p.id+':b',kind:'person',anchor:'naix',name:p.name,year:p.birth,approx:ap,desc:p.desc,wd:p.wd});
      if(typeof p.death==='number') pool.push({key:'pe:'+p.id+':d',kind:'person',anchor:'mort',name:p.name,year:p.death,approx:ap,desc:p.desc,wd:p.wd});
    });
    return pool;
  }

  // ── Marge de seguretat quan una data no és fiable ──────────────────────────────
  // Els tres jocs cronològics busquen EXPRESSAMENT les parelles més properes, perquè són
  // les difícils. Però hi ha ~10 persones amb el camp `approx` (antigues, amb precisió de
  // segle o mil·lenni, o amb fonts que no s'hi posen d'acord), i allà una parella propera
  // no és difícil: és una moneda a l'aire amb una resposta «correcta» inventada.
  // Mesurat abans del guard, simulant 365 dies d'«Ordena la línia»: 29% de dies portaven
  // algun ítem aproximat i un 3% tenien una parella realment dubtosa — Sèneca 65 contra
  // Neró 68 (3 anys), Alexandre −356 contra Plató −348 (8 anys). Al pool hi ha fins i tot
  // un empat: Jesucrist i Sèneca, tots dos nascuts el −4 i tots dos estimacions.
  // 60 anys cobreix la incertesa d'una data amb precisió de segle (±50).
  // No es treuen del pool: seguirien sortint, però mai emparellats amb algú tan a prop que
  // la resposta depengui de quina font hagi triat Wikidata. Treure'ls castigaria
  // l'antiguitat, que és on l'eina té més valor.
  const APX_GAP=60;
  function incertMassaAprop(a,b){
    if(!a||!b) return false;
    if(!a.approx && !b.approx) return false;
    return Math.abs(a.year-b.year)<APX_GAP;
  }

  // Retorna {qid,name,birth,death,img,desc} per a un ítem del pool de tipus 'person', o null si és un event.
  function personFromItem(it){
    if(!it||it.kind!=='person') return null;
    const id=it.key.split(':')[1];
    const p=(HB_DATA.PEOPLE||[]).find(x=>x.id===id);
    if(!p||!p.wd) return null;
    // death!=null i no ||null: a l'index.html death:null vol dir VIU, i un any 0 (o qualsevol
    // falsy) el convertiria en immortal. Avui la BD no en te cap, pero el || no hi pinta res.
    return {qid:p.wd,name:p.name,birth:p.birth,death:(p.death!=null?p.death:null),img:null,desc:p.desc||''};
  }
  // Retorna {kind:'event',id,name,year} per a un ítem del pool de tipus 'event', o null si és una persona.
  function eventFromItem(it){
    if(!it||it.kind!=='event') return null;
    return {kind:'event',id:it.key.replace(/^ev:/,''),name:it.name,year:it.year!=null?it.year:null};
  }

  // Única funció de traspas al cronograma (big-bang joc2cronograma). Sobreescriu sempre (last-write-wins).
  // items: barreja de personatges {qid,...} i/o events {kind:'event',id,name,year}.
  function goToCronograma(source, items){
    const peopleList=(items||[]).filter(function(x){ return x&&x.qid; });
    const eventsList=(items||[]).filter(function(x){ return x&&x.kind==='event'&&x.id; });
    if(!peopleList.length&&!eventsList.length) return;
    const total=peopleList.length+eventsList.length;
    const payload={v:1,source:source,kind:total>1?'set':'person',
      people:peopleList.map(function(p){ return {qid:p.qid,name:p.name||null,
        birth:(p.birth!=null?p.birth:null),death:(p.death!=null?p.death:null),
        img:p.img||null,desc:p.desc||''}; }),ts:Date.now()};
    if(eventsList.length) payload.events=eventsList.map(function(e){ return {id:e.id,name:e.name||null,year:e.year!=null?e.year:null}; });
    try{ localStorage.setItem('hb_cronograma_ctx',JSON.stringify(payload)); }catch(_){}
    track('joc_2_cronograma',{joc:source});
    location.href='index.html?from=joc';
  }

  // La casa dels botons del final (data-x="hub"): torna al hub.
  function wireHubBtn(scope){ if(!scope) return; const b=scope.querySelector('[data-x="hub"]'); if(b) b.addEventListener('click',function(){ location.hash=''; }); }

  // ===== Botons del final, iguals a tots els jocs (21/11/2026) =====
  // Ordre: casa · comparteix · següent. Els tres del mateix color, icona + text. Si no caben en
  // una fila (mai scroll), la casa es queda només amb la icona (.compacte).
  // «Següent joc» = el proper que NO has fet avui, en l'ordre del hub i fent la volta. Si ja els
  // has fet tots, no surt.
  // El calendari del «Repte diari» i del botó del Personatge del dia: abans era l'emoji 📅.
  const ICO_CAL='<svg class="ico-cal" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';
  // Ratxa: flama de línia (21/11/2026, abans l'emoji 🔥). Al text de compartir es queda el 🔥: allà només hi van emojis.
  const ICO_FLAMA='<svg class="ico-flama" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5C8.6 4 12 5.6 12 9.6a4 4 0 0 1-8 0c0-1.8.9-3 1.9-3.8 0 1.5.7 2.4 1.6 2.7C7 6.2 7 3.6 8 1.5z"/></svg>';
  // Resultat: diana de línia (21/11/2026, abans l'emoji 🎯). Al text de compartir es queda el 🎯.
  const ICO_DIANA='<svg class="ico-flama" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="3.4"/><circle cx="8" cy="8" r=".9" fill="currentColor"/></svg>';
  const ICO_ENLL='<svg class="ico-cal" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.9.9"/><path d="M9.4 6.6a3 3 0 0 0-4.2 0L3.1 8.7a3 3 0 0 0 4.2 4.2l.9-.9"/></svg>';
  const ICO_RELL='<svg class="ico-cal" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.3 1.5"/></svg>';
  // Compte enrere fins al repte nou: UN sol component a la portada i al final dels 5 jocs (21/11/2026).
  // Cada lloc li posa el seu id i el seu tic; el text i l'aspecte són sempre els mateixos.
  function compteHTML(id){ return '<span class="cdchip">'+ICO_RELL+t('new_challenge_in')+' <b id="'+id+'">--:--:--</b></span>'; }
  const ICO_CASA='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.4 9 3.4l6 5"/><path d="M4.6 7.8V14.4h8.8V7.8"/></svg>';
  const ICO_COMP='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11.2V2.8"/><path d="M5.6 6.1 9 2.8l3.4 3.3"/><path d="M3.8 9.8v4.6h10.4V9.8"/></svg>';
  const ICO_SEG='<svg class="seg1" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.8 3.8 12 9l-5.2 5.2"/></svg>'
               +'<svg class="seg2" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.8 9.2 9 4 14.2"/><path d="M9.2 3.8 14.4 9l-5.2 5.2"/></svg>';   // «»» per al 3r graó
  function seguentJoc(actual){
    const ids=GAMES.filter(function(g){ return MODULES[g.id]; }).map(function(g){ return g.id; });
    const i=ids.indexOf(actual);
    for(let k=1;k<ids.length;k++){ const id=ids[(i+k)%ids.length]; if(!doneToday(id)) return id; }
    return null;
  }
  // share: els atributs del botó de compartir (cada joc l'enganxa a la seva funció), o null si no n'hi ha.
  function endBtnsHTML(actual, share){
    const seg=seguentJoc(actual);
    return '<div class="endbtns">'
      +'<button class="endbtn casa" type="button" data-x="hub" aria-label="'+t('back_all')+'">'+ICO_CASA+'<span class="lbl">'+t('back_all')+'</span></button>'
      +(share?'<button class="endbtn" type="button" '+share+'>'+ICO_COMP+'<span class="lbl">'+t('share_lbl')+'</span></button>':'')
      +(seg?'<button class="endbtn seg" type="button" data-x="next" data-next="'+seg+'" aria-label="'+t('next_game')+'"><span class="lbl">'+t('next_game')+'</span>'+ICO_SEG+'</button>':'')
      +'</div>';
  }
  // Tres graons, per ordre: 1) la casa només amb la icona; 2) botons més petits; 3) «Següent joc»
  // passa a «»» (decisió d'en Bernat, 21/11/2026). Comparteix sempre porta el text.
  function encaixaEndBtns(r){
    r.classList.remove('compacte','compacte2','compacte3');
    const surt=function(){ return r.scrollWidth>r.clientWidth+1; };
    if(surt()) r.classList.add('compacte');
    if(surt()) r.classList.add('compacte2');
    if(surt()) r.classList.add('compacte3');
  }
  function wireEndBtns(scope){
    if(!scope) return;
    wireHubBtn(scope);
    const n=scope.querySelector('[data-x="next"]');
    if(n) n.addEventListener('click',function(){ track('joc_seguent',{joc:n.getAttribute('data-next')}); location.hash='#/'+n.getAttribute('data-next'); });
    scope.querySelectorAll('.endbtns').forEach(encaixaEndBtns);
  }
  window.addEventListener('resize',function(){ document.querySelectorAll('.endbtns').forEach(encaixaEndBtns); });
  // «Copiat!» dins del botó sense esborrar-ne la icona (textContent= se l'enduia).
  function copiatAlBoto(btn){ if(!btn) return; const l=btn.querySelector('.lbl')||btn; const o=l.textContent; l.textContent=t('copied'); setTimeout(function(){ l.textContent=o; },1800); }

  // ===== Mòdul: «Abans o després?» — REPTE DIARI (determinista per data + 1 intent/dia) =====
  const AbansDespres = (function(){
    const DAILY_KEY='hb_ad_daily';    // { date, score, perfect, failKeys }
    const STREAK_KEY='hb_ad_streak';  // { last, days }
    // Ronda de ROUND_N preguntes amb VIDES vides. Abans s'acabava al primer error i el final era
    // esgotar la baralla (160 cartes, inabastable): «ronda perfecta» no la feia ningu. Ara es
    // perfecta si arribes al final de les 20 amb algun cor, encara que n'hagis perdut un o hagis
    // fet servir el comodi. El comodi tambe compta com una de les 20.
    const ROUND_N=20, VIDES=2;
    let root=null, deck=[], idx=0, current=null, candidate=null, score=0, locked=false, skipUsed=false, timer=null, cdTimer=null, gaStarted=false,
        lives=VIDES, answered=0, failPairs=[], failItems=[], comodiItem=null,
        adSeq='';   // un quadret per pregunta: 🟩 encert, 🟥 error, 🟨 comodí (per compartir)

    // Meta discreta: esdeveniments només icôna 📜; persones indiquen naixement/mort (imprescindible).
    function meta(it){
      if(it.kind==='event') return '<div class="meta ev"></div>';
      return it.anchor==='naix'
        ? '<div class="meta">'+t('meta_birth')+'</div>'
        : '<div class="meta">'+t('meta_death')+'</div>';
    }
    // role: 'ref' (fixada, amb xinxeta) o 'new' (elevada, apareix animada). flip: anima l'any en revelar-se.
    function card(it,opts){
      opts=opts||{};
      const cls='itemcard '+(opts.role||'')+(opts.enter?' enter':'');
      const yrInner = opts.reveal ? fmtYear(it.year) : '<span class="q">?</span>';
      const yrCls = 'yr'+(opts.flip?' reveal':'');
      const nmAttr = ' data-desc="1" role="button" tabindex="0"';   // sempre: sense descripció, el globus ho diu
      return `<div class="${cls}">${meta(it)}<div class="nm"${nmAttr}>${it.name}</div><div class="${yrCls}">${yrInner}</div></div>`;
    }

    // ── Descripció en tocar el nom (16/11/2026) ─────────────────────────────────────────
    // Per quan surt algú que no has vist mai. A la carta de la PREGUNTA (any amagat) els anys i
    // els segles surten tapats, perquè algunes descripcions duen la resposta («Rei d'Anglaterra de
    // 1189 a 1199»); les pistes d'època («grec», «romà») s'hi queden. Un cop girada, sencera.
    // Regles fixes, sense llistes: valen igual per a qualsevol entrada nova de la BD.
    //   1. qualsevol número -> ····   (1547, 800, 33, 1.480)
    //   2. un romà NOMÉS darrere de «segle», «s.» o «mil·lenni» -> ···   («Felip II» no es toca)
    // Quan s'equivoca, tapa de més (edats, ordinals), mai de menys. ⚠️ En traduir, la regla 2
    // s'ha d'ampliar amb les paraules de cada idioma («siglo», «century»…).
    function descText(it){
      const d=it&&it.desc; if(!d) return '';
      return typeof d==='object' ? (d[LANG]||d.ca||'') : String(d);
    }
    function tapaAnys(txt){
      return txt
        .replace(/\b(segles?|s\.|mil·lennis?)(\s+)[IVXLC]+\b(?:\s*(?:i|-|–|al?)\s*[IVXLC]+\b)?/gi, (m,w,sp)=>w+sp+'···')
        .replace(/\d[\d.,]*\d|\d/g, '····');
    }
    // Text pla escapat; només es deixa passar el <br> (com descHtml() al cronograma).
    function descHtml(txt){
      return txt.split(/<br\s*\/?>/i).map(function(part){
        return part.replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
      }).join('<br>');
    }
    function tancaDesc(){ const p=document.querySelector('.descpop'); if(p) p.remove(); }
    // Tocar fora del globus el tanca (però no tocar un altre nom: aquell n'obrirà un de nou).
    function foraDesc(e){ if(!document.querySelector('.descpop')) return; if(e.target.closest&&(e.target.closest('.descpop')||e.target.closest('.nm[data-desc]'))) return; tancaDesc(); }
    function obreDesc(nmEl, it, tapat){
      tancaDesc();
      // Sense descripció: text de reserva (de persona amb Q-id, que convida a Wikidata, o el curt).
      const txt=descText(it), buit=!txt;
      const pop=document.createElement('div');
      pop.className='descpop'; pop.setAttribute('role','dialog');
      pop.innerHTML='<button class="descx" type="button" aria-label="'+t('close')+'">×</button><div class="descnm"></div><div class="desctx'+(buit?' none':'')+'">'+(buit ? descHtml(t(it.kind==='person'&&it.wd?'desc_none_person':'desc_none')) : descHtml(tapat?tapaAnys(txt):txt))+'</div>';
      pop.querySelector('.descnm').textContent=it.name;
      document.body.appendChild(pop);
      // Sota el nom i centrat, sense sortir de la pantalla; si a sota no hi cap, a sobre.
      const r=nmEl.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight, M=10;
      let left=Math.min(Math.max(M, r.left+r.width/2-pw/2), innerWidth-pw-M);
      let top=r.bottom+8; if(top+ph>innerHeight-M) top=Math.max(M, r.top-ph-8);
      pop.style.left=left+'px'; pop.style.top=top+'px';
      pop.querySelector('.descx').addEventListener('click',tancaDesc);
    }
    // Cada nom es lliga a l'ítem de la SEVA carta en pintar-la (no a `candidate`, que avanca() ja
    // ha canviat mentre la carta resolta encara és a la pantalla). Tapat = l'any encara és «?».
    function wireDesc(){
      root.querySelectorAll('.itemcard .nm[data-desc]').forEach(function(nm){
        if(nm._obre) return;
        const it = nm.closest('#candslot') ? candidate : current;
        const obre=function(){ obreDesc(nm, it, !!nm.closest('.itemcard').querySelector('.yr .q')); };
        nm._obre=obre;
        // A la carta de la pregunta el toc el detecta wireSwipe (toc sense moviment), perquè la
        // carta captura el punter per arrossegar-la i el click no arriba al nom.
        if(!nm.closest('#candslot')) nm.addEventListener('click',obre);
        nm.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); obre(); } });
      });
    }

    function head(){ return `<div class="gamehead"><h2>⚖️ ${t('t_abansdespres')}</h2></div>`; }

    // Següent candidat de la baralla FINITA (sense rebarreig). Salta empats d'any (determinista).
    function nextCandidate(){
      // Salta empats d'any (determinista) i, si algun dels dos porta data aproximada,
      // també els que cauen dins d'APX_GAP: allà «abans o després» no té resposta.
      while(idx<deck.length){ const c=deck[idx++]; if(c.year!==current.year && !incertMassaAprop(current,c)) return c; }
      return null; // baralla esgotada => ronda perfecta
    }

    // Pool del dia: cada PERSONA hi surt NOMÉS UN COP (naixement O mort, triat per la llavor).
    // Així mai comparem el naixement d'algú contra la seva pròpia mort, ni surt duplicada.
    function dailyPool(rng){
      const raw = buildPool();
      const events = raw.filter(x=>x.kind==='event');
      const byPerson = {};
      raw.filter(x=>x.kind==='person').forEach(it=>{
        const pid = it.key.split(':')[1];
        (byPerson[pid]=byPerson[pid]||[]).push(it);
      });
      const persons = [];
      Object.keys(byPerson).sort().forEach(pid=>{
        const arr = byPerson[pid].sort((a,b)=> a.key<b.key?-1:1); // ordre estable (:b abans :d)
        persons.push(arr.length>1 ? arr[rng()<0.5?0:1] : arr[0]);
      });
      const pool = events.concat(persons);
      pool.sort((a,b)=> a.key<b.key?-1:(a.key>b.key?1:0)); // ordre estable abans de sembrar
      return pool;
    }

    // ===== Generació del "game path" amb dificultat controlada =====
    // Dificultat perceptiva (logarítmica): g = |ln(edatA/edatB)|, edat = anys enrere des d'ANY_REF.
    // g PETIT => els dos ítems queden "a prop" en percepció => DIFÍCIL. g GRAN => FÀCIL.
    const AD_CONFIG = {
      refYear: 2026,   // "present" per calcular l'edat de cada ítem
      gHardMax: 0.55,  // passos "gruix": g <= gHardMax (difícil/mig)
      gEasyMin: 0.70,  // "respirs": banda MÍNIMA de g (respir moderat)
      gEasyMax: 1.25,  // "respirs": banda MÀXIMA de g (evita salts trivials/obvis)
      pRespir: 0.22,   // probabilitat (sembrada) que un pas sigui respir (~1 de cada 4-5)
      warmup: 2        // primers passos forçats a respir (escalfament suau)
    };
    function ageOf(it){ return Math.max(1, AD_CONFIG.refYear - it.year); }
    function gap(a,b){ return Math.abs(Math.log(ageOf(a)/ageOf(b))); }

    // Passeig voraç sembrat: cada següent ítem es tria segons la banda de dificultat desitjada.
    // Tot es deriva del MATEIX rng del dia (ordre de consum fix) => 100% determinista.
    function buildPath(pool, rng){
      const cfg = AD_CONFIG;
      const rem = pool.slice();
      if(!rem.length) return [];
      const path = [ rem.splice(Math.floor(rng()*rem.length),1)[0] ];
      let step = 0;
      while(rem.length){
        step++;
        const ref = path[path.length-1];
        const scored = rem.map((it,i)=>({i,g:gap(ref,it)})).filter(o=>o.g>1e-9); // evita empats d'any
        if(!scored.length){ rem.sort((a,b)=> a.key<b.key?-1:1).forEach(x=>path.push(x)); break; }
        const wantEasy = (step<=cfg.warmup) || (rng() < cfg.pRespir);
        let band;
        if(wantEasy){
          band = scored.filter(o=>o.g>=cfg.gEasyMin && o.g<=cfg.gEasyMax);
          if(!band.length){ const mid=(cfg.gEasyMin+cfg.gEasyMax)/2; band = scored.slice().sort((a,b)=>Math.abs(a.g-mid)-Math.abs(b.g-mid)).slice(0, Math.max(1,Math.ceil(scored.length*0.2))); }
        } else {
          band = scored.filter(o=>o.g<=cfg.gHardMax);
          if(!band.length) band = scored.slice().sort((a,b)=>a.g-b.g).slice(0, Math.max(1,Math.ceil(scored.length*0.2)));
        }
        const pick = band[Math.floor(rng()*band.length)];
        path.push(rem.splice(pick.i,1)[0]);
      }
      return path;
    }

    // Hook de depuració per a l'script d'anàlisi (no afecta el joc).
    try{ window.__AD = {
      config: AD_CONFIG,
      gap: gap,
      pool: function(ds){ return dailyPool(mulberry32(seedFromStr(ds))); },
      tapa: function(txt){ return tapaAnys(txt); },   // per als tests: la regla de tapar anys
      sim: function(ds){ const r=mulberry32(seedFromStr(ds)); return buildPath(dailyPool(r), r); }
    }; }catch(_){}

    // Dos cors: plens els que queden, buits els perduts. Es repinta sol a cada render(); en perdre'n
    // un, guess() el buida a ma perque la carta revelada es queda a la pantalla fins al seguent torn.
    function livesHtml(){
      let h='<div class="glives" role="img" aria-label="'+lives+'/'+VIDES+'">';
      for(let i=0;i<VIDES;i++){
        const ple=i>=VIDES-lives;   // es buiden d'esquerra a dreta
        h+='<svg class="heart'+(ple?'':' empty')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.5 2 4.5 5.8 4.1 8.2 3.9 10.2 5.3 12 7.4c1.8-2.1 3.8-3.5 6.2-3.3 3.8.4 5.4 4.4 3.8 7.6C19.5 16.4 12 21 12 21z"/></svg>';
      }
      return h+'</div>';
    }

    // Tanca una pregunta (encert, error o comodi) i decideix que ve despres: el final de la ronda,
    // la baralla esgotada, o la seguent carta. La carta resolta passa a ser la nova referencia.
    function avanca(delay){
      answered++;
      const pb=root.querySelector('.gprog>i'); if(pb) pb.style.width=(answered/ROUND_N*100)+'%';
      current=candidate;
      if(answered>=ROUND_N){ candidate=null; timer=setTimeout(()=>finish(true),delay); return; }
      const nxt=nextCandidate();
      if(nxt){ candidate=nxt; timer=setTimeout(()=>{ locked=false; render(); },delay); }
      else { candidate=null; timer=setTimeout(()=>finish(true),delay); }   // baralla esgotada
    }

    function render(){
      root.innerHTML = `
        <div class="game ad">
          <div class="gtop">
            <div class="gtitle">⚖️ ${t('t_abansdespres')}</div>
            <div class="gscore">${livesHtml()}<div class="n" id="scoren"><span class="ic">${ICO_DIANA}</span><span class="v">${score}</span></div></div>
          </div>
          <div class="cards2">
            <div class="gprog" aria-hidden="true"><i style="width:${answered/ROUND_N*100}%"></i></div>
            ${card(current,{role:'ref',reveal:true})}
            <div class="vs">VS</div>
            <div id="candslot">${card(candidate,{role:'new',enter:true})}</div>
          </div>
          <div class="choices">
            <button class="choice" data-a="abans"><span class="big">←</span>${t('before')}</button>
            <button class="pass" data-x="skip"${skipUsed?' disabled':''} title="${skipUsed?t('joker_used_title'):t('joker_title')}"><span class="jk">🃏</span><span class="jt">${skipUsed?t('joker_spent'):t('joker')}</span><span class="jn">${skipUsed?0:1}</span></button>
            <button class="choice" data-a="despres"><span class="big">→</span>${t('after')}</button>
          </div>
        </div>`;
      root.querySelectorAll('.choice').forEach(b=>{
        b.addEventListener('click',()=>guess(b.getAttribute('data-a')));
      });
      const sk=root.querySelector('[data-x="skip"]'); if(sk) sk.addEventListener('click',skip);
      tancaDesc();
      wireSwipe();
      wireDesc();
    }

    // Lliscar la carta nova: esquerra = Abans, dreta = Despres, amunt = comodi (com les fletxes del
    // teclat). La carta segueix el dit i s'inclina; si no arriba al llindar, torna al seu lloc.
    // Pointer Events: el mateix codi serveix per al dit i per arrossegar amb el ratoli.
    const SWIPE_TH=70;
    function wireSwipe(){
      const card=root.querySelector('#candslot .itemcard'); if(!card) return;
      let id=null, x0=0, y0=0, dx=0, dy=0, apunta=null, nmToc=null;
      const boto=a=> a==='skip' ? root.querySelector('[data-x="skip"]') : root.querySelector('.choice[data-a="'+a+'"]');
      const cap=()=>{
        if(Math.abs(dx)>=SWIPE_TH && Math.abs(dx)>Math.abs(dy)) return dx<0?'abans':'despres';
        if(!skipUsed && -dy>=SWIPE_TH && -dy>Math.abs(dx)) return 'skip';
        return null;
      };
      const marca=a=>{ if(a===apunta) return; const b0=apunta&&boto(apunta); if(b0) b0.classList.remove('aim'); apunta=a; const b1=a&&boto(a); if(b1) b1.classList.add('aim'); };
      card.addEventListener('pointerdown',e=>{
        if(locked||!candidate||id!==null) return;
        if(e.pointerType==='mouse'&&e.button!==0) return;
        id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=dy=0;
        nmToc=e.target.closest&&e.target.closest('.nm[data-desc]');
        try{ card.setPointerCapture(id); }catch(_){}
        card.classList.add('drag');
      });
      card.addEventListener('pointermove',e=>{
        if(e.pointerId!==id) return;
        dx=e.clientX-x0; dy=e.clientY-y0;
        const ty = dy<0 ? dy : dy*0.3;   // cap avall no vol dir res: s'hi resisteix
        card.style.transform='translate('+dx+'px,'+ty+'px) rotate('+(dx/18)+'deg)';
        marca(cap());
      });
      const deixa=e=>{
        if(e.pointerId!==id) return;
        id=null; card.classList.remove('drag');
        const a = e.type==='pointerup' ? cap() : null;
        marca(null); card.style.transform='';
        if(a==='skip') skip(); else if(a) guess(a);
        else if(e.type==='pointerup' && nmToc && Math.abs(dx)<6 && Math.abs(dy)<6 && nmToc._obre) nmToc._obre();
        nmToc=null;
      };
      card.addEventListener('pointerup',deixa);
      card.addEventListener('pointercancel',deixa);
    }

    // Teclat: fletxa esquerra = Abans, dreta = Despres, amunt = comodi. Nomes amb una pregunta
    // oberta: a la pantalla de resultat, amb el joc bloquejat o escrivint en un camp, no fa res.
    function onKey(e){
      if(e.key==='Escape' && document.querySelector('.descpop')){ tancaDesc(); return; }
      if(!root||locked||!candidate||e.altKey||e.ctrlKey||e.metaKey) return;
      const tg=e.target; if(tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
      if(!root.querySelector('#candslot')) return;
      if(e.key==='ArrowLeft'){ e.preventDefault(); guess('abans'); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); guess('despres'); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); skip(); }
    }

    function guess(ans){
      if(locked||!candidate) return;
      locked=true;
      if(!gaStarted){ gaStarted=true; track('joc_iniciat',{joc:'abansdespres',mode:'default'}); }
      const correct = (ans==='abans' && candidate.year<current.year) || (ans==='despres' && candidate.year>current.year);
      const slot=root.querySelector('#candslot');
      tancaDesc();
      if(slot){ slot.innerHTML=card(candidate,{role:'new',reveal:true,flip:true}); const c=slot.querySelector('.itemcard'); if(c) c.classList.add(correct?'flash-ok':'flash-no'); wireDesc(); }
      root.querySelectorAll('.choice').forEach(b=>{ b.disabled=true; });   // el comodi no: el locked ja el bloqueja, i apagar-lo el feia parpellejar en gris
      adSeq += correct ? '🟩' : '🟥';
      if(correct){
        score++;
        const sn=root.querySelector('#scoren'); if(sn){ const v=sn.querySelector('.v'); if(v) v.textContent=score; sn.classList.remove('pop'); void sn.offsetWidth; sn.classList.add('pop'); }
        avanca(2000);
      }else{
        failPairs.push([current,candidate]);
        lives--;
        const hs=root.querySelectorAll('.glives .heart');
        const perdut=hs[VIDES-1-lives]; if(perdut){ perdut.classList.add('empty','lost'); }
        const gl=root.querySelector('.glives'); if(gl) gl.setAttribute('aria-label',lives+'/'+VIDES);
        if(lives<=0){ timer=setTimeout(()=>finish(false),2100); return; }
        avanca(2100);   // queda un cor: la carta fallada (ja revelada) passa a ser la referencia
      }
    }

    // Comodi: UN cop per partida. Abans saltava la parella sense dir res; ara MOSTRA la resposta:
    // gira la carta amb l'any i pinta de verd el boto que tocava, com si l'haguessis premut tu.
    // No suma punt (seria un encert regalat) i compta com una de les preguntes de la ronda.
    function skip(){
      if(locked||skipUsed||!candidate) return;
      skipUsed=true; locked=true; comodiItem=candidate; adSeq+='🟨';
      if(!gaStarted){ gaStarted=true; track('joc_iniciat',{joc:'abansdespres',mode:'default'}); }
      track('joc_comodin_usat',{joc:'abansdespres',mode:'default'});
      const bona = candidate.year<current.year ? 'abans' : 'despres';
      const slot=root.querySelector('#candslot');
      tancaDesc();
      if(slot){ slot.innerHTML=card(candidate,{role:'new',reveal:true,flip:true}); wireDesc(); }
      root.querySelectorAll('.choice,.pass').forEach(b=>{ b.disabled=true; });
      const bb=root.querySelector('.choice[data-a="'+bona+'"]'); if(bb) bb.classList.add('answer');
      avanca(2000);
    }

    function finish(perfect){
      const today=todayStr();
      const days=tocaRatxa(STREAK_KEY);
      track('joc_completat',{joc:'abansdespres',mode:'default',encerts:score,errors:failPairs.length,ratxa:days});
      // Les cartes que has fallat (la nova de cada parella fallada) i la del comodí: surten al
      // resultat, clicables cap al cronograma.
      failItems=failPairs.map(function(pr){ return pr[1]; }).filter(Boolean);
      const failKeys=failItems.length?failItems.map(function(it){return it.key;}):null;
      writeLS(DAILY_KEY,{date:today,score:score,perfect:!!perfect,failKeys:failKeys,comodiKey:comodiItem?comodiItem.key:null,seq:adSeq});
      showResult(score,!!perfect);
    }

    // Nivell del títol: 20 encerts / 15 o més / 7-14 / 0-6. Amb el comodí no s'arriba a 20 (no suma).
    function adNivell(sc){ return sc>=20?1:(sc>=15?2:(sc>=7?3:4)); }
    function showResult(sc,perfect){
      if(timer){ clearTimeout(timer); timer=null; }
      const st=readLS(STREAK_KEY); const days=st?(st.days||0):0;
      // Les cartes per repassar: la del comodí en groc i les fallades en vermell. Cada una porta al
      // cronograma (substitueix el botó «A veure, ensenyam-ho»).
      const files=[];
      if(comodiItem) files.push({it:comodiItem,cls:'joker'});
      failItems.forEach(function(it){ files.push({it:it,cls:'fail'}); });
      const filaHtml=function(f,i){
        const it=f.it, crono=personFromItem(it)||eventFromItem(it);
        const ic=it.kind==='person'?(it.anchor==='naix'?'🎂 ':'🕯️ '):'';
        const txt='<span class="adnm"></span><span class="adyr">'+ic+fmtYear(it.year)+'</span>';
        return crono ? '<button class="adrow '+f.cls+'" data-fi="'+i+'">'+txt+'</button>' : '<div class="adrow '+f.cls+' dis">'+txt+'</div>';
      };
      root.innerHTML = `
        <div class="gameover ad">
          ${head()}
          ${resTitol(adNivell(sc),'h2')}
          ${resMarcador(sc, t('hits_in_row'), days)}
          ${files.length?'<div class="adrows">'+files.map(filaHtml).join('')+'</div>':''}
          <div class="cdn">${compteHTML('cd')}</div>
          ${endBtnsHTML('abansdespres','data-x="share"')}
        </div>`;
      root.querySelectorAll('.adrow').forEach(function(el){
        const f=files[[...root.querySelectorAll('.adrow')].indexOf(el)];
        el.querySelector('.adnm').textContent=f.it.name;
        if(el.tagName==='BUTTON') el.addEventListener('click',function(){ goToCronograma('abansdespres',[personFromItem(f.it)||eventFromItem(f.it)]); });
      });
      const sh=root.querySelector('[data-x="share"]');
      if(sh) sh.addEventListener('click',()=>doShare(sc,days,sh));
      wireEndBtns(root);
      startCountdown();
    }

    function doShare(sc,days,btn){
      // Fins a 20 quadrets: en files de 10, que en una sola línia el mòbil els parteix on vol.
      // Array.from i no slice: cada quadret són dos caràcters UTF-16.
      const q=Array.from(adSeq), files=[];
      for(let i=0;i<q.length;i+=10) files.push(q.slice(i,i+10).join(''));
      const text=shareCard('abansdespres','',todayStr(),sc,t(sc===1?'res_k_hit1':'hits_in_row'),days,files.join('\n'));
      if(navigator.share){ navigator.share({text:text}).catch(()=>{}); return; }
      const done=()=>copiatAlBoto(btn);
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(done); }
      else { done(); }
    }

    function startCountdown(){
      if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
      const tick=()=>{ const el=root&&root.querySelector('#cd'); if(!el){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} return; } el.textContent=fmtDur(msToMidnight()); };
      tick(); cdTimer=setInterval(tick,1000);
    }

    function start(){
      if(timer){ clearTimeout(timer); timer=null; }
      if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
      const today=todayStr();
      const daily=readLS(DAILY_KEY);
      if(daily && daily.date===today){
        failItems=[]; comodiItem=null;
        const allPool=buildPool(); const byKey={};
        allPool.forEach(function(it){byKey[it.key]=it;});
        if(daily.failKeys) failItems=daily.failKeys.map(function(k){return byKey[k];}).filter(Boolean);
        if(daily.comodiKey) comodiItem=byKey[daily.comodiKey]||null;
        adSeq=daily.seq||'';
        showResult(daily.score,!!daily.perfect); return;
      } // ja jugat avui => bloquejat
      const rng=mulberry32(seedFromStr(today));
      const pool=dailyPool(rng); // cada persona només un cop (naix O mort) segons la llavor del dia
      deck=buildPath(pool,rng);  // ordena el pool en un camí amb dificultat controlada (g logarítmic)
      idx=0; score=0; locked=false; skipUsed=false; current=null; candidate=null;
      lives=VIDES; answered=0; failPairs=[]; failItems=[]; comodiItem=null; adSeq='';
      current=deck[idx++]||null;
      candidate=current?nextCandidate():null;
      if(!current||!candidate){ root.innerHTML='<div class="err">'+t('err_not_enough')+'</div>'; return; }
      render();
    }

    return {
      mount(container){ root=container; gaStarted=false; failPairs=[]; failItems=[]; track('joc_vist',{joc:'abansdespres'}); document.addEventListener('keydown',onKey); document.addEventListener('pointerdown',foraDesc,true); start(); },
      unmount(){ document.removeEventListener('keydown',onKey); document.removeEventListener('pointerdown',foraDesc,true); tancaDesc(); if(timer){ clearTimeout(timer); timer=null; } if(cdTimer){ clearInterval(cdTimer); cdTimer=null; } root=null; }
    };
  })();

  // ===== Mòdul: «Personatge del dia» — DESCOBRIMENT (determinista per data, dades en viu de Wikidata) =====
  const PersonatgeDia = (function(){
    const CACHE_KEY='hb_personatge_cache'; // { date, person }
    const ALBUM_KEY='hb_personatge_album'; // [ {qid,name,birth,death,img,desc,date} ]
    const FAV_KEY='hb_favorits';           // stub; enllaçarà amb Favorits quan existeixin
    const POPUP_KEY='hb_personatge_popup'; // { date } — pop-up d'invitacio ja mostrat/tancat AVUI (clau per DATA)
    const STREAK_KEY='hb_personatge_streak'; // { last, days } — ratxa de dies descobrint el personatge
    const WD_API='https://www.wikidata.org/w/api.php';
    const COMMONS='https://commons.wikimedia.org/wiki/Special:FilePath/';
    const MAX_TRIES=5; // intents deterministes (base, base+1, …) si algun QID de la llista fos invàlid/esborrat
    let root=null, alive=false, person=null, popupTimer=null;
    function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

    // --- Wikidata ---
    async function wd(params){
      params.format='json'; params.origin='*';
      const qs=Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
      const url=WD_API+'?'+qs;
      let lastErr=null;
      for(let attempt=0;attempt<2;attempt++){
        if(attempt) await new Promise(function(res){ setTimeout(res,600); });
        const ctrl=new AbortController();
        const to=setTimeout(function(){ ctrl.abort(); },8000);
        try{
          const r=await fetch(url,{signal:ctrl.signal});
          clearTimeout(to);
          if(!r.ok) throw new Error('HTTP '+r.status);
          return await r.json();
        }catch(e){
          clearTimeout(to);
          lastErr=e;
          const m=/^HTTP (\d+)/.exec((e&&e.message)||'');
          if(m && parseInt(m[1],10)<500) throw e;
        }
      }
      throw lastErr||new Error('fetch failed');
    }
    function hasItem(e,prop,qid){ const c=e.claims&&e.claims[prop]; if(!c) return false; return c.some(function(s){ const v=s.mainsnak&&s.mainsnak.datavalue&&s.mainsnak.datavalue.value; return v&&v.id===qid; }); }
    function yearFrom(e,prop){ const c=e.claims&&e.claims[prop]; if(!c||!c.length) return null; const dv=c[0].mainsnak&&c[0].mainsnak.datavalue&&c[0].mainsnak.datavalue.value; const t=dv&&dv.time; if(!t) return null; const m=t.match(/^([+-])0*(\d+)-/); if(!m) return null; const y=parseInt(m[2],10); return m[1]==='-'?-y:y; }
    function imgUrl(e){ const c=e.claims&&e.claims.P18; if(!c||!c.length) return null; const dv=c[0].mainsnak&&c[0].mainsnak.datavalue; if(!dv) return null; return COMMONS+encodeURIComponent(String(dv.value).replace(/ /g,'_'))+'?width=500'; }
    function itemQids(e,prop,max){ const c=e.claims&&e.claims[prop]; if(!c) return []; const out=[]; for(let i=0;i<c.length;i++){ const v=c[i].mainsnak&&c[i].mainsnak.datavalue&&c[i].mainsnak.datavalue.value; if(v&&v.id){ out.push(v.id); if(out.length>=max) break; } } return out; }
    function lbl(o){ return o?((o.ca||o.es||o.en||o.mul||{}).value||null):null; }   // o.mul: veure wdLangs()
    // trusted=true per als homenatges de PD_PINNED: la tria l'ha fet una persona, no la llavor, i
    // el filtre de sitelinks (ca I es I en) tombaria justament les perles locals que volem destacar.
    // El que NO es relaxa mai: humà, any de naixement i etiqueta — sense això la fitxa no es pot pintar.
    function isValid(e,trusted){
      if(!e || e.missing!==undefined) return false;
      if(!hasItem(e,'P31','Q5')) return false;                          // ha de ser humà
      // No n'hi ha prou que la declaracio EXISTEIXI: si a Wikidata el P569 preferit es «valor
      // desconegut», la claim hi es pero no porta datavalue i yearFrom() en treu null. Aleshores
      // el personatge del dia sortia sense any, i el traspas al cronograma no el pintava
      // (visiblePeople() vol un numero). Cal l'ANY, no la claim. (Mateix cas que el «null–» del
      // desplegable de l'index: veure wdParse alla.)
      if(yearFrom(e,'P569')===null) return false;                       // ha de tenir naixement UTIL
      if(!lbl(e.labels)) return false;                                  // etiqueta en ca/es/en
      if(trusted) return true;
      const s=e.sitelinks||{};                                          // entrada a Viquipèdia en ca I es I en (AND dels tres)
      if(!(s.cawiki && s.eswiki && s.enwiki)) return false;
      return true;
    }
    // Text monolingue (p.ex. P2521 forma en femeni): prioritza ca, despres es, despres en.
    function monolingual(claims,prop){ const c=claims&&claims[prop]; if(!c||!c.length) return null; const by={}; c.forEach(function(s){ const v=s.mainsnak&&s.mainsnak.datavalue&&s.mainsnak.datavalue.value; if(v&&v.text&&v.language){ by[v.language]=v.text; } }); return by.ca||by.es||by.en||null; }
    // Gènere de la persona: P21 == Q6581072 (dona).
    function isFemale(e){ const c=e.claims&&e.claims.P21; if(!c||!c.length) return false; const v=c[0].mainsnak&&c[0].mainsnak.datavalue&&c[0].mainsnak.datavalue.value; return !!(v&&v.id==='Q6581072'); }
    // Codi de genere per triar el tracte informal al pop-up: 'f' dona, 'm' home, '' desconegut/altre (=> neutre).
    function genderCode(e){ const c=e.claims&&e.claims.P21; if(!c||!c.length) return ''; const v=c[0].mainsnak&&c[0].mainsnak.datavalue&&c[0].mainsnak.datavalue.value; if(!(v&&v.id)) return ''; if(v.id==='Q6581072') return 'f'; if(v.id==='Q6581097') return 'm'; return ''; }
    // Baixa etiquetes dels items (ocupacio P106 / nacionalitat P27). Inclou P2521 (forma en femeni
    // de l'etiqueta) per poder mostrar l'ocupacio en femeni quan la persona es dona. Si Wikidata no
    // te forma femenina per a aquella ocupacio, es manté l'etiqueta per defecte (masculi generic).
    async function labelsFor(qids){
      if(!qids.length) return {};
      const data=await wd({action:'wbgetentities',ids:qids.join('|'),props:'labels|claims',languages:wdLangs()});
      const map={}, ents=data.entities||{};
      Object.keys(ents).forEach(function(q){ const e=ents[q]; map[q]={label:lbl(e.labels), female:monolingual(e.claims,'P2521')}; });
      return map;
    }
    async function build(e,qid){
      const occQ=itemQids(e,'P106',3), couQ=itemQids(e,'P27',2);
      const female=isFemale(e), gender=genderCode(e);
      const names=await labelsFor(occQ.concat(couQ));
      const s=e.sitelinks||{}, site=s.cawiki||s.eswiki||s.enwiki||{};
      // Opcio A: P18 (Wikidata) es l'UNICA font de retrat. La imatge principal de l'article de la
      // Viquipedia NO es fiable (p.ex. en un pintor sol ser una obra seva, no un retrat d'ell), no la fem servir.
      const img=imgUrl(e), imgSource=img?'wikidata':null;
      return {
        qid:qid,
        name:lbl(e.labels)||qid,
        desc:lbl(e.descriptions)||'',
        birth:yearFrom(e,'P569'),
        death:yearFrom(e,'P570'),
        img:img,
        imgSource:imgSource,
        gender:gender,
        occ:occQ.map(function(q){ const it=names[q]||{}; return (female && it.female) ? it.female : it.label; }).filter(Boolean),
        country:couQ.map(function(q){ return (names[q]||{}).label; }).filter(Boolean),
        wiki:site.url||('https://www.wikidata.org/wiki/'+qid)   // sense article a ca/es/en (cas PD_PINNED): la fitxa de Wikidata
      };
    }
    // Selecció determinista des de l'índex offline (personatges.js → window.HB_PERSONATGES).
    // La llavor del dia tria una posició de la llista i es baixa la fitxa d'aquell QID de Wikidata.
    // Igual per a tothom durant 24h. La llista es genera amb gen_personatges.py (humans amb
    // data de naixement i article a la Viquipèdia en català I castellà I anglès (AND)). Només IDs, res més.
    function pool(){ return (typeof window!=='undefined' && Array.isArray(window.HB_PERSONATGES)) ? window.HB_PERSONATGES : []; }
    async function fetchPerson(qid,trusted){
      const data=await wd({action:'wbgetentities',ids:qid,props:'labels|descriptions|claims|sitelinks/urls',languages:wdLangs(),sitefilter:'cawiki|eswiki|enwiki'});
      const e=(data.entities||{})[qid];
      if(!isValid(e,trusted)) return null;
      return build(e,qid);
    }
    // Calendari d'homenatges: data (AAAA-MM-DD, hora local) -> QID. Té prioritat sobre la llavor
    // del dia; els dies que no hi surten segueixen sent aleatoris. Doc a ESTRATEGIA_JOC.md.
    const PD_PINNED={
      '2026-08-19':'Q733621',    // Juan Tamariz — mag, mort el 18/08/2026
      '2026-09-02':'Q1523',    // Ramsès II — Tercer faraó de la dinastia XIX d’Egipte
      '2026-10-27':'Q969725'    // Harry Kane — Futbolista anglès
    };
    async function pickDaily(ds){
      // L'homenatge va ABANS de la llavor i de la comprovació de la llista: no depèn del pool
      // offline, i si Wikidata no respon es cau a la tria aleatòria en lloc de deixar el dia buit.
      const forced=PD_PINNED[ds];
      // ⚠️ I va abans del CAU. Mirar el cau primer era un bug: si algú havia obert el joc
      // aquell dia abans que el pin fos viu, es quedava l'aleatori 24 h i clavar un dia no
      // servia de res (va passar amb en Josep Pla el 31/08/2026). Si el dia està clavat i el
      // que hi ha desat no és qui toca, el cau es descarta.
      const cache=readLS(CACHE_KEY);
      if(cache && cache.date===ds && cache.person && (!forced || cache.person.qid===forced))
        return cache.person;
      if(forced){
        try{
          const fp=await fetchPerson(forced,true);
          if(fp){ writeLS(CACHE_KEY,{date:ds,person:fp}); return fp; }
        }catch(_){}
      }
      const list=pool();
      if(!list.length){ const err=new Error('LIST_MISSING'); err.code='LIST_MISSING'; throw err; }
      const rng=mulberry32(seedFromStr('pd:'+ds));
      const base=Math.floor(rng()*list.length);
      for(let k=0;k<MAX_TRIES;k++){
        const idx=(base+k)%list.length;
        const qid='Q'+list[idx];
        const p=await fetchPerson(qid);
        if(p){ writeLS(CACHE_KEY,{date:ds,person:p}); return p; }
      }
      return null;
    }

    // --- Àlbum + favorits (localStorage) ---
    function addToAlbum(p){ const a=readLS(ALBUM_KEY)||[]; if(!a.some(function(x){ return x.qid===p.qid; })){ a.push({qid:p.qid,name:p.name,birth:p.birth,death:p.death,img:p.img,desc:p.desc,date:todayStr()}); writeLS(ALBUM_KEY,a); } }
    function bumpStreak(){ return tocaRatxa(STREAK_KEY); }   // aqui acabar = obrir-lo: no hi ha res mes a fer
    function favs(){ return readLS(FAV_KEY)||[]; }
    function isFav(qid){ return favs().some(function(x){ return x.qid===qid; }); }
    function toggleFav(p){ let a=favs(); if(a.some(function(x){ return x.qid===p.qid; })) a=a.filter(function(x){ return x.qid!==p.qid; }); else a.push({qid:p.qid,name:p.name,birth:p.birth,death:p.death,img:p.img,desc:p.desc}); writeLS(FAV_KEY,a); return isFav(p.qid); }
    function viewInCronograma(p){ goToCronograma('personatgedia',[p]); }

    // --- Pop-up d'invitacio a contribuir (nomes escenaris 2 i 3) ---
    function popupSeenToday(){ const s=readLS(POPUP_KEY); return !!(s && s.date===todayStr()); }
    function markPopupSeen(){ writeLS(POPUP_KEY,{date:todayStr()}); }   // punt 4: tancar O clicar el CTA compta com a vist del dia
    function onInviteKey(ev){ if(ev.key==='Escape'){ markPopupSeen(); closeInvitePopup(); } }
    function closeInvitePopup(){ document.removeEventListener('keydown',onInviteKey); const ov=document.getElementById('pinvov'); if(!ov) return; ov.classList.remove('show'); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); }
    function scheduleInvitePopup(p){
      if(popupTimer){ clearTimeout(popupTimer); popupTimer=null; }
      // Opcio A: nomes quan NO hi ha P18 (imgSource===null). Si te P18 (cas B inclos) o l'estat es desconegut => mai.
      if(!p || p.imgSource!==null) return;
      // Punt 3: clau per DATA. Si ja s'ha mostrat/tancat avui, no el tornem a treure.
      if(popupSeenToday()) return;
      // Punt 1: apareix 1,5s DESPRES de coneixer l'estat (renderPerson ja te imgSource resolt).
      popupTimer=setTimeout(function(){ popupTimer=null; if(!alive) return; if(popupSeenToday()) return; if(document.getElementById('pinvov')) return; showInvitePopup(p); },1500);
    }
    function showInvitePopup(p){
      const qui = p.gender==='f' ? t('inv_who_f') : (p.gender==='m' ? t('inv_who_m') : t('inv_who_n'));
      const ov=el('div','pinvov'); ov.id='pinvov';
      const md=el('div','pinvmodal');
      const x=el('button','pinvx','✕'); x.setAttribute('aria-label',t('close')); x.addEventListener('click',function(){ markPopupSeen(); closeInvitePopup(); }); md.appendChild(x);
      md.appendChild(el('div','pinvemoji','🖼️'));
      md.appendChild(el('h3','pinvtitle',t('inv_title')));
      md.appendChild(el('p','pinvtext',t('inv_text',{who:qui})));
      const cta=el('a','pinvcta',t('inv_cta'));
      cta.href='https://commons.wikimedia.org/wiki/Special:UploadWizard';
      cta.target='_blank'; cta.rel='noopener';
      cta.addEventListener('click',function(){ markPopupSeen(); closeInvitePopup(); });
      md.appendChild(cta);
      const no=el('button','pinvno',t('inv_no')); no.addEventListener('click',function(){ markPopupSeen(); closeInvitePopup(); }); md.appendChild(no);
      // Punt 5: enllac de suport al final ("si necessites ajuda, aqui la tens").
      const help=el('a','pinvhelp',t('inv_help'));
      help.href='https://commons.wikimedia.org/wiki/Commons:First_steps/Uploading_files';
      help.target='_blank'; help.rel='noopener'; md.appendChild(help);
      ov.appendChild(md);

    function renderLoading(){ root.innerHTML=''; const w=el('div','pwrap'), l=el('div','ploading'); l.appendChild(el('div','pspin')); l.appendChild(document.createTextNode(t('searching_wikidata'))); w.appendChild(l); root.appendChild(w); }

    function renderPerson(p){

      const fav=isFav(p.qid);
      // Icona + «Favorits» (21/11/2026): mateixa mida que «Llegeix-ne més», mitja fila cadascun. El text no

      const nm=body.querySelector('.pname'); nm.classList.add('pgo'); nm.setAttribute('role','link'); nm.tabIndex=0; nm.title=t('see_crono_lbl');
      nm.addEventListener('click',function(){ viewInCronograma(p); });

    function start(){
      renderLoading();
      pickDaily(todayStr()).then(function(p){ if(!alive) return; if(!p){ renderError(t('err_no_person')); return; } person=p; addToAlbum(p); bumpStreak(); renderPerson(p); })
      .catch(function(err){ if(!alive) return; if(err&&err.code==='LIST_MISSING'){ renderError(t('err_list_missing')); } else { renderError(t('err_wikidata')); } });
    }
    // Precompute en background: prepara el personatge del dia (omple la caché) en carregar la pàgina.
    function precompute(){ try{ pickDaily(todayStr()).catch(function(){}); }catch(_){} }

    return {
      mount(container){ root=container; alive=true; track('personatge_dia_vist',{}); start(); },
      unmount(){ alive=false; if(popupTimer){ clearTimeout(popupTimer); popupTimer=null; } closeInvitePopup(); root=null; },
      precompute:precompute
