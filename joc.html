<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Història Bàsica · Jocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap"></noscript>
<style>
  /* Paleta idèntica a index.html (mantenir sincronitzada) */
  :root{
    --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
    --surface:#F0EFED; --border:#E6E5E3; --border-strong:#CBC9C4;
    --topbar-bg:#B8503C; --band:#F3F4F7; --slate:#5f6570;
    --r-card:8px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{min-height:100dvh;background:var(--soft);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

  /* ===== Top bar: MATEIXA que index.html (fons terracota, vora #612E25, marca Oswald) ===== */
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 22px;border-bottom:5px solid #612E25;background:var(--topbar-bg);}
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topbar-right{display:flex;align-items:center;gap:14px;flex:0 0 auto;}
  .brand{color:#fff;font-family:'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:20px;letter-spacing:.06em;white-space:nowrap;}
  .brand .sub{font-weight:400;opacity:.75;}
  /* ===== Botons de secció (Cronograma · Jocs · …) =====
     BLOC COMPARTIT entre index.html i joc.html: CSS, markup i JS han de ser BYTE-IDÈNTICS.
     Si el toques en un fitxer, copia'l a l'altre i comprova-ho amb un diff.

     Són botons INDEPENDENTS, no un toggle segmentat: el de la secció actual va marcat i la
     resta queden disponibles. Afegir una tercera pàgina és només afegir un <a> més.
     Viu a topbar-left (identitat: «on sóc»), no a la zona d'accions de la dreta.
     L'aspecte replica .topbar .btn / .topbar .btn.on a TOTS els punts de tall, però
     autocontingut: així les dues pàgines es veuen igual i la topbar fa la mateixa alçada,
     sense saltet en navegar. ⚠️ Si canvies l'estil de .btn, actualitza també aquest bloc.

     ESCALA DE COMPRESSIÓ (per ordre; el cercador és l'últim que es toca):
      1. tot sencer: marca de text + botons en fila
      2. es plega el menú: la marca passa a botó amb fletxa i obre un desplegable
      3. els botons d'acció passen a icones
      4. la marca passa a «HB» (en obrir el menú es torna a veure el nom sencer)
      5. només si no queda més remei, el cercador baixa del seu mínim
     El cercador ha de poder mostrar «Cercant a Wikidata…» en UNA línia: 180px mesurats.
     Els llindars els decideix el JS amb una fórmula que NO depèn del contingut de la pàgina,
     perquè les dues pàgines es plegan a la mateixa amplada (si no, navegar faria un salt
     estrany: menú plegat en una i desplegat en l'altra). */
  .topbar{z-index:20;}   /* per sobre de .sidebar (z-index:10): si no, el desplegable hi queda darrere */
  .topbar-left{flex:0 0 auto;min-width:auto;}
  /* Separador vertical entre el menú i el cercador: marca on acaba la navegació («on sóc») i on
     comencen les opcions de la pàgina. Del mateix marró que la vora inferior de la topbar.
     NOMÉS surt quan l'aire entre els dos s'esgota — si hi ha espai de separació, la separació ja
     la fa l'espai i la barreta no cal. Ho decideix el JS mesurant l'aire (classe .sep).
     Va dins de .secnav amb ::after (no a .topbar-left amb :has(), menys compatible). */
  .secnav::after{content:'';flex:0 0 auto;width:2px;height:22px;border-radius:1px;background:#612E25;margin-left:14px;display:none;}
  .secnav.sep::after{display:block;}
  .topbar-right{flex:1 1 auto;min-width:0;justify-content:flex-end;}
  /* El cercador cedeix espai, però NO s'estira sense límit: si sobra amplada, es queda a 420 i
     l'aire va entre el separador i el cercador. 180 = «Cercant a Wikidata…» en una línia. */
  .topbar-right .search{flex:1 1 auto;min-width:180px;max-width:420px;}
  @media (max-width:480px){ .topbar-right .search{min-width:120px;} }   /* pas 5: últim recurs */
  .topbar.navopen .search{min-width:110px;}   /* amb el menú obert la marca creix: el cercador cedeix mentre estigui obert */
  .secnav{display:flex;align-items:center;gap:14px;min-width:0;}
  /* La marca és un <button> per poder obrir el desplegable. Es neutralitza NOMÉS el chrome
     del botó: gens de font ni color aquí, perquè les regles de .brand (Oswald 20px 600, blanc)
     ja guanyen a l'estil per defecte del navegador. Amb font:inherit sortia en font del
     sistema a 14px i en color fosc sobre el terracota. */
  .secnav>.brand{display:inline-flex;align-items:center;gap:6px;margin:0;padding:0;border:0;background:none;cursor:default;-webkit-appearance:none;appearance:none;}
  .brand-short{display:none;}
  .brandcaret{display:none;width:12px;height:12px;flex:0 0 auto;opacity:.85;transition:transform .15s;}
  .modeswitch{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;}
  .mode{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);font-family:inherit;font-size:14px;font-weight:500;line-height:1;color:#fff;text-decoration:none;white-space:nowrap;transition:background .14s,border-color .14s;}
  .mode:hover{background:rgba(255,255,255,.22);}
  .mode.on{background:#fff;border-color:#fff;color:#B23A2E;font-weight:600;cursor:default;}
  .mode.on:hover{background:#fff;}
  .mode-ic{display:none;width:17px;height:17px;flex:0 0 auto;}
  @media (max-width:860px){ .mode{min-width:32px;min-height:32px;padding:4px 8px;font-size:13px;} }
  @media (max-height:560px){ .mode{min-width:30px;min-height:30px;padding:3px 8px;font-size:13px;} }
  @media (pointer:coarse){ .mode{min-width:30px;min-height:30px;padding:3px 10px;font-size:13px;} }
  @media (max-width:600px),(pointer:coarse){ .mode-tx{display:none;} .mode-ic{display:block;} }
  /* --- pas 3: els botons d'acció passen a icones (regles pròpies de l'index; al joc no hi ha .controls) --- */
  @media (max-width:720px){
    .controls #fitAll .btn-tx,.controls #reset .btn-tx{display:none;}
    .controls #fitAll .btn-ic,.controls #reset .btn-ic{display:block;}
    /* amplada FIXA perquè tots quedin quadrats iguals: si no, «Vista global» es veia més gran
       que les lupes tot i ser ja una icona */
    .controls .btn{width:34px;min-width:34px;min-height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
  }
  /* --- pas 2: plegat: la marca fa de botó i obre el desplegable --- */
  .secnav.navcollapsed{position:relative;gap:0;}
  /* min-height igual que .btn a cada tram: si la marca-botó és més alta que els botons
     d'acció, la topbar creix en plegar-se (feia 75→79px) i es veu el salt. */
  .secnav.navcollapsed>.brand{cursor:pointer;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:8px;padding:0 10px;min-height:38px;transition:background .14s;}
  @media (max-width:860px){ .secnav.navcollapsed>.brand{min-height:32px;padding:0 8px;} }
  @media (max-height:560px){ .secnav.navcollapsed>.brand{min-height:30px;padding:0 8px;} }
  @media (pointer:coarse){ .secnav.navcollapsed>.brand{min-height:30px;padding:0 10px;} }
  .secnav.navcollapsed>.brand:hover{background:rgba(255,255,255,.22);}
  .secnav.navcollapsed .brandcaret{display:block;}
  .secnav.navcollapsed.open>.brand{background:#fff;border-color:#fff;color:#B23A2E;}
  .secnav.navcollapsed.open .brandcaret{transform:rotate(180deg);}
  .secnav.navcollapsed .modeswitch{display:none;position:absolute;top:calc(100% + 8px);left:0;flex-direction:column;align-items:stretch;gap:2px;min-width:196px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(40,44,60,.22);z-index:40;}
  .secnav.navcollapsed.open .modeswitch{display:flex;}
  .secnav.navcollapsed .mode{justify-content:flex-start;min-width:0;min-height:0;padding:9px 10px;border:0;background:none;border-radius:6px;color:var(--text);font-size:14px;font-weight:500;}
  .secnav.navcollapsed .mode:hover{background:var(--soft);}
  .secnav.navcollapsed .mode.on{background:#F7E5E0;color:#B23A2E;font-weight:600;}
  .secnav.navcollapsed .mode-tx{display:inline;}
  .secnav.navcollapsed .mode-ic{display:block;}
  /* --- pas 4: marca abreujada; en obrir el menú es torna a veure sencera --- */
  .secnav.hb .brand-long{display:none;}
  .secnav.hb .brand-short{display:inline;}
  .secnav.hb.open .brand-long{display:inline;}
  .secnav.hb.open .brand-short{display:none;}
  /* ===== fi del bloc compartit ===== */
  .btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:500;min-width:38px;min-height:38px;cursor:pointer;transition:background .12s;font-family:inherit;}
  .btn:hover{background:rgba(255,255,255,.22);}
  .datainfo{color:rgba(255,255,255,.85);font-size:12px;white-space:nowrap;}

  /* ===== Contingut ===== */
  main{max-width:920px;margin:0 auto;padding:24px 18px 64px;}
  .lead{color:var(--text2);font-size:14px;margin:2px 0 22px;}
  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .gamecard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-card);padding:18px;cursor:pointer;transition:transform .12s,box-shadow .12s;font:inherit;color:inherit;}
  .gamecard:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--slate),0 5px 11px rgba(40,44,60,.20);}
  .gamecard .ic{font-size:30px;line-height:1;}
  .gamecard .t{font-size:17px;font-weight:600;}
  .gamecard .d{font-size:13px;color:var(--text2);line-height:1.4;}
  .placeholder{background:var(--canvas);border:1px dashed var(--border-strong);border-radius:var(--r-card);padding:48px 24px;text-align:center;}
  .placeholder .ic{font-size:52px;line-height:1;}
  .placeholder h2{margin:14px 0 6px;font-size:22px;font-family:'Oswald','Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.03em;}
  .placeholder .d{color:var(--text2);max-width:460px;margin:0 auto 18px;line-height:1.5;}
  .badge{display:inline-block;background:#F7E5E0;color:#B23A2E;font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);letter-spacing:.02em;}
  .err{background:#F7E5E0;color:#B23A2E;padding:16px;border-radius:var(--r-card);line-height:1.5;}
  .soon{align-self:flex-start;margin-top:2px;background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);}
  /* --- Personatge del dia --- */
  .pwrap{max-width:560px;margin:0 auto;}
  .ploading,.perror{text-align:center;color:var(--text2);padding:44px 16px;font-size:15px;line-height:1.6;}
  .pspin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--topbar-bg);border-radius:50%;animation:pspin .8s linear infinite;margin:0 auto 14px;}
  @keyframes pspin{to{transform:rotate(360deg);}}
  .pcard{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;box-shadow:0 8px 22px rgba(40,44,60,.12);}
  .pimg{width:100%;height:300px;object-fit:cover;background:var(--surface);display:block;}
  .pimg.ph{display:flex;align-items:center;justify-content:center;font-size:66px;color:var(--border-strong);}
  .pbody{padding:20px;}
  .pname{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1.15;margin:0 0 4px;}
  .pdesc{color:var(--text2);font-size:15px;line-height:1.5;margin:0 0 14px;}
  .pchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .pchip{background:#F7E5E0;color:#B23A2E;font-size:13px;font-weight:600;padding:4px 11px;border-radius:var(--r-pill);}
  .pchip.yr{background:var(--surface);color:var(--text);}
  .pacts{display:flex;flex-wrap:wrap;gap:10px;}
  .pbtn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;padding:11px 14px;border-radius:var(--r-card);border:1px solid var(--border-strong);background:var(--canvas);color:var(--text);transition:transform .12s,box-shadow .12s,border-color .12s,color .12s;}
  .pbtn:hover{transform:translateY(-1px);border-color:var(--topbar-bg);color:var(--topbar-bg);}
  .pbtn.fav.on{background:#F7E5E0;border-color:var(--topbar-bg);color:#B23A2E;}
  .palbum{text-align:center;color:var(--text2);font-size:13px;margin-top:16px;}
  .pretry{margin-top:14px;font:inherit;font-weight:600;cursor:pointer;padding:9px 18px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--canvas);color:var(--text);}

  /* ===== Joc: «Abans o després?» ===== */
  .game{max-width:560px;margin:0 auto;}
  .gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;}
  .gtitle{font-family:'Oswald','Roboto Condensed',Arial,sans-serif;font-weight:600;letter-spacing:.03em;font-size:20px;line-height:1.1;}
  .gscore{flex:0 0 auto;}
  .gscore .n{display:inline-flex;align-items:center;gap:6px;background:#F7E5E0;color:var(--topbar-bg);font-family:'Oswald','Roboto Condensed',Arial,sans-serif;font-weight:600;font-size:18px;line-height:1;padding:6px 13px;border-radius:var(--r-pill);}
  @keyframes scorepop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
  .gscore .n.pop{animation:scorepop .4s ease-out;}
  .ad-q{color:var(--text2);text-align:center;margin:10px 0 18px;font-size:14px;}
  .gamefoot{text-align:center;color:var(--text2);font-size:12px;margin-top:22px;letter-spacing:.02em;}
  .cards2{display:grid;grid-template-columns:1fr;gap:10px;perspective:900px;}
  .itemcard{position:relative;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 18px 16px;text-align:center;}
  .itemcard.ref{border:3px solid var(--topbar-bg);}
  .itemcard.new{border-color:var(--border-strong);box-shadow:0 8px 20px rgba(40,44,60,.16);}
  .itemcard .meta{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.02em;margin-bottom:4px;min-height:16px;}
  .itemcard .meta.ev{font-size:16px;opacity:.75;}
  .itemcard .nm{font-size:19px;font-weight:600;line-height:1.25;margin-top:4px;}
  .itemcard .yr{font-family:'Oswald','Roboto Condensed',Arial,sans-serif;font-size:32px;font-weight:600;margin-top:8px;min-height:38px;color:var(--text);transform-origin:center;}
  .itemcard .yr .q{color:var(--border-strong);}
  .vs{width:fit-content;margin:0 auto;background:var(--topbar-bg);color:#fff;font-family:'Oswald','Roboto Condensed',Arial,sans-serif;font-weight:600;letter-spacing:.12em;font-size:11px;padding:3px 12px;border-radius:var(--r-pill);}
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96);}to{opacity:1;transform:none;}}
  .itemcard.enter{animation:cardIn .28s ease-out;}
  @keyframes yrFlip{0%{opacity:0;transform:rotateX(90deg);}100%{opacity:1;transform:rotateX(0);}}
  .itemcard .yr.reveal{animation:yrFlip .5s ease-out;}
  .choices{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:18px;align-items:stretch;}
  .choice{padding:18px 16px;border-radius:var(--r-card);border:1.5px solid var(--border-strong);background:var(--canvas);font:inherit;font-size:16px;font-weight:600;cursor:pointer;color:var(--text);box-shadow:0 3px 0 #E7C3B8;transition:transform .1s,box-shadow .1s,border-color .1s,color .1s;}
  .choice:hover{transform:translateY(-2px);border-color:var(--topbar-bg);color:var(--topbar-bg);box-shadow:0 6px 14px rgba(184,80,60,.22);}
  .choice:active{transform:translateY(2px);box-shadow:0 1px 0 #E7C3B8;}
  .choice:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;color:var(--text);}
  .choice .big{display:block;font-size:30px;line-height:1;margin-bottom:4px;color:var(--topbar-bg);font-family:'Oswald','Roboto Condensed',Arial,sans-serif;transition:transform .1s;}
  .choice:hover .big{transform:scale(1.12);}
  .pass{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 16px;border-radius:var(--r-card);border:2px dashed #C79A3A;background:linear-gradient(180deg,#FFF9EC,#FBEFCF);color:#8A6A1E;font:inherit;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #E6D3A0;transition:transform .1s,box-shadow .1s,border-color .1s,color .1s;}
  .pass .jk{font-size:24px;line-height:1;text-transform:none;}
  .pass .jt{font-size:10px;}
  .pass .jn{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;line-height:20px;padding:0 5px;border-radius:999px;background:#C79A3A;color:#fff;font-size:12px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .pass:hover:not(:disabled){transform:translateY(-2px);border-color:#B4841F;color:#6E5416;box-shadow:0 6px 14px rgba(199,154,58,.3);}
  .pass:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #E6D3A0;}
  .pass:disabled{opacity:1;filter:grayscale(1);background:#EAEAEA;border-color:#C6C6C6;border-style:solid;color:#9A9A9A;cursor:default;transform:none;box-shadow:none;}
  .pass:disabled .jt{text-decoration:line-through;}
  .pass:disabled .jn{background:#A9A9A9;}
  @media (prefers-reduced-motion:reduce){
    .itemcard.enter,.itemcard .yr.reveal,.gscore .n.pop,.flash-ok,.flash-no{animation:none!important;}
    .choice,.choice .big,.gamecard{transition:none!important;}
  }
  .itemcard.flash-ok{border:3px solid #2E9B5B;background:#E9F7EE;box-shadow:0 8px 24px rgba(45,150,90,.30);animation:okpulse .5s;}
  .itemcard.flash-no{border:3px solid #C43A2C;background:#FBECEA;box-shadow:0 8px 24px rgba(196,58,44,.30);animation:nopulse .5s;}
  .itemcard.flash-ok .yr{color:#238049;}
  .itemcard.flash-no .yr{color:#B4321F;}
  .itemcard.flash-ok::after,.itemcard.flash-no::after{position:absolute;top:-16px;right:-14px;width:42px;height:42px;line-height:42px;text-align:center;border-radius:999px;font-size:23px;font-weight:800;color:#fff;box-shadow:0 3px 9px rgba(0,0,0,.28);z-index:3;}
  .itemcard.flash-ok::after{content:"\2713";background:#2E9B5B;}
  .itemcard.flash-no::after{content:"\2717";background:#C43A2C;}
  @keyframes okpulse{0%{transform:scale(.96);box-shadow:0 0 0 0 rgba(45,150,90,.6);}55%{transform:scale(1.03);}100%{transform:scale(1);box-shadow:0 8px 24px rgba(45,150,90,.30);}}
  @keyframes nopulse{0%{transform:translateX(0);}15%{transform:translateX(-7px);}30%{transform:translateX(6px);}45%{transform:translateX(-5px);}60%{transform:translateX(4px);}75%{transform:translateX(-2px);}100%{transform:translateX(0);}}
  .gameover{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-card);padding:32px 24px;text-align:center;max-width:560px;margin:0 auto;}
  .gameover h2{font-family:'Oswald',Arial,sans-serif;font-weight:600;margin:0 0 8px;font-size:24px;letter-spacing:.03em;}
  .gameover .stats{display:flex;justify-content:center;gap:34px;margin:16px 0 20px;}
  .gameover .stat .v{font-family:'Oswald','Roboto Condensed',Arial,sans-serif;font-size:42px;font-weight:600;color:var(--topbar-bg);line-height:1;}
  .gameover .stat .k{font-size:12px;color:var(--text2);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}
  .gameover .sub{color:var(--text2);margin:8px 0 20px;}
  .cta{background:var(--topbar-bg);color:#fff;border:none;border-radius:var(--r-pill);padding:12px 26px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;}
  .cta:hover{filter:brightness(1.06);}
  .tagd{align-self:flex-start;margin-top:2px;background:#F7E5E0;color:#B23A2E;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);}
  .gamehead{text-align:center;margin:0 0 10px;}

  .btnrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}

  /* ===== Responsive (mateixos punts de tall que la topbar d'index) ===== */
  @media (max-width:860px){
    .topbar{padding:10px 14px;gap:10px;}

  @media (max-height:560px){

    .brand{font-size:15px;letter-spacing:.04em;}

  }
  /* === Layout HORITZONTAL per a MOBIL tactil (repensat en columnes) ===
     Nomes s'activa en pantalles tactils, en horitzontal i amb alcada petita
     (mobils; les tauletes en horitzontal tenen prou espai i es queden amb el

  @media (orientation:landscape) and (pointer:coarse) and (max-height:600px){
    main{padding:10px 14px 14px;}
    .game{max-width:none;display:grid;grid-template-columns:1fr 1fr minmax(120px,.8fr);grid-template-areas:"top top top" "cards cards btns";column-gap:14px;row-gap:6px;align-items:stretch;}
    .gtop{grid-area:top;margin-bottom:2px;}
    .cards2{grid-area:cards;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
    .vs{align-self:center;}
    .itemcard{padding:10px 12px 9px;}
    .itemcard .meta{font-size:11px;min-height:14px;margin-bottom:2px;}
    .itemcard .meta.ev{font-size:13px;}
    .itemcard .nm{font-size:15px;margin-top:2px;}
    .itemcard .yr{font-size:25px;min-height:29px;margin-top:5px;}
    .choices{grid-area:btns;grid-template-columns:1fr;grid-auto-rows:auto;gap:8px;margin-top:0;align-content:center;}
    .choices .choice[data-a="abans"]{order:1;}
    .choices .choice[data-a="despres"]{order:2;}
    .choices .pass{order:3;}
    .choice{padding:12px 12px;font-size:15px;}
    .choice .big{display:inline;font-size:20px;margin:0 6px 0 0;}
    .pass{flex-direction:row;gap:8px;padding:8px 12px;}
    .pass .jk{font-size:20px;}
    .gamefoot{display:none;}
  }
</style>
</head>
<body>

  <div class="topbar-left">
    <!-- BLOC COMPARTIT: mateix markup als dos fitxers; nomes canvia quin <a> porta .on -->
    <div class="secnav">

<!-- ⚠️ PROVISIONAL: data.js és una CÒPIA (snapshot) de les dades que ara viuen a
     index.html, feta per facilitar el testeig local. Quan existeixi la DB externa,
     substituir aquest <script> pel carregador real (fetch a la DB). Veure ESTRATEGIA_JOC.md. -->
<script src="data.js"></script>
<!-- Índex d'IDs de Wikidata per al joc «Personatge del dia». Generar amb gen_personatges.py.
     De moment pot ser una MOSTRA de poques entrades per validar el flux. Veure ESTRATEGIA_JOC.md. -->
<script src="personatges.js"></script>
<script>
(function(){
  "use strict";
  // --- Catàleg de jocs (de moment només obren un placeholder) ---
  const GAMES=[
    {id:'ordena',       ic:'🕰️', t:'Ordena la línia',        d:'Posa 4–5 fets o personatges en el seu ordre cronològic correcte.'},
    {id:'abansdespres', ic:'⚖️', t:'Abans o després?',        d:'Encadena encerts dient si cada item és abans o després. Un repte nou cada dia.'},
    {id:'personatgedia',ic:'🎭', t:'Personatge del dia',      d:'Cada dia, una persona real de la història per descobrir i aprendre.', discover:true},
    {id:'personatge',   ic:'🕵️', t:'Endevina el personatge',  d:'Pistes progressives (era, categoria, descripció) fins encertar-ho.'},
    {id:'contemporanis',ic:'🤝', t:'Contemporanis?',          d:'Van coincidir en vida aquestes dues persones? Sí o no.'}
  ];
  const app=document.getElementById('app');
  const back=document.getElementById('back');
  const info=document.getElementById('datainfo');
  let activeModule=null;

  function dataOk(){return !!(window.HB_DATA && HB_DATA.PEOPLE && HB_DATA.EVENTS && HB_DATA.MARCS);}

  function showInfo(){
    info.textContent = dataOk()
      ? `${HB_DATA.PEOPLE.length} personatges · ${HB_DATA.EVENTS.length} esdeveniments · ${HB_DATA.MARCS.length} marcs`
      : '';
  }

  // ---- Utils compartits ----
  const fmtYear = y => y<0 ? Math.abs(y)+' aC' : String(y);
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---- Utils del repte diari: determinisme per data (mitjanit LOCAL de cada jugador) ----
  function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return todayStr(d); }
  function ddmm(s){ const a=s.split('-'); return a[2]+'/'+a[1]+'/'+a[0]; }
  // Llavor estable a partir de la data (FNV-1a) + PRNG mulberry32 + barreja sembrada.
  function seedFromStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seededShuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function msToMidnight(){ const now=new Date(); const mid=new Date(now); mid.setHours(24,0,0,0); return mid-now; }
  function fmtDur(ms){ if(ms<0) ms=0; let s=Math.floor(ms/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); const ss=s-m*60; const p=n=>String(n).padStart(2,'0'); return p(h)+':'+p(m)+':'+p(ss); }

  // Pool d'items per als jocs cronològics: esdeveniments + persones (naixement i mort).
  // NO incloem marcs/eres: els seus anys d'inici/fi són massa imprecisos.
  function buildPool(){
    const pool=[];
    (HB_DATA.EVENTS||[]).forEach(e=>{
      if(typeof e.year==='number') pool.push({key:'ev:'+e.id,kind:'event',name:e.name,year:e.year});
    });
    (HB_DATA.PEOPLE||[]).forEach(p=>{
      if(typeof p.birth==='number') pool.push({key:'pe:'+p.id+':b',kind:'person',anchor:'naix',name:p.name,year:p.birth});
      if(typeof p.death==='number') pool.push({key:'pe:'+p.id+':d',kind:'person',anchor:'mort',name:p.name,year:p.death});
    });
    return pool;
  }

  // ===== Mòdul: «Abans o després?» — REPTE DIARI (determinista per data + 1 intent/dia) =====
  const AbansDespres = (function(){
    const DAILY_KEY='hb_ad_daily';    // { date, score, perfect }
    const STREAK_KEY='hb_ad_streak';  // { last, days }
    let root=null, deck=[], idx=0, current=null, candidate=null, score=0, locked=false, skipUsed=false, timer=null, cdTimer=null;

    function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } }
    function writeLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }

    // Meta discreta: esdeveniments només icôna 📜; persones indiquen naixement/mort (imprescindible).
    function meta(it){
      if(it.kind==='event') return '<div class="meta ev"></div>';
      return it.anchor==='naix'
        ? '<div class="meta">🎂 naixement</div>'
        : '<div class="meta">🕯️ mort</div>';
    }
    // role: 'ref' (fixada, amb xinxeta) o 'new' (elevada, apareix animada). flip: anima l'any en revelar-se.
    function card(it,opts){
      opts=opts||{};
      const cls='itemcard '+(opts.role||'')+(opts.enter?' enter':'');
      const yrInner = opts.reveal ? fmtYear(it.year) : '<span class="q">?</span>';
      const yrCls = 'yr'+(opts.flip?' reveal':'');
      return `<div class="${cls}">${meta(it)}<div class="nm">${it.name}</div><div class="${yrCls}">${yrInner}</div></div>`;
    }

    function head(){ return `<div class="gamehead"><h2>⚖️ Abans o després?</h2><div class="sub">Repte diari · ${ddmm(todayStr())}</div></div>`; }

    // Següent candidat de la baralla FINITA (sense rebarreig). Salta empats d'any (determinista).
    function nextCandidate(){
      while(idx<deck.length){ const c=deck[idx++]; if(c.year!==current.year) return c; }
      return null; // baralla esgotada => ronda perfecta
    }

    // Pool del dia: cada PERSONA hi surt NOMÉS UN COP (naixement O mort, triat per la llavor).
    // Així mai comparem el naixement d'algú contra la seva pròpia mort, ni surt duplicada.
    function dailyPool(rng){
      const raw = buildPool();
      const events = raw.filter(x=>x.kind==='event');
      const byPerson = {};
      raw.filter(x=>x.kind==='person').forEach(it=>{
        const pid = it.key.split(':')[1];
        (byPerson[pid]=byPerson[pid]||[]).push(it);
      });
      const persons = [];
      Object.keys(byPerson).sort().forEach(pid=>{
        const arr = byPerson[pid].sort((a,b)=> a.key<b.key?-1:1); // ordre estable (:b abans :d)
        persons.push(arr.length>1 ? arr[rng()<0.5?0:1] : arr[0]);
      });
      const pool = events.concat(persons);
      pool.sort((a,b)=> a.key<b.key?-1:(a.key>b.key?1:0)); // ordre estable abans de sembrar
      return pool;
    }

    // ===== Generació del "game path" amb dificultat controlada =====
    // Dificultat perceptiva (logarítmica): g = |ln(edatA/edatB)|, edat = anys enrere des d'ANY_REF.
    // g PETIT => els dos ítems queden "a prop" en percepció => DIFÍCIL. g GRAN => FÀCIL.
    const AD_CONFIG = {
      refYear: 2026,   // "present" per calcular l'edat de cada ítem
      gHardMax: 0.55,  // passos "gruix": g <= gHardMax (difícil/mig)
      gEasyMin: 0.70,  // "respirs": banda MÍNIMA de g (respir moderat)
      gEasyMax: 1.25,  // "respirs": banda MÀXIMA de g (evita salts trivials/obvis)
      pRespir: 0.22,   // probabilitat (sembrada) que un pas sigui respir (~1 de cada 4-5)
      warmup: 2        // primers passos forçats a respir (escalfament suau)
    };
    function ageOf(it){ return Math.max(1, AD_CONFIG.refYear - it.year); }
    function gap(a,b){ return Math.abs(Math.log(ageOf(a)/ageOf(b))); }

    // Passeig voraç sembrat: cada següent ítem es tria segons la banda de dificultat desitjada.
    // Tot es deriva del MATEIX rng del dia (ordre de consum fix) => 100% determinista.
    function buildPath(pool, rng){
      const cfg = AD_CONFIG;
      const rem = pool.slice();
      if(!rem.length) return [];
      const path = [ rem.splice(Math.floor(rng()*rem.length),1)[0] ];
      let step = 0;
      while(rem.length){
        step++;
        const ref = path[path.length-1];
        const scored = rem.map((it,i)=>({i,g:gap(ref,it)})).filter(o=>o.g>1e-9); // evita empats d'any
        if(!scored.length){ rem.sort((a,b)=> a.key<b.key?-1:1).forEach(x=>path.push(x)); break; }
        const wantEasy = (step<=cfg.warmup) || (rng() < cfg.pRespir);
        let band;
        if(wantEasy){
          band = scored.filter(o=>o.g>=cfg.gEasyMin && o.g<=cfg.gEasyMax);
          if(!band.length){ const mid=(cfg.gEasyMin+cfg.gEasyMax)/2; band = scored.slice().sort((a,b)=>Math.abs(a.g-mid)-Math.abs(b.g-mid)).slice(0, Math.max(1,Math.ceil(scored.length*0.2))); }
        } else {
          band = scored.filter(o=>o.g<=cfg.gHardMax);
          if(!band.length) band = scored.slice().sort((a,b)=>a.g-b.g).slice(0, Math.max(1,Math.ceil(scored.length*0.2)));
        }
        const pick = band[Math.floor(rng()*band.length)];
        path.push(rem.splice(pick.i,1)[0]);
      }
      return path;
    }

    // Hook de depuració per a l'script d'anàlisi (no afecta el joc).
    try{ window.__AD = {
      config: AD_CONFIG,
      gap: gap,
      pool: function(ds){ return dailyPool(mulberry32(seedFromStr(ds))); },
      sim: function(ds){ const r=mulberry32(seedFromStr(ds)); return buildPath(dailyPool(r), r); }
    }; }catch(_){}

    function render(){
      root.innerHTML = `
        <div class="game">
          <div class="gtop">
            <div class="gtitle">⚖️ Abans o després?</div>
            <div class="gscore"><div class="n" id="scoren"><span class="ic">🎯</span><span class="v">${score}</span></div></div>
          </div>
          <div class="cards2">
            ${card(current,{role:'ref',reveal:true})}
            <div class="vs">VS</div>
            <div id="candslot">${card(candidate,{role:'new',enter:true})}</div>
          </div>
          <div class="choices">
            <button class="choice" data-a="abans"><span class="big">←</span>Abans</button>
            <button class="pass" data-x="skip"${skipUsed?' disabled':''} title="${skipUsed?'Comodí ja gastat en aquesta partida':'Comodí: passa aquesta parella (un cop per partida)'}"><span class="jk">🃏</span><span class="jt">${skipUsed?'Gastat':'Comodí'}</span><span class="jn">${skipUsed?0:1}</span></button>
            <button class="choice" data-a="despres"><span class="big">→</span>Després</button>
          </div>
          <div class="gamefoot">📅 Repte diari · ${ddmm(todayStr())}</div>
        </div>`;
      root.querySelectorAll('.choice').forEach(b=>{
        b.addEventListener('click',()=>guess(b.getAttribute('data-a')));
      });
      const sk=root.querySelector('[data-x="skip"]'); if(sk) sk.addEventListener('click',skip);
    }

    function guess(ans){
      if(locked||!candidate) return;
      locked=true;
      const correct = (ans==='abans' && candidate.year<current.year) || (ans==='despres' && candidate.year>current.year);
      const slot=root.querySelector('#candslot');
      if(slot){ slot.innerHTML=card(candidate,{role:'new',reveal:true,flip:true}); const c=slot.querySelector('.itemcard'); if(c) c.classList.add(correct?'flash-ok':'flash-no'); }
      root.querySelectorAll('.choice').forEach(b=>{ b.disabled=true; });
      if(correct){
        score++;
        const sn=root.querySelector('#scoren'); if(sn){ const v=sn.querySelector('.v'); if(v) v.textContent=score; sn.classList.remove('pop'); void sn.offsetWidth; sn.classList.add('pop'); }
        current=candidate;
        const nxt=nextCandidate();
        if(nxt){ candidate=nxt; timer=setTimeout(()=>{ locked=false; render(); },2000); }
        else { candidate=null; timer=setTimeout(()=>finish(true),2000); } // ronda perfecta
      }else{
        timer=setTimeout(()=>finish(false),2100);
      }
    }

    // Comodí: passar UN cop per partida. No suma ni resta; només avança a un nou candidat.
    function skip(){
      if(locked||skipUsed||!candidate) return;
      skipUsed=true;
      const nxt=nextCandidate();
      if(nxt){ candidate=nxt; render(); }
      else { candidate=null; finish(true); } // baralla esgotada en passar => ronda perfecta
    }

    function finish(perfect){
      const today=todayStr();
      const st=readLS(STREAK_KEY);
      let days=1;
      if(st){ if(st.last===yesterdayStr()) days=(st.days||0)+1; else if(st.last===today) days=st.days||1; else days=1; }
      writeLS(STREAK_KEY,{last:today,days:days});
      writeLS(DAILY_KEY,{date:today,score:score,perfect:!!perfect});
      showResult(score,!!perfect);
    }

    function showResult(sc,perfect){
      if(timer){ clearTimeout(timer); timer=null; }
      const st=readLS(STREAK_KEY); const days=st?(st.days||0):0;
      const title = perfect ? '<span class="perfect">Ronda perfecta! 🏆</span>' : 'Repte completat';
      root.innerHTML = `
        <div class="gameover">
          ${head()}
          <h2 class="rtitle">${title}</h2>
          <div class="stats">
            <div class="stat"><div class="v">🎯 ${sc}</div><div class="k">encerts seguits</div></div>
            <div class="stat"><div class="v">🔥 ${days}</div><div class="k">${days===1?'dia':'dies'} seguits</div></div>
          </div>
          <div class="locknote">Ja has jugat el repte d'avui. Torna demà per un de nou!</div>
          <div class="countdown">Nou repte en <b id="cd">--:--:--</b></div>
          <div class="btnrow"><button class="cta" data-x="share">📤 Comparteix</button></div>
        </div>`;
      const sh=root.querySelector('[data-x="share"]');
      if(sh) sh.addEventListener('click',()=>doShare(sc,days,sh));
      startCountdown();
    }

    function doShare(sc,days,btn){
      const text='🏛️ Història Bàsica — Repte diari '+ddmm(todayStr())+'\n🎯 '+sc+' encerts seguits\n🔥 '+days+' '+(days===1?'dia':'dies')+' seguits';
      if(navigator.share){ navigator.share({text:text}).catch(()=>{}); return; }
      const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='Copiat! ✅'; setTimeout(()=>{ btn.textContent=o; },1800); } };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(done); }
      else { done(); }
    }

    function startCountdown(){
      if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
      const tick=()=>{ const el=root&&root.querySelector('#cd'); if(!el){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} return; } el.textContent=fmtDur(msToMidnight()); };
      tick(); cdTimer=setInterval(tick,1000);
    }

    function start(){
      if(timer){ clearTimeout(timer); timer=null; }
      if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
      const today=todayStr();
      const daily=readLS(DAILY_KEY);
      if(daily && daily.date===today){ showResult(daily.score,!!daily.perfect); return; } // ja jugat avui => bloquejat
      const rng=mulberry32(seedFromStr(today));
      const pool=dailyPool(rng); // cada persona només un cop (naix O mort) segons la llavor del dia
      deck=buildPath(pool,rng);  // ordena el pool en un camí amb dificultat controlada (g logarítmic)
      idx=0; score=0; locked=false; skipUsed=false; current=null; candidate=null;
      current=deck[idx++]||null;
      candidate=current?nextCandidate():null;
      if(!current||!candidate){ root.innerHTML='<div class="err">No hi ha prou dades per jugar.</div>'; return; }
      render();
    }

    return {
      mount(container){ root=container; start(); },
      unmount(){ if(timer){ clearTimeout(timer); timer=null; } if(cdTimer){ clearInterval(cdTimer); cdTimer=null; } root=null; }
    };
  })();

  // ===== Mòdul: «Personatge del dia» — DESCOBRIMENT (determinista per data, dades en viu de Wikidata) =====
  const PersonatgeDia = (function(){
    const CACHE_KEY='hb_personatge_cache'; // { date, person }
    const ALBUM_KEY='hb_personatge_album'; // [ {qid,name,birth,death,img,desc,date} ]
    const FAV_KEY='hb_favorits';           // stub; enllaçarà amb Favorits quan existeixin
    const VIEW_KEY='hb_view_person';       // handoff cap al cronograma (index.html?person=QID)
    const WD_API='https://www.wikidata.org/w/api.php';
    const COMMONS='https://commons.wikimedia.org/wiki/Special:FilePath/';
    const MAX_TRIES=5; // intents deterministes (base, base+1, …) si algun QID de la llista fos invàlid/esborrat
    let root=null, alive=false, person=null;

    function readLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } }
    function writeLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
    function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

    // --- Wikidata ---
    async function wd(params){
      params.format='json'; params.origin='*';
      const qs=Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
      const r=await fetch(WD_API+'?'+qs);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }
    function hasItem(e,prop,qid){ const c=e.claims&&e.claims[prop]; if(!c) return false; return c.some(function(s){ const v=s.mainsnak&&s.mainsnak.datavalue&&s.mainsnak.datavalue.value; return v&&v.id===qid; }); }
    function yearFrom(e,prop){ const c=e.claims&&e.claims[prop]; if(!c||!c.length) return null; const dv=c[0].mainsnak&&c[0].mainsnak.datavalue&&c[0].mainsnak.datavalue.value; const t=dv&&dv.time; if(!t) return null; const m=t.match(/^([+-])0*(\d+)-/); if(!m) return null; const y=parseInt(m[2],10); return m[1]==='-'?-y:y; }
    function imgUrl(e){ const c=e.claims&&e.claims.P18; if(!c||!c.length) return null; const dv=c[0].mainsnak&&c[0].mainsnak.datavalue; if(!dv) return null; return COMMONS+encodeURIComponent(String(dv.value).replace(/ /g,'_'))+'?width=500'; }
    function itemQids(e,prop,max){ const c=e.claims&&e.claims[prop]; if(!c) return []; const out=[]; for(let i=0;i<c.length;i++){ const v=c[i].mainsnak&&c[i].mainsnak.datavalue&&c[i].mainsnak.datavalue.value; if(v&&v.id){ out.push(v.id); if(out.length>=max) break; } } return out; }
    function lbl(o){ return o?((o.ca||o.es||o.en||{}).value||null):null; }
    function isValid(e){
      if(!e || e.missing!==undefined) return false;
      if(!hasItem(e,'P31','Q5')) return false;                          // ha de ser humà
      if(!(e.claims&&e.claims.P569&&e.claims.P569.length)) return false; // ha de tenir naixement
      if(!lbl(e.labels)) return false;                                  // etiqueta en ca/es/en
      const s=e.sitelinks||{};                                          // entrada a Viquipèdia en ca I es I en (AND dels tres)
      if(!(s.cawiki && s.eswiki && s.enwiki)) return false;
      return true;
    }
    async function labelsFor(qids){
      if(!qids.length) return {};
      const data=await wd({action:'wbgetentities',ids:qids.join('|'),props:'labels',languages:'ca|es|en'});
      const map={}, ents=data.entities||{};
      Object.keys(ents).forEach(function(q){ map[q]=lbl(ents[q].labels); });
      return map;
    }
    async function build(e,qid){
      const occQ=itemQids(e,'P106',3), couQ=itemQids(e,'P27',2);
      const names=await labelsFor(occQ.concat(couQ));
      const s=e.sitelinks||{}, site=s.cawiki||s.eswiki||s.enwiki||{};
      return {
        qid:qid,
        name:lbl(e.labels)||qid,
        desc:lbl(e.descriptions)||'',
        birth:yearFrom(e,'P569'),
        death:yearFrom(e,'P570'),
        img:imgUrl(e),
        occ:occQ.map(function(q){ return names[q]; }).filter(Boolean),
        country:couQ.map(function(q){ return names[q]; }).filter(Boolean),
        wiki:site.url||''
      };
    }
    // Selecció determinista des de l'índex offline (personatges.js → window.HB_PERSONATGES).
    // La llavor del dia tria una posició de la llista i es baixa la fitxa d'aquell QID de Wikidata.
    // Igual per a tothom durant 24h. La llista es genera amb gen_personatges.py (humans amb
    // data de naixement i article a la Viquipèdia en català I castellà I anglès (AND)). Només IDs, res més.
    function pool(){ return (typeof window!=='undefined' && Array.isArray(window.HB_PERSONATGES)) ? window.HB_PERSONATGES : []; }
    async function fetchPerson(qid){
      const data=await wd({action:'wbgetentities',ids:qid,props:'labels|descriptions|claims|sitelinks/urls',languages:'ca|es|en',sitefilter:'cawiki|eswiki|enwiki'});
      const e=(data.entities||{})[qid];
      if(!isValid(e)) return null;
      return build(e,qid);
    }
    async function pickDaily(ds){
      const cache=readLS(CACHE_KEY);
      if(cache && cache.date===ds && cache.person) return cache.person;
      const list=pool();
      if(!list.length){ const err=new Error('LIST_MISSING'); err.code='LIST_MISSING'; throw err; }
      const rng=mulberry32(seedFromStr('pd:'+ds));
      const base=Math.floor(rng()*list.length);
      for(let k=0;k<MAX_TRIES;k++){
        const idx=(base+k)%list.length;
        const qid='Q'+list[idx];
        const p=await fetchPerson(qid);
        if(p){ writeLS(CACHE_KEY,{date:ds,person:p}); return p; }
      }
      return null;
    }

    // --- Àlbum + favorits (localStorage) ---
    function addToAlbum(p){ const a=readLS(ALBUM_KEY)||[]; if(!a.some(function(x){ return x.qid===p.qid; })){ a.push({qid:p.qid,name:p.name,birth:p.birth,death:p.death,img:p.img,desc:p.desc,date:todayStr()}); writeLS(ALBUM_KEY,a); } }
    function favs(){ return readLS(FAV_KEY)||[]; }
    function isFav(qid){ return favs().some(function(x){ return x.qid===qid; }); }
    function toggleFav(p){ let a=favs(); if(a.some(function(x){ return x.qid===p.qid; })) a=a.filter(function(x){ return x.qid!==p.qid; }); else a.push({qid:p.qid,name:p.name,birth:p.birth,death:p.death,img:p.img,desc:p.desc}); writeLS(FAV_KEY,a); return isFav(p.qid); }
    function viewInCronograma(p){ writeLS(VIEW_KEY,{qid:p.qid,name:p.name,birth:p.birth,death:p.death,img:p.img,desc:p.desc}); location.href='index.html?person='+encodeURIComponent(p.qid); }

    // --- Render ---
    function renderLoading(){ root.innerHTML=''; const w=el('div','pwrap'), l=el('div','ploading'); l.appendChild(el('div','pspin')); l.appendChild(document.createTextNode('Cercant a Wikidata…')); w.appendChild(l); root.appendChild(w); }
    function renderError(msg){ root.innerHTML=''; const w=el('div','pwrap'), p=el('div','perror'); p.appendChild(el('div',null,'⚠️')); p.appendChild(el('div',null,msg)); const b=el('button','pretry','Torna-ho a provar'); b.addEventListener('click',start); p.appendChild(b); w.appendChild(p); root.appendChild(w); }
    function renderPerson(p){
      root.innerHTML='';
      const w=el('div','pwrap'), card=el('div','pcard');
      if(p.img){ const im=el('img','pimg'); im.src=p.img; im.alt=p.name; im.addEventListener('error',function(){ im.style.display='none'; }); card.appendChild(im); }
      else { card.appendChild(el('div','pimg ph','👤')); }
      const body=el('div','pbody');
      body.appendChild(el('h2','pname',p.name));
      body.appendChild(el('p','pdesc',p.desc||'Sense descripció disponible.'));
      const chips=el('div','pchips');
      p.occ.forEach(function(o){ chips.appendChild(el('span','pchip',o)); });
      p.country.forEach(function(c){ chips.appendChild(el('span','pchip',c)); });
      const life=(p.birth!=null?fmtYear(p.birth):'?')+' – '+(p.death!=null?fmtYear(p.death):'…');
      chips.appendChild(el('span','pchip yr',life));
      body.appendChild(chips);
      const acts=el('div','pacts');
      const fav=isFav(p.qid);
      const fb=el('button','pbtn fav'+(fav?' on':''), fav?'★ Als favorits':'☆ Afegeix a favorits');
      fb.addEventListener('click',function(){ const on=toggleFav(p); fb.classList.toggle('on',on); fb.textContent=on?'★ Als favorits':'☆ Afegeix a favorits'; });
      acts.appendChild(fb);
      const cb=el('button','pbtn','📅 Veure al cronograma'); cb.addEventListener('click',function(){ viewInCronograma(p); }); acts.appendChild(cb);
      if(p.wiki){ const a=el('a','pbtn','🔗 Llegeix-ne més'); a.href=p.wiki; a.target='_blank'; a.rel='noopener'; acts.appendChild(a); }
      body.appendChild(acts); card.appendChild(body); w.appendChild(card);
      const album=readLS(ALBUM_KEY)||[];
      w.appendChild(el('div','palbum','🗂️ Has descobert '+album.length+' '+(album.length===1?'personatge':'personatges')));
      root.appendChild(w);
    }

    function start(){
      renderLoading();
      pickDaily(todayStr()).then(function(p){ if(!alive) return; if(!p){ renderError('No hem trobat cap personatge avui. Torna-ho a provar.'); return; } person=p; addToAlbum(p); renderPerson(p); })
      .catch(function(err){ if(!alive) return; if(err&&err.code==='LIST_MISSING'){ renderError('Falta la llista de personatges (personatges.js). Cal generar-la amb gen_personatges.py.'); } else { renderError('No s\'ha pogut connectar amb Wikidata. Comprova la connexió i torna-ho a provar.'); } });
    }
    // Precompute en background: prepara el personatge del dia (omple la caché) en carregar la pàgina.
    function precompute(){ try{ pickDaily(todayStr()).catch(function(){}); }catch(_){} }

    return {
      mount(container){ root=container; alive=true; start(); },
      unmount(){ alive=false; root=null; },
      precompute:precompute
    };
  })();

  const MODULES={ abansdespres: AbansDespres, personatgedia: PersonatgeDia };

  function renderMenu(){
    back.hidden=true;
    if(!dataOk()){
      app.innerHTML=`<div class="err">No s'han pogut carregar les dades (<code>data.js</code>). Assegura't que <code>data.js</code> és a la mateixa carpeta que <code>joc.html</code>.</div>`;
      return;
    }
    let cards='';
    GAMES.forEach(g=>{
      const badge = MODULES[g.id] ? (g.discover ? '<span class="tagd">🌟 Descobreix</span>' : '<span class="tagd">📅 Repte diari</span>') : '<span class="soon">🚧 Pròximament</span>';
      cards+=`<button class="gamecard" data-id="${g.id}"><span class="ic">${g.ic}</span><span class="t">${g.t}</span><span class="d">${g.d}</span>${badge}</button>`;
    });
    app.innerHTML=`<p class="lead">Cada joc és un <b>repte diari</b>: un intent al dia, igual per a tothom.</p><div class="menu">${cards}</div>`;
    app.querySelectorAll('.gamecard').forEach(btn=>{
      btn.addEventListener('click',()=>{location.hash='#/'+btn.getAttribute('data-id');});
    });
  }

  function renderGame(g){
    back.hidden=false;
    app.innerHTML=`<div class="placeholder"><div class="ic">${g.ic}</div><h2>${g.t}</h2><p class="d">${g.d}</p><span class="badge">🚧 Pròximament</span></div>`;
  }

  function router(){
    showInfo();
    if(activeModule && activeModule.unmount){ try{activeModule.unmount();}catch(_){} activeModule=null; }
    const m=(location.hash||'').match(/^#\/(.+)$/);
    if(m){
      const g=GAMES.find(x=>x.id===m[1]);
      if(g){
        const mod=MODULES[g.id];
        if(mod){ back.hidden=false; app.innerHTML=''; activeModule=mod; mod.mount(app); }
        else { renderGame(g); }
        return;
      }
    }
    renderMenu();
  }

  back.addEventListener('click',()=>{location.hash='';});
  window.addEventListener('hashchange',router);
  router();
  // Precompute del «Personatge del dia» en background, tan bon punt carrega la pàgina de jocs.
  try{ if(MODULES.personatgedia && MODULES.personatgedia.precompute) MODULES.personatgedia.precompute(); }catch(_){}
})();
// ===== BLOC COMPARTIT (index.html / joc.html): compressió de la topbar =====
// Escala: 1) tot sencer · 2) es plega el menú (la marca obre un desplegable) · 3) botons d'acció
// a icones (CSS) · 4) la marca passa a «HB» · 5) últim recurs, el cercador baixa del seu mínim.
// El cercador ha de poder mostrar «Cercant a Wikidata…» en una línia (180px mesurats), per això
// és l'últim que es toca.
//
// Els llindars són una FÓRMULA que no depèn del contingut de la pàgina, a propòsit: així
// l'index i el joc es plegan a la mateixa amplada. Si cada pàgina es mesurés a si mateixa, el
// joc (que no té cercador ni quatre botons) es quedaria desplegat molt més avall i navegar
// d'una pàgina a l'altra faria un canvi estrany.
// Ha de ser byte-idèntic als dos fitxers.
(function(){
  const sec=document.querySelector('.secnav');
  const brand=sec&&sec.querySelector('.brand');
  const nav=sec&&sec.querySelector('.modeswitch');
  const tb=document.querySelector('.topbar');
  const search=document.querySelector('.topbar-right .search');
  if(!sec||!brand||!nav||!tb)return;
  const tanca=()=>{sec.classList.remove('open');tb.classList.remove('navopen');brand.setAttribute('aria-expanded','false');};
  function fitSecnav(){
    const coarse=window.matchMedia('(pointer:coarse)').matches, w=window.innerWidth;
    const plega = coarse ? w<=600 : w<=900;   // en tàctil tot ja és més compacte: aguanta més
    const hb    = coarse ? w<=430 : w<=560;   // amb els botons d'accio quadrats el nom sencer hi cap fins a ~545
    sec.classList.toggle('navcollapsed',plega);
    sec.classList.toggle('hb',plega&&hb);
    // Separador: només quan l'aire entre el menú i el cercador s'ha esgotat. Es mesura SEMPRE
    // sense la barreta posada, perquè la barreta viu dins de .secnav i si no es reduiria l'aire
    // a si mateixa (bucle). Sense cercador (pàgina de jocs) no hi ha res a separar: mai surt.
    sec.classList.remove('sep');
    if(search&&!(plega&&hb)){
      const aire=search.getBoundingClientRect().left-sec.getBoundingClientRect().right;
      if(aire<40)sec.classList.add('sep');
    }
    if(!plega)tanca();
  }
  brand.addEventListener('click',e=>{
    if(!sec.classList.contains('navcollapsed'))return;   // en vista ampla la marca és text inert
    e.stopPropagation();
    const obert=sec.classList.toggle('open');
    tb.classList.toggle('navopen',obert);
    brand.setAttribute('aria-expanded',obert?'true':'false');
  });
  document.addEventListener('click',e=>{if(!sec.contains(e.target))tanca();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')tanca();});
  // Igual que amb floorH: en creuar el llindar de (pointer:coarse) el primer càlcul encara
  // llegeix l'estat antic. Es reavalua al frame següent i un cop assentat.
  let t;
  function reavalua(){fitSecnav();requestAnimationFrame(fitSecnav);clearTimeout(t);t=setTimeout(fitSecnav,180);}
  reavalua();
  window.addEventListener('resize',reavalua);
  const MQ=window.matchMedia('(pointer:coarse)');
  if(MQ.addEventListener)MQ.addEventListener('change',reavalua);   // el llindar tàctil pot canviar sense que el resize arribi a temps
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reavalua);   // Oswald canvia l'amplada de la marca
})();
// ===== fi del bloc compartit =====
</script>
</body>
</html>
