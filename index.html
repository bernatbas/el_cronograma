// A collection is a list of Q-ids: resolve each against the local DB first, fetch the rest from
// Wikidata (byIds already drops anything we hold locally), then frame the view around the result —
// without it "Els meus filòsofs" would land off-screen, since the default view starts at 1500.
let collLoads=0, collSpinTimer=null;
// Spinner centrat sobre el canvas mentre carreguen membres remots d'una col·lecció.
// Llindar curt perquè les càrregues ràpides/en cau no facin flash, i comptador perquè
// diverses càrregues simultànies comparteixin un sol overlay que només marxa quan totes acaben.
function beginCollLoading(){
  collLoads++;
  if(collLoads===1 && !collSpinTimer){
    collSpinTimer=setTimeout(()=>{collSpinTimer=null; if(collLoads>0){collOverlay.classList.add('on');}},250);
  }
  return function endCollLoading(){
    collLoads=Math.max(0,collLoads-1);
    if(collLoads===0){
      if(collSpinTimer){clearTimeout(collSpinTimer);collSpinTimer=null;}
      collOverlay.classList.remove('on');
    }
  };
}
const COLL_TTL=30*24*3600*1000;   // 30 dies: passat aquest temps una persona del cau es refresca de Wikidata en segon pla
// Refresca en segon pla (sense spinner ni bloqueig) les persones de sessió caducades. Sense xarxa,
// es conserva silenciosament la còpia vella: millor una dada caducada que cap.
function refreshStale(qids){
  if(!qids||!qids.length)return;
  byIds(qids,true,true).then(list=>{
    let changed=false;
    list.forEach(w=>{
      if(w.birth==null)return;
      const p=PEOPLE.find(x=>x.wd===w.qid);if(!p)return;
      const canviIdioma=(p._lang||'ca')!==LANG;   // la descripcio vella seria d'un altre idioma: no la conservis
      p.name=w.name;p.birth=w.birth;p.death=w.death;p.wiki=w.article;p.desc=w.desc||(canviIdioma?'':p.desc);if(!canviIdioma)p.cats=guessCats(w.desc);   // canviar d'idioma no ha de canviar el color: la categoria es dedueix de la descripcio i cada idioma la redacta diferentp._lang=LANG;p._ts=Date.now();changed=true;
    });
    if(changed){recomputePresent();render();scheduleSave();}
  }).catch(()=>{});
}
// ===== Colleccions propies =====
// Les de serie viuen a COLLECTIONS (contingut d'autor, no s'esborren). Les que fa l'usuari es
// desen a part i s'afegeixen a la MATEIXA llista amb `_mine:true`, aixi tota la resta del codi
// —render, toggle, TTL de refresc— les tracta igual sense saber d'on venen.
const MYCOLL_LS='historiabasica.mycolls';
let newCollOpen=false, newCollDraft='';
// ⚠️ La casella arrenca DESMARCADA: crear-la buida ha de ser el cami curt, i incloure gent
// una decisio explicita. Si es vol al contrari, es aquest false.

function loadMyColls(){
  let arr=[];
  try{ arr=JSON.parse(localStorage.getItem(MYCOLL_LS)||'[]'); }catch(ex){}
  if(!Array.isArray(arr))return;
  arr.forEach(c=>{
    if(!c||typeof c.name!=='string'||!Array.isArray(c.wds))return;
    if(COLLECTIONS.some(x=>x.id===c.id))return;                       // no trepitgem les de serie
    const wds=c.wds.filter(q=>typeof q==='string'&&/^Q\d+$/.test(q));
    COLLECTIONS.push({id:c.id,name:c.name,wds,vis:c.vis==='public'?'public':'private',_mine:true,   // ara tambe n'accepta de buides
      desc:typeof c.desc==='string'?c.desc:'',created:c.created||'',updated:c.updated||''});
  });
}
function saveMyColls(){
  try{ localStorage.setItem(MYCOLL_LS,JSON.stringify(
    COLLECTIONS.filter(c=>c._mine).map(c=>({id:c.id,name:c.name,wds:c.wds,vis:c.vis||'private',desc:c.desc||'',created:c.created||'',updated:c.updated||''})))); }catch(ex){}
}

// Els Q-ids de qui tens ara a la vista. Una colleccio guarda Q-ids i prou, com les de serie:
// aixi es pot compartir i tornar a resoldre contra Wikidata. ⚠️ Qui no te QID (el «bernat» de
// la BD) no hi pot anar: no hi ha manera de tornar-lo a trobar.
function viewQids(){
  return PEOPLE.filter(p=>state.present.has(p.id)&&/^Q\d+$/.test(p.wd||'')).map(p=>p.wd);
}

function createColl(nom){
  const name=(nom||'').trim().slice(0,60);
  if(!name){showToast(t('cro_coll_needname'));return null;}   // sense nom no es desa
  const wds=[];
  let i=1,id;do{id='my'+(i++);}while(COLLECTIONS.some(c=>c.id===id));
  pushUndo('undo_coll_new',{name});
  // `vis` es guarda des d'ara encara que no hi hagi cap interruptor: el dia que hi hagi
  // servidor, les colleccions ja desades no necessitaran migracio.
  COLLECTIONS.push({id,name,wds,vis:'private',_mine:true,desc:'',created:avuiISO(),updated:avuiISO()});
  // Nomes s'activa si porta gent: una colleccio buida i «encesa» no vol dir res.
  if(wds.length)state.collections.add(id);
  saveMyColls();scheduleSave();render();
  showToast(wds.length?t('cro_coll_saved',{name,n:wds.length}):t('cro_coll_saved_empty',{name}));
  return id;
}

function deleteColl(cid){
  const i=COLLECTIONS.findIndex(c=>c.id===cid&&c._mine);
  if(i<0)return;                        // les de serie no s'esborren
  const c=COLLECTIONS[i];
  pushUndo('undo_coll_del',{name:c.name});
  // ⚠️ La gent es queda a la vista. Esborrar una llista es una operacio sobre la LLISTA, no
  // sobre el cronograma: igual que treure'n un membre (#151). Nomes l'interruptor d'engegar i
  // apagar la colleccio mou gent de la vista.
  state.collections.delete(cid);
  COLLECTIONS.splice(i,1);
  saveMyColls();recomputePresent();closeDetailIfGone();clearFitLatch();scheduleSave();render();
}

// La caixa del nom i el boto que la substitueix. Separats perque els fan servir tant el
// render com openNewColl(), i han de sortir exactament iguals pels dos camins.
// Nom i «Crea». La casella «inclou els de la vista» es va treure el 20/11/2026: ara, en crear-la, s'obre la
// fitxa, i allà hi ha la drecera «Afegeix els N de la vista» i el cercador.
function newCollBoxHTML(){
  return `<div class="newcolbox"><div class="newcolrow"><input class="newcolin" id="newcolin" type="text" maxlength="60" placeholder="${t('cro_coll_name_ph')}" value="${esc(newCollDraft)}">`
    + `<button class="dbtn primary newcolok" type="button" data-newcolok>${t('cro_coll_create')}</button></div></div>`;
}

}
function newCollBtnHTML(){ return `<button class="newcol" data-newcol>${t('cro_newcol')}</button>`; }


// NO es fa un render() sencer: entre el toc i el focus() hi ha d'haver la MINIMA feina
// possible. render() refa el canvas sencer, i al mobil una tasca llarga pot deixar el
// focus() fora de la finestra del gest — i llavors iOS no obre el teclat. Aqui nomes es
// canvia el boto per la caixa.
function openNewColl(){
  newCollOpen=true;newCollDraft='';
  const cont=$('#collections'), btn=cont.querySelector('.newcol');
  if(btn){btn.insertAdjacentHTML('beforebegin',newCollBoxHTML());btn.remove();}

async function toggleCollection(cid){
  const c=COLLECTIONS.find(x=>x.id===cid);if(!c)return;
  pushUndo(state.collections.has(cid)?'cro_act_coll_off':'cro_act_coll_on',{name:c.name});
  if(state.collections.has(cid)){                  // same button takes it away again
    state.collections.delete(cid);
    const stillWanted=new Set([...state.collections].flatMap(id=>(COLLECTIONS.find(x=>x.id===id)||{wds:[]}).wds));
    c.wds.forEach(q=>{
      if(stillWanted.has(q))return;                // someone another active collection also holds
      const p=PEOPLE.find(x=>x.wd===q);
      if(p&&!SEED_PINNED.includes(p.id))state.pinned.delete(p.id);
    });
    recomputePresent();closeDetailIfGone();clearFitLatch();render();return;
  }
  state.collections.add(cid);
  if(typeof gtag!=='undefined')gtag('event','colleccio_activada',{colleccio:c.name});
  const local=new Map(PEOPLE.filter(p=>p.wd).map(p=>[p.wd,p]));
  const localIds=c.wds.map(q=>local.get(q)).filter(Boolean).map(p=>p.id);
  const missing=c.wds.filter(q=>!local.has(q));
  const stale=c.wds.filter(q=>{const p=local.get(q);return p&&p._session&&(!p._ts||Date.now()-p._ts>COLL_TTL||(p._lang||'ca')!==LANG);});   // membres del cau caducats → refresc silenciós
  if(!missing.length){                             // tot és local → mostrar-ho de cop, sense spinner
    localIds.forEach(id=>state.pinned.add(id));
    clearFitLatch();
    recomputePresent();fitToPresent();
    refreshStale(stale);                           // en segon pla, sense bloquejar l'aparició instantània
    return;
  }
  render();                                         // marca el botó com a actiu ja; els membres apareixen junts quan estigui tot
  const endLoading=beginCollLoading();             // spinner sobre el canvas (després d'un llindar curt)
  let got=null, failed=false;
  try{got=await byIds(missing,true);}
  catch(e){failed=true;}
  finally{endLoading();}
  if(!state.collections.has(cid))return;           // desactivada (o canviada) mentre carregava → descarta el resultat zombie
  localIds.forEach(id=>state.pinned.add(id));       // revela els locals ara — també és el fallback si la petició falla
  if(failed){recomputePresent();clearFitLatch();render();fitToPresent();showToast(t('cro_coll_fail',{name:c.name}));return;}
  got.forEach(w=>{
    if(w.birth==null)return;                        // no birth year → nowhere to place the bar
    state.pinned.add(wdAPersona(w));
  });
  recomputePresent();
  clearFitLatch();
  const lost=missing.length-got.filter(w=>w.birth!=null).length;
  render();fitToPresent();                          // revela tothom de cop i reenqua­dra
  showToast(lost?t('cro_coll_lost',{name:c.name,n:lost}):c.name);
  refreshStale(stale);                             // refresca també, en segon pla, els caducats que ja teníem
}
// Zoom + pan so everyone currently on the canvas fits.
// La barra lateral és al flux (encongeix el canvas), així que clientWidth ja és l'espai visible.
function fitToPresent(){
  const pp=PEOPLE.filter(p=>state.present.has(p.id)&&!SEED_PINNED.includes(p.id)&&!amagat(p));
  if(!pp.length)return;                            // only the always-pinned ones → nothing you chose to frame, so don't move
  const y1=Math.min(...pp.map(p=>p.birth)), y2=Math.max(...pp.map(p=>deathOf(p)));
  const pad=Math.max(10,(y2-y1)*0.06);
  setZoom(Math.max(60,scroll.clientWidth-24)/((y2-y1)+2*pad));
  scroll.scrollLeft=Math.min(Math.max(0,x(y1-pad)),maxScroll());
}
// Enquadra la vista sobre la unió de persones (per id) + events del handoff.
// Inclou tots els anys de les persones (birth..death) i l'any de cada event.
function fitToHandoff(resolvedIds,evs){
  const allY=[];
  PEOPLE.filter(function(p){ return resolvedIds.includes(p.id); }).forEach(function(p){
    if(p.birth!=null) allY.push(p.birth);
    if(p.death!=null) allY.push(p.death); else if(p.birth!=null) allY.push(NOW_YEAR);
  });
  (evs||[]).forEach(function(e){ if(e&&e.year!=null) allY.push(e.year); });
  if(!allY.length){ fitToPresent(); return; }
  const y1=Math.min.apply(null,allY), y2=Math.max.apply(null,allY);
  const span=Math.max(1,y2-y1);
  const pad=Math.max(10,span*0.06);
  setZoom(Math.max(60,scroll.clientWidth-24)/(span+2*pad));
  scroll.scrollLeft=Math.min(Math.max(0,x(y1-pad)),maxScroll());
}
// Zoom centrat sobre un personatge concret (mode joc → cronograma).
// Mostra la vida sencera + 60% de marge a cada banda. Prou context per no quedar perdut,
// prou apropa perquè el personatge tingui protagonisme.
function centerOnPerson(p){
  if(p.birth==null){defaultView();return;}   // sense any de naixement no hi ha res a centrar (el fallback de Wikidata ja arriba)
  const y1=p.birth, y2=p.death!=null?p.death:NOW_YEAR;
  const span=Math.max(1,y2-y1);
  const pad=Math.max(20,Math.round(span*0.6));
  clearFitLatch();
  setZoom(Math.max(fitPx(),Math.min(20,(scroll.clientWidth-24)/(span+2*pad))));
  scroll.scrollLeft=Math.min(Math.max(0,x((y1+y2)/2)-scroll.clientWidth/2),maxScroll());
}
// Zoom keeping the year under the pointer fixed.
function zoomAt(clientX,factor){clearFitLatch();
  const rect=scroll.getBoundingClientRect();
  const pointerInner=(clientX-rect.left)+scroll.scrollLeft;
  const yearAt=YEAR_MIN+pointerInner/pxPerYear;
  setZoom(pxPerYear*factor);
  const newInner=(yearAt-YEAR_MIN)*pxPerYear;
  scroll.scrollLeft=Math.min(Math.max(0,newInner-(clientX-rect.left)),maxScroll());   // must be clamped: during a fast pinch this lands against not-yet-reflowed layout and an out-of-range value sticks, parking the view past the end of the canvas (blank right side, endless-feeling scroll)
}
// "Veure tot": botó de doble estat. 1r clic → zoom out per encabir tot el visible i queda marcat;
// 2n clic → desfà el zoom out i torna a la vista anterior.
let fitPrev=null;
function fitLatch(on){$('#fitAll').classList.toggle('on',on);}
function clearFitLatch(){fitPrev=null;fitLatch(false);}
$('#undo').onclick=()=>{if(typeof gtag!=='undefined')gtag('event','undo');doUndo();};
// ⌘Z / Ctrl+Z, pero no mentre s'escriu al cercador (allà Z ha de ser una lletra)
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&(e.key==='z'||e.key==='Z')){
    const a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
    e.preventDefault();doUndo();

// sense res més tot el contingut es desplaçava amb ella. Mentre s'anima, l'scroll compensa cada píxel
// que guanya o perd: els anys es queden quiets a la pantalla i la barra tapa (o destapa) la franja.
// Es mesura a cada frame (dins del rAF, abans de pintar) perquè vagi amb la transició de l'amplada.
// Plegant-la a tocar de l'inici del temps (scrollLeft < amplada) el navegador topa amb el 0: acceptat.
let _sbAnim=0;
function sbCompensa(){

// Trackpad pinch / ⌘+wheel → zoom. (Chrome/Firefox deliver pinch as ctrl+wheel.)
// Bound to the document, not to #scroll: the sidebar overlays the canvas and the topbar sits above it,
// so a pinch with the cursor over either would otherwise escape us and become a browser page zoom.
document.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.01);
  const r=scroll.getBoundingClientRect();
  const inCanvas=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  zoomAt(inCanvas?e.clientX:r.left+scroll.clientWidth/2,factor);   // pinch outside the canvas → zoom about its centre
},{passive:false});

// Touch pinch zoom (mobile). Two fingers → zoom around their midpoint.
// Absolute, not incremental: the gesture pins one year under the fingers and scales from the
// zoom it started at. Incremental factors (dist/prevDist, compounding) drifted and stuck for
// good once a frame hit the fitPx()/20 clamp, because the clamped value became the next baseline.
// The work is also deferred to one rAF per frame — a full render() straight inside touchmove was
// what made it stutter, since touchmove fires far faster than we can rebuild the canvas.
let pinch=null,pinchRAF=0;
const tMid=t=>(t[0].clientX+t[1].clientX)/2;
const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

  if(e.touches.length!==2){endPinch();return;}
  e.preventDefault();hideGuide();
  const rect=scroll.getBoundingClientRect(),mx=tMid(e.touches);
  pinch={dist0:Math.max(tDist(e.touches),1),px0:pxPerYear,mx,scale:1,
         year:YEAR_MIN+((mx-rect.left)+scroll.scrollLeft)/pxPerYear};   // the year under the fingers, held there for the whole gesture
},{passive:false});
scroll.addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;
  e.preventDefault();
  pinch.mx=tMid(e.touches);                 // re-read the midpoint: fingers drift, and a stale one drags the anchor toward the centre
  pinch.scale=tDist(e.touches)/pinch.dist0;
  if(!pinchRAF)pinchRAF=requestAnimationFrame(applyPinch);
},{passive:false});
function applyPinch(){clearFitLatch();
  pinchRAF=0;
  if(!pinch)return;
  setZoom(pinch.px0*pinch.scale);
  const rect=scroll.getBoundingClientRect();
  scroll.scrollLeft=Math.min(Math.max(0,(pinch.year-YEAR_MIN)*pxPerYear-(pinch.mx-rect.left)),maxScroll());
}
function endPinch(){pinch=null;if(pinchRAF){cancelAnimationFrame(pinchRAF);pinchRAF=0;}}

// Doble-tap amb un dit → apropa al punt tocat (complementa el pinch). Ignora tocs sobre elements interactius.
let tStart=null,lastTap=0,lastTapX=0,lastTapY=0;
scroll.addEventListener('touchstart',e=>{tStart=(e.touches.length===1)?{x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false}:null;},{passive:true});

  if(pinch||!tStart||tStart.moved||e.changedTouches.length!==1)return;
  const t=e.changedTouches[0];
  if(e.target.closest('.bar,.event,.seg.mov,.marcchip,.menu,button,a,input,.results'))return;   // deixa que el toc obri detalls / actuï normal
  const now=Date.now();
  if(now-lastTap<300&&Math.abs(t.clientX-lastTapX)<32&&Math.abs(t.clientY-lastTapY)<32){e.preventDefault();zoomAt(t.clientX,1.8);lastTap=0;hideGuide();}
  else{lastTap=now;lastTapX=t.clientX;lastTapY=t.clientY;}
},{passive:false});

// Guia mòbil: drag primer (passive:false, prioritat) → placement segon (passive:true).
// Ordre important: drag es registra abans de placement, per tant fires primer.
// Si la guia és visible i el toc cau a ±22px → drag actiu, placement no s'executa (guideTouch=true).
// Si la guia no és visible, o el toc és lluny → drag surt, placement col·loca la guia al touchstart.
let guideTouch=false;
// 1) Drag: toc proper a la guia existent → arrossegar
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||guide.style.display!=='block')return;
  const t=e.touches[0];

  if(Math.abs(touchX-parseFloat(guide.style.left||'-9999'))>22)return;
  e.preventDefault();guideTouch=true;tStart=null;
},{passive:false});
// 2) Placement: toc al canvas buit → guia apareix immediatament
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||guideTouch||pinch)return;
  if(e.target.closest('.bar,.event,.seg.mov,.marcchip,.menu,button,a,input,.results'))return;

// [10] BOOT (wait for a real width before the first fit)
// ============================================================
function bootDefault(cb){if(scroll.clientWidth>0){applyMetrics();if(restoredView){pxPerYear=Math.max(fitPx(),Math.min(20,restoredView.px));render();scroll.scrollLeft=Math.min(Math.max(0,restoredView.left||0),maxScroll());}else{defaultView();}lsReady=true;saveNow();if(cb)cb();}else{requestAnimationFrame(()=>bootDefault(cb));}}   // re-measure here too: at parse time the viewport height can still be 0 (or mid-settle behind Safari's URL bar), which would lock in the wrong metrics
// ============================================================
// [11] MODE «PERSONATGE UNIC» (?person=QID) — handoff des de joc.html
// ============================================================
// El joc mostra un personatge random de Wikidata que NO es a la BD local, escriu les seves dades
// a localStorage['hb_view_person'] i navega a index.html?person=QID. La URL nomes porta el QID
// (curta i compartible); les dades riques van per la cache. Si la cache no hi es o no coincideix
// (un amic obre l'enllac al seu dispositiu), es reconsulta Wikidata pel QID.
//
// ⚠️ ANYS aC: les DUES APIs de Wikidata serialitzen diferent el mateix valor. Comprovat amb
// quatre casos (Aristotil, Socrates, Cleopatra, Cesar):
//     wbgetentities  ->  -0384  =  384 aC   (directe; NO cal conversio)
//     SPARQL         ->  -0383  =  384 aC   (astronomic; cal restar 1 -> es el que fa wdYear)
// Aqui fem servir wbgetentities (com el joc), per tant NO s'ha d'aplicar wdYear: seria un any
// de mes. Mateix parser que joc.html a proposit.
const PERSON_KEY='hb_view_person';
// languages ordenat per wdLangs(): funcio, no const, perque setLang() ha de poder canviar-ho.
function wdEntUrl(){return 'https://www.wikidata.org/w/api.php?action=wbgetentities&props=labels%7Cdescriptions%7Cclaims%7Csitelinks/urls&languages='+encodeURIComponent(wdLangs())+'&format=json&origin=*&ids=';}
const COMMONS_FP='https://commons.wikimedia.org/wiki/Special:FilePath/';
const pbar=$('#personbar');

// La barra es construeix amb nodes i textContent: les dades venen de Wikidata i no es poden
// interpolar a innerHTML.
let _pbarId=null; // id PEOPLE de la persona actual a la personbar; null si no n'hi ha cap
// Ve del joc? NOMES ho podem saber pel referrer:
//   - el traspas ?from=joc s'esborra la URL tot seguit (replaceState), aixi que no en queda rastre;
//   - el ?person= tambe arriba d'enllaços COMPARTITS, i alla «torna al joc» no vol dir res.
// Aixi el boto surt quan de veritat hi ha un joc al darrere, i no quan un amic t'ha enviat el link.
const CAME_FROM_JOC=(function(){
  try{
    // 1) ?from=joc es el traspas intern del joc (joc.html:889 hi navega sempre): senyal
    //    DETERMINISTA i sense dependencies. Cal llegir-lo AQUI perque bootFromJoc()
    //    esborra la URL tot seguit amb replaceState. Es parseja amb un URLSearchParams
    //    propi i no amb _urlP, que es declara molt mes avall (TDZ: usar-lo aqui aturaria
    //    tot l'script). I sobretot: aixo funciona amb file://, on el navegador NO dona
    //    referrer — que es com s'obre la pagina amb doble clic.
    if(new URLSearchParams(location.search).get('from')==='joc')return true;
    // 2) ?person= NO l'usa el joc: ve d'enllaços compartits. Aqui l'unic senyal es el
    //    referrer, i que falti es el comportament correcte — si un amic t'envia el link,
    //    «torna al joc» no vol dir res.
    if(!document.referrer)return false;
    const u=new URL(document.referrer);
    return u.origin===location.origin&&/(^|\/)joc\.html$/.test(u.pathname);
  }catch(_){return false;}
})();
// history.back() i no un enllaç a joc.html: torna el joc TAL COM el vas deixar (mateixa
// pregunta, ratxa intacta). Un enllaç recarregaria el menu de jocs i perdries la partida.
function backToJocBtn(){
  if(!CAME_FROM_JOC)return null;

  b.className='pjoc';b.type='button';

  b.setAttribute('aria-label',t('cro_back_to_game_t'));

const pYear=t=>{const m=/^([+-])0*(\d+)-/.exec(String(t||''));if(!m)return null;const y=parseInt(m[2],10);return m[1]==='-'?-y:y;};
const pLbl=o=>o?((o.ca||o.es||o.en||o.mul||{}).value||null):null;   // o.mul: veure wdLangs()

function personFromEntity(e){
  const cl=e.claims||{};
  const claim=p=>cl[p]&&cl[p][0]&&cl[p][0].mainsnak&&cl[p][0].mainsnak.datavalue;
  const b=claim('P569'), d=claim('P570'), im=claim('P18');
  const birth=b?pYear(b.value&&b.value.time):null;
  if(birth==null)return null;                       // sense naixement no es pot situar a la linia
  const sl=e.sitelinks||{};
  const art=(sl.cawiki&&sl.cawiki.url)||(sl.eswiki&&sl.eswiki.url)||(sl.enwiki&&sl.enwiki.url)||('https://www.wikidata.org/wiki/'+e.id);
  return {qid:e.id,name:pLbl(e.labels)||e.id,desc:pLbl(e.descriptions)||'',
    birth,death:d?pYear(d.value&&d.value.time):null,
    img:im?COMMONS_FP+encodeURIComponent(String(im.value).replace(/ /g,'_'))+'?width=500':null,wiki:art};
}

function personFromCache(qid){
  let d=null;try{d=JSON.parse(localStorage.getItem(PERSON_KEY)||'null');}catch(e){d=null;}
  if(!d||d.qid!==qid||typeof d.birth!=='number')return null;
  return {qid:d.qid,name:String(d.name||qid),desc:String(d.desc||''),birth:d.birth,
    death:(typeof d.death==='number')?d.death:null,img:d.img||null,
    wiki:'https://www.wikidata.org/wiki/'+qid};
}

function fetchPerson(qid){
  const ac=('AbortController' in window)?new AbortController():null;
  const to=setTimeout(()=>{if(ac)ac.abort();},9000);
  return fetch(wdEntUrl()+encodeURIComponent(qid),ac?{signal:ac.signal}:undefined)
    .then(r=>r.ok?r.json():Promise.reject(new Error('http')))
    .then(j=>{
      const e=j&&j.entities&&j.entities[qid];
      if(!e||e.missing!==undefined)return null;
      return personFromEntity(e);
    })
    .finally(()=>clearTimeout(to));
}

// Afegeix el personatge del joc a la vista com qualsevol resultat de cerca de Wikidata:
// lsReady segueix actiu, l’estat es desa normalment, i la × de la personbar és equivalent
// a la × d’«A la vista» (removePerson).
// --- Favorits -------------------------------------------------------------
// Els escriu el JOC (l'estrella del «Personatge del dia») a hb_favorits; aqui nomes
// es LLEGEIXEN, com hb_view_person. Per aixo es tornen a llegir a cada render en lloc
// de desar-los a `state`: l'altra pestanya els pot haver canviat mentrestant.
// Forma desada: {qid,name,birth,death,img,desc} — just el que vol mostraPersonatge().
// --- Seccions plegables de la barra lateral -------------------------------
// L'estat plegat es recorda (es una preferencia, com la de la barra lateral) pero NO es part
// de `state` ni del Desfes: plegar una seccio no es una dada.
const SECPLEG_LS='historiabasica.seccions';
function llegeixPlegades(){
  try{ const a=JSON.parse(localStorage.getItem(SECPLEG_LS)||'[]'); return Array.isArray(a)?a:[]; }
  catch(ex){ return []; }
}
function plegaSeccio(h3,plegada){
  const sec=h3.closest('section'); if(!sec)return;
  sec.classList.toggle('plegada',plegada);
  h3.setAttribute('aria-expanded',String(!plegada));
}
function iniSeccionsPlegables(){
  const pleg=llegeixPlegades();
  document.querySelectorAll('.sidebar h3.sech').forEach(h=>plegaSeccio(h,pleg.includes(h.dataset.sec)));
  const alterna=h=>{
    const sec=h.closest('section'), ara=!sec.classList.contains('plegada');
    plegaSeccio(h,ara);
    const tots=[...document.querySelectorAll('.sidebar h3.sech')].filter(x=>x.closest('section').classList.contains('plegada')).map(x=>x.dataset.sec);
    try{ localStorage.setItem(SECPLEG_LS,JSON.stringify(tots)); }catch(ex){}
  };
  $('.sidebar').addEventListener('click',e=>{ const h=e.target.closest('h3.sech'); if(h)alterna(h); });
  $('.sidebar').addEventListener('keydown',e=>{
    const h=e.target.closest('h3.sech');
    if(h&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); alterna(h); }
  });
}
// «(n)» al costat del nom: Marcs i Col·leccions = els ACTIVATS; Favorits i A la vista = quants n'hi ha.
function actualitzaComptes(){

const FAV_LS='hb_favorits';
function llegeixFavorits(){
  try{ const a=JSON.parse(localStorage.getItem(FAV_LS)||'[]'); return Array.isArray(a)?a:[]; }
  catch(ex){ return []; }   // si algu l'ha deixat malmes, val mes llista buida que pagina morta
}
// La clau d'un favorit. Qui ve de Wikidata s'indexa pel seu QID —i aixi el joc i el
// cronograma parlen del mateix—, pero la BD tambe te gent SENSE QID (en Bernat mateix) i
// no tenien manera de ser favorits. Aquests s'indexen per l'id local amb prefix, que el
// joc no reconeixera mai i per tant ignorara, que es el que volem.
const favKey=p=>p?(/^Q\d+$/.test(p.wd||p.qid||'')?(p.wd||p.qid):'local:'+p.id):null;
function esFav(k){ return !!k && llegeixFavorits().some(f=>f&&f.qid===k); }
// ⚠️ NO passa pel Desfes. La seva foto guarda {pinned, collections, marcs, showEvents, focus}
// i els favorits no hi son: posar-hi pushUndo() faria que «desfes» desfes una ALTRA cosa.
function toggleFav(p){
  const qid=favKey(p); if(!qid)return null;
  const a=llegeixFavorits().filter(f=>f&&f.qid);
  const i=a.findIndex(f=>f.qid===qid);
  if(i>=0){ a.splice(i,1); }
  else {
    // La foto nomes la te el joc; si ja hi era i la portava, no se li pren.
    const abans=llegeixFavorits().find(f=>f&&f.qid===qid);
    a.push({qid, name:Lcru(p.name), birth:p.birth==null?null:p.birth, death:p.death==null?null:p.death,
            img:(abans&&abans.img)||null, desc:Lcru(p.desc)||''});   // Lcru: es desa, no s'hi ha de colar la marca de ?lang=xx
  }
  try{ localStorage.setItem(FAV_LS,JSON.stringify(a)); }catch(ex){}
  return i<0;   // true = ara es favorit
}

function renderFavorits(){
  const cont=$('#favorits'); if(!cont)return;
  const favs=llegeixFavorits().filter(f=>f&&f.qid&&f.name);
  if(!favs.length){ cont.innerHTML=`<div class="empty">${t('cro_fav_empty')}</div>`; return; }
  cont.innerHTML=favs.map(f=>{
    // ⚠️ El color ha de ser EL MATEIX que a «A la vista» i a la barra del canvas: les
    // categories de la persona. La primera versio les deduia de la descripcio amb
    // guessCats() i no coincidia — l'Atila sortia teal («sense categoria») a Favorits i
    // rosa («politica») a les altres dues bandes, que es com es va veure.
    // guessCats() nomes val de reserva: un favorit marcat al joc pot no ser a la BD.
    // La clau pot ser un QID (de Wikidata) o 'local:<id>' (algu de la BD sense QID).
    const dins=f.qid.startsWith('local:')
      ? PEOPLE.find(x=>x.id===f.qid.slice(6))
      : PEOPLE.find(x=>x.wd===f.qid);
    const cats=dins?dins.cats:guessCats(f.desc||'');
    const ja=!!dins&&state.present.has(dins.id);
    const anys=(f.birth==null?'?':fmtY(f.birth))+(f.death==null?'':'–'+fmtY(f.death));
    return `<div class="item${ja?' favin':''}">`
      + `<span class="swatch" style="background:${swatchBg({cats})}"></span>`
      + `<button class="nm" data-fav="${esc(f.qid)}" aria-label="${esc(ja?t('cro_fav_already'):t('cro_fav_add'))}">${esc(L(f.name))}</button>`
      + `<span class="favyr">${esc(anys)}</span>`
      + `</div>`;
  }).join('');
}

function mostraPersonatge(p,opts){
  const existing=PEOPLE.find(x=>x.wd===p.qid);
  const id=existing?existing.id:'wd_'+p.qid;
  if(!existing){
    PEOPLE.push({id,wd:p.qid,name:p.name,birth:p.birth,death:p.death,cats:guessCats(p.desc),
      gender:'',wiki:p.wiki,desc:p.desc||'',_lang:LANG,_session:true,_ts:Date.now()});
  }else{
    // Una entrada desada d'abans pot venir sense anys: el traspas els aporta i s'han d'escriure.
    if(existing.birth==null&&p.birth!=null) existing.birth=p.birth;
    if(existing.death==null&&p.death!=null) existing.death=p.death;
  }
  state.present.add(id);
  state.pinned.add(id);
  destapaCats(PEOPLE.find(x=>x.id===id));   // l'has demanat: ha de sortir encara que la seva categoria estigués amagada
  scheduleSave();
  render();
  if(!opts||!opts.noBar) personBar('ok',L(p.name),L(p.desc)||'',p.img,opts&&opts.source,id);
  return id;
}

// Barra de handoff des del joc: mostra personatges + events en un sol resum.
// Si total > 1, oculta els anys per estalviar espai; scroll horitzontal si no hi caben.
// events: array de {id,name,year} (opcional).
function jocBar(items,source){
  // items: [{kind:'person', p:{name,birth,death,...}, id:'wd_...'} | {kind:'event', ev:{id,name,year}}]
  pbar.textContent='';
  pbar.dataset.state='ok';
  {const _bj=backToJocBtn();if(_bj)pbar.appendChild(_bj);}   // fix a l'esquerra; els noms fan scroll entre ell i la ✕
  const txt=document.createElement('div');txt.className='ptxt';
  const nm=document.createElement('div');nm.className='pname';
  const showYears=items.length<=1;
  if(items.length>1){
    txt.style.cssText='min-width:0;flex:1 1 0%;overflow:hidden;';
    nm.style.cssText='overflow-x:auto;overflow-y:hidden;white-space:nowrap;text-overflow:clip;';
  }
  items.forEach(function(item,i){
    if(i>0){const sep=document.createElement('span');sep.textContent=' · ';nm.appendChild(sep);}
    const btn=document.createElement('button');
    btn.type='button';btn.className='pname-item';
    if(item.kind==='person'){
      const p=item.p;
      if(showYears){
        const y1=fmtY(p.birth);const y2=p.death!=null?fmtY(p.death):t('cro_today');
        btn.textContent=L(p.name)+' ('+y1+'–'+y2+')';
      }else{btn.textContent=L(p.name);}
      btn.title=t('cro_pb_rehighlight');
      const id=item.id;
      btn.addEventListener('click',function(){revealPerson(id);});
    }else{
      const ev=item.ev;
      btn.textContent=showYears?(L(ev.name)+(ev.year!=null?' ('+fmtY(ev.year)+')':'')):L(ev.name);
      btn.title=t('cro_pb_rehighlight');
      btn.addEventListener('click',function(){focusEvent(ev.id);});
    }
    nm.appendChild(btn);
  });
  txt.appendChild(nm);
  pbar.appendChild(txt);
  const back=document.createElement('button');
  back.className='pback';back.type='button';back.textContent='✕';
  back.title=t('cro_pb_remove_items');
  back.setAttribute('aria-label',t('cro_pb_remove_items'));
  back.addEventListener('click',function(){
    // Una sola foto per tot el clic, i un sol render al final: amb removePerson() normal
    // cada nom empenyia la seva passa i calien 5 «Desfés» per desfer un clic (mesurat).
    pushUndo('cro_act_remove_items',{n:items.length});
    items.forEach(function(item){
      if(item.kind==='person'){removePerson(item.id,{batch:true});}
      else if(item.kind==='event'&&state.selectedEvent===item.ev.id){state.selectedEvent=null;}
    });
    render();
    pbar.textContent='';pbar.classList.remove('on');delete pbar.dataset.state;
  });
  pbar.appendChild(back);
  pbar.classList.add('on');
  scheduleSettle();
}
function bootPersonMode(qid){
  restoreState();
  if(!/^Q\d+$/.test(qid)){
    bootDefault();
    personBar('error',t('cro_bad_qid'),t('cro_bad_qid_desc'),null);
    return;
  }
  const cached=personFromCache(qid);
  if(cached){
    bootDefault(()=>{
      const pid=mostraPersonatge(cached);
      centerOnPerson(cached);                               // zoom + centrat sobre el personatge (no fitToPresent: enmarca tots els desats)
      window.dispatchEvent(new Event('resize'));             // re-avalua fitSecnav amb l'amplada real (fix topbar HB)
      setTimeout(()=>flashBar(pid),500);                   // retardat: sobreviu els render() de scheduleSettle (180ms)
      // El refresc de la foto ha de tornar a passar `pid`: sense ell, personBar cau al fallback
      // 'wd_'+PERSON_QID, un id que no existeix a PEOPLE quan la persona ja hi era (Aristotil =>
      // 'aristotil'). La ✕ cridava removePerson() amb un id inexistent i deixava la barra al canvas.
      if(!cached.img)fetchPerson(qid).then(p=>{if(p&&p.img&&pbar.classList.contains('on'))personBar('ok',p.name,p.desc||'',p.img,null,pid);}).catch(()=>{});
    });
    return;
  }
  bootDefault();
  personBar('loading',t('cro_loading'),t('cro_consulting'),null);
  fetchPerson(qid).then(p=>{
    if(p){const pid=mostraPersonatge(p);centerOnPerson(p);window.dispatchEvent(new Event('resize'));setTimeout(()=>flashBar(pid),500);}
    else personBar('error',t('cro_not_found'),t('cro_not_found_desc',{qid:qid}),null);
  }).catch(()=>{
    personBar('error',t('cro_offline'),t('cro_offline_desc'),null);
  });
}

// [11b] MODE «DES DEL JOC» (?from=joc) — handoff unificat des de joc.html (joc2cronograma).
// joc.html escriu hb_cronograma_ctx={v,source,kind,people,ts} i navega a index.html?from=joc.
// Funciona tant per a 1 persona (personatgedia, memory) com per a N (ordena, abansdespres).
const FRESH_MS=5*60*1000;   // el traspas caduca als 5 minuts
function bootFromJoc(){
  let ctx=null;
  try{ ctx=JSON.parse(localStorage.getItem('hb_cronograma_ctx')||'null'); }catch(_){}
  try{ localStorage.removeItem('hb_cronograma_ctx'); }catch(_){}  // us unic: consumir i esborrar
  history.replaceState(null,'',location.pathname);
  const _np=(ctx&&ctx.people&&ctx.people.length)||0, _ne=(ctx&&ctx.events&&ctx.events.length)||0;
  if(!ctx||ctx.v!==1||(!_np&&!_ne)||(Date.now()-ctx.ts)>FRESH_MS){
    restoreState(); bootDefault(); return;
  }
  const src=ctx.source||null;
  const people=ctx.people||[];
  restoreState();
  // El repartidor va per TOTAL d'items, no per persones: amb 1 persona i 4 events
  // el cami d'un sol personatge ignorava ctx.events i nomes es veia la persona.
  if(_np===1&&!_ne){
    // Un sol personatge: usa personBar amb etiqueta de source
    const p=people[0];
    bootDefault(function(){
      const pid=mostraPersonatge(p,{source:src});
      const _pe0=PEOPLE.find(function(x){return x.id===pid;});
      centerOnPerson(_pe0||p);
      window.dispatchEvent(new Event('resize'));
      setTimeout(function(){ flashBar(pid); },500);
      if(!p.img||!_pe0||_pe0.birth==null)fetchPerson(p.qid).then(function(full){
        if(!full) return;
        const _e=PEOPLE.find(function(x){return x.id===pid;});
        if(_e){
          const _was=_e.birth==null;
          if(_e.birth==null&&full.birth!=null){_e.birth=full.birth;}
          if(_e.death==null&&full.death!=null){_e.death=full.death;}
          scheduleSave();render();
          if(_was&&_e.birth!=null){centerOnPerson(_e);flashBar(pid);}   // ara si es pot enquadrar
        }
        if(full.img&&pbar.classList.contains('on')) personBar('ok',full.name,full.desc||'',full.img,src,pid);
      }).catch(function(){});
    });
  }else{
    // Conjunt (persones i/o events): jocBar. Aguanta people buit (traspàs només d'events).
    bootDefault(function(){
      const resolvedIds=people.map(function(p){
        const local=PEOPLE.find(function(x){return x.wd===p.qid;});
        const id=local?local.id:'wd_'+p.qid;
        if(!local){
          PEOPLE.push({id:'wd_'+p.qid,wd:p.qid,name:p.name,birth:p.birth,death:p.death,
            cats:guessCats(p.desc),gender:'',wiki:p.wiki||'',desc:p.desc||'',_lang:LANG,_session:true,_ts:Date.now()});
        }else{
          if(local.birth==null&&p.birth!=null) local.birth=p.birth;
          if(local.death==null&&p.death!=null) local.death=p.death;
        }
        state.present.add(id);
        state.pinned.add(id);
        return id;
      });
      scheduleSave();
      // Repesca de Wikidata els que segueixen sense anys: sense birth no es pinten (visiblePeople).
      resolvedIds.forEach(function(id,i){
        const _e=PEOPLE.find(function(x){return x.id===id;});
        if(!_e||_e.birth!=null) return;
        fetchPerson(people[i].qid).then(function(full){
          if(!full||full.birth==null) return;
          _e.birth=full.birth;
          if(_e.death==null&&full.death!=null) _e.death=full.death;
          scheduleSave();render();
        }).catch(function(){});
      });
      // Events del joc: filtrar els vàlids i marcar-los visibles
      const _evs=(ctx.events||[]).filter(function(ev){ return ev&&ev.id&&EVENTS.some(function(e){ return e.id===ev.id; }); });
      _evs.forEach(function(ev){ state.showEvents=true; if(!state.selectedEvent) state.selectedEvent=ev.id; });
      // Ordenar persones per any de naixement
      const _paired=resolvedIds.map(function(id,i){ return {p:people[i],id:id}; });
      _paired.sort(function(a,b){
        if(a.p.birth==null&&b.p.birth==null) return 0;
        if(a.p.birth==null) return 1;
        if(b.p.birth==null) return -1;
        return a.p.birth-b.p.birth;
      });
      // Barreja persones + events, ordenats cronologicament junts
      const _items=[
        ..._paired.map(function(x){ return {kind:'person',p:x.p,id:x.id,year:x.p.birth}; }),
        ..._evs.map(function(ev){ return {kind:'event',ev:ev,year:ev.year}; })
      ];
      _items.sort(function(a,b){
        if(a.year==null&&b.year==null) return 0;
        if(a.year==null) return 1;
        if(b.year==null) return -1;
        return a.year-b.year;
      });
      const _resolvedIds=_paired.map(function(x){return x.id;});
      jocBar(_items,src);
      fitToHandoff(_resolvedIds,_evs);
      window.dispatchEvent(new Event('resize'));
      setTimeout(function(){
        _resolvedIds.forEach(function(id){ flashBar(id); });
        _evs.forEach(function(ev){ if(ev&&ev.id) flashEvent(ev.id); });
      },500);
    });
  }
}

// ============================================================
// [12] GUIA DE BENVINGUDA (17/11/2026)
// Sis passos: benvinguda · cerca (Shakespeare suggerit) · mostra context · col·leccions (La
// Il·lustració) · moure's · jocs. No explica botons: vol que l'usuari VEGI per a què serveix
// l'eina (gent de mons diferents que va viure alhora). Detall a BACKLOG/CLAUDE.md.
// - Surt sola NOMÉS a la primera visita (cap estat desat i cap guia vista) i NOMÉS amb ratolí:
//   el mòbil queda per més endavant. `?guia` a la URL la força sempre (per provar-la).
// - Tancar-la (la X, a qualsevol pas) compta com a vista: no torna mai més.
// - Va avançant sola quan l'usuari fa el que li demana (guiaTick, cridat al final de render()).
// - ⚠️ `var` i `function` a posta: render() crida guiaTick() i ha de poder-ho fer encara que
//   aquest bloc no s'hagi executat (una `let` aquí seria TDZ i aturaria tot l'script).
// ============================================================
var GUIA_LS='historiabasica.guia', GUIA_PERSONA='shakespeare', GUIA_COL='illustracio', GUIA_N=6;
var guiaTabFet=false, guiaCol0=null, guiaColT=0, guiaColFi=0, guiaCtxFet=false, guiaPas=null, guiaEl=null, guiaHaloEl=null, guiaVeloEl=null, guiaRaf=0, guiaVist0=null, guiaFocus=null, guiaClau='';
var GUIA_LLOC={1:['baix','dalt'],2:['baix','dalt','esq','dreta'],3:['dreta','baix'],4:['baix','esq'],5:['baix','dreta']};
function guiaTick(){
  // Pas 2: un cop surt el context, la gràcia és VEURE'L. S'enquadra perquè es llegeixin els noms
  // i el globus s'aparta a la cantonada (guiaColoca), que si no tapava justament els contemporanis.
  if(guiaPas===2&&guiaFocus&&state.focus===guiaFocus&&!guiaCtxFet){guiaCtxFet=true;guiaClau='';setTimeout(()=>{if(guiaPas===2){fitToPresent();guiaVes(2,true);}},350);return;}   // guiaVes: canvia el text (la sorpresa, ara sí)
  // Pas 3: activar la col·lecció no fa zoom (decisió general de l'app), però a la guia la gràcia
  // és veure-la sencera. Les persones arriben de Wikidata a poc a poc: s'enquadra quan para.
  if(guiaPas===3&&guiaColNova()&&state.present.size){
    if(!guiaColFi){guiaColFi=Date.now()+4000;guiaClau='';setTimeout(()=>{if(guiaPas===3)guiaVes(3,true);},0);   // canvia el text: ja l'ha activada
      // Al mòbil la col·lecció s'activa dins del popup, que la tapa: el tanquem sol (després de mig
      // segon, que es vegi que s'ha marcat) i així apareix la tira de «després».
      if(guiaMob()&&!$('#cfgwrap').hidden)setTimeout(()=>{if(guiaPas===3)closeCfg();},500);}
    if(Date.now()<guiaColFi){clearTimeout(guiaColT);guiaColT=setTimeout(()=>{if(guiaPas===3)fitToPresent();},500);}
    return;
  }
  if(guiaPas!==1||!guiaVist0)return;
  const nou=[...state.present].find(id=>!guiaVist0.has(id));
  if(nou){guiaFocus=nou;guiaVist0=null;setTimeout(()=>{if(guiaPas===1)guiaVes(2);},450);}   // espera que el scroll de revealPerson acabi
}
function guiaObjectiu(){
  if(guiaPas===1)return results.classList.contains('open')&&results.getBoundingClientRect().height?results:q;   // amb resultats oberts, el globus es posa al costat i no els tapa
  if(guiaPas===2){
    const d=$('#detail');
    if(guiaFocus&&d.classList.contains('open')&&state.selected===guiaFocus){const b=d.querySelector('[data-act="context"]');if(b)return b;}
    return guiaFocus?barsLayer.querySelector(`.bar[data-id="${guiaFocus}"]`):null;
  }
  if(guiaPas===3){   // al mòbil les seccions viuen dins del popup: primer el botó, i amb el popup obert, la fila
    if(guiaMob()&&$('#cfgwrap').hidden)return $('#cfgBtn');
    return document.querySelector(`#collections .colitem[data-col="${GUIA_COL}"]`);
  }
  if(guiaPas===4)return $('#fitAll');
  if(guiaPas===5){const a=document.querySelector('.modeswitch a[href$="joc.html"]');if(a&&a.getBoundingClientRect().width)return a;return document.querySelector('.secnav .brand');}
  return null;
}
function guiaMob(){return matchMedia('(pointer:coarse)').matches;}
// Mòbil: la tira, a dalt o a baix. Va a dalt si el que assenyala és a la meitat de baix (botó de
// configuració, «Mostra context» dins la fitxa) o si la fitxa és oberta; si no, a baix.
function guiaColocaTira(W,H){

  const nav=sec&&sec.querySelector('.modeswitch');
  const tb=document.querySelector('.topbar');
  const search=document.querySelector('.topbar-right .search');
  if(!sec||!brand||!nav||!tb)return;
  const tanca=()=>{sec.classList.remove('open');tb.classList.remove('navopen');brand.setAttribute('aria-expanded','false');};
  function fitSecnav(){
    const coarse=window.matchMedia('(pointer:coarse)').matches, w=window.innerWidth;
    const plega = coarse ? w<=600 : w<=900;   // en tàctil tot ja és més compacte: aguanta més
    const hb    = coarse ? w<=430 : w<=560;   // amb els botons d'accio quadrats el nom sencer hi cap fins a ~545
    sec.classList.toggle('navcollapsed',plega);
    sec.classList.toggle('hb',plega&&hb);
    // Separador: només quan l'aire entre el menú i el cercador s'ha esgotat. Es mesura SEMPRE
    // sense la barreta posada, perquè la barreta viu dins de .secnav i si no es reduiria l'aire
    // a si mateixa (bucle). Sense cercador (pàgina de jocs) no hi ha res a separar: mai surt.
    sec.classList.remove('sep');
    if(search&&!plega){
      const aire=search.getBoundingClientRect().left-sec.getBoundingClientRect().right;
      if(aire<40)sec.classList.add('sep');
    }
    if(!plega)tanca();
  }
  brand.addEventListener('click',e=>{
    if(!sec.classList.contains('navcollapsed'))return;   // en vista ampla la marca és text inert
    e.stopPropagation();
    const obert=sec.classList.toggle('open');
    tb.classList.toggle('navopen',obert);
    brand.setAttribute('aria-expanded',obert?'true':'false');
  });
  document.addEventListener('click',e=>{if(!sec.contains(e.target))tanca();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')tanca();});
  // Igual que amb floorH: en creuar el llindar de (pointer:coarse) el primer càlcul encara
  // llegeix l'estat antic. Es reavalua al frame següent i un cop assentat.
  let t;
  function reavalua(){fitSecnav();requestAnimationFrame(fitSecnav);clearTimeout(t);t=setTimeout(fitSecnav,300);}
  reavalua();
  // resize dispara amb dimensions antigues en iOS quan es gira — esperem un frame + 300ms per llegir les dimensions reals
  window.addEventListener('resize',()=>{requestAnimationFrame(reavalua);});
  if(screen&&screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(reavalua,350));   // en girar el mòbil screen.orientation.change dona temps al viewport d'assentar-se abans de mesurar
  const MQ=window.matchMedia('(pointer:coarse)');
  if(MQ.addEventListener)MQ.addEventListener('change',reavalua);   // el llindar tàctil pot canviar sense que el resize arribi a temps
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reavalua);   // Oswald canvia l'amplada de la marca
  window.addEventListener('pageshow',e=>{if(e.persisted)reavalua();});   // bfcache: el back-button restaura la pàgina sense re-executar el JS; reavalua garanteix que la barreta es recalculi
})();
// --- Selector d'idioma (22/11/2026). Autosuficient a posta: al joc aquest bloc viu FORA del mòdul
// on hi ha LANG i setLang(), així que llegeix l'idioma actiu de <html lang> (el posen totes dues
// pàgines) i, en triar-ne un, el desa a hb_lang (la clau compartida), oblida el ?lang de la sessió
// i recarrega: el contingut es tradueix NOMÉS en arrencar (localitza()).
(function(){
  const ls=document.querySelector('.langsel');
  if(!ls)return;
  const btn=ls.querySelector('.langbtn'), cur=ls.querySelector('.langcur');
  const act=(document.documentElement.lang||'ca').slice(0,2);
  if(cur)cur.textContent=act.toUpperCase();
  ls.querySelectorAll('.langopt').forEach(o=>{
    const on=o.dataset.lang===act;
    o.classList.toggle('on',on);o.setAttribute('aria-checked',on?'true':'false');
    o.addEventListener('click',e=>{
      e.stopPropagation();
      if(on){tanca();return;}
      try{localStorage.setItem('hb_lang',o.dataset.lang);sessionStorage.removeItem('hb_lang_sessio');}catch(_){}
      const u=new URL(location.href);u.searchParams.delete('lang');u.pathname=u.pathname.replace(/^\/[a-z]{2}\//,'/');
      location.replace(u.toString());
    });
  });
  function tanca(){ls.classList.remove('open');btn.setAttribute('aria-expanded','false');}
  btn.addEventListener('click',e=>{e.stopPropagation();const o=ls.classList.toggle('open');btn.setAttribute('aria-expanded',o?'true':'false');});
  document.addEventListener('click',e=>{if(!ls.contains(e.target))tanca();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')tanca();});
  // Coherència entre pàgines: l'idioma és UN per a tota l'experiència (hb_lang és compartit). Però el
  // botó enrere (i el «← Al joc», que fa history.back()) restaura la pàgina de la memòria del navegador
  // (bfcache) TAL COM ERA, sense tornar-la a carregar: si mentrestant s'ha canviat l'idioma a l'altra
  // pàgina, tornaria en l'idioma vell. Si no quadra, es recarrega (sense el ?lang de l'adreça, que és
  // vell: el que mana ara és la tria de l'usuari).
  window.addEventListener('pageshow',e=>{
    if(!e.persisted)return;
    let vol=null;try{vol=sessionStorage.getItem('hb_lang_sessio')||localStorage.getItem('hb_lang');}catch(_){}
    if(vol&&vol!==act){const u=new URL(location.href);u.searchParams.delete('lang');u.pathname=u.pathname.replace(/^\/[a-z]{2}\//,'/');location.replace(u.toString());}
  });
})();
// ===== fi del bloc compartit =====
</script>
</body>
