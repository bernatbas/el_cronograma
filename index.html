<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cronograma — prova</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     Change look & feel from here. Scale: 16/14/12/11 px · weights 600/500/400.
     Radii: --r-card (rectangles) · --r-pill (round). Structure = slate; data = colour.
     ============================================================ */
  :root{
    --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
    --surface:#F0EFED; --border:#E6E5E3; --border-strong:#CBC9C4; --blue:#2783DE; --blueSoft:#E5F2FC;
    --topbar-bg:#B8503C;
    /* collection (people) colours — the vivid "data" layer */
    --philosophy:#5E9FE8; --music:#BF8EDA; --literature:#DE9255;
    --science:#72BC8F; --politics:#DF84A8; --painting:#D4A72C; --religion:#A24E5E;
    /* events + structure — the calm layer */
    --eventc:#4B4F57;
    --struct:#8B93AD; --struct-ink:#565D78; --band:#F3F4F7; --r-card:8px; --r-pill:999px; --axis-h:32px;
  }

  /* ===== Base ===== */
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}   /* the page itself never scrolls — every overflow lives inside .scroll or .sidebar */
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--canvas);font-size:14px;line-height:1.5;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}   /* no min-height: it forced the app taller than a phone in landscape and pushed the timeline past the fold. dvh follows Safari's collapsing URL bar */

  /* ===== Top bar (brand · search · zoom controls) ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 22px;border-bottom:5px solid #612E25;flex:0 0 auto;background:var(--topbar-bg);z-index:5;}
  .topbar .brand{color:#fff;}
  .topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .topbar .btn.on{background:#fff;color:#B23A2E;border-color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px #fff;}
  .topbar .btn:hover{background:rgba(255,255,255,.22);}
  .topbar .search input{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;}
  .topbar .search input::placeholder{color:rgba(255,255,255,.55);}
  .topbar .search input:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);}
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topbar-right{display:flex;align-items:center;gap:14px;flex:0 0 auto;}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;letter-spacing:.06em;white-space:nowrap;}
  .search{position:relative;width:320px;flex:0 0 auto;}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--soft);}
  .search input:focus{border-color:var(--blue);background:#fff;}
  .results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.06);max-height:280px;overflow:auto;display:none;z-index:20;}
  .results.open{display:block;}
  .results .row{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;}
  .results .row:hover{background:var(--soft);}
  .results .row.active{background:var(--blueSoft);}
  .results .rowsep{padding:7px 12px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);border-top:1px solid var(--border);}
  .results .row.loading{color:var(--text2);font-style:italic;cursor:default;}
  .results .row .yr{color:var(--text2);font-size:12px;margin-left:auto;}
  .results .row.disabled{opacity:.5;cursor:default;}
  .controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--text);min-width:38px;min-height:38px;}
  .btn:hover{background:var(--soft);}

  /* ===== Sidebar (marcs · col·leccions · a la vista) ===== */
  .body{display:flex;flex:1 1 auto;min-height:0;position:relative;}
  .sidebar{position:absolute;top:0;left:0;bottom:0;width:240px;border-right:2px solid var(--border-strong);padding:16px;overflow:auto;background:var(--soft);transition:width .18s ease,padding .18s ease;z-index:10;box-shadow:3px 0 14px rgba(0,0,0,.07);}   /* overlays the canvas instead of pushing it — the stage never resizes */
  .body.collapsed .sidebar{width:14px;padding:0;overflow:hidden;box-shadow:none;}   /* thin strip stays visible as a "something's hidden here" cue */
  .body.collapsed .sidebar>*{display:none;}                        /* hide content instead of letting it reflow/wrap inside the strip */
  .sidebarHandle{position:absolute;top:50%;left:229px;transform:translateY(-50%);width:24px;height:52px;border:1.5px solid var(--border-strong);border-left:none;background:var(--surface);border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:16px;line-height:1;padding:0;z-index:10;box-shadow:2px 0 6px rgba(0,0,0,.08);transition:left .18s ease;}
  .sidebarHandle:hover{background:#fff;border-color:var(--blue);color:var(--blue);}
  .body.collapsed .sidebarHandle{left:3px;}
  .sidebar h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:0 0 10px;font-weight:600;}
  .sidebar section{margin-bottom:24px;}
  .filter{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:14px;}
  .filter input{width:16px;height:16px;accent-color:var(--blue);}
  .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}

  /* ===== Category legend (below the timeline) =====
     Passive reading aid, not a control: it lists only the categories actually painted on the
     canvas right now, so it appears on the first search and empties again when you clear. */
  .legend{position:absolute;left:256px;bottom:calc(var(--axis-h) + 12px);z-index:8;display:flex;flex-direction:column;gap:6px;max-width:40vw;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-card);background:rgba(255,255,255,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(40,44,60,.13);transition:left .18s ease;pointer-events:none;}
  /* Floats over the canvas so it costs zero layout height — vertical space is the scarcest thing on
     a phone. Tucked against the sidebar (240px + gutter), which overlays the stage rather than
     shrinking it, so it has to follow the sidebar open/closed. Always open and non-interactive:
     pointer-events:none means it can never block a bar in a low lane that it happens to overlap. */
  .body.collapsed .legend{left:30px;}
  .legend:empty{display:none;}                 /* nothing painted → no floating card at all */
  .legend .lgi{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);white-space:nowrap;}
  .legend .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}

  .onview .item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;}
  .onview .item .nm{flex:1 1 auto;cursor:pointer;border:none;background:none;font:inherit;color:inherit;text-align:left;padding:2px 4px;margin-left:-4px;border-radius:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .onview .item .nm:hover{background:var(--surface);text-decoration:underline;}
  .onview .item .x,.onview .item .rp{flex:0 0 auto;color:var(--text2);cursor:pointer;border:none;background:none;font-size:16px;line-height:1;padding:2px 5px;border-radius:6px;}
  .onview .item .rp{font-size:12px;opacity:.55;}
  .onview .item .x:hover,.onview .item .rp:hover{background:var(--surface);color:var(--text);opacity:1;}
  #collections{display:flex;flex-direction:column;gap:6px;}
  /* Every collection button is IDENTICAL — collections carry no colour of their own (that is what
     categories and the legend are for), so the only thing that varies is on/off. */
  .colitem{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--border-strong);border-radius:var(--r-card);padding:9px 11px;font-size:14px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;background:linear-gradient(135deg,#FFFFFF,#F6F2ED);box-shadow:0 1px 3px rgba(40,44,60,.10);transition:box-shadow .14s,background .14s,border-color .14s;}
  .colitem:hover{border-color:#B0ADA7;box-shadow:0 2px 8px rgba(40,44,60,.16);}
  .colitem .ico{flex:0 0 auto;width:16px;height:16px;opacity:.45;}
  .colitem .cnt{margin-left:auto;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;}
  .colitem .extlink{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;opacity:.35;border-radius:3px;text-decoration:none;color:inherit;transition:opacity .15s;}
  .colitem .extlink:hover{opacity:.85;background:rgba(0,0,0,.06);}
  .colitem.on .extlink{opacity:.6;}
  .colitem.on{background:linear-gradient(135deg,#F7E5E0,#EFD4CC);border-color:var(--topbar-bg);box-shadow:inset 3px 0 0 var(--topbar-bg),0 1px 3px rgba(40,44,60,.13);font-weight:600;}
  .colitem.on .ico{opacity:.8;}
  .newcol{width:100%;border:1px dashed var(--border-strong);background:none;border-radius:var(--r-card);padding:8px 10px;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit;}
  .newcol:hover{background:var(--surface);color:var(--text);}
  .onview .empty{color:var(--text2);font-size:13px;font-style:italic;}

  /* ===== Stage: the scrolling timeline canvas ===== */
  .stage{flex:1 1 auto;position:relative;min-width:0;display:flex;flex-direction:column;}
  .scroll{flex:1 1 auto;overflow:auto;position:relative;cursor:grab;user-select:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;}   /* pan-x pan-y: one finger scrolls natively, two fingers are left to our own pinch handler instead of the browser starting a gesture and dropping our events */
  .scroll.grabbing,.scroll.grabbing *{cursor:grabbing;}
  .inner{position:relative;}

  /* ===== Era strata =====
     ERES backbone = pale wash spanning the whole canvas (the "ruler", always on).
     MARC blocks = opaque bordered cards on top, coloured per marc; the canvas grows with the lanes. */
  .eraPanel{position:absolute;left:0;top:0;background:var(--band);border-bottom:1px solid var(--border);box-shadow:0 8px 14px -10px rgba(40,44,60,.22);}
  .eraTracks{position:absolute;top:0;left:0;}
  .segwrap{position:absolute;inset:0;}
  .blockzone{position:absolute;top:0;overflow:hidden;pointer-events:none;}
  .blockzone .blabel{position:absolute;top:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;opacity:.9;}
  .seg{position:absolute;top:0;display:flex;flex-direction:column;justify-content:center;padding:0 14px;overflow:hidden;border-right:1px solid rgba(0,0,0,.06);}
  .seg .segname{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--struct-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;flex:0 0 auto;}
  .seg .segyears{font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;margin-top:2px;line-height:1.2;flex:0 0 auto;}   /* flex:0 0 auto on both: the block has a fixed height, and letting these shrink squashed the glyphs and clipped the name */
  /* Radius on all four corners + a left colour spine, so the blocks share the bars' shape language
     instead of reading as chart columns planted on a baseline (which is what radius-top-only plus a
     heavy border-bottom did). The spine is an inset shadow, not a border-left: a single-sided border
     tapers away at the rounded corners, an inset shadow stays a clean 3px. Colour stays washed out —
     the vivid layer belongs to people and events. --mc/--mink are set per block in render(). */
  .seg.mov{border:none;border-radius:var(--r-card);padding:0 10px 0 13px;cursor:pointer;box-shadow:inset 3px 0 0 var(--mc),0 1px 3px rgba(40,44,60,.14);transition:box-shadow .12s,filter .12s;}
  .seg.mov:hover{filter:brightness(.98);box-shadow:inset 3px 0 0 var(--mc),0 3px 8px rgba(40,44,60,.26);}
  .seg.mov .segname{font-size:12px;letter-spacing:.03em;color:var(--mink,var(--struct-ink));}
  .seg.mov .segyears{font-size:11px;margin-top:0;}

  /* ===== Events (vertical markers: name on top, year at the foot) ===== */
  .eventsRail{position:absolute;left:0;top:0;pointer-events:none;}
  .event{position:absolute;top:0;}
  .event .eline{position:absolute;left:0;width:2px;margin-left:-1px;background:linear-gradient(to bottom,var(--eventc),rgba(44,44,43,.22));border-radius:2px;}
  .event .edot{position:absolute;left:0;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--eventc);box-shadow:0 0 0 4px rgba(44,44,43,.13);}
  .event .ename{position:absolute;left:10px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--eventc);cursor:pointer;pointer-events:auto;}
  .event .ename:hover{text-decoration:underline;}
  .event .eyear{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:600;color:var(--eventc);background:#fff;border:1.5px solid var(--eventc);padding:2px 9px;border-radius:var(--r-card);font-variant-numeric:tabular-nums;}
  .event.dotonly .edot{pointer-events:auto;cursor:pointer;width:6px;height:6px;box-shadow:0 0 0 3px rgba(44,44,43,.10);opacity:.5;transition:opacity .15s ease,transform .15s ease;}
  .event.dotonly .edot:hover{opacity:1;transform:translateX(-50%) scale(1.35);}
  .event.focus{z-index:8;}
  .event.focus .edot{background:#2783DE;box-shadow:0 0 0 5px rgba(39,131,222,.25);opacity:1;width:9px;height:9px;}
  .event.focus .ename{color:#2783DE;text-decoration:underline;}
  .event.focus .eyear{color:#2783DE;border-color:#2783DE;}
  .event.evPop .edot{animation:evPop 4s ease-out;}
  @keyframes evPop{0%{box-shadow:0 0 0 0 rgba(39,131,222,.6);}6%{transform:translateX(-50%) scale(1.5);}16%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 12px rgba(39,131,222,0);}24%{box-shadow:0 0 0 0 rgba(39,131,222,.5);}40%{box-shadow:0 0 0 11px rgba(39,131,222,0);}50%{box-shadow:0 0 0 0 rgba(39,131,222,.42);}68%{box-shadow:0 0 0 11px rgba(39,131,222,0);}78%{box-shadow:0 0 0 0 rgba(39,131,222,.34);}100%{box-shadow:0 0 0 10px rgba(39,131,222,0);}}

  /* ===== People bars (the "data": a bar per lifespan; living ones fade to the future) ===== */
  .bars{position:absolute;left:0;}
  .bar{position:absolute;height:var(--bar-h,26px);border-radius:var(--r-card);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:500;color:#fff;cursor:pointer;white-space:nowrap;overflow:visible;transition:opacity .12s;box-shadow:0 1px 3px rgba(40,44,60,.18);}
  .bar .lbl{pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.42);}
  .bar.sel{outline:2px solid var(--text);outline-offset:1px;}
  .bar.alive{box-shadow:none;border-top-right-radius:0;border-bottom-right-radius:0;}
  @keyframes barPop{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(39,131,222,.6);}6%{transform:scale(1.12);}16%{transform:scale(1);box-shadow:0 0 0 12px rgba(39,131,222,0);}24%{box-shadow:0 0 0 0 rgba(39,131,222,.5);}40%{box-shadow:0 0 0 11px rgba(39,131,222,0);}50%{box-shadow:0 0 0 0 rgba(39,131,222,.42);}68%{box-shadow:0 0 0 11px rgba(39,131,222,0);}78%{box-shadow:0 0 0 0 rgba(39,131,222,.34);}100%{box-shadow:0 0 0 10px rgba(39,131,222,0);}}
  .bar.justAdded{animation:barPop 4s ease-out;z-index:9;}
  .bar .menu{position:absolute;right:1px;top:50%;transform:translateY(-50%);display:none;width:20px;height:20px;padding:0;border:none;border-radius:5px;background:rgba(255,255,255,.92);color:var(--text);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .bar:hover .menu{display:flex;align-items:center;justify-content:center;}
  .bar .fade{position:absolute;top:0;bottom:0;pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent);}
  .emptyState{position:absolute;left:24px;font-size:14px;color:var(--text2);font-style:italic;pointer-events:none;}
  /* Floating context menu (bar ⋮ button) */
  .barmenu{position:fixed;display:none;background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:30;overflow:hidden;min-width:150px;}
  .barmenu.open{display:block;}
  .barmenu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;}
  .barmenu button:hover{background:var(--soft);}
  .barmenu button.danger{color:#C0392B;}
  /* Hover tooltip on a person bar. Not a native `title`: that waits ~1s and, zoomed out, the pill is
     too small to hold a readable label — the name and dates have to be reachable without clicking. */
  /* ===== Toast (feedback curt per accions encara no implementades) ===== */
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--text);color:#fff;font-size:13px;padding:10px 18px;border-radius:var(--r-card);z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.26);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s;pointer-events:none;}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s,transform .18s,visibility 0s;}
  .bartip{position:fixed;display:none;background:var(--text);color:#fff;font-size:12px;font-weight:500;padding:5px 10px;border-radius:var(--r-card);white-space:nowrap;z-index:40;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.24);}
  .bartip.on{display:block;}

  /* ===== Hover guide + "today" line ===== */
  .guide{position:absolute;top:0;width:1px;background:var(--blue);pointer-events:none;display:none;z-index:8;}
  .guide .yr{position:absolute;top:2px;left:3px;background:var(--blue);color:#fff;font-size:11px;padding:2px 7px;border-radius:var(--r-card);white-space:nowrap;}
  .nowline{position:absolute;top:0;width:0;border-left:2px solid rgba(30,30,29,.4);pointer-events:none;}
  .nowline .lbl{position:absolute;top:2px;left:5px;background:var(--text);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-card);white-space:nowrap;}

  /* ===== Axis (sticks to the viewport bottom when content overflows) ===== */
  .axis{position:sticky;bottom:0;height:var(--axis-h);border-top:1px solid var(--border);background:var(--canvas);z-index:7;}
  .axis .inner2{position:absolute;top:0;left:0;height:100%;}
  .tick{position:absolute;top:0;height:100%;border-left:1px solid var(--border);padding-left:5px;font-size:11px;color:var(--text2);display:flex;align-items:center;}
  .tick.tinf{border-left:none;color:var(--text2);font-weight:600;letter-spacing:.05em;}
  .tick.tbound{border-left:2px dashed var(--border);color:var(--text);font-weight:700;}

  /* ===== Detail panel — modal popup ===== */
  .detail-backdrop{position:fixed;inset:0;background:rgba(20,8,10,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:49;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s;}
  .detail-backdrop.open{visibility:visible;opacity:1;transition:opacity .2s,visibility 0s;}
  .detail{position:fixed;top:50dvh;left:50%;transform:translate(-50%,-50%) scale(.95);width:min(420px,calc(100vw - 32px));max-height:calc(100dvh - 80px);overflow-y:auto;background:#fff;border-radius:16px;padding:24px 24px 20px;box-shadow:0 24px 64px rgba(0,0,0,.18),0 4px 20px rgba(0,0,0,.08);z-index:50;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s,visibility 0s .2s;}
  .detail.open{visibility:visible;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);transition:opacity .2s,transform .2s,visibility 0s;}
  .detail .close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1;padding:2px 6px;border-radius:6px;}
  .detail .close:hover{background:var(--soft);}
  .detail h2{font-size:17px;font-weight:600;margin:0 0 4px;padding-right:32px;}
  .detail .life{color:var(--text2);font-size:12px;margin-bottom:14px;}
  .detail .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .detail .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:var(--r-card);background:var(--soft);border:1px solid var(--border);}
  .detail .meta{font-size:12px;color:var(--text2);margin:6px 0;}
  .detail .desc{font-size:14px;margin:14px 0;}
  .detail a.wiki{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-size:14px;}
  .detail a.wiki:hover{text-decoration:underline;}
  .detail .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .detail .dbtn{border:1px solid var(--border);background:#fff;border-radius:var(--r-card);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text);}
  .detail .dbtn:hover{background:var(--soft);}
  .detail .dbtn.danger{color:#C0392B;border-color:#E7B7B0;}
  .detail .dbtn.danger:hover{background:#FBEDEB;}

  /* ===== Portrait wall (touch devices in portrait: asks to rotate) ===== */
  .portrait-wall{position:fixed;inset:0;background:var(--canvas);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px;}
  .portrait-wall.on{display:flex;}
  .portrait-wall .p-icon{font-size:64px;animation:pSpin 2.4s ease-in-out infinite;}

// ============================================================
// [2] RANGE, CONFIG & STATE
// ============================================================
// Data extent → the drawable year window (with a little gutter each side).
const _blocks=[...ERAS,...MARCS.flatMap(m=>m.blocks)];
const _starts=[..._blocks.map(b=>b.start),...EVENTS.map(e=>e.year),...PEOPLE.map(p=>p.birth)];
const _ends=[..._blocks.map(b=>b.end),...EVENTS.map(e=>e.year),...PEOPLE.map(p=>p.death==null?NOW_YEAR:p.death)];
const DATA_MIN=Math.min(..._starts), DATA_MAX=Math.max(..._ends);
const GUTTER_YEARS=14;
const RIGHT_PAD_YEARS=20;   // just enough for the axis to keep ticking a bit past "today" — the real scroll margin is capped in px by FUTURE_MARGIN_PX in render(), not by this
const YEAR_MIN=DATA_MIN-GUTTER_YEARS, YEAR_MAX=DATA_MAX+RIGHT_PAD_YEARS;
let pxPerYear=4;               // current zoom (pixels per year); set by defaultView()/setZoom()
const SEED_PINNED=['bernat'];  // always present, never removable — "empty screen" means without the other 35, not without him
const DEFAULT_MARCS=['west'];  // marcs shown on load / after Reset (the eras backbone is always on)
const FUTURE_FADE=72;          // px the living bars (and the era band) fade out past "today"
const deathOf=p=>p.death==null?NOW_YEAR:p.death;
const isAlive=p=>p.death==null;

const state={present:new Set(),pinned:new Set(SEED_PINNED),collections:new Set(),marcs:new Set(DEFAULT_MARCS),showEvents:true,selected:null,selectedEvent:null};

// ============================================================
// [3] DOM REFS & SMALL HELPERS (coords, colours, formatting)
// ============================================================
const $=s=>document.querySelector(s);
const inner=$('#inner'),barsLayer=$('#barsLayer'),eraTracksEl=$('#eraTracks'),eraPanel=$('#eraPanel'),eventsRail=$('#eventsRail'),axisEl=$('#axis'),axisInner=$('#axisInner'),guide=$('#guide'),nowline=$('#nowline'),scroll=$('#scroll'),legendEl=$('#legend'),detailBackdrop=$('#detailBackdrop'),toastEl=$('#toast');

// ============================================================
// Persistència local (per navegador): recupera la vista i els
// canvis fets en reobrir la pàgina al mateix navegador.
// ============================================================
const LS_KEY='historiabasica.state.v1';
let lsReady=false,saveTimer=null,restoredView=null;
function saveNow(){
  if(!lsReady)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({v:1,pinned:[...state.pinned],collections:[...state.collections],marcs:[...state.marcs],showEvents:state.showEvents,extraPeople:PEOPLE.filter(p=>p._session),view:{px:pxPerYear,left:scroll.scrollLeft}}));}catch(e){}
}
function scheduleSave(){if(!lsReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,400);}   // debounced: render() and scroll fire often
function restoreState(){
  let d;try{d=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){d=null;}
  if(!d||d.v!==1)return;
  (d.extraPeople||[]).forEach(p=>{if(p&&p.id&&!PEOPLE.some(x=>x.id===p.id))PEOPLE.push(p);});   // re-add people fetched from Wikidata last session
  state.pinned=new Set([...SEED_PINNED,...(Array.isArray(d.pinned)?d.pinned:[])]);
  state.collections=new Set(Array.isArray(d.collections)?d.collections:[]);
  state.marcs=new Set(Array.isArray(d.marcs)?d.marcs:DEFAULT_MARCS);
  state.showEvents=d.showEvents!==false;
  if(d.view&&typeof d.view.px==='number')restoredView=d.view;
  recomputePresent();
}
scroll.addEventListener('scroll',scheduleSave);   // persist pan position (no-op until lsReady)
let toastTimer=null;
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),2200);}
const WIP=()=>showToast('🚧 En construcció');
function hideDetail(){$('#detail').classList.remove('open');detailBackdrop.classList.remove('open');}
$('#detailBackdrop').addEventListener('click',()=>{hideDetail();state.selected=null;state.selectedEvent=null;render();});
const x=y=>(y-YEAR_MIN)*pxPerYear;                 // year → x px
const totalW=()=>(YEAR_MAX-YEAR_MIN)*pxPerYear;    // full canvas width px

const NOCAT_COLOR='#4FB0A6';                        // people with no category at all
const hasCat=p=>Array.isArray(p.cats)&&p.cats.length>0;
const stripeBg=(cols,seg)=>cols.length<2?cols[0]:`repeating-linear-gradient(135deg, ${cols.map((c,i)=>`${c} ${i*seg}px ${(i+1)*seg}px`).join(', ')})`;
const barBg=p=>hasCat(p)?stripeBg(p.cats.map(a=>CAT_COLORS[a]),14):NOCAT_COLOR;   // two categories → diagonal stripes
const swatchBg=p=>hasCat(p)?stripeBg(p.cats.map(a=>CAT_COLORS[a]),7):NOCAT_COLOR;
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};                                   // hex → translucent rgba
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return `rgb(${r},${g},${b})`;};   // darken toward black
const mix=(hex,f)=>{const n=parseInt(hex.slice(1),16);const m=v=>Math.round(255+(v-255)*f);return `rgb(${m((n>>16)&255)},${m((n>>8)&255)},${m(n&255)})`;};   // opaque tint toward white (f=0 white … 1 full colour)
const fmtY=y=>y<0?(-y)+' aC':''+y;
const linkLabel=url=>/wikipedia\.org/.test(url)?'Wikipedia':/wikidata\.org/.test(url)?'Wikidata':'Web';   // adaptive label for the detail link

// Guess categories from Wikidata itemDescription (conservative keyword matching)
const guessCats=desc=>{if(!desc)return[];const d=desc.toLowerCase(),a=[];
  if(/filòsof|filósofo|philosopher/.test(d))a.push('Filosofia');
  if(/compositor|composer|música|music/.test(d))a.push('Música');
  if(/escriptor|escritor|writer|poeta|poet|dramaturgo|dramaturg|novel·lista|novelist/.test(d))a.push('Literatura');
  if(/físic|physicist|matemàtic|mathematician|astrònom|astronomer|científic|scientist|naturalista|naturalist/.test(d))a.push('Ciència');
  if(/rei|king|emperador|emperor|dictador|dictator|militar|military|president|independentista/.test(d))a.push('Política');
  if(/pintor|painter|escultor|sculptor/.test(d))a.push('Pintura');
  if(/profeta|prophet|religiós|religious|sant|saint/.test(d))a.push('Religió');
  if(/futbolista|jugador de futbol|footballer|football player|tennista|tenista|tennis player|jugador de tennis|basquetbol|bàsquet|baloncestista|basketball|boxejador|boxeador|boxer|atleta|athlete|track and field|velocista|sprinter|gimnasta|gymnast|nedador|nadador|swimmer|ciclista|cyclist|golfista|golfer|automobilista|racing driver|motorcycle racer/.test(d)
     ||/(pilot|piloto)[^,;.]{0,18}(autom|motocicl)/.test(d))a.push('Esport');   // "pilot" sol cauria sobre aviadors, així que exigim context de motor
  return [...new Set(a)].slice(0,2);};   // 0–2 per persona: una descripció tipus "filòsof, escriptor i naturalista" dispararia tres regles

// Who is on the timeline = whoever you put there. Categories only colour the bars; they never
// decide membership, so `pinned` is the whole story (no more activeCols/hidden bookkeeping).
function recomputePresent(){state.present=new Set([...state.pinned].filter(id=>PEOPLE.some(p=>p.id===id)));}

// ============================================================
// [4] LAYOUT MATH (lane packing + vertical geometry)
// ============================================================
let MOV_LANE_H=40, MOV_BAR_H=34, MOV_PAD_BOT=6, ERAS_TOP=16, ERA_LABEL_H=26, EVENT_LABEL_H=38, GAP_AFTER=14, ROW_H=34, BAR_H=26, EVENT_YEAR_BAND=32;
// Vertical budget is what runs out on a phone in landscape (~340px of usable height), so the eras
// band, the event rail and the people rows all shrink together. Driven off the same media query as
// the CSS below — one source of truth, so the JS geometry and the font sizes can never disagree.
const COMPACT_MQ=window.matchMedia('(max-height:560px)');
function applyMetrics(){
  const c=COMPACT_MQ.matches;
  MOV_LANE_H=c?30:40; MOV_BAR_H=c?26:34; MOV_PAD_BOT=c?4:6;   // 26 is the floor for two lines of block text (name + years) at the compact font sizes
  ERAS_TOP=c?9:16; ERA_LABEL_H=c?17:26; EVENT_LABEL_H=c?28:38; GAP_AFTER=c?8:14;
  BAR_H=c?20:26; ROW_H=BAR_H+(c?5:8); EVENT_YEAR_BAND=c?26:32;
  document.documentElement.style.setProperty('--bar-h',BAR_H+'px');
}
applyMetrics();
// Greedy lane assignment so overlapping intervals stack instead of colliding.
function packSegs(segs){const arr=segs.map((s,idx)=>({idx,start:s.start,end:s.end})).sort((a,b)=>a.start-b.start);const ends=[];const lane=new Array(segs.length).fill(0);for(const it of arr){let placed=false;for(let l=0;l<ends.length;l++){if(it.start>=ends[l]){lane[it.idx]=l;ends[l]=it.end;placed=true;break;}}if(!placed){lane[it.idx]=ends.length;ends.push(it.end);}}return {lane,nLanes:Math.max(1,ends.length)};}
// All period blocks from the active marcs, pooled into one list and tagged with their marc's colour.
// `key` (marc id + index) is the click identity: blocks have no id of their own in DATA, and the
// pooled list is rebuilt on every render, so the DOM needs something stable to look them back up by.
function activeBlocks(){const out=[];MARCS.forEach(m=>{if(state.marcs.has(m.id))m.blocks.forEach((b,i)=>out.push({name:b.name,start:b.start,end:b.end,color:m.color,key:m.id+':'+i,marcName:m.name,wiki:b.wiki,desc:b.desc}));});return out;}
function blockLanes(){const b=activeBlocks();return b.length?packSegs(b).nLanes:0;}
// The eras canvas grows with the number of block lanes (just like the people canvas).
function erasBlockH(){return ERAS_TOP+ERA_LABEL_H+blockLanes()*MOV_LANE_H+MOV_PAD_BOT;}
function eventLabelTop(){return erasBlockH()+6;}
function barsTop(){return eventLabelTop()+EVENT_LABEL_H+GAP_AFTER;}

function visiblePeople(){return PEOPLE.filter(p=>state.present.has(p.id));}
// Stack people into rows. Living pills grow to fit the name; dead bars keep their real lifespan
// (the label just overflows). Lanes pack by the bar, so overlapping names are allowed (click to disambiguate).
function packLanes(people){
  const sorted=[...people].sort((a,b)=>a.birth-b.birth);
  const laneEnds=[];
  sorted.forEach(p=>{
    const startX=x(p.birth);
    const nameW=p.name.length*7+20;
    const lifeW=Math.max(x(deathOf(p))-startX,8);
    const alive=isAlive(p);
    const pillW=alive?Math.max(lifeW,nameW):lifeW;
    const endX=startX+pillW+(alive?FUTURE_FADE:0);
    let lane=laneEnds.findIndex(e=>e+8<startX);
    if(lane===-1){lane=laneEnds.length;laneEnds.push(endX);}
    else laneEnds[lane]=endX;
    p._lane=lane;p._startX=startX;p._endX=endX;p._pillW=pillW;p._alive=alive;
  });
  return laneEnds.length;
}

// ============================================================
// [5] RENDER — rebuilds the whole view from `state` + `pxPerYear`
// ============================================================
function render(){
  recomputePresent();
  if(scroll.clientWidth>0)pxPerYear=Math.max(fitPx(),Math.min(20,pxPerYear));   // safety net: whatever path got us here (pinch, resize, page zoom), never draw at a zoom below the fit floor — that's what left a white gap and runaway scroll
  const nowX=x(NOW_YEAR);
  const W=Math.max(Math.min(totalW(),nowX+FUTURE_MARGIN_PX),nowX+FUTURE_FADE+8,scroll.clientWidth);   // cap the scrollable canvas to a fixed px margin past "today" (not a year count, or it balloons at high zoom), but never narrower than the viewport (white gap) nor than the future-fade
  inner.style.width=W+'px';

  // --- Era strata: always-on eras backbone + pooled marc blocks (canvas grows with lanes) ---
  const erasH=erasBlockH();
  eraPanel.style.width=W+'px';
  eraPanel.style.height=erasH+'px';
  const futureMask=`linear-gradient(to right,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;   // band fades out at "today"
  eraPanel.style.webkitMaskImage=futureMask;
  eraPanel.style.maskImage=futureMask;
  eraTracksEl.style.width=W+'px';
  eraTracksEl.style.height=erasH+'px';
  const gw=x(DATA_MIN), FADE=72;
  const maskGrad=`linear-gradient(to right,transparent ${gw}px,#000 ${gw+FADE}px,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;  // fade both ends (past ∞ / future)
  const maskCss=`-webkit-mask-image:${maskGrad};mask-image:${maskGrad};`;
  // eras backbone: the macro-eras as a pale wash spanning the whole canvas, names at the top
  const backboneEls=ERAS.map((b,k)=>{
    const bl=x(b.start),bw=Math.max(x(b.end)-x(b.start),2);
    const tint=hexA(ERAS_COLOR,k%2?0.13:0.06);
    const dv=k>0?`border-left:1px solid ${hexA(ERAS_COLOR,.26)};`:'';
    return `<div class="blockzone" style="left:${bl}px;width:${bw}px;height:${erasH}px;background:${tint};${dv}"><span class="blabel" style="left:14px;top:${ERAS_TOP}px;color:${shade(ERAS_COLOR,.55)}">${b.name}</span></div>`;
  }).join('');
  // marc blocks: every active marc pooled into shared lanes, identical style, coloured per marc
  const blocks=activeBlocks();
  const bpk=blocks.length?packSegs(blocks):{lane:[]};
  const blockEls=blocks.map((b,j)=>{
    const left=x(b.start),w=Math.max(x(b.end)-x(b.start),2);
    const rowTop=ERAS_TOP+ERA_LABEL_H+bpk.lane[j]*MOV_LANE_H;
    const c=b.color;
    // Gradient fades to the right for direction; the spine marks where the period starts, and the
    // right edge stays crisp so you can still read where it ends. Shadow matches .bar so both layers
    // sit on the canvas the same way. Name takes the marc's own darkened tone (as the era labels do).
    // --mc/--mink carry the marc's colour into the stylesheet so the spine, the ink and the :hover
    // shadow all live in CSS. Inline box-shadow would win over :hover and kill the hover feedback.
    const grad=`linear-gradient(to right,${mix(c,.28)},${mix(c,.13)})`;
    return `<div class="seg mov" data-blk="${b.key}" style="left:${left+1}px;width:${Math.max(w-2,2)}px;top:${rowTop}px;height:${MOV_BAR_H}px;background:${grad};--mc:${c};--mink:${shade(c,.55)};" title="${b.name} (${fmtY(b.start)}–${fmtY(b.end)})"><span class="segname">${b.name}</span><span class="segyears">${fmtY(b.start)}–${fmtY(b.end)}</span></div>`;
  }).join('');
  eraTracksEl.innerHTML=`<div class="segwrap" style="${maskCss}">${backboneEls}${blockEls}</div>`;

  // --- People (measure first so we know the content height) ---
  eventsRail.style.width=W+'px';
  const people=visiblePeople();
  const lanes=packLanes(people);
  const rowH=ROW_H;
  const peopleH=people.length?lanes*rowH+16:46;
  const contentH=barsTop()+peopleH+EVENT_YEAR_BAND;   // EVENT_YEAR_BAND = breathing room so event-year pills clear the lowest bar row

  // --- Events (name on top, full line, year pill at the foot; two rows to avoid name overlap) ---
  const evNameTop=eventLabelTop(), evYearTop=contentH-24;
  const evPlaced=EVENTS.map(ev=>({ev,left:x(ev.year),w:ev.name.length*7+16,m:ev._m})).sort((a,b)=>a.left-b.left);   // m: precomputed once at load (see metricOf near EVENTS)
  // --- Semantic zoom (Google-Maps style): importance = PRIORITY, local density = the real GATE ---
  // Allocate name-labels by descending importance into the 2 rows; whatever fits without colliding at
  // the current zoom keeps a full label, the rest fall back to a bare dot. Empty stretches keep even a
  // low-importance label (nothing to collide with); crowded stretches keep only the top ones. So
  // importance decides WHEN a name shows, never IF the event exists — zoom in and space opens for more.
  const LBL_GAP=12, FADE_PX=46, DOT_GAP=7;
  const rowIv=[[],[]];
  const fitsRow=(r,l,w)=>{for(const iv of rowIv[r]){if(!(l+w+LBL_GAP<iv.l||l>iv.r+LBL_GAP))return false;}return true;};
  const byImp=[...evPlaced].sort((a,b)=>b.m-a.m||a.left-b.left);
  // A searched/selected event is FORCED to keep its label at any zoom (explicit user intent beats the gate):
  // pre-place it in row 0 so everyone else yields around it, even if that means overlapping a neighbour.
  const forcedEv=state.selectedEvent?evPlaced.find(o=>o.ev.id===state.selectedEvent):null;
  if(forcedEv){const iv={l:forcedEv.left,r:forcedEv.left+forcedEv.w};rowIv[0].push(iv);forcedEv.row=0;forcedEv.iv=iv;forcedEv.labeled=true;}
  byImp.forEach(o=>{if(o.labeled)return;for(let r=0;r<2;r++){if(fitsRow(r,o.left,o.w)){const iv={l:o.left,r:o.left+o.w};rowIv[r].push(iv);o.row=r;o.iv=iv;o.labeled=true;break;}}});
  // Dot de-dup: a dot-only event is hidden if a higher-priority dot already sits within DOT_GAP px, so
  // dense stretches don't smear into a solid bar of dots. Labelled events always keep their dot.
  const dotX=byImp.filter(o=>o.labeled).map(o=>o.left);
  byImp.forEach(o=>{if(o.labeled){o.showDot=true;return;}if(dotX.some(dx=>Math.abs(dx-o.left)<DOT_GAP)){o.showDot=false;}else{o.showDot=true;dotX.push(o.left);}});
  // Organic fade: a label that only just fits comes in dim and brightens as zoom opens space around it.
  evPlaced.forEach(o=>{
    if(!o.labeled||o.ev.id===state.selectedEvent){o.op=1;return;}
    let gap=Infinity;
    for(const iv of rowIv[o.row]){if(iv===o.iv)continue;if(iv.r<=o.left)gap=Math.min(gap,o.left-iv.r);else if(iv.l>=o.left+o.w)gap=Math.min(gap,iv.l-(o.left+o.w));}
    o.op=gap===Infinity?1:Math.max(.45,Math.min(1,gap/FADE_PX));
  });
  eventsRail.innerHTML=state.showEvents?evPlaced.map(o=>{
    const ev=o.ev,left=o.left;
    ev._x=left;
    if(!o.labeled){
      if(!o.showDot)return '';
      return `<div class="event dotonly" style="left:${left}px"><div class="edot" data-ev="${ev.id}" title="${ev.name}" style="top:${evNameTop+18}px"></div></div>`;
    }
    const nameTop=evNameTop+o.row*16,dotTop=nameTop+18,lineTop=dotTop+3;
    const lineH=Math.max(evYearTop-lineTop-2,0);
    const foc=state.selectedEvent===ev.id?' focus':'';
    return `<div class="event${foc}" style="left:${left}px;opacity:${o.op.toFixed(2)}"><div class="ename" data-ev="${ev.id}" style="top:${nameTop}px">${ev.name}</div><div class="edot" style="top:${dotTop}px"></div><div class="eline" style="top:${lineTop}px;height:${lineH}px"></div><div class="eyear" style="top:${evYearTop}px">${fmtY(ev.year)}</div></div>`;
  }).join(''):'';

  // --- People bars ---
  barsLayer.style.top=barsTop()+'px';
  barsLayer.style.width=W+'px';
  if(people.length){
    barsLayer.innerHTML=people.map(p=>{
      const top=p._lane*rowH;
      const pillW=p._pillW, alive=p._alive;
      const col=barBg(p);
      const fade=alive?`<span class="fade" style="left:${pillW}px;width:${FUTURE_FADE}px;background:${col}"></span>`:'';   // future fade for the living
      return `<div class="bar${alive?' alive':''}${state.selected===p.id?' sel':''}" data-id="${p.id}" style="left:${p._startX}px;top:${top}px;width:${pillW}px;background:${col}">${fade}<span class="lbl">${p.name}</span><button class="menu" data-menu="${p.id}" title="Opcions">⋮</button></div>`;
    }).join('');
  }else{
    barsLayer.innerHTML=`<div class="emptyState" style="top:6px">Clica una col·lecció a l\u0027esquerra o cerca un personatge — o estudia només els períodes.</div>`;
  }
  inner.style.height=contentH+'px';

  // --- Today line ---
  nowline.style.left=nowX+'px';
  nowline.style.height=contentH+'px';
  nowline.querySelector('.lbl').textContent='avui · '+NOW_YEAR;

  // --- Axis ticks (step chosen so labels are ~>=70px apart) ---
  axisEl.style.width=W+'px';
  axisInner.style.width=W+'px';
  const STEPS=[1,2,5,10,25,50,100,250,500,1000,2000,5000,10000];
  let step=STEPS[STEPS.length-1];
  for(const st of STEPS){if(st*pxPerYear>=70){step=st;break;}}
  let ticks=`<div class="tick tinf" style="left:2px">∞···</div><div class="tick tbound" style="left:${x(DATA_MIN)}px">${fmtY(DATA_MIN)}</div>`;
  const firstTick=Math.ceil((DATA_MIN+step*0.4)/step)*step;
  for(let y=firstTick;y<=YEAR_MAX&&x(y)<=W;y+=step){ticks+=`<div class="tick" style="left:${x(y)}px">${fmtY(y)}</div>`;}   // stop at the px-capped canvas edge (W) as well as the year range, so high zoom can't push a tick past the canvas and inflate scrollWidth
  axisInner.innerHTML=ticks;
  guide.style.height=contentH+'px';
  if(parseFloat(guide.style.left||0)>W)hideGuide();   // a guide left over at an old (larger) zoom keeps the scrollable area inflated → runaway scroll + blank right side

  renderSidebar();
  renderLegend();
  scheduleSave();
}

// Category legend: derived from what is painted, never the other way round. Walks CAT_COLORS so the
// order stays stable as people come and go, and counts both colours of a two-category (striped) bar.
function renderLegend(){
  const present=PEOPLE.filter(p=>state.present.has(p.id));
  const live=new Set(present.flatMap(p=>hasCat(p)?p.cats:[]));
  const items=Object.keys(CAT_COLORS).filter(c=>live.has(c)).map(c=>[c,CAT_COLORS[c]]);
  if(present.some(p=>!hasCat(p)))items.push(['Sense categoria',NOCAT_COLOR]);   // the teal bars need a key too
  if(!items.length){legendEl.innerHTML='';return;}   // :empty hides the card entirely
  legendEl.innerHTML=items.map(([n,c])=>`<span class="lgi"><span class="swatch" style="background:${c}"></span>${n}</span>`).join('');
  // The axis is sticky-bottom inside .scroll, but whenever the canvas is shorter than the viewport
  // it falls back into normal flow partway up — so its position is variable and has to be measured,
  // not assumed from --axis-h, or the card ends up sitting on top of the year ticks.
  const sb=scroll.getBoundingClientRect().bottom,at=axisEl.getBoundingClientRect().top;
  legendEl.style.bottom=Math.max(12,Math.round(sb-at+10))+'px';
}

// Which movement/era a given year falls in (falls back to the macro-block, which has no gaps).
function eraLabel(year){
  const w=MARCS.find(m=>m.id==='west');
  const blk=w&&w.blocks.find(b=>year>=b.start&&year<b.end);   // Western movement, if any
  if(blk)return blk.name;
  const era=ERAS.find(e=>year>=e.start&&year<e.end);           // else the macro-era backbone
  return era?era.name:'—';
}

// ============================================================
// [7] SEARCH (add a person to the timeline by name)
// ============================================================
const q=$('#q'),results=$('#results');
const deaccent=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();   // case- & accent-insensitive
let searchIdx=-1, wdTerm='', wdResults=[], wdLoading=false, wdTimer=null, wdSeq=0;

const localRow=p=>{const added=state.present.has(p.id);return `<div class="row ${added?'disabled':''}" data-add="${p.id}"><span class="swatch" style="background:${swatchBg(p)}"></span>${p.name}<span class="yr">${added?'ja afegit':p.birth+'\u2013'+(p.death==null?'':p.death)}</span></div>`;};
const wdRow=w=>`<div class="row" data-wd="${w.qid}"><span class="swatch" style="background:${NOCAT_COLOR}"></span>${w.name}<span class="yr">${w.birth}${w.death!=null?'\u2013'+w.death:'\u2013'}</span></div>`;
const evSearchRow=ev=>`<div class="row evrow" data-evsearch="${ev.id}"><span class="swatch" style="background:var(--eventc)"></span>${ev.name}<span class="yr">${fmtY(ev.year)}</span></div>`;
function renderDropdown(){
  const term=deaccent(q.value.trim());
  if(!term){results.classList.remove('open');return;}
  const local=PEOPLE.filter(p=>deaccent(p.name).includes(term));
  const localEv=EVENTS.filter(ev=>deaccent(ev.name).includes(term));
  let html=local.map(localRow).join('');
  if(localEv.length)html+=`<div class="rowsep">Esdeveniments</div>`+localEv.map(evSearchRow).join('');
  if((wdResults.length||wdLoading)&&(local.length||localEv.length))html+=`<div class="rowsep">Wikidata</div>`;
  html+=wdResults.map(wdRow).join('');
  if(wdLoading)html+=`<div class="row loading">Cercant a Wikidata\u2026</div>`;
  if(!local.length&&!localEv.length&&!wdResults.length&&!wdLoading)html=`<div class="row disabled">Cap coincid\u00e8ncia</div>`;
  results.innerHTML=html;results.classList.add('open');highlightSearch(0);
}
function runSearch(){
  const term=q.value.trim();
  if(!term){results.classList.remove('open');return;}
  if(deaccent(term)!==wdTerm){wdTerm=deaccent(term);wdResults=[];wdLoading=term.length>=2;scheduleWikidata(term);}
  renderDropdown();
}
// keyboard navigation over both local and Wikidata rows
const searchRows=()=>[...results.querySelectorAll('.row[data-add]:not(.disabled),.row[data-evsearch],.row[data-wd]')];
function highlightSearch(i){
  const rows=searchRows();
  results.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  if(!rows.length){searchIdx=-1;return;}
  searchIdx=(i+rows.length)%rows.length;
  rows[searchIdx].classList.add('active');
  rows[searchIdx].scrollIntoView({block:'nearest'});
}
function activateRow(r){if(!r)return;if(r.dataset.add)addFromSearch(r.dataset.add);else if(r.dataset.evsearch)focusEvent(r.dataset.evsearch);else if(r.dataset.wd)addWikidataPerson(r.dataset.wd);}
function addFromSearch(id){
  if(!id||state.present.has(id))return;
  state.selectedEvent=null;state.pinned.add(id);q.value='';results.classList.remove('open');wdTerm='';wdResults=[];render();revealPerson(id);
}
// Wikidata person -> session-only entry in PEOPLE (no category; lost on reload)
function addWikidataPerson(qid){
  const w=wdResults.find(x=>x.qid===qid);if(!w||w.birth==null)return;
  const id='wd_'+qid;
  if(!PEOPLE.some(p=>p.id===id))PEOPLE.push({id,wd:qid,name:w.name,birth:w.birth,death:w.death,cats:guessCats(w.desc),gender:'',wiki:w.article,desc:w.desc||'',_session:true});
  addFromSearch(id);
}

// --- Wikidata live search: humans only (P31=Q5), Catalan labels with es/en fallback ---
const wdYear=iso=>{const m=/^(-?\d+)/.exec(iso);if(!m)return null;const y=parseInt(m[1],10);return y<=0?y-1:y;};   // ISO astronomical -> our aC convention
const WDQ='https://query.wikidata.org/sparql?format=json&query=';
const WD_FIELDS='OPTIONAL { ?item wdt:P569 ?birth. } OPTIONAL { ?item wdt:P570 ?death. } OPTIONAL { ?article schema:about ?item ; schema:isPartOf <https://ca.wikipedia.org/> . } SERVICE wikibase:label { bd:serviceParam wikibase:language "ca,es,en". }';
function scheduleWikidata(term){clearTimeout(wdTimer);if(term.trim().length<2)return;wdTimer=setTimeout(()=>fetchWikidata(term.trim()),300);}
function wdParse(data){
  const binds=(data&&data.results&&data.results.bindings)||[], seen=new Set(), inDB=new Set(PEOPLE.map(p=>p.wd).filter(Boolean)), out=[];
  for(const b of binds){
    const qid=b.item.value.split('/').pop();
    if(seen.has(qid)||inDB.has(qid)||!b.birth)continue;   // dedup vs DB; need a birth year to place it
    seen.add(qid);
    out.push({qid,name:(b.itemLabel&&b.itemLabel.value)||qid,desc:(b.itemDescription&&b.itemDescription.value)||'',birth:wdYear(b.birth.value),death:b.death?wdYear(b.death.value):null,article:(b.article&&b.article.value)||('https://www.wikidata.org/wiki/'+qid)});
  }
  return out;
}
// resolve a list of Q-ids to {name,dates,article} via a fast VALUES query (optionally keep only humans)
function byIds(ids,humansOnly){
  if(!ids.length)return Promise.resolve([]);
  const query=`SELECT ?item ?itemLabel ?itemDescription ?birth ?death ?article WHERE { VALUES ?item { ${ids.map(q=>'wd:'+q).join(' ')} } ${humansOnly?'?item wdt:P31 wd:Q5.':''} ${WD_FIELDS} }`;
  return fetch(WDQ+encodeURIComponent(query),{headers:{Accept:'application/sparql-results+json'}}).then(r=>r.json()).then(data=>{
    const byq={};wdParse(data).forEach(x=>byq[x.qid]=x);
    return ids.map(q=>byq[q]).filter(Boolean);   // preserve the search-relevance order
  }).catch(()=>[]);
}
// primary: fast label/alias autocomplete (great ranking), then keep only humans
function entitySearch(term){
  const url='https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=15&language=ca&uselang=ca&search='+encodeURIComponent(term);
  return fetch(url).then(r=>r.json()).then(d=>byIds(((d.search||[]).map(x=>x.id).filter(t=>/^Q\d+$/.test(t))),true)).catch(()=>[]);
}
// fallback: full-text search (finds people by surname / mid-name that the autocomplete buries under common words)
function fulltextSearch(term){
  const safe=term.replace(/[^\p{L}\p{N} ]/gu,'').trim();if(!safe)return Promise.resolve([]);
  const url='https://www.wikidata.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=0&srlimit=10&srsearch='+encodeURIComponent(safe+'* haswbstatement:P31=Q5');
  return fetch(url).then(r=>r.json()).then(d=>byIds((((d.query&&d.query.search)||[]).map(x=>x.title).filter(t=>/^Q\d+$/.test(t))),false)).catch(()=>[]);
}
function fetchWikidata(term){
  const seq=++wdSeq;
  entitySearch(term).then(out=>{
    if(seq!==wdSeq)return;   // a newer search superseded this one
    if(out.length){wdResults=out;wdLoading=false;renderDropdown();return;}
    fulltextSearch(term).then(out2=>{if(seq!==wdSeq)return;wdResults=out2;wdLoading=false;renderDropdown();});
  });
}

q.addEventListener('input',runSearch);
q.addEventListener('focus',runSearch);
q.addEventListener('keydown',e=>{
  if(!results.classList.contains('open'))return;
  if(e.key==='ArrowDown'){e.preventDefault();highlightSearch(searchIdx+1);}
  else if(e.key==='ArrowUp'){e.preventDefault();highlightSearch(searchIdx-1);}
  else if(e.key==='Enter'){e.preventDefault();activateRow(searchRows()[searchIdx]);}

});

// ============================================================
// [9] ZOOM & PAN
// ============================================================
function fitPx(){const vw=scroll.clientWidth-24;return Math.max(0.005,vw/(YEAR_MAX-YEAR_MIN));}          // zoom that fits the whole span
const FOCUS_FROM=1500;
const FUTURE_MARGIN_PX=240;   // fixed px reserved past "today" so grown living-pills + fade never hug/clip the right edge
function focusPx(){const vw=Math.max(60,scroll.clientWidth-24-FUTURE_MARGIN_PX);return Math.max(fitPx(),Math.min(20,vw/(NOW_YEAR-FOCUS_FROM)));}   // default focus ~1500→today, with future margin
function defaultView(){pxPerYear=focusPx();render();scroll.scrollLeft=Math.min(Math.max(0,x(FOCUS_FROM)-16),maxScroll());}   // clamp: the focus target can sit past the canvas end and leave a sliver of blank on the right
function setZoom(v){pxPerYear=Math.max(fitPx(),Math.min(20,v));render();clampScroll();}
// Max scroll is measured against OUR canvas width, not scrollWidth: any stray absolutely-positioned
// leftover (a hover guide parked at an old zoom, an overflowing label) inflates scrollWidth and would
// hand back a bogus, far too large limit ��� which is exactly how the runaway scroll happened.
function maxScroll(){return Math.max(0,(parseFloat(inner.style.width)||scroll.scrollWidth)-scroll.clientWidth);}
function clampScroll(){const max=maxScroll();if(scroll.scrollLeft>max)scroll.scrollLeft=max;}   // keep scrollLeft in range so zooming out doesn't leave it parked past the end
// Pan (no zoom change) so a person's bar is centred on screen.
function panToPerson(id){
  const p=PEOPLE.find(x=>x.id===id);
  if(!p||p._startX==null)return;
  const cx=p._startX+p._pillW/2;            // horizontal centre of the bar
  const cy=barsTop()+p._lane*34+13;         // vertical centre (rowH 34, bar 26 → +13)
  scroll.scrollTo({left:cx-scroll.clientWidth/2,top:cy-scroll.clientHeight/2,behavior:'smooth'});
}
// Flash a bar so it's easy to spot among others.
function flashBar(id){
  const b=barsLayer.querySelector(`.bar[data-id="${id}"]`);
  if(b){b.classList.remove('justAdded');void b.offsetWidth;b.classList.add('justAdded');setTimeout(()=>b.classList.remove('justAdded'),4100);}
}
function revealPerson(id){panToPerson(id);flashBar(id);}
// --- Event equivalents of pan/flash/reveal (same effect + marking as people; scroll only, no zoom) ---
function panToEvent(id){
  const e=EVENTS.find(ev=>ev.id===id);if(!e||e._x==null)return;
  scroll.scrollTo({left:e._x-scroll.clientWidth/2,top:0,behavior:'smooth'});
}
function flashEvent(id){
  const node=eventsRail.querySelector(`.ename[data-ev="${id}"],.edot[data-ev="${id}"]`);
  const box=node&&node.closest('.event');
  if(box){box.classList.remove('evPop');void box.offsetWidth;box.classList.add('evPop');setTimeout(()=>box.classList.remove('evPop'),4100);}
}
function revealEvent(id){panToEvent(id);requestAnimationFrame(()=>flashEvent(id));}
// A DB event chosen from the search box: turn the layer on, mark it, force-paint it, then locate + flash.
function focusEvent(id){
  if(!EVENTS.some(ev=>ev.id===id))return;
  state.showEvents=true;state.selectedEvent=id;
  q.value='';results.classList.remove('open');wdTerm='';wdResults=[];
  render();revealEvent(id);
}

// Remove a person from the canvas (same as the × in "A la vista"). Seed-pinned people can't be removed.
function removePerson(id){
  if(SEED_PINNED.includes(id))return;
  state.pinned.delete(id);
  recomputePresent();closeDetailIfGone();render();
}
// "Show context": add every DB person whose life overlaps, or is within 20 years of, this person.
function showContext(id){
  const t=PEOPLE.find(p=>p.id===id);if(!t)return;
  const a1=t.birth,a2=deathOf(t);
  PEOPLE.forEach(o=>{
    if(o.id===id||state.present.has(o.id))return;
    const gap=Math.max(0,Math.max(o.birth-a2,a1-deathOf(o)));   // 0 if the lifespans overlap
    if(gap<=20)state.pinned.add(o.id);
  });
  recomputePresent();render();panToPerson(id);
}

// Little ⋮ menu anchored to a bar (or opened from the detail panel).
const barmenu=$('#barmenu');
function openBarMenu(id,anchorEl){
  const rm=SEED_PINNED.includes(id)?'':`<button class="danger" data-act="remove" data-id="${id}">Elimina</button>`;
  // "Veure detall" first: zoomed far out a bar can shrink to just its ⋮ button, leaving no pill left
  // to click, so the menu has to offer the same thing clicking the bar would.
  barmenu.innerHTML=`<button data-act="detail" data-id="${id}">Veure detall</button><button data-act="context" data-id="${id}">Mostra context</button><button data-act="report" data-id="${id}">Reportar error</button>${rm}`;
  const r=anchorEl.getBoundingClientRect();
  barmenu.style.left=Math.min(r.left,window.innerWidth-170)+'px';
  barmenu.style.top=(r.bottom+4)+'px';
  barmenu.classList.add('open');
}
function closeBarMenu(){barmenu.classList.remove('open');}
barmenu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
  if(act==='remove')removePerson(id);
  else if(act==='detail'){const p=PEOPLE.find(x=>x.id===id);if(p)openDetail(p);}
  else if(act==='report')WIP();
  else showContext(id);
  closeBarMenu();
});
$('#collections').addEventListener('click',e=>{
  if(e.target.closest('[data-newcol]')){WIP();return;}
  const b=e.target.closest('[data-col]');if(b)toggleCollection(b.getAttribute('data-col'));
});
// A collection is a list of Q-ids: resolve each against the local DB first, fetch the rest from
// Wikidata (byIds already drops anything we hold locally), then frame the view around the result —
// without it "Els meus filòsofs" would land off-screen, since the default view starts at 1500.
async function toggleCollection(cid){
  const c=COLLECTIONS.find(x=>x.id===cid);if(!c)return;
  if(state.collections.has(cid)){                  // same button takes it away again
    state.collections.delete(cid);
    const stillWanted=new Set([...state.collections].flatMap(id=>(COLLECTIONS.find(x=>x.id===id)||{wds:[]}).wds));
    c.wds.forEach(q=>{
      if(stillWanted.has(q))return;                // someone another active collection also holds
      const p=PEOPLE.find(x=>x.wd===q);
      if(p&&!SEED_PINNED.includes(p.id))state.pinned.delete(p.id);
    });
    recomputePresent();closeDetailIfGone();render();return;
  }
  state.collections.add(cid);
  const local=new Map(PEOPLE.filter(p=>p.wd).map(p=>[p.wd,p]));
  c.wds.forEach(q=>{const p=local.get(q);if(p)state.pinned.add(p.id);});
  const missing=c.wds.filter(q=>!local.has(q));
  recomputePresent();render();
  if(missing.length){
    showToast(`${c.name}: carregant ${missing.length} de Wikidata…`);
    const got=await byIds(missing,true);
    got.forEach(w=>{
      if(w.birth==null)return;                       // no birth year → nowhere to place the bar
      const id='wd_'+w.qid;
      if(!PEOPLE.some(p=>p.id===id))PEOPLE.push({id,wd:w.qid,name:w.name,birth:w.birth,death:w.death,cats:guessCats(w.desc),gender:'',wiki:w.article,desc:w.desc||'',_session:true});
      state.pinned.add(id);
    });
    recomputePresent();
    const lost=missing.length-got.filter(w=>w.birth!=null).length;
    showToast(lost?`${c.name} · ${lost} no s'han pogut carregar`:c.name);
  }
  render();   // deliberately no zoom change: a collection snapping the zoom was jarring — that's what "Veure tot" is for
}
// Zoom + pan so everyone currently on the canvas fits.
// The sidebar OVERLAYS the stage rather than shrinking it, so the leftmost strip of the canvas is
// hidden: fitting against the full clientWidth would park the oldest person behind the sidebar
// (exactly what happened with Sòcrates). Measure the occluded strip and start the content after it.
function fitToPresent(){
  const pp=PEOPLE.filter(p=>state.present.has(p.id)&&!SEED_PINNED.includes(p.id));
  if(!pp.length)return;                            // only the always-pinned ones → nothing you chose to frame, so don't move
  const y1=Math.min(...pp.map(p=>p.birth)), y2=Math.max(...pp.map(p=>deathOf(p)));
  const pad=Math.max(10,(y2-y1)*0.06);
  const blind=Math.max(0,$('.sidebar').getBoundingClientRect().right-scroll.getBoundingClientRect().left);
  setZoom(Math.max(60,scroll.clientWidth-blind-24)/((y2-y1)+2*pad));
  scroll.scrollLeft=Math.min(Math.max(0,x(y1-pad)-blind),maxScroll());
}
// Zoom keeping the year under the pointer fixed.
function zoomAt(clientX,factor){clearFitLatch();
  const rect=scroll.getBoundingClientRect();
  const pointerInner=(clientX-rect.left)+scroll.scrollLeft;
  const yearAt=YEAR_MIN+pointerInner/pxPerYear;
  setZoom(pxPerYear*factor);
  const newInner=(yearAt-YEAR_MIN)*pxPerYear;
  scroll.scrollLeft=Math.min(Math.max(0,newInner-(clientX-rect.left)),maxScroll());   // must be clamped: during a fast pinch this lands against not-yet-reflowed layout and an out-of-range value sticks, parking the view past the end of the canvas (blank right side, endless-feeling scroll)
}
$('#zoomIn').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1.4);};
$('#zoomOut').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1/1.4);};
// "Veure tot": botó de doble estat. 1r clic → zoom out per encabir tot el visible i queda marcat;
// 2n clic → desfà el zoom out i torna a la vista anterior.
let fitPrev=null;
function fitLatch(on){$('#fitAll').classList.toggle('on',on);}
function clearFitLatch(){fitPrev=null;fitLatch(false);}
$('#fitAll').onclick=()=>{
  if(fitPrev){pxPerYear=Math.max(fitPx(),Math.min(20,fitPrev.px));render();scroll.scrollLeft=Math.min(Math.max(0,fitPrev.left),maxScroll());clearFitLatch();return;}
  const before={px:pxPerYear,left:scroll.scrollLeft};
  fitToPresent();
  if(pxPerYear!==before.px||scroll.scrollLeft!==before.left){fitPrev=before;fitLatch(true);}   // only latch if it actually moved
};
$('#reset').onclick=()=>{state.present=new Set();state.pinned=new Set(SEED_PINNED);state.collections=new Set();state.marcs=new Set(DEFAULT_MARCS);state.showEvents=true;state.selected=null;state.selectedEvent=null;$('#detail').classList.remove('open');clearFitLatch();defaultView();};
$('#sidebarToggle').onclick=e=>{
  const collapsed=$('.body').classList.toggle('collapsed');
  e.currentTarget.textContent=collapsed?'›':'‹';
  e.currentTarget.title=collapsed?'Mostra la barra lateral':'Amaga la barra lateral';
};

// Trackpad pinch / ⌘+wheel → zoom. (Chrome/Firefox deliver pinch as ctrl+wheel.)
// Bound to the document, not to #scroll: the sidebar overlays the canvas and the topbar sits above it,
// so a pinch with the cursor over either would otherwise escape us and become a browser page zoom.
document.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.01);
  const r=scroll.getBoundingClientRect();
  const inCanvas=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  zoomAt(inCanvas?e.clientX:r.left+scroll.clientWidth/2,factor);   // pinch outside the canvas → zoom about its centre
},{passive:false});

// Touch pinch zoom (mobile). Two fingers → zoom around their midpoint.
// Absolute, not incremental: the gesture pins one year under the fingers and scales from the
// zoom it started at. Incremental factors (dist/prevDist, compounding) drifted and stuck for
// good once a frame hit the fitPx()/20 clamp, because the clamped value became the next baseline.
// The work is also deferred to one rAF per frame — a full render() straight inside touchmove was
// what made it stutter, since touchmove fires far faster than we can rebuild the canvas.
let pinch=null,pinchRAF=0;
const tMid=t=>(t[0].clientX+t[1].clientX)/2;
const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==2){endPinch();return;}
  e.preventDefault();
  const rect=scroll.getBoundingClientRect(),mx=tMid(e.touches);
  pinch={dist0:Math.max(tDist(e.touches),1),px0:pxPerYear,mx,scale:1,
         year:YEAR_MIN+((mx-rect.left)+scroll.scrollLeft)/pxPerYear};   // the year under the fingers, held there for the whole gesture
},{passive:false});
scroll.addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;
  e.preventDefault();
  pinch.mx=tMid(e.touches);                 // re-read the midpoint: fingers drift, and a stale one drags the anchor toward the centre
  pinch.scale=tDist(e.touches)/pinch.dist0;
  if(!pinchRAF)pinchRAF=requestAnimationFrame(applyPinch);
},{passive:false});
function applyPinch(){clearFitLatch();
  pinchRAF=0;
  if(!pinch)return;
  setZoom(pinch.px0*pinch.scale);
  const rect=scroll.getBoundingClientRect();
  scroll.scrollLeft=Math.min(Math.max(0,(pinch.year-YEAR_MIN)*pxPerYear-(pinch.mx-rect.left)),maxScroll());
}
function endPinch(){pinch=null;if(pinchRAF){cancelAnimationFrame(pinchRAF);pinchRAF=0;}}
scroll.addEventListener('touchend',endPinch);
scroll.addEventListener('touchcancel',endPinch);

// Hover guide (vertical year line). Suppressed while dragging.
scroll.addEventListener('mousemove',e=>{
  if(drag)return;
  const rect=inner.getBoundingClientRect();
  const offX=e.clientX-rect.left;
  if(offX<0||offX>totalW()){hideGuide();return;}
  const year=Math.round(YEAR_MIN+offX/pxPerYear);
  guide.style.display='block';
  guide.style.left=offX+'px';
  guide.querySelector('.yr').textContent=year;
});
function hideGuide(){guide.style.display='none';guide.style.left='0px';}   // reset left too: a stale far-right offset keeps inflating the scrollable area after a zoom-out
scroll.addEventListener('mouseleave',hideGuide);

// Click-and-drag panning. Not started over a person bar (there, click = open detail).
let drag=null,suppressClick=false;
scroll.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.bar'))return;
  hideGuide();
  drag={x:e.clientX,y:e.clientY,sl:scroll.scrollLeft,st:scroll.scrollTop,moved:false};
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;scroll.classList.add('grabbing');hideGuide();}
  if(drag.moved){scroll.scrollLeft=drag.sl-dx;scroll.scrollTop=drag.st-dy;e.preventDefault();}
});
window.addEventListener('mouseup',()=>{
  if(!drag)return;
  const moved=drag.moved;drag=null;scroll.classList.remove('grabbing');
  if(moved){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}   // swallow the click that follows a real drag
});

// ============================================================
// [10] BOOT (wait for a real width before the first fit)
// ============================================================
function bootDefault(){if(scroll.clientWidth>0){applyMetrics();if(restoredView){pxPerYear=Math.max(fitPx(),Math.min(20,restoredView.px));render();scroll.scrollLeft=Math.min(Math.max(0,restoredView.left||0),maxScroll());}else{defaultView();}lsReady=true;saveNow();}else{requestAnimationFrame(bootDefault);}}   // re-measure here too: at parse time the viewport height can still be 0 (or mid-settle behind Safari's URL bar), which would lock in the wrong metrics
restoreState();
bootDefault();
window.addEventListener('resize',()=>{applyMetrics();setZoom(pxPerYear);});   // rotating the phone flips the compact threshold, so the geometry has to be recomputed before the redraw

// Portrait wall: show overlay on touch devices held in portrait mode.
const portraitWall=document.getElementById('portraitWall');
function checkPortrait(){
  const isTouch=window.matchMedia('(pointer:coarse)').matches;
  const isPortrait=window.innerWidth<window.innerHeight;
  portraitWall.classList.toggle('on',isTouch&&isPortrait);
}
window.addEventListener('resize',checkPortrait);
checkPortrait();

// Sidebar: collapse by default on narrow screens (phone / small tablet in landscape).
if(window.innerWidth<900){$('.body').classList.add('collapsed');$('#sidebarToggle').textContent='›';}   // re-clamp: a wider window raises the minimum zoom, so plain render() would leave the canvas narrower than the viewport
</script>
</body>
</html>
