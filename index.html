// ============================================================
// [9] ZOOM & PAN
// ============================================================
function fitPx(){const vw=scroll.clientWidth-24;return Math.max(0.005,vw/(YEAR_MAX-YEAR_MIN));}          // zoom that fits the whole span
const FOCUS_FROM=window.matchMedia('(pointer:coarse)').matches?1760:1500;   // phones: start more zoomed-in (fewer years across the smaller screen)
const FUTURE_MARGIN_PX=240;   // fixed px reserved past "today" so grown living-pills + fade never hug/clip the right edge
function focusPx(){const vw=Math.max(60,scroll.clientWidth-24-FUTURE_MARGIN_PX);return Math.max(fitPx(),Math.min(20,vw/(NOW_YEAR-FOCUS_FROM)));}   // default focus ~1500→today, with future margin
function defaultView(){pxPerYear=focusPx();render();scroll.scrollLeft=Math.min(Math.max(0,x(FOCUS_FROM)-16),maxScroll());}   // clamp: the focus target can sit past the canvas end and leave a sliver of blank on the right
function setZoom(v){pxPerYear=Math.max(fitPx(),Math.min(20,v));render();clampScroll();}
// Max scroll is measured against OUR canvas width, not scrollWidth: any stray absolutely-positioned
// leftover (a hover guide parked at an old zoom, an overflowing label) inflates scrollWidth and would
// hand back a bogus, far too large limit — which is exactly how the runaway scroll happened.
function maxScroll(){return Math.max(0,(parseFloat(inner.style.width)||scroll.scrollWidth)-scroll.clientWidth);}
function clampScroll(){const max=maxScroll();if(scroll.scrollLeft>max)scroll.scrollLeft=max;}   // keep scrollLeft in range so zooming out doesn't leave it parked past the end
// Pan (no zoom change) so a person's bar is centred on screen.
function panToPerson(id){
  const p=PEOPLE.find(x=>x.id===id);
  if(!p||p._startX==null)return;
  const cx=p._startX+p._pillW/2;            // horizontal centre of the bar
  const cy=barsTop()+p._lane*34+13;         // vertical centre (rowH 34, bar 26 → +13)
  scroll.scrollTo({left:cx-scroll.clientWidth/2,top:cy-scroll.clientHeight/2,behavior:'smooth'});
}
// Flash a bar so it's easy to spot among others.
function flashBar(id){
  const b=barsLayer.querySelector(`.bar[data-id="${id}"]`);
  if(b){b.classList.remove('justAdded');void b.offsetWidth;b.classList.add('justAdded');setTimeout(()=>b.classList.remove('justAdded'),4100);}
}
function revealPerson(id){panToPerson(id);flashBar(id);}
// --- Event equivalents of pan/flash/reveal (same effect + marking as people; scroll only, no zoom) ---
function panToEvent(id){
  const e=EVENTS.find(ev=>ev.id===id);if(!e||e._x==null)return;
  scroll.scrollTo({left:e._x-scroll.clientWidth/2,top:0,behavior:'smooth'});
}
function flashEvent(id){
  const node=eventsRail.querySelector(`.ename[data-ev="${id}"],.edot[data-ev="${id}"]`);
  const box=node&&node.closest('.event');
  if(box){box.classList.remove('evPop');void box.offsetWidth;box.classList.add('evPop');setTimeout(()=>box.classList.remove('evPop'),4100);}
}
function revealEvent(id){panToEvent(id);requestAnimationFrame(()=>flashEvent(id));}
// A DB event chosen from the search box: turn the layer on, mark it, force-paint it, then locate + flash.
function focusEvent(id){
  if(!EVENTS.some(ev=>ev.id===id))return;
  state.showEvents=true;state.selectedEvent=id;
  q.value='';results.classList.remove('open');wdTerm='';wdResults=[];
  render();revealEvent(id);
}

// Remove a person from the canvas (same as the × in "A la vista"). Seed-pinned people can't be removed.
function removePerson(id){
  if(SEED_PINNED.includes(id))return;
  state.pinned.delete(id);
  clearFitLatch();
  if(state.focus===id)state.focus=null;   // si treus l'original, ja no hi ha focus fixat a dalt
  recomputePresent();closeDetailIfGone();
  if(PERSON_QID&&id==='wd_'+PERSON_QID){history.replaceState(null,'',location.pathname);pbar.textContent='';pbar.classList.remove('on');delete pbar.dataset.state;}
  scheduleSave();render();
}
// "Show context": add every SEED-DB person whose life overlaps, or is within 20 years of, this person.
// DETERMINISTA: recorre només la BD original (salta els `_session` baixats de Wikidata/localStorage),
// així "Mostra context" dóna el mateix resultat per a tothom, independentment de l'historial de cerques.
// El dataset canònic el controla l'autor editant la llista PEOPLE; qui vulgui més gent l'afegeix a mà.
function showContext(id){
  const t=PEOPLE.find(p=>p.id===id);if(!t)return;
  hideDetail();   // tanca el panell de detall perquè es vegi el context que s'afegeix (mòbil i desktop)
  state.focus=id;   // l'original queda fixat al carril de dalt; els personatges de context, a sota
  const a1=t.birth,a2=deathOf(t);
  PEOPLE.forEach(o=>{
    if(o._session)return;                          // ← només BD original, mai el que s'hagi baixat en local
    if(o.id===id||state.present.has(o.id))return;
    const gap=Math.max(0,Math.max(o.birth-a2,a1-deathOf(o)));   // 0 if the lifespans overlap
    if(gap<=20)state.pinned.add(o.id);
  });
  clearFitLatch();
  recomputePresent();render();panToPerson(id);
}

// Little ⋮ menu anchored to a bar (or opened from the detail panel).
const barmenu=$('#barmenu');
function openBarMenu(id,anchorEl){
  const rm=SEED_PINNED.includes(id)?'':`<button class="danger" data-act="remove" data-id="${id}">Esborra</button>`;
  // "Veure detall" first: zoomed far out a bar can shrink to just its ⋮ button, leaving no pill left
  // to click, so the menu has to offer the same thing clicking the bar would.
  barmenu.innerHTML=`<button data-act="detail" data-id="${id}">Veure detall</button><button data-act="context" data-id="${id}">Mostra context</button><button data-act="report" data-id="${id}">Reportar error</button>${rm}`;
  const r=anchorEl.getBoundingClientRect();
  barmenu.style.left=Math.min(r.left,window.innerWidth-170)+'px';
  barmenu.style.top=(r.bottom+4)+'px';
  barmenu.classList.add('open');
}
function closeBarMenu(){barmenu.classList.remove('open');}
barmenu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
  if(act==='remove')removePerson(id);
  else if(act==='detail'){const p=PEOPLE.find(x=>x.id===id);if(p)openDetail(p);}
  else if(act==='report')WIP();
  else showContext(id);
  closeBarMenu();
});

  const b=e.target.closest('[data-col]');if(b)toggleCollection(b.getAttribute('data-col'));
});
// A collection is a list of Q-ids: resolve each against the local DB first, fetch the rest from
// Wikidata (byIds already drops anything we hold locally), then frame the view around the result —
// without it "Els meus filòsofs" would land off-screen, since the default view starts at 1500.
let collLoads=0, collSpinTimer=null;
// Spinner centrat sobre el canvas mentre carreguen membres remots d'una col·lecció.
// Llindar curt perquè les càrregues ràpides/en cau no facin flash, i comptador perquè
// diverses càrregues simultànies comparteixin un sol overlay que només marxa quan totes acaben.
function beginCollLoading(){
  collLoads++;
  if(collLoads===1 && !collSpinTimer){
    collSpinTimer=setTimeout(()=>{collSpinTimer=null; if(collLoads>0){collOverlay.classList.add('on');}},250);
  }
  return function endCollLoading(){
    collLoads=Math.max(0,collLoads-1);
    if(collLoads===0){
      if(collSpinTimer){clearTimeout(collSpinTimer);collSpinTimer=null;}
      collOverlay.classList.remove('on');
    }
  };
}
const COLL_TTL=30*24*3600*1000;   // 30 dies: passat aquest temps una persona del cau es refresca de Wikidata en segon pla
// Refresca en segon pla (sense spinner ni bloqueig) les persones de sessió caducades. Sense xarxa,
// es conserva silenciosament la còpia vella: millor una dada caducada que cap.
function refreshStale(qids){
  if(!qids||!qids.length)return;
  byIds(qids,true,true).then(list=>{
    let changed=false;
    list.forEach(w=>{
      if(w.birth==null)return;
      const p=PEOPLE.find(x=>x.wd===w.qid);if(!p)return;
      p.name=w.name;p.birth=w.birth;p.death=w.death;p.wiki=w.article;p.desc=w.desc||p.desc;p.cats=guessCats(w.desc);p._ts=Date.now();changed=true;
    });
    if(changed){recomputePresent();render();scheduleSave();}
  }).catch(()=>{});
}
async function toggleCollection(cid){
  const c=COLLECTIONS.find(x=>x.id===cid);if(!c)return;
  if(state.collections.has(cid)){                  // same button takes it away again
    state.collections.delete(cid);
    const stillWanted=new Set([...state.collections].flatMap(id=>(COLLECTIONS.find(x=>x.id===id)||{wds:[]}).wds));
    c.wds.forEach(q=>{
      if(stillWanted.has(q))return;                // someone another active collection also holds
      const p=PEOPLE.find(x=>x.wd===q);
      if(p&&!SEED_PINNED.includes(p.id))state.pinned.delete(p.id);
    });
    recomputePresent();closeDetailIfGone();clearFitLatch();render();return;
  }
  state.collections.add(cid);
  const local=new Map(PEOPLE.filter(p=>p.wd).map(p=>[p.wd,p]));
  const localIds=c.wds.map(q=>local.get(q)).filter(Boolean).map(p=>p.id);
  const missing=c.wds.filter(q=>!local.has(q));
  const stale=c.wds.filter(q=>{const p=local.get(q);return p&&p._session&&(!p._ts||Date.now()-p._ts>COLL_TTL);});   // membres del cau caducats → refresc silenciós
  if(!missing.length){                             // tot és local → mostrar-ho de cop, sense spinner
    localIds.forEach(id=>state.pinned.add(id));
    clearFitLatch();
    recomputePresent();render();
    refreshStale(stale);                           // en segon pla, sense bloquejar l'aparició instantània
    return;
  }
  render();                                         // marca el botó com a actiu ja; els membres apareixen junts quan estigui tot
  const endLoading=beginCollLoading();             // spinner sobre el canvas (després d'un llindar curt)
  let got=null, failed=false;
  try{got=await byIds(missing,true);}
  catch(e){failed=true;}
  finally{endLoading();}
  if(!state.collections.has(cid))return;           // desactivada (o canviada) mentre carregava → descarta el resultat zombie
  localIds.forEach(id=>state.pinned.add(id));       // revela els locals ara — també és el fallback si la petició falla
  if(failed){recomputePresent();clearFitLatch();render();showToast(`${c.name} · no s'ha pogut connectar a Wikidata`);return;}
  got.forEach(w=>{
    if(w.birth==null)return;                        // no birth year → nowhere to place the bar
    const id='wd_'+w.qid;
    if(!PEOPLE.some(p=>p.id===id))PEOPLE.push({id,wd:w.qid,name:w.name,birth:w.birth,death:w.death,cats:guessCats(w.desc),gender:'',wiki:w.article,desc:w.desc||'',_session:true,_ts:Date.now()});
    state.pinned.add(id);
  });
  recomputePresent();
  clearFitLatch();
  const lost=missing.length-got.filter(w=>w.birth!=null).length;
  render();                                         // revela tothom de cop (s'acaba el pop-in de 2 fases)
  showToast(lost?`${c.name} · ${lost} no s'han pogut carregar`:c.name);
  refreshStale(stale);                             // refresca també, en segon pla, els caducats que ja teníem
}
// Zoom + pan so everyone currently on the canvas fits.
// The sidebar OVERLAYS the stage rather than shrinking it, so the leftmost strip of the canvas is
// hidden: fitting against the full clientWidth would park the oldest person behind the sidebar
// (exactly what happened with Sòcrates). Measure the occluded strip and start the content after it.
function fitToPresent(){
  const pp=PEOPLE.filter(p=>state.present.has(p.id)&&!SEED_PINNED.includes(p.id));
  if(!pp.length)return;                            // only the always-pinned ones → nothing you chose to frame, so don't move
  const y1=Math.min(...pp.map(p=>p.birth)), y2=Math.max(...pp.map(p=>deathOf(p)));
  const pad=Math.max(10,(y2-y1)*0.06);
  setZoom(Math.max(60,scroll.clientWidth-24)/((y2-y1)+2*pad));
  scroll.scrollLeft=Math.min(Math.max(0,x(y1-pad)),maxScroll());
}
// Zoom keeping the year under the pointer fixed.
function zoomAt(clientX,factor){clearFitLatch();
  const rect=scroll.getBoundingClientRect();
  const pointerInner=(clientX-rect.left)+scroll.scrollLeft;
  const yearAt=YEAR_MIN+pointerInner/pxPerYear;
  setZoom(pxPerYear*factor);
  const newInner=(yearAt-YEAR_MIN)*pxPerYear;
  scroll.scrollLeft=Math.min(Math.max(0,newInner-(clientX-rect.left)),maxScroll());   // must be clamped: during a fast pinch this lands against not-yet-reflowed layout and an out-of-range value sticks, parking the view past the end of the canvas (blank right side, endless-feeling scroll)
}
$('#zoomIn').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1.4);};
$('#zoomOut').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1/1.4);};
// "Veure tot": botó de doble estat. 1r clic → zoom out per encabir tot el visible i queda marcat;
// 2n clic → desfà el zoom out i torna a la vista anterior.
let fitPrev=null;
function fitLatch(on){$('#fitAll').classList.toggle('on',on);}
function clearFitLatch(){fitPrev=null;fitLatch(false);}
$('#fitAll').onclick=()=>{
  if(fitPrev){pxPerYear=Math.max(fitPx(),Math.min(20,fitPrev.px));render();scroll.scrollLeft=Math.min(Math.max(0,fitPrev.left),maxScroll());clearFitLatch();return;}
  const before={px:pxPerYear,left:scroll.scrollLeft};
  fitToPresent();
  if(pxPerYear!==before.px||scroll.scrollLeft!==before.left){fitPrev=before;fitLatch(true);}   // only latch if it actually moved
};
$('#reset').onclick=()=>{state.present=new Set();state.pinned=new Set(SEED_PINNED);state.collections=new Set();state.marcs=new Set(DEFAULT_MARCS);state.showEvents=true;state.focus=null;state.selected=null;state.selectedEvent=null;state.expandedClusters=new Set();$('#detail').classList.remove('open');clearFitLatch();defaultView();};
$('#sidebarToggle').onclick=e=>{
  const collapsed=$('.body').classList.toggle('collapsed');
  e.currentTarget.textContent=collapsed?'›':'‹';
  e.currentTarget.title=collapsed?'Mostra la barra lateral':'Amaga la barra lateral';
  try{localStorage.setItem(SIDEBAR_LS,collapsed?'collapsed':'open');}catch(ex){}
};
$('.sidebar').addEventListener('transitionend',e=>{if(e.propertyName==='width'){applyMetrics();setZoom(pxPerYear);scheduleSettle();}});

// Trackpad pinch / ⌘+wheel → zoom. (Chrome/Firefox deliver pinch as ctrl+wheel.)
// Bound to the document, not to #scroll: the sidebar overlays the canvas and the topbar sits above it,
// so a pinch with the cursor over either would otherwise escape us and become a browser page zoom.
document.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.01);
  const r=scroll.getBoundingClientRect();
  const inCanvas=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  zoomAt(inCanvas?e.clientX:r.left+scroll.clientWidth/2,factor);   // pinch outside the canvas → zoom about its centre
},{passive:false});

// Touch pinch zoom (mobile). Two fingers → zoom around their midpoint.
// Absolute, not incremental: the gesture pins one year under the fingers and scales from the
// zoom it started at. Incremental factors (dist/prevDist, compounding) drifted and stuck for
// good once a frame hit the fitPx()/20 clamp, because the clamped value became the next baseline.
// The work is also deferred to one rAF per frame — a full render() straight inside touchmove was
// what made it stutter, since touchmove fires far faster than we can rebuild the canvas.
let pinch=null,pinchRAF=0;
const tMid=t=>(t[0].clientX+t[1].clientX)/2;
const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==2){endPinch();return;}
  e.preventDefault();hideGuide();
  const rect=scroll.getBoundingClientRect(),mx=tMid(e.touches);
  pinch={dist0:Math.max(tDist(e.touches),1),px0:pxPerYear,mx,scale:1,
         year:YEAR_MIN+((mx-rect.left)+scroll.scrollLeft)/pxPerYear};   // the year under the fingers, held there for the whole gesture
},{passive:false});
scroll.addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;
  e.preventDefault();
  pinch.mx=tMid(e.touches);                 // re-read the midpoint: fingers drift, and a stale one drags the anchor toward the centre
  pinch.scale=tDist(e.touches)/pinch.dist0;
  if(!pinchRAF)pinchRAF=requestAnimationFrame(applyPinch);
},{passive:false});
function applyPinch(){clearFitLatch();
  pinchRAF=0;
  if(!pinch)return;
  setZoom(pinch.px0*pinch.scale);
  const rect=scroll.getBoundingClientRect();
  scroll.scrollLeft=Math.min(Math.max(0,(pinch.year-YEAR_MIN)*pxPerYear-(pinch.mx-rect.left)),maxScroll());
}
function endPinch(){pinch=null;if(pinchRAF){cancelAnimationFrame(pinchRAF);pinchRAF=0;}}
scroll.addEventListener('touchend',endPinch);
scroll.addEventListener('touchcancel',endPinch);
// Doble-tap amb un dit → apropa al punt tocat (complementa el pinch). Ignora tocs sobre elements interactius.
let tStart=null,lastTap=0,lastTapX=0,lastTapY=0;
scroll.addEventListener('touchstart',e=>{tStart=(e.touches.length===1)?{x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false}:null;},{passive:true});
scroll.addEventListener('touchmove',e=>{if(tStart&&e.touches.length===1){const t=e.touches[0];if(Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)>10)tStart.moved=true;}},{passive:true});
scroll.addEventListener('touchend',e=>{
  if(pinch||!tStart||tStart.moved||e.changedTouches.length!==1)return;
  const t=e.changedTouches[0];
  if(e.target.closest('.bar,.event,.seg.mov,.marcchip,.menu,button,a,input,.results'))return;   // deixa que el toc obri detalls / actuï normal
  const now=Date.now();
  if(now-lastTap<300&&Math.abs(t.clientX-lastTapX)<32&&Math.abs(t.clientY-lastTapY)<32){e.preventDefault();zoomAt(t.clientX,1.8);lastTap=0;hideGuide();}
  else{lastTap=now;lastTapX=t.clientX;lastTapY=t.clientY;}
},{passive:false});

// Guia mòbil: drag primer (passive:false, prioritat) → placement segon (passive:true).
// Ordre important: drag es registra abans de placement, per tant fires primer.
// Si la guia és visible i el toc cau a ±22px → drag actiu, placement no s'executa (guideTouch=true).
// Si la guia no és visible, o el toc és lluny → drag surt, placement col·loca la guia al touchstart.
let guideTouch=false;
// 1) Drag: toc proper a la guia existent → arrossegar
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||guide.style.display!=='block')return;
  const t=e.touches[0];
  const touchX=t.clientX-scroll.getBoundingClientRect().left+scroll.scrollLeft;
  if(Math.abs(touchX-parseFloat(guide.style.left||'-9999'))>22)return;
  e.preventDefault();guideTouch=true;tStart=null;
},{passive:false});
// 2) Placement: toc al canvas buit → guia apareix immediatament
scroll.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||guideTouch||pinch)return;
  if(e.target.closest('.bar,.event,.seg.mov,.marcchip,.menu,button,a,input,.results'))return;
  const t=e.touches[0];
  const offX=t.clientX-scroll.getBoundingClientRect().left+scroll.scrollLeft;
  if(offX<0||offX>totalW())return;
  guide.style.display='block';guide.style.left=offX+'px';
  guide.querySelector('.yr').textContent=Math.round(YEAR_MIN+offX/pxPerYear);
},{passive:true});
// 3) Moviment del drag
scroll.addEventListener('touchmove',e=>{
  if(!guideTouch||e.touches.length!==1)return;
  e.preventDefault();
  const t=e.touches[0];
  const offX=Math.max(0,Math.min(t.clientX-scroll.getBoundingClientRect().left+scroll.scrollLeft,totalW()));
  guide.style.left=offX+'px';
  guide.querySelector('.yr').textContent=Math.round(YEAR_MIN+offX/pxPerYear);
},{passive:false});
scroll.addEventListener('touchend',()=>{guideTouch=false;});
scroll.addEventListener('touchcancel',()=>{guideTouch=false;});

// Hover guide (vertical year line). Suppressed while dragging.
scroll.addEventListener('mousemove',e=>{
  if(drag)return;
  const rect=inner.getBoundingClientRect();
  const offX=e.clientX-rect.left;
  if(offX<0||offX>totalW()){hideGuide();return;}
  const year=Math.round(YEAR_MIN+offX/pxPerYear);
  guide.style.display='block';
  guide.style.left=offX+'px';
  guide.querySelector('.yr').textContent=year;
});
function hideGuide(){guide.style.display='none';guide.style.left='0px';}   // reset left too: a stale far-right offset keeps inflating the scrollable area after a zoom-out
scroll.addEventListener('mouseleave',hideGuide);

// Click-and-drag panning. Not started over a person bar (there, click = open detail).
let drag=null,suppressClick=false;
scroll.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.bar'))return;
  hideGuide();
  drag={x:e.clientX,y:e.clientY,sl:scroll.scrollLeft,st:scroll.scrollTop,moved:false};
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;scroll.classList.add('grabbing');hideGuide();}
  if(drag.moved){scroll.scrollLeft=drag.sl-dx;scroll.scrollTop=drag.st-dy;e.preventDefault();}
});
window.addEventListener('mouseup',()=>{
  if(!drag)return;
  const moved=drag.moved;drag=null;scroll.classList.remove('grabbing');
  if(moved){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}   // swallow the click that follows a real drag
});

// ============================================================
// [10] BOOT (wait for a real width before the first fit)
// ============================================================
function bootDefault(cb){if(scroll.clientWidth>0){applyMetrics();if(restoredView){pxPerYear=Math.max(fitPx(),Math.min(20,restoredView.px));render();scroll.scrollLeft=Math.min(Math.max(0,restoredView.left||0),maxScroll());}else{defaultView();}lsReady=true;saveNow();if(cb)cb();}else{requestAnimationFrame(()=>bootDefault(cb));}}   // re-measure here too: at parse time the viewport height can still be 0 (or mid-settle behind Safari's URL bar), which would lock in the wrong metrics
// ============================================================
// [11] MODE «PERSONATGE UNIC» (?person=QID) — handoff des de joc.html
// ============================================================
// El joc mostra un personatge random de Wikidata que NO es a la BD local, escriu les seves dades
// a localStorage['hb_view_person'] i navega a index.html?person=QID. La URL nomes porta el QID
// (curta i compartible); les dades riques van per la cache. Si la cache no hi es o no coincideix
// (un amic obre l'enllac al seu dispositiu), es reconsulta Wikidata pel QID.
//
// ⚠️ ANYS aC: les DUES APIs de Wikidata serialitzen diferent el mateix valor. Comprovat amb
// quatre casos (Aristotil, Socrates, Cleopatra, Cesar):
//     wbgetentities  ->  -0384  =  384 aC   (directe; NO cal conversio)
//     SPARQL         ->  -0383  =  384 aC   (astronomic; cal restar 1 -> es el que fa wdYear)
// Aqui fem servir wbgetentities (com el joc), per tant NO s'ha d'aplicar wdYear: seria un any
// de mes. Mateix parser que joc.html a proposit.
const PERSON_KEY='hb_view_person';
const WD_ENT='https://www.wikidata.org/w/api.php?action=wbgetentities&props=labels%7Cdescriptions%7Cclaims%7Csitelinks/urls&languages=ca%7Ces%7Cen&format=json&origin=*&ids=';
const COMMONS_FP='https://commons.wikimedia.org/wiki/Special:FilePath/';
const pbar=$('#personbar');

// La barra es construeix amb nodes i textContent: les dades venen de Wikidata i no es poden
// interpolar a innerHTML.
function personBar(estat,nom,descripcio,imgUrl){
  pbar.textContent='';
  pbar.dataset.state=estat;
  if(imgUrl){
    const im=document.createElement('img');
    im.className='pimg';im.alt='';im.referrerPolicy='no-referrer';im.src=imgUrl;
    im.addEventListener('error',()=>im.remove());       // Commons pot fallar: la barra no s'ha de trencar
    pbar.appendChild(im);
  }
  const txt=document.createElement('div');txt.className='ptxt';
  const tag=document.createElement('div');tag.className='ptag';
  tag.textContent=estat==='error'?'No s’ha pogut carregar':'Personatge del dia';
  const nm=document.createElement('div');nm.className='pname';nm.textContent=nom;
  txt.appendChild(tag);txt.appendChild(nm);
  if(descripcio){const de=document.createElement('div');de.className='pdesc';de.textContent=descripcio;txt.appendChild(de);}
  pbar.appendChild(txt);
  // Nomes la ✕, sense text (decisio d'en Bernat). La barra ja diu en quin mode estas, i qualsevol
  // text hi sobrava: «Veure tot el cronograma» es confonia amb «Vista global» de la topbar, que si
  // que enquadra. El que fa: treu el ?person= de la URL, i aixo torna la linia de temps desada.
  const back=document.createElement('button');
  back.className='pback';back.type='button';back.textContent='✕';
  back.title='Treu el personatge de la vista';
  back.setAttribute('aria-label','Treu el personatge de la vista');
  back.addEventListener('click',()=>{removePerson('wd_'+PERSON_QID);});
  pbar.appendChild(back);
  pbar.classList.add('on');
  scheduleSettle();   // la barra canvia l'alcada del canvas: floorH s'ha de recalcular
}

const pYear=t=>{const m=/^([+-])0*(\d+)-/.exec(String(t||''));if(!m)return null;const y=parseInt(m[2],10);return m[1]==='-'?-y:y;};
const pLbl=o=>o?((o.ca||o.es||o.en||{}).value||null):null;

function personFromEntity(e){
  const cl=e.claims||{};
  const claim=p=>cl[p]&&cl[p][0]&&cl[p][0].mainsnak&&cl[p][0].mainsnak.datavalue;
  const b=claim('P569'), d=claim('P570'), im=claim('P18');
  const birth=b?pYear(b.value&&b.value.time):null;
  if(birth==null)return null;                       // sense naixement no es pot situar a la linia
  const sl=e.sitelinks||{};
  const art=(sl.cawiki&&sl.cawiki.url)||(sl.eswiki&&sl.eswiki.url)||(sl.enwiki&&sl.enwiki.url)||('https://www.wikidata.org/wiki/'+e.id);
  return {qid:e.id,name:pLbl(e.labels)||e.id,desc:pLbl(e.descriptions)||'',
    birth,death:d?pYear(d.value&&d.value.time):null,
    img:im?COMMONS_FP+encodeURIComponent(String(im.value).replace(/ /g,'_'))+'?width=500':null,wiki:art};
}

function personFromCache(qid){
  let d=null;try{d=JSON.parse(localStorage.getItem(PERSON_KEY)||'null');}catch(e){d=null;}
  if(!d||d.qid!==qid||typeof d.birth!=='number')return null;
  return {qid:d.qid,name:String(d.name||qid),desc:String(d.desc||''),birth:d.birth,
    death:(typeof d.death==='number')?d.death:null,img:d.img||null,
    wiki:'https://www.wikidata.org/wiki/'+qid};
}

function fetchPerson(qid){
  const ac=('AbortController' in window)?new AbortController():null;
  const to=setTimeout(()=>{if(ac)ac.abort();},9000);
  return fetch(WD_ENT+encodeURIComponent(qid),ac?{signal:ac.signal}:undefined)
    .then(r=>r.ok?r.json():Promise.reject(new Error('http')))
    .then(j=>{
      const e=j&&j.entities&&j.entities[qid];
      if(!e||e.missing!==undefined)return null;
      return personFromEntity(e);
    })
    .finally(()=>clearTimeout(to));
}

// Afegeix el personatge del joc a la vista com qualsevol resultat de cerca de Wikidata:
// lsReady segueix actiu, l’estat es desa normalment, i la × de la personbar és equivalent
// a la × d’«A la vista» (removePerson).
function mostraPersonatge(p){
  const id='wd_'+p.qid;
  if(!PEOPLE.some(x=>x.id===id)){
    PEOPLE.push({id,wd:p.qid,name:p.name,birth:p.birth,death:p.death,cats:guessCats(p.desc),
      gender:'',wiki:p.wiki,desc:p.desc||'',_session:true,_ts:Date.now()});
  }
  state.present.add(id);
  state.pinned.add(id);
  scheduleSave();
  render();
  personBar('ok',p.name,p.desc||'',p.img);
}
function bootPersonMode(qid){
  restoreState();
  if(!/^Q\d+$/.test(qid)){
    bootDefault();
    personBar('error','Identificador no vàlid','L’enllaç no porta un QID de Wikidata correcte.',null);
    return;
  }
  const cached=personFromCache(qid);
  if(cached){
    bootDefault(()=>{
      mostraPersonatge(cached);
      fitToPresent();                                        // centra la vista sobre el personatge
      window.dispatchEvent(new Event('resize'));             // re-avalua fitSecnav amb l'amplada real (fix topbar HB)
      if(!cached.img)fetchPerson(qid).then(p=>{if(p&&p.img)personBar('ok',p.name,p.desc||'',p.img);}).catch(()=>{});
    });
    return;
  }
  bootDefault();
  personBar('loading','Carregant…','Consultant Wikidata…',null);
  fetchPerson(qid).then(p=>{
    if(p){mostraPersonatge(p);requestAnimationFrame(fitToPresent);}
    else personBar('error','Personatge no trobat','Wikidata no retorna cap entitat per a '+qid+'.',null);
  }).catch(()=>{
    personBar('error','Sense connexió','No s’ha pogut consultar Wikidata i no hi ha còpia local d’aquest personatge.',null);
  });
}

// Sidebar: plegada per defecte a pantalles estretes; la preferència manual es persisteix.
// ⚠️ Ha d'anar ABANS del boot: la barra està en flux (canvi #41), així que plegar-la eixampla
// el canvas ~226px. Si es fes després, fitToPresent() ja hauria mesurat el clientWidth VELL i
// el personatge quedaria descentrat i amb el zoom equivocat (bug del mode ?person= al mòbil).
// La transició es desactiva per a aquesta primera aplicació: si no, bootDefault() mesura a
// mitja animació de 0,18s i torna a llegir una amplada que encara no és la definitiva.
{const _sbPref=localStorage.getItem(SIDEBAR_LS);const _sbCollapse=_sbPref?_sbPref==='collapsed':window.innerWidth<900;
 if(_sbCollapse){const _sb=$('.sidebar');const _tr=_sb.style.transition;_sb.style.transition='none';
   $('.body').classList.add('collapsed');$('#sidebarToggle').textContent='›';
   _sb.getBoundingClientRect();_sb.style.transition=_tr;}}

const PERSON_QID=(new URLSearchParams(location.search)).get('person');
if(PERSON_QID){
  bootPersonMode(PERSON_QID);
}else{
  restoreState();
  bootDefault();
}
// floorH (el "terra" on s'ancoren l'any de l'event, la linia d'avui i la guia) es calcula DINS de
// render(), a partir de scroll.clientHeight. Si l'alcada del viewport canvia i no es torna a
// renderitzar, l'any de l'event queda surant a mig canvas. Passava en creuar el llindar de
// (pointer:coarse) i, sobretot, quan el layout s'assenta TARD: al mobil la barra d'adreces del
// navegador s'anima ~200ms i un sol render al primer frame encara llegeix l'alcada antiga.
// Per aixo es renderitza tres vegades: ara, al frame seguent, i un cop assentat.
function settleRender(){applyMetrics();render();}
function scheduleSettle(){requestAnimationFrame(settleRender);clearTimeout(_settleT);_settleT=setTimeout(settleRender,180);}
window.addEventListener('resize',()=>{applyMetrics();setZoom(pxPerYear);scheduleSettle();});   // en girar el mobil canvia el llindar compacte: cal recalcular la geometria abans de repintar
window.addEventListener('load',scheduleSettle);

// Rotate hint: a dismissible suggestion (not a blocker) on touch devices held in portrait.
const portraitWall=document.getElementById('portraitWall');
let rotateDismissed=false;
function checkPortrait(){
  const isTouch=window.matchMedia('(pointer:coarse)').matches;
  const isPortrait=window.innerWidth<window.innerHeight;
  portraitWall.classList.toggle('on',isTouch&&isPortrait&&!rotateDismissed);
}
$('#rotateDismiss').addEventListener('click',()=>{rotateDismissed=true;portraitWall.classList.remove('on');});
window.addEventListener('resize',checkPortrait);
checkPortrait();

// ===== Acordió de la barra lateral (NOMÉS mòbil) =====
// En pointer:coarse, les 3 seccions es comporten com un acordió: només una oberta a la vegada,
// que ocupa tota l'alçada amb el seu scroll. Tornar a clicar la capçalera oberta les plega totes
// (vista de només títols). Al desktop no s'activa (queda com sempre).
const ACC_MQ=window.matchMedia('(pointer:coarse)');
function openAccSection(sec){
  const secs=[...document.querySelectorAll('.sidebar section')];
  const wasOpen=sec.classList.contains('open');
  secs.forEach(s=>s.classList.remove('open'));
  if(!wasOpen)sec.classList.add('open');
}
function setupAccordion(){
  const sb=$('.sidebar');const secs=[...document.querySelectorAll('.sidebar section')];
  if(ACC_MQ.matches){
    sb.classList.add('accordion');
    secs.forEach(s=>{const h=s.querySelector('h3');if(h&&!h.dataset.acc){h.dataset.acc='1';const c=document.createElement('span');c.className='acc-chev';c.textContent='\u25b8';h.appendChild(c);h.addEventListener('click',()=>openAccSection(s));}});
    if(!sb.querySelector('section.open'))openAccSection(secs[secs.length-1]);   // per defecte: «A la vista» oberta
  }else{sb.classList.remove('accordion');secs.forEach(s=>s.classList.remove('open'));}
}
setupAccordion();
if(ACC_MQ.addEventListener)ACC_MQ.addEventListener('change',setupAccordion);
// ===== BLOC COMPARTIT (index.html / joc.html): compressió de la topbar =====
// Escala: 1) tot sencer · 2) es plega el menú (la marca obre un desplegable) · 3) botons d'acció
// a icones (CSS) · 4) la marca passa a «HB» · 5) últim recurs, el cercador baixa del seu mínim.
// El cercador ha de poder mostrar «Cercant a Wikidata…» en una línia (180px mesurats), per això
// és l'últim que es toca.
//
// Els llindars són una FÓRMULA que no depèn del contingut de la pàgina, a propòsit: així
// l'index i el joc es plegan a la mateixa amplada. Si cada pàgina es mesurés a si mateixa, el
// joc (que no té cercador ni quatre botons) es quedaria desplegat molt més avall i navegar
// d'una pàgina a l'altra faria un canvi estrany.
// Ha de ser byte-idèntic als dos fitxers.
(function(){
  const sec=document.querySelector('.secnav');
  const brand=sec&&sec.querySelector('.brand');
  const nav=sec&&sec.querySelector('.modeswitch');
  const tb=document.querySelector('.topbar');
  const search=document.querySelector('.topbar-right .search');
  if(!sec||!brand||!nav||!tb)return;
  const tanca=()=>{sec.classList.remove('open');tb.classList.remove('navopen');brand.setAttribute('aria-expanded','false');};
  function fitSecnav(){
    const coarse=window.matchMedia('(pointer:coarse)').matches, w=window.innerWidth;
    const plega = coarse ? w<=600 : w<=900;   // en tàctil tot ja és més compacte: aguanta més
    const hb    = coarse ? w<=430 : w<=560;   // amb els botons d'accio quadrats el nom sencer hi cap fins a ~545
    sec.classList.toggle('navcollapsed',plega);
    sec.classList.toggle('hb',plega&&hb);
    // Separador: només quan l'aire entre el menú i el cercador s'ha esgotat. Es mesura SEMPRE
    // sense la barreta posada, perquè la barreta viu dins de .secnav i si no es reduiria l'aire
    // a si mateixa (bucle). Sense cercador (pàgina de jocs) no hi ha res a separar: mai surt.
    sec.classList.remove('sep');
    if(search&&!plega){
      const aire=search.getBoundingClientRect().left-sec.getBoundingClientRect().right;
      if(aire<40)sec.classList.add('sep');
    }
    if(!plega)tanca();
  }
  brand.addEventListener('click',e=>{
    if(!sec.classList.contains('navcollapsed'))return;   // en vista ampla la marca és text inert
    e.stopPropagation();
    const obert=sec.classList.toggle('open');
    tb.classList.toggle('navopen',obert);
    brand.setAttribute('aria-expanded',obert?'true':'false');
  });
  document.addEventListener('click',e=>{if(!sec.contains(e.target))tanca();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')tanca();});
  // Igual que amb floorH: en creuar el llindar de (pointer:coarse) el primer càlcul encara
  // llegeix l'estat antic. Es reavalua al frame següent i un cop assentat.
  let t;
  function reavalua(){fitSecnav();requestAnimationFrame(fitSecnav);clearTimeout(t);t=setTimeout(fitSecnav,300);}
  reavalua();
  // resize dispara amb dimensions antigues en iOS quan es gira — esperem un frame + 300ms per llegir les dimensions reals
  window.addEventListener('resize',()=>{requestAnimationFrame(reavalua);});
  if(screen&&screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(reavalua,350));   // en girar el mòbil screen.orientation.change dona temps al viewport d'assentar-se abans de mesurar
  const MQ=window.matchMedia('(pointer:coarse)');
  if(MQ.addEventListener)MQ.addEventListener('change',reavalua);   // el llindar tàctil pot canviar sense que el resize arribi a temps
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reavalua);   // Oswald canvia l'amplada de la marca
  window.addEventListener('pageshow',e=>{if(e.persisted)reavalua();});   // bfcache: el back-button restaura la pàgina sense re-executar el JS; reavalua garanteix que la barreta es recalculi
})();
// ===== fi del bloc compartit =====
</script>
</body>
