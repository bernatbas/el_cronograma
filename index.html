  /* Mes calmat que a la barra lateral: vora clara, fons pla (fora el degradat) i l'estat actiu
     marcat NOMES amb la barreta terracota de l'esquerra i el fons tenyit fluix. Amb sis files
     actives seguides, la vora fosca i el degradat de cada una feien massa soroll. */
  /* padding vertical 0 + min-height: l'alcada de la fila la mana el ⋮ (36px tactils) i no
     se sumen. Amb padding 6 la fila pujava a 48px i al popup nomes se'n veien TRES, quan
     n'hi han de cabre cinc o sis. */
  .cfgbody .colitem{padding:0 9px;min-height:38px;font-size:13px;gap:8px;box-shadow:none;
       border-color:var(--border);background:var(--canvas);}
  .cfgbody .colitem.on{background:#FBF1EE;box-shadow:none;
       border-color:#E8D2CB;font-weight:600;}
  .cfgbody .colitem .cnt{font-size:11px;}
  .cfgbody .newcol{padding:6px 9px;font-size:12px;}
  .cfgbody .filter{padding:3px 0;font-size:13px;}
  .cfgbody .onview .item{padding:3px 0;font-size:13px;}
  .cfgbody .onview .item .x{font-size:15px;}
  .cfgbody .empty{font-size:12px;}
  /* Les seccions mogudes: nomes la de la pestanya activa, i sense h3 (el titol ja es la pestanya). */
  .cfgbody section{display:none;}
  .cfgbody section.on{display:block;}
  .cfgbody section>h3{display:none;}
  .cfgbody section>div{overflow:visible;max-height:none;}   /* el scroll el fa .cfgbody, no cada seccio */

  /* ===== GUIA DE BENVINGUDA (17/11/2026) =====
     Un globus que va apuntant a cada cosa. Crema clar i text fosc a posta: la primera versió en
     terracota plena era massa agressiva. Va per sobre de tot, fitxa inclosa (60). */
  .guia-velo{position:fixed;inset:0;background:rgba(60,40,35,.18);z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;}
  .guia-velo.on{opacity:1;pointer-events:auto;}
  .guia-halo{position:fixed;border-radius:10px;pointer-events:none;z-index:81;opacity:0;transition:opacity .2s;animation:guiaHalo 1.6s ease-out infinite;}
  .guia-halo.on{opacity:1;}
  @keyframes guiaHalo{0%{box-shadow:0 0 0 2px rgba(232,160,140,.95);}100%{box-shadow:0 0 0 12px rgba(232,160,140,0);}}

function detectLang(){
  try{
    // Ordre (22/11/2026): 1) ?lang= a l'adreça · 2) el ?lang d'abans en aquesta pestanya ·
    // 3) el que l'usuari ha triat al selector (hb_lang) · 4) el del navegador · 5) catala.
    // El ?lang es recorda a sessionStorage perque no es perdi en navegar entre pagines, pero NO
    // es desa a hb_lang: un enllaç compartit no ha de canviar la preferencia de qui l'obre.
    // Accepta qualsevol idioma amb diccionari (tambe un d'encara no actiu, per previsualitzar-lo).
    const q=/[?&]lang=([a-z]{2})(&|$)/.exec(location.search);
    if(q && I18N[q[1]]){ try{ sessionStorage.setItem('hb_lang_sessio',q[1]); }catch(_){} return q[1]; }
    const ses=sessionStorage.getItem('hb_lang_sessio');
    if(ses && I18N[ses]) return ses;
    const saved=localStorage.getItem(LANG_KEY);
    if(saved && I18N_SUPPORTED.indexOf(saved)>=0) return saved;
    // NOMES l'idioma PRINCIPAL del navegador (decisio d'en Bernat, 22/11/2026): amb «en-US, es-ES»
    // toca catala, no castella. Si el principal no el tenim, el default i prou.
    const nav=String((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase();
    if(I18N_SUPPORTED.indexOf(nav)>=0) return nav;
  }catch(_){}
  return I18N_DEFAULT;
}
let LANG=detectLang();
// Analytics: l'idioma com a PROPIETAT D'USUARI (22/11/2026), un cop decidit. A GA cal registrar la
// dimensio personalitzada «idioma» (abast: usuari) per veure-la als informes i al dashboard.
try{ if(typeof gtag!=='undefined') gtag('set','user_properties',{idioma:LANG}); }catch(_){}
// Adreça de l'idioma (22/11/2026): si la pagina va en un idioma amb pagines propies (/es/, les fa
// _tools/gen_compartir.py), la barra ho diu: /es/ i /es/joc.html. Aixi el boto de compartir del mobil
// (que comparteix la barra) dona l'adreça amb les metadades en aquell idioma, i WhatsApp la previsualitza
// be. Nomes es reescriu l'adreça (history.replaceState), no es recarrega res. Si es recarrega, la pagina
// /es/ porta aqui amb ?lang=es. ⚠️ Per aixo els enllaços que s'obren DESPRES d'aquest punt han de ser

// Aixo NO es dada i per aixo no viu a db.js: es el precalcul del motor de zoom semantic,
// i necessita L() de la seccio [0] per mesurar l'amplada del nom de cada event.
// Each event gets a PERMANENT row (_row) + the minimum zoom (_revealPPY, px/year) at which its name may
// show. Processed by descending importance: higher-priority events claim their spot first; a lower one
// only reveals once the zoom opens enough gap beside the more-important labels already in its row (so it
// can never overlap them). Net effect: zooming only ADDS names — no flicker, and an event never swaps
// rows. Row 1 is spillover, used only when row 0 would delay the reveal a lot (e.g. two very close, very
// important events like the two World Wars).
(function(){
  const GAP=12, ROW_BIAS=0.8, wOf=ev=>L(ev.name).length*7+16;
  const placed=[[],[]];
  const thrIn=(row,ev,w)=>{let t=0;for(const n of placed[row]){const dy=Math.abs(ev.year-n.year);if(dy===0)return Infinity;const need=(n.year<=ev.year?n.w:w)+GAP;t=Math.max(t,need/dy);}return t;};
  [...EVENTS].sort((a,b)=>b._m-a._m||a.year-b.year).forEach(ev=>{
    const w=wOf(ev),t0=thrIn(0,ev,w),t1=thrIn(1,ev,w);
    let row=(t1<t0*ROW_BIAS)?1:0;
    if((row===0?t0:t1)===Infinity&&(row===0?t1:t0)!==Infinity)row=1-row;
    ev._row=row; ev._revealPPY=(row===0?t0:t1);
    placed[row].push({year:ev.year,w});

const barBg=p=>hasCat(p)?stripeBg(p.cats.map(a=>CAT_COLORS[a]),14):NOCAT_COLOR;   // two categories → diagonal stripes
const swatchBg=p=>hasCat(p)?stripeBg(p.cats.map(a=>CAT_COLORS[a]),7):NOCAT_COLOR;
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};                                   // hex → translucent rgba
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return `rgb(${r},${g},${b})`;};   // darken toward black
// MODE FOSC: els tints dels marcs es barregen amb el FONS, no amb el blanc, i la tinta dels noms
// s'aclareix en comptes d'enfosquir-se. En clar, mix() i ink() fan exactament el mateix que abans.
const ESFOSC=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const mix=(hex,f)=>{const n=parseInt(hex.slice(1),16);const B=ESFOSC()?[28,28,27]:[255,255,255];const m=(v,k)=>Math.round(B[k]+(v-B[k])*f);return `rgb(${m((n>>16)&255,0)},${m((n>>8)&255,1)},${m(n&255,2)})`;};   // opaque tint toward the background (white in light, canvas in dark)
const ink=(hex,f)=>{if(!ESFOSC())return shade(hex,f);const n=parseInt(hex.slice(1),16);const l=v=>Math.round(v+(255-v)*(1-f));return `rgb(${l((n>>16)&255)},${l((n>>8)&255)},${l(n&255)})`;};   // text on a tint: darker in light, lighter in dark   // opaque tint toward white (f=0 white … 1 full colour)
const fmtY=y=>y<0?(-y)+' '+t('bce'):''+y;
// Escapat per als noms i descripcions que venen de Wikidata (contingut public i editable) i que
// es pinten via innerHTML. Sense aixo, una etiqueta amb HTML s'injectaria: la cerca i les
// col·leccions ja n'eren via, i el mode ?person= ho fa arribar des d'un parametre d'URL.
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkLabel=url=>/wikipedia\.org/.test(url)?'Wikipedia':/wikidata\.org/.test(url)?'Wikidata':'Web';   // adaptive label for the detail link

// Guess categories from Wikidata itemDescription (conservative keyword matching)
const guessCats=desc=>{if(!desc)return[];const d=desc.toLowerCase(),a=[],pos={};
  const hit=(re,c)=>{const k=d.search(re);if(k>=0){pos[c]=k;a.push(c);}};   // pos: on surt a la descripció (per a «art», a sota)
  if(/filòsof|filósofo|philosopher/.test(d))a.push('philosophy');
  hit(/compositor|composer|músic|music|cantant|cantante|singer|cantautor|songwriter|guitarr|pianist|violinist|violoncel|trompetist|trumpet|saxofon|saxophon|percussion|drummer|rapper|raper|jazz|òpera|soprano|orquestra|orchestra|ópera|orquesta/,'music');   // només hi havia compositor: ni músic, ni cantant, ni cap instrumentista
  hit(/escriptor|escritor|writer|poeta|poet|dramaturgo|dramaturg|novel·lista|novelist|aede|aedo|ensayista|assagista|essayist/,'literature');
  // Hi havia nomes fisica, matematiques, astronomia i «cientific/naturalista»: ni quimica ni
  // res de biomedicina. Amb la col·leccio dels Nobel es va veure de cop —23 de 49 sortien
  // sense categoria, i entre ells sis quimics i set metges/biolegs. Mateix forat que el cas
  // Verdi: arreglat al dash.py i encara viu aqui.
  if(/físic|physicist|matemàtic|matemátic|astrónom|médic|fisiólog|biólog|zoólog|bacteriólog|neurólog|farmacólog|inmunólog|inventor|mathematician|astrònom|astronomer|científic|scientist|naturalista|naturalist|químic|chemist|bioquímic|biochemist|metge|metgessa|physician|fisiòleg|physiologist|biòleg|biòloga|biologist|zoòleg|zoologist|bacteriòleg|bacteriologist|neuròleg|neurologist|neurocientífic|neuroscientist|genetista|geneticist|farmacòleg|pharmacologist|immunòleg|immunologist|geòleg|geologist|enginyer|engineer|informàtic|computer scientist/.test(d))a.push('science');
  if(/polític|político|politician|politique|rei|rey|reina|king|queen|faraó|faraón|faraona|pharaoh|emperador|emperor|dictador|dictator|militar|military|president|independentista|ministre|ministro|minister|activista|activist|estadista|statesman|diplomàtic|diplomat|líder|leader|canceller|canciller|chancellor|secretari general|secretario general|secretary-general|politòleg|political scientist/.test(d))a.push('politics');
  hit(/pintor|painter/,'painting');   // l’escultor ha passat a «art» (17/11/2026)
  // ⚠️ Aqui «actor» SOL sí que val, i al mapa de P106 (dash.py) NO: son dos senyals diferents.
  // A P106 en Shakespeare porta l’ocupacio «actor» (Q33999) i li encolomaria cinema; la seva
  // DESCRIPCIO, en canvi, diu «dramaturg i poeta angles» i no hi surt la paraula. Excloure-la
  // tambe aqui deixava fora tothom descrit nomes com a «actor»: en Tom Cruise sortia sense
  // categoria. El teatre s’aparta amb el guard de sota, no amagant la paraula.
  if(!/teatre|teatro|teatral/.test(d))hit(/cineasta|director[a]? de cinema|film director|filmmaker|guionista|screenwriter|actor|actriu|actriz|director[a]? de cine|productor[a]? de cine|de cine\b|film producer|productor[a]? de cinema|director[a]? de fotografia|cinematographer|cinema/,'cinema');
  if(/profeta|prophet|religiós|religioso|religious|religiosa|sant|saint|monja|nun|monjo|monje|monk|bisbe|obispo|bishop|papa |pope|rabí|rabino|rabbi|imam|apòstol|apóstol|apostle|predicador|preacher|teòleg|teólogo|theologian|missioner|misionero|missionary/.test(d))a.push('religion');
  if(/futbolista|jugador de futbol|jugador de fútbol|footballer|football player|tennista|tenista|tennis player|jugador de tennis|basquetbol|bàsquet|baloncesto|baloncestista|basketball|boxejador|boxeador|boxer|atleta|athlete|track and field|velocista|sprinter|gimnasta|gymnast|nedador|nadador|swimmer|ciclista|cyclist|golfista|golfer|automobilista|racing driver|motorcycle racer/.test(d)
     ||/(pilot|piloto)[^,;.]{0,18}(autom|motocicl)/.test(d))a.push('sport');   // "pilot" sol cauria sobre aviadors, així que exigim context de motor
  // ART: paraigua per a les arts que no són Pintura, Literatura, Música ni Cinema. Mana l’ORDRE de
  // la descripció, com a P106 al dash.py: si «escultor» va abans que «pintor», art i va davant
  // (Miquel Àngel); si va després, no hi suma (Picasso, «Pintor i escultor»).
  // ⚠️ «artista» SOL no hi és a posta: Wikidata el posa a cantants («recording artist»).
  // Teatre: s’aparta de Cinema amb el guard de dalt i ve a parar aquí.
  {const k=d.search(/arquitect|architect|fotògraf|fotógraf|photographer|escultor|sculptor|ballarí|ballarina|bailar[ií]n|dancer|coreògraf|coreógraf|choreographer|dissenyador|diseñador|designer|il·lustrador|ilustrador|illustrator|dibuixant|dibujante|cartoonist|autor[a]? de còmic|historietista|comic artist|ceramista|ceramicist|orfebre|goldsmith|actor de teatre|actriu de teatre|director[a]? de teatre|director[a]? de teatro|stage actor|theatre director|theater director|artista visual|artista plàstic|artista plástic|visual artist/);
   if(k>=0){const abans=['painting','literature','music','cinema'].filter(c=>c in pos).map(c=>pos[c]);
     if(!abans.length||k<Math.min(...abans)){pos.art=k;a.push('art');}}}
  // Entre les arts també mana l’ordre: «Escultor, pintor, arquitecte i poeta» → art+pintura, no
  // art+literatura. Només es reordenen aquestes cinc entre elles; la resta queda on era.
  {const R=a.filter(c=>c in pos).sort((x,y)=>pos[x]-pos[y]);let n=0;for(let i=0;i<a.length;i++)if(a[i] in pos)a[i]=R[n++];}
  return [...new Set(a)].slice(0,2);};   // 0–2 per persona: una descripció tipus "filòsof, escriptor i naturalista" dispararia tres regles

// Who is on the timeline = whoever you put there. Categories only colour the bars; they never
// decide membership, so `pinned` is the whole story (no more activeCols/hidden bookkeeping).
function recomputePresent(){state.present=new Set([...state.pinned].filter(id=>PEOPLE.some(p=>p.id===id)));}

// ============================================================
// [4] LAYOUT MATH (lane packing + vertical geometry)
// ============================================================
let MOV_LANE_H=40, MOV_BAR_H=34, MOV_PAD_BOT=6, ERAS_TOP=16, ERA_LABEL_H=26, EVENT_LABEL_H=38, GAP_AFTER=14, ROW_H=34, BAR_H=26, EVENT_YEAR_BAND=32;
let MARC_TIER_CAP=2;                 // nivells (tiers) visibles per marc abans de col·lapsar la resta en «+N». Parametritzable.
let TIER_STEP=15, MARC_GAP=8, MCHIP_H=15, MCHIP_GAP=4;   // desplaçament vertical entre tiers · separació entre marcs · mida del xip «+N»
// Vertical budget is what runs out on a phone in landscape (~340px of usable height), so the eras
// band, the event rail and the people rows all shrink together. Driven off the same media query as
// the CSS below — one source of truth, so the JS geometry and the font sizes can never disagree.
const COMPACT_MQ=window.matchMedia('(max-height:560px)');
function applyMetrics(){
  const c=COMPACT_MQ.matches;
  MOV_LANE_H=c?30:40; MOV_BAR_H=c?26:34; MOV_PAD_BOT=c?4:6;   // 26 is the floor for two lines of block text (name + years) at the compact font sizes
  ERAS_TOP=c?9:16; ERA_LABEL_H=c?17:26; EVENT_LABEL_H=c?28:38; GAP_AFTER=c?8:14;
  TIER_STEP=c?12:15; MARC_GAP=c?6:8; MCHIP_H=c?13:15; MCHIP_GAP=c?3:4;
  BAR_H=c?20:26; ROW_H=BAR_H+(c?5:8); EVENT_YEAR_BAND=c?26:32;
  document.documentElement.style.setProperty('--bar-h',BAR_H+'px');
}
applyMetrics();
// All period blocks from the active marcs, pooled into one list and tagged with their marc's colour.
// `key` (marc id + index) is the click identity: blocks have no id of their own in DATA, and the
// pooled list is rebuilt on every render, so the DOM needs something stable to look them back up by.
function activeBlocks(){const out=[];MARCS.forEach(m=>{if(state.marcs.has(m.id))m.blocks.forEach((b,i)=>out.push({name:L(b.name),start:b.start,end:b.end,color:m.color,key:m.id+':'+i,marcName:L(m.name),wiki:b.wiki,desc:L(b.desc)}));});return out;}
// ── Layout de marcs: cada marc actiu s'organitza en TIERS PROPIS (interval-partition) ──
// Regla mare: dos blocs comparteixen carril NOMÉS si no comparteixen cap any (tocar-se hi val).
// El de durada més gran va al tier de dalt (context, to més clar); els solapats baixen i s'enfosqueixen.
function _assignTiers(blocks){
  const arr=blocks.slice().sort((a,b)=>(b.end-b.start)-(a.end-a.start)||a.start-b.start);   // durada gran primer → tier de dalt
  const tiers=[];
  arr.forEach(b=>{
    let t=0;
    for(;t<tiers.length;t++){if(tiers[t].every(iv=>b.start>=iv.end||b.end<=iv.start))break;}   // sense solapament real (solapen si b.start<iv.end && iv.start<b.end)
    if(!tiers[t])tiers[t]=[];
    tiers[t].push({start:b.start,end:b.end});b._tier=t;
  });
  return tiers.length;
}
// Per cada marc actiu: assigna tiers, decideix quins blocs es veuen (tier<CAP o dins un clúster expandit),
// agrupa els amagats en clústers «+N» i calcula la geometria vertical de la banda del marc.
function marcLayout(){
  const CAP=Math.max(1,MARC_TIER_CAP);const out=[];let y=0;
  MARCS.forEach(m=>{
    if(!state.marcs.has(m.id))return;
    const blocks=m.blocks.map((b,i)=>({name:L(b.name),start:b.start,end:b.end,wiki:b.wiki,desc:L(b.desc),color:m.color,marcName:L(m.name),key:m.id+':'+i}));
    if(!blocks.length)return;
    _assignTiers(blocks);
    const hidden=blocks.filter(b=>b._tier>=CAP).sort((a,b)=>a.start-b.start);   // blocs profunds → col·lapsats
    const clusters=[];
    hidden.forEach(b=>{const last=clusters[clusters.length-1];if(last&&b.start<last.end){last.end=Math.max(last.end,b.end);last.items.push(b);}else clusters.push({start:b.start,end:b.end,items:[b]});});   // agrupats per solapament en x
    clusters.forEach((c,ci)=>{c.ckey=m.id+'#'+ci;c.expanded=state.expandedClusters.has(c.ckey);});
    const shown=blocks.filter(b=>b._tier<CAP||clusters.some(c=>c.expanded&&c.items.indexOf(b)>=0));
    const maxShownTier=shown.reduce((mx,b)=>Math.max(mx,b._tier),0);
    const barsH=maxShownTier*TIER_STEP+MOV_BAR_H;
    const hasChips=clusters.length>0;
    const bandH=barsH+(hasChips?MCHIP_GAP+MCHIP_H:0);
    out.push({marc:m,color:m.color,shown,clusters,marcTop:y,chipTop:barsH+MCHIP_GAP});
    y+=bandH+MARC_GAP;
  });
  return {marcs:out,totalH:out.length?y-MARC_GAP:0};
}
// El canvas d'eres creix amb l'alçada total de les bandes dels marcs (com abans amb els carrils).
function erasBlockH(){return ERAS_TOP+ERA_LABEL_H+marcLayout().totalH+MOV_PAD_BOT;}
function eventLabelTop(){return erasBlockH()+6;}
function barsTop(){return eventLabelTop()+EVENT_LABEL_H+GAP_AFTER;}

function visiblePeople(){return PEOPLE.filter(p=>state.present.has(p.id)&&typeof p.birth==='number'&&!amagat(p));}   // sense birth no es pot situar a la linia: x(null) donaria l'any 0 i pintaria una barra fantasma fins a avui
// Stack people into rows. Living pills grow to fit the name; dead bars keep their real lifespan
// (the label just overflows). Lanes pack by the bar, so overlapping names are allowed (click to disambiguate).
function packLanes(people){
  // Geometria d'una pastilla (posició i amplada) — s'aplica igual al focus i a la resta.
  const geom=p=>{
    const startX=x(p.birth);
    const lifeW=Math.max(x(deathOf(p))-startX,8);
    const alive=isAlive(p);
    const pillW=lifeW;
    const endX=startX+pillW+(alive?FUTURE_FADE:0);
    p._startX=startX;p._endX=endX;p._pillW=pillW;p._alive=alive;
    return endX;
  };
  // L'ORIGINAL (focus) es queda SOL al carril 0 (a dalt); els de context s'empaqueten a partir del carril 1,
  // així no es perd mai quin era el personatge de referència.
  const focusPerson=(state.focus&&people.find(p=>p.id===state.focus))||null;
  if(focusPerson){geom(focusPerson);focusPerson._lane=0;}
  const off=focusPerson?1:0;
  const laneEnds=[];
  people.filter(p=>!focusPerson||p.id!==state.focus).sort((a,b)=>a.birth-b.birth).forEach(p=>{
    const endX=geom(p);
    let lane=laneEnds.findIndex(e=>e+8<p._startX);
    if(lane===-1){lane=laneEnds.length;laneEnds.push(endX);}
    else laneEnds[lane]=endX;
    p._lane=lane+off;
  });
  return laneEnds.length+off;
}

// ============================================================
// [5] RENDER — rebuilds the whole view from `state` + `pxPerYear`
// ============================================================
function render(){
  recomputePresent();
  // La guia de benvinguda avança sola quan l'usuari fa el que li demana. Va AQUÍ, no al final:
  // només necessita saber qui hi ha a la vista, i així cap error de la resta del render no la para.
  // (Tot el que fa és programar timeouts, que s'executen quan el render ja ha acabat.)
  try{guiaTick();}catch(ex){console.warn('guia',ex);}
  if(scroll.clientWidth>0)pxPerYear=Math.max(fitPx(),Math.min(20,pxPerYear));   // safety net: whatever path got us here (pinch, resize, page zoom), never draw at a zoom below the fit floor — that's what left a white gap and runaway scroll
  const nowX=x(NOW_YEAR);
  const W=Math.max(Math.min(totalW(),nowX+FUTURE_MARGIN_PX),nowX+FUTURE_FADE+8,scroll.clientWidth);   // cap the scrollable canvas to a fixed px margin past "today" (not a year count, or it balloons at high zoom), but never narrower than the viewport (white gap) nor than the future-fade
  inner.style.width=W+'px';

  // --- Era strata: always-on eras backbone + pooled marc blocks (canvas grows with lanes) ---
  const erasH=erasBlockH();
  eraPanel.style.width=W+'px';
  eraPanel.style.height=erasH+'px';
  const futureMask=`linear-gradient(to right,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;   // band fades out at "today"
  eraPanel.style.webkitMaskImage=futureMask;
  eraPanel.style.maskImage=futureMask;
  eraTracksEl.style.width=W+'px';
  eraTracksEl.style.height=erasH+'px';
  const gw=x(DATA_MIN), FADE=72;
  const maskGrad=`linear-gradient(to right,transparent ${gw}px,#000 ${gw+FADE}px,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;  // fade both ends (past ∞ / future)
  const maskCss=`-webkit-mask-image:${maskGrad};mask-image:${maskGrad};`;
  // eras backbone: the macro-eras as a pale wash spanning the whole canvas, names at the top
  const backboneEls=ERAS.map((b,k)=>{
    const bl=x(b.start),bw=Math.max(x(b.end)-x(b.start),2);
    const tint=hexA(ERAS_COLOR,k%2?0.13:0.06);
    const dv=k>0?`border-left:1px solid ${hexA(ERAS_COLOR,.26)};`:'';
    return `<div class="blockzone" style="left:${bl}px;width:${bw}px;height:${erasH}px;background:${tint};${dv}"><span class="blabel" style="left:14px;top:${ERAS_TOP}px;color:${ink(ERAS_COLOR,.55)}">${L(b.name)}</span></div>`;
  }).join('');
  // marc blocks: cada marc actiu en TIERS propis (semi-solapament); els nivells profunds es col·lapsen en «+N»
  const ml=marcLayout();
  const blocksY=ERAS_TOP+ERA_LABEL_H;
  const blockEls=ml.marcs.map(M=>{
    const c=M.color;
    const bars=M.shown.map(b=>{
      const left=x(b.start),w=Math.max(x(b.end)-x(b.start),2);
      const top=blocksY+M.marcTop+b._tier*TIER_STEP;   // tier profund = més avall i, per z-index, al davant → deixa veure la vora de dalt del pare
      // El to codifica la PROFUNDITAT: tier 0 (context) clar, cada nivell més avall s'enfosqueix. Sempre el hue del marc.
      const f=Math.min(0.92,0.26+b._tier*0.22);
      const grad=`linear-gradient(to right,${mix(c,f)},${mix(c,Math.max(0.08,f-0.15))})`;
      return `<div class="seg mov" data-blk="${b.key}" style="left:${left+1}px;width:${Math.max(w-2,2)}px;top:${top}px;height:${MOV_BAR_H}px;z-index:${10+b._tier};background:${grad};--mc:${c};--mink:${ink(c,.55)};"><span class="segname">${b.name}</span><span class="segyears">${fmtY(b.start)}–${fmtY(b.end)}</span></div>`;
    }).join('');
    const chips=M.clusters.map(cl=>{
      const left=x(cl.start),w=Math.max(x(cl.end)-x(cl.start),26),top=blocksY+M.marcTop+M.chipTop;
      const lbl=cl.expanded?'−':('+'+cl.items.length);
      return `<div class="marcchip${cl.expanded?' open':''}" data-cluster="${cl.ckey}" style="left:${left}px;width:${w}px;top:${top}px;height:${MCHIP_H}px;--mc:${hexA(c,.75)};color:${ink(c,.5)};background:${hexA(c,.12)};" title="${cl.expanded?t('cro_chip_collapse'):cl.items.map(i=>i.name).join(', ')}">${lbl}</div>`;
    }).join('');
    return bars+chips;
  }).join('');
  eraTracksEl.innerHTML=`<div class="segwrap" style="${maskCss}">${backboneEls}${blockEls}</div>`;
  stickLabels();   // manté els noms d'eres/blocs visibles encara que facis zoom i el bloc surti de pantalla

  // --- People (measure first so we know the content height) ---
  eventsRail.style.width=W+'px';
  const people=visiblePeople();
  const lanes=packLanes(people);
  const rowH=ROW_H;
  const peopleH=people.length?lanes*rowH+16:46;
  const contentH=barsTop()+peopleH+EVENT_YEAR_BAND;   // EVENT_YEAR_BAND = breathing room so event-year pills clear the lowest bar row
  // Al mòbil (pointer:coarse) l'eix queda enganxat al terra i .inner s'estira fins a omplir el viewport (regla CSS min-height:calc(100% - var(--axis-h))).
  // L'any de l'event (i la línia "avui"/guia) ha de seguir aquest terra real, no el contentH lògic, o queda flotant a mig canvas quan hi ha poques files.
  const _coarse=window.matchMedia('(pointer:coarse)').matches;
  const _axisH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--axis-h'))||32;
  const floorH=_coarse?Math.max(contentH,scroll.clientHeight-_axisH):Math.max(contentH,Math.round(scroll.clientHeight*0.5));

  // --- Events (name on top, full line, year pill at the foot; two rows to avoid name overlap) ---
  const evNameTop=eventLabelTop(), evYearTop=floorH-24;
  const evPlaced=EVENTS.map(ev=>({ev,left:x(ev.year),w:L(ev.name).length*7+16})).sort((a,b)=>a.left-b.left);
  // --- Stable semantic zoom: PERMANENT rows + MONOTONIC reveal (see the _row/_revealPPY precompute) ---
  // A name shows the moment the zoom (pxPerYear) reaches its precomputed _revealPPY, always in its fixed
  // _row. So zooming only ADDS names — no flicker (a name never toggles on/off at a fixed zoom) and no
  // up/down swap. A searched/selected event is FORCED to show at any zoom (explicit intent beats the gate).
  const FADE_PX=22, DOT_GAP=7;   // finestra de fade més curta = aparició més brusca en fer zoom
  // Un event sense nom es pinta com a punt, però NO des del primer moment: només quan el zoom
  // ja arriba a la meitat del que li cal per guanyar el nom. Amb 32 events, sense aquesta porta
  // la vista per defecte tenia 11 noms i 21 punts —el canvas quedava clapejat de boles mig
  // esvaïdes—; amb la porta en queden 3, i les que hi són volen dir «amplia una mica més i
  // això tindrà nom». Pujar el valor cap a 1 les fa desaparèixer del tot.
  const DOT_PPY_RATIO=0.5;
  evPlaced.forEach(o=>{o.labeled=(o.ev.id===state.selectedEvent)||pxPerYear>=o.ev._revealPPY;o.row=o.ev._row;});
  // Importance order (stable) drives the dot de-dup so dense stretches don't smear into a solid bar of dots.
  const byImp=[...evPlaced].sort((a,b)=>b.ev._m-a.ev._m||a.left-b.left);
  const dotX=byImp.filter(o=>o.labeled).map(o=>o.left);
  byImp.forEach(o=>{
    if(o.labeled){o.showDot=true;return;}
    if(pxPerYear<o.ev._revealPPY*DOT_PPY_RATIO){o.showDot=false;return;}   // encara massa lluny del seu zoom
    if(dotX.some(dx=>Math.abs(dx-o.left)<DOT_GAP)){o.showDot=false;}else{o.showDot=true;dotX.push(o.left);}
  });
  // Organic fade: a name that only just cleared its row-neighbours comes in dim and brightens with zoom.
  const rowLbl=[[],[]];
  evPlaced.forEach(o=>{if(o.labeled)rowLbl[o.row].push(o);});
  rowLbl.forEach(list=>{list.sort((a,b)=>a.left-b.left);list.forEach((o,i)=>{
    if(o.ev.id===state.selectedEvent){o.op=1;return;}
    let gap=Infinity;
    if(i>0)gap=Math.min(gap,o.left-(list[i-1].left+list[i-1].w));
    if(i<list.length-1)gap=Math.min(gap,list[i+1].left-(o.left+o.w));
    o.op=gap===Infinity?1:Math.max(.55,Math.min(1,gap/FADE_PX));
  });});
  eventsRail.innerHTML=state.showEvents?evPlaced.map(o=>{
    const ev=o.ev,left=o.left;
    ev._x=left;
    if(!o.labeled){
      if(!o.showDot)return '';
      const dTop=evNameTop+o.row*16+18;   // segueix la fila permanent: en tornar-se punt NO salta de fila. Sense pal: només el punt.
      return `<div class="event dotonly" style="left:${left}px"><div class="edot" data-ev="${ev.id}" title="${L(ev.name)}" style="top:${dTop}px"></div></div>`;
    }
    const nameTop=evNameTop+o.row*16,dotTop=nameTop+18,lineTop=dotTop+3;
    const lineH=Math.max(evYearTop-lineTop-2,0);
    const foc=state.selectedEvent===ev.id?' focus':'';
    return `<div class="event${foc}" style="left:${left}px;opacity:${o.op.toFixed(2)}"><div class="ename" data-ev="${ev.id}" style="top:${nameTop}px">${L(ev.name)}</div><div class="edot" style="top:${dotTop}px"></div><div class="eline" style="top:${lineTop}px;height:${lineH}px"></div><div class="eyear" style="top:${evYearTop}px">${fmtY(ev.year)}</div></div>`;
  }).join(''):'';

  // --- People bars ---
  barsLayer.style.top=barsTop()+'px';
  barsLayer.style.width=W+'px';
  if(people.length){
    barsLayer.innerHTML=people.map(p=>{
      const top=p._lane*rowH;
      const pillW=p._pillW, alive=p._alive;
      const col=barBg(p);
      const fade=alive?`<span class="fade" style="left:${pillW}px;width:${FUTURE_FADE}px;background:${col}"></span>`:'';   // future fade for the living
      const lblW=pillW-(_coarse?16:20);
      const lblStyle=lblW<28?'display:none':'max-width:'+lblW+'px;overflow:hidden;text-overflow:ellipsis';
      return `<div class="bar${alive?' alive':''}${state.selected===p.id?' sel':''}" data-id="${p.id}" style="left:${p._startX}px;top:${top}px;width:${pillW}px;background:${col}">${fade}<span class="lbl" style="${lblStyle}">${esc(L(p.name))}</span><button class="menu" data-menu="${p.id}" title="${esc(t('cro_bar_opts'))}">⋮</button></div>`;
    }).join('');
  }else{
    barsLayer.innerHTML=`<div class="emptyState" style="top:6px">${t('cro_empty_canvas')}</div>`;
  }
  inner.style.height=floorH+'px';

  // --- Today line ---
  nowline.style.left=nowX+'px';
  nowline.style.height=floorH+'px';
  nowline.querySelector('.lbl').textContent=t('cro_today')+' · '+NOW_YEAR;

  // --- Axis ticks (step chosen so labels are ~>=70px apart) ---
  axisEl.style.width=W+'px';
  axisInner.style.width=W+'px';
  const STEPS=[1,2,5,10,25,50,100,250,500,1000,2000,5000,10000];
  let step=STEPS[STEPS.length-1];
  for(const st of STEPS){if(st*pxPerYear>=70){step=st;break;}}
  let ticks=`<div class="tick tinf" style="left:2px">∞···</div><div class="tick tbound" style="left:${x(DATA_MIN)}px">${fmtY(DATA_MIN)}</div>`;
  const firstTick=Math.ceil((DATA_MIN+step*0.4)/step)*step;
  for(let y=firstTick;y<=YEAR_MAX&&x(y)<=W;y+=step){ticks+=`<div class="tick" style="left:${x(y)}px">${fmtY(y)}</div>`;}   // stop at the px-capped canvas edge (W) as well as the year range, so high zoom can't push a tick past the canvas and inflate scrollWidth
  axisInner.innerHTML=ticks;
  guide.style.height=floorH+'px';
  if(parseFloat(guide.style.left||0)>W)hideGuide();   // a guide left over at an old (larger) zoom keeps the scrollable area inflated → runaway scroll + blank right side

  renderSidebar();
  renderLegend();
  scheduleSave();
}

// Category legend: derived from what is painted, never the other way round. Walks CAT_COLORS so the
// order stays stable as people come and go, and counts both colours of a two-category (striped) bar.
function renderLegend(){
  const present=PEOPLE.filter(p=>state.present.has(p.id));
  const live=new Set(present.flatMap(p=>hasCat(p)?p.cats:[]));
  const items=Object.keys(CAT_COLORS).filter(c=>live.has(c)).map(c=>[c,CAT_COLORS[c]]);
  if(present.some(p=>!hasCat(p)))items.push(['none',NOCAT_COLOR]);   // the teal bars need a key too
  // Una categoria amagada que ja no porta ningú de la vista s'oblida: si no, en afegir-hi algú més
  // endavant (una altra col·lecció, una cerca) sortiria amagat sense que ningú recordés per què.
  [...state.hiddenCats].forEach(c=>{if(!items.some(([n])=>n===c))state.hiddenCats.delete(c);});
  if(!items.length){legendEl.innerHTML='';return;}   // :empty hides the card entirely
  legendEl.innerHTML=items.map(([n,c])=>{const off=state.hiddenCats.has(n);
    return `<button type="button" class="lgi${off?' off':''}" data-cat="${n}" aria-pressed="${!off}"><span class="swatch" style="background:${c};--sw:${c}"></span>${t('cat_'+n)}</button>`;}).join('');
  // The axis is sticky-bottom inside .scroll, but whenever the canvas is shorter than the viewport
  // it falls back into normal flow partway up — so its position is variable and has to be measured,
  // not assumed from --axis-h, or the card ends up sitting on top of the year ticks.
  const sb=scroll.getBoundingClientRect().bottom,at=axisEl.getBoundingClientRect().top;
  legendEl.style.bottom=Math.max(12,Math.round(sb-at+10))+'px';
}


// Sidebar lists (rebuilt on every render so counts / checked states stay in sync).

  // ⚠️ NO hi posis linies apilades. La icona d'abans eren tres ratlles horitzontals i un
  // cercle (una «playlist»), pero tres ratlles apilades son el gest universal d'«agafa'm»:
  // en Bernat va dir que semblava que les col·leccions s'havien de poder arrossegar per
  // reordenar-les, i no es aixi. En aquest mateix projecte el joc «Ordena la linia» fa servir
  // ⠿ com a nansa de debo, o sigui que la confusio era interna. Ara son capes superposades:
  // diuen «un munt de coses» sense prometre cap gest.
  const colIco='<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 14.4 5 8 8.2 1.6 5z"/><path d="m1.6 8.4 6.4 3.2 6.4-3.2"/><path d="m1.6 11.6 6.4 3.2 6.4-3.2"/></svg>';
  // Les colleccions propies porten un ⋮ que obre la seva fitxa (reanomenar, veure i treure
  // gent, esborrar). Les de serie no en porten: s'editen al dashboard.
  const optIco='<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>';
  // ⚠️ El camp del nom NO es pot tornar a crear a cada render. Al mobil, obrir el teclat
  // canvia el viewport, el resize dispara scheduleSettle() → render(), i un innerHTML nou
  // destrueix l’element enfocat: el teclat es tancava de seguida i no s’hi podia escriure.
  // Mesurat: amb UN SOL resize, activeElement passava de «newcolin» a BODY i el node era un
  // altre. Per aixo, si la caixa ja hi es, aqui nomes es refan els BOTONS i no es toca.
  const _cont=$('#collections');
  const _viu=newCollOpen?_cont.querySelector('.newcolbox'):null;
  const _botons=COLLECTIONS.map(c=>`<button class="colitem ${state.collections.has(c.id)?'on':''}" data-col="${c.id}">${colIco}<span class="cname">${esc(c.name)}</span><span class="cnt">${c.wds.length}</span><span class="colx" role="button" tabindex="0" data-collopt="${c.id}" title="${t('cro_coll_opts')}" aria-label="${t('cro_coll_opts')}">${optIco}</span></button>`).join('')   // la ↗ cap a la web de la font s'ha tret (20/11/2026): el camp `url` es queda a db.js per passar-lo a la futura descripció
  if(_viu){
    _cont.querySelectorAll('.colitem, .newcol').forEach(n=>n.remove());
    _viu.insertAdjacentHTML('afterend',_botons);   // la caixa de nova col·lecció va A DALT (20/11/2026): a baix de tot ni es veia
  }else{
    _cont.innerHTML=(newCollOpen?newCollBoxHTML():newCollBtnHTML())+_botons;
  }
  renderFavorits();
  const present=PEOPLE.filter(p=>state.present.has(p.id)).sort((a,b)=>L(a.name).localeCompare(L(b.name),LANG));   // always alphabetical, en l'idioma actiu
  $('#onview').innerHTML=present.length?present.map(p=>`<div class="item${amagat(p)?' amagat':''}"><span class="swatch" style="background:${swatchBg(p)}"></span><button class="nm" data-goto="${p.id}">${esc(L(p.name))}</button><button class="favb" data-favt="${p.id}" aria-label="${esc(esFav(favKey(p))?t('cro_fav_unmark'):t('cro_fav_mark'))}" aria-pressed="${esFav(favKey(p))}">${favIco(esFav(favKey(p)))}</button>${p.wd?`<button class="addc" data-addc="${p.id}" aria-label="${t('cro_coll_addto')}">+</button>`:''}${SEED_PINNED.includes(p.id)?'':`<button class="rp" data-report="${p.id}" aria-label="${t('cro_report')}">⚠</button><button class="x" data-remove="${p.id}" aria-label="${t('cro_remove')}">×</button>`}</div>`).join(''):`<div class="empty">${t('cro_empty_people')}</div>`;
  actualitzaComptes();
}

function closeDetailIfGone(){if(state.selected && !state.present.has(state.selected)){state.selected=null;hideDetail();}}

// Which movement/era a given year falls in (falls back to the macro-block, which has no gaps).
function eraLabel(year){
  const w=MARCS.find(m=>m.id==='west');
  const blk=w&&w.blocks.find(b=>year>=b.start&&year<b.end);   // Western movement, if any
  if(blk)return L(blk.name);
  const era=ERAS.find(e=>year>=e.start&&year<e.end);           // else the macro-era backbone
  return era?L(era.name):'—';
}

function openDetail(p){
  $('#detail').classList.remove('collcard');   // la fitxa d'una col·lecció la deixa en columna (scroll només a la llista)
  if(typeof gtag!=='undefined')gtag('event','fitxa_oberta',{personatge:L(p.name)});
  state.selected=p.id;state.selectedEvent=null;
  const d=$('#detail');d.classList.add('open');detailBackdrop.classList.add('open');
  d.innerHTML=`<button class="close" id="closeDetail" aria-label="${t('close')}">×</button>
    <h2>${esc(L(p.name))}</h2>
    <div class="dhead"><span class="life">${approxText(p)?'~':''}${fmtY(p.birth)} – ${isAlive(p)?t('cro_present'):fmtY(p.death)}</span>${hasCat(p)?p.cats.map(a=>`<span class="chip"><span class="swatch" style="background:${CAT_COLORS[a]}"></span>${t('cat_'+a)}</span>`).join(''):`<span class="chip"><span class="swatch" style="background:${NOCAT_COLOR}"></span>${t('cat_none')}</span>`}<span class="chip era">${eraLabel(p.birth)}</span></div>
    ${approxText(p)?`<div class="approx">${esc(approxText(p))}</div>`:''}
    <div class="desc">${descHtml(L(p.desc))}</div>
    <div class="actions">
      <button class="dbtn" data-act="context">${t('cro_context')}</button>
      <button class="dbtn favbtn" data-act="fav" aria-label="${esc(esFav(favKey(p))?t('cro_fav_unmark'):t('cro_fav_mark'))}" aria-pressed="${esFav(favKey(p))}">${favIco(esFav(favKey(p)))}</button>
      ${personQid(p.id)?`<button class="dbtn" data-act="addto">${t('cro_coll_addto')}</button>`:''}
      ${p.wiki?`<button class="dbtn" data-act="wiki">${linkLabel(p.wiki)} ↗</button>`:''}
      ${SEED_PINNED.includes(p.id)?'':`<button class="dbtn danger" data-act="remove">${t('cro_delete')}</button>`}
    </div>`;
  $('#closeDetail').onclick=()=>{hideDetail();state.selected=null;render();};
  d.querySelectorAll('.dbtn').forEach(btn=>btn.onclick=(ev)=>{
    const act=btn.getAttribute('data-act');
    // ⚠️ stopPropagation obligatori: el handler de «clic fora» viu al document i, sense aixo,
    // tancava el menu just despres d'obrir-lo. El + d'«A la vista» ja el portava, i per aixo
    // aquell funcionava i aquests dos no.
    if(act==='fav'){
      ev.stopPropagation();
      toggleFavISincronitza(p);
      return;
    }
    if(act==='addto'){ev.stopPropagation();openAddToColl(p.id,btn);return;}
    if(act==='remove')removePerson(p.id);
    else if(act==='wiki')window.open(p.wiki,'_blank','noopener,noreferrer');
    else{if(typeof gtag!=='undefined')gtag('event','mostra_context',{personatge:L(p.name)});showContext(p.id);}
  });
  render();
}

// ===== Fitxa d'una colleccio propia =====
// Reaprofita el panell de detall, que ja servia persones i esdeveniments: al desktop es el
// panell lateral, al mobil puja des de baix. Es la «pagina de la playlist»: nom editable, qui
// hi ha (amb ✕ a cada un), l'enllac i esborrar. Nomes per a les propies —les de serie
// s'editen al dashboard.
let collDraft=null;   // colleccio que s'esta creant i encara NO existeix: {name, wds}
const penIco='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.6l2.2 2.2L5.6 12.6 2.8 13.2l.6-2.8z"/></svg>';

function openCollDetail(cid){
  const c=COLLECTIONS.find(x=>x.id===cid);
  if(!c){hideDetail();state.selectedColl=null;return;}
  collDraft=null;
  if(collCercaCid!==cid){collCercaCid=null;collCercaTxt='';}
  if(!c._mine)return drawCatalogCard(c);
  drawCollCard(c.name,c.wds,cid,null);
}
// ── Dades d'una col·lecció (20/11/2026): desc, author, created, updated. Les del catàleg les posa
// en Bernat a db.js; les pròpies, created/updated sols (avui) i la desc des de la fitxa.
const avuiISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtData=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';};
// Peu de la fitxa: qui l'ha feta i quan. Va al PEU, petit: a dalt ocupava molt i és el que menys interessa.
function collFoot(c){
  const p=[c._mine?t('cro_coll_private'):(c.author?t('cro_coll_by',{a:c.author}):'')];
  if(c.created)p.push(t('cro_coll_created',{d:fmtData(c.created)}));
  if(c.updated&&c.updated!==c.created)p.push(t('cro_coll_updated',{d:fmtData(c.updated)}));   // si és el mateix dia, sobra
  const txt=p.filter(Boolean).join(' · ');
  return txt?txt[0].toUpperCase()+txt.slice(1):'';
}
// Capçalera: quantes persones i de quin any a quin any (dels que ja coneixem).
function collChips(wds){
  const pp=wds.map(q=>PEOPLE.find(x=>x.wd===q)).filter(p=>p&&p.birth!=null);
  let h=`<span class="chip">${t('cro_coll_people',{n:wds.length})}</span>`;
  if(pp.length>1)h+=`<span class="chip">${fmtY(Math.min(...pp.map(p=>p.birth)))} – ${pp.some(isAlive)?t('cro_present'):fmtY(Math.max(...pp.map(deathOf)))}</span>`;   // algú viu → «avui», com a la fitxa
  return h;
}
// Els membres que encara no tenim (col·lecció mai activada, gent de Wikidata) no tenen nom: en obrir la
// fitxa se'ls demana a Wikidata (una consulta, sense activar res) i es torna a pintar en arribar.
var collNomsDemanats=new Set(), collNomsPendents=new Set();
function collNomsQueFalten(c){
  const falten=c.wds.filter(q=>!PEOPLE.some(x=>x.wd===q));
  if(!falten.length||collNomsDemanats.has(c.id))return false;
  collNomsDemanats.add(c.id);collNomsPendents.add(c.id);
  byIds(falten,true).finally(()=>collNomsPendents.delete(c.id)).then(got=>{
    got.forEach(w=>{if(w.birth!=null)wdAPersona(w);});
    if(state.selectedColl===c.id&&$('#detail').classList.contains('open'))openCollDetail(c.id);
  }).catch(()=>{   // Wikidata no respon: que no quedi «Carregant…» per sempre; torna a «… i N més»
    if(state.selectedColl===c.id&&$('#detail').classList.contains('open'))openCollDetail(c.id);
  });
  return true;
}
const shareIcoSvg='<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2.5M5 5.2 8 2.2l3 3"/><path d="M4.5 7.5H3.8a.8.8 0 0 0-.8.8v5a.8.8 0 0 0 .8.8h8.4a.8.8 0 0 0 .8-.8v-5a.8.8 0 0 0-.8-.8h-.7"/></svg>';
// Fitxa d'una col·lecció del CATÀLEG: només lectura. Els membres que encara no tenim (no s'ha activat
// mai i són de Wikidata) no tenen nom: es compten a «… i N més» en lloc d'ensenyar-ne el Q-id.
function drawCatalogCard(c){
  closeCfg();   // al mòbil la fitxa (safata) quedaria darrere del popup de configuració
  state.selected=null;state.selectedEvent=null;state.selectedColl=c.id;
  const d=$('#detail');d.classList.add('open');detailBackdrop.classList.add('open');
  collNomsQueFalten(c);const carregant=collNomsPendents.has(c.id);
  const coneguts=c.wds.map(q=>PEOPLE.find(x=>x.wd===q)).filter(Boolean).sort((a,b)=>a.birth-b.birth);
  const resta=c.wds.length-coneguts.length;
  const files=coneguts.map(p=>`<div class="collrow"><span class="swatch" style="background:${swatchBg(p)}"></span>`
      +`<span class="collnm">${esc(L(p.name))}</span><span class="collyr">${fmtY(p.birth)}–${isAlive(p)?'':fmtY(p.death)}</span></div>`).join('')
    +(resta?`<div class="collrow more">${carregant?t('cro_loading'):t('cro_coll_more',{n:resta})}</div>`:'');
  const on=state.collections.has(c.id);
  d.classList.add('collcard');
  d.innerHTML=`<button class="close cclose" id="closeDetail" aria-label="${t('close')}">×</button>
    <button class="collshare" data-act="share" title="${t('cro_coll_share')}" aria-label="${t('cro_coll_share')}">${shareIcoSvg}</button>
    <h2 class="collh2">${esc(c.name)}</h2>
    <div class="collbar"><div class="collchips">${collChips(c.wds)}</div><button class="dbtn${on?'':' primary'}" data-act="toggle">${t(on?'cro_coll_deactivate':'cro_coll_activate')}</button></div>
    ${c.desc?`<div class="desc colldesc">${c.desc}</div>`:''}
    <div class="collmembers">${files}</div>
    <div class="collfoot">${esc(collFoot(c))}</div>`;
  const tanca=()=>{hideDetail();state.selectedColl=null;render();};
  $('#closeDetail').onclick=tanca;
  d.querySelector('[data-act="toggle"]').onclick=ev=>{ev.stopPropagation();tanca();toggleCollection(c.id);};   // es tanca: que es vegi la línia
  d.querySelector('[data-act="share"]').onclick=ev=>{ev.stopPropagation();compartirColleccio(c.id);};
  render();
}
// Una colleccio nova NO es crea en obrir la fitxa: es queda en esborrany fins que prems Desa.
// Aixi pots posar-li nom, treure'n algu o cancelar sense deixar restes a la llista.

  collDraft={name:'',wds:qid?[qid]:[]};
  drawCollCard('',collDraft.wds,null,null);
}

function drawCollCard(nom,wds,cid,url){
  const draft=!cid;
  // Al mobil les colleccions nomes viuen dins del popup de configuracio (z-index 70) i la
  // fitxa es una safata de z-index 50: sense tancar-lo, tocar el ⋮ obria una fitxa que
  // quedava DARRERE del vel, amb el nom i el boto d'esborrar inaccessibles. Nomes en treia
  // el nas per sota. A l'escriptori el popup ja esta tancat i la crida no fa res.
  closeCfg();
  state.selected=null;state.selectedEvent=null;state.selectedColl=cid;
  const d=$('#detail');d.classList.add('open');detailBackdrop.classList.add('open');
  const cc=cid?COLLECTIONS.find(x=>x.id===cid):null;
  if(cc)collNomsQueFalten(cc);
  d.classList.add('collcard');
  d.innerHTML=`<button class="close cclose" id="closeDetail" aria-label="${t('close')}">×</button>
    <div class="collhead">
      <input class="collname" id="collname" type="text" maxlength="60" value="${esc(nom)}" placeholder="${t('cro_coll_name_ph')}" aria-label="${t('cro_coll_name_ph')}">
      <button class="collpen" id="collpen" type="button" title="${t('cro_coll_rename')}" aria-label="${t('cro_coll_rename')}">${penIco}</button>
    </div>
    <div class="collbar">${cc?collBarInner(cc):`<div class="collchips">${collChips(wds)}</div>`}</div>
    ${cc?`<textarea class="colldescin" id="colldescin" rows="2" maxlength="300" placeholder="${t('cro_coll_desc_ph')}">${esc(cc.desc||'')}</textarea>`:''}
    ${cc?collAddHTML(cc):''}
    <div class="collmembers">${collMembresHTML(wds)}</div>
    ${cc?`<div class="collfoot propia"><span class="collfoottx">${esc(collFoot(cc))}</span><button class="dbtn danger colldel" data-act="del">${t('cro_coll_del_btn')}</button></div>`:''}
    ${draft?`<div class="actions confirm"><button class="dbtn quiet" data-act="cancel">${t('cro_coll_cancel')}</button>`
        +`<button class="dbtn primary" data-act="save" ${nom.trim()?'':'disabled'}>${t('cro_coll_savebtn')}</button></div>`:''}`;   // «Elimina» al peu (20/11/2026): la fitxa pròpia no hi cabia en horitzontal
  const tanca=()=>{hideDetail();state.selectedColl=null;collDraft=null;collCercaCid=null;collCercaTxt='';render();};
  $('#closeDetail').onclick=tanca;
  const inp=$('#collname');
  $('#collpen').onclick=()=>{inp.focus();inp.select();};
  if(draft){
    // En esborrany el nom es va guardant a cada lletra —no crea res— i el Desa s'activa
    // nomes quan hi ha nom: una colleccio sense nom no es desa.
    inp.oninput=()=>{collDraft.name=inp.value;
      const b=d.querySelector('[data-act="save"]');if(b)b.disabled=!inp.value.trim();};
    inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();saveCollDraft();}
                       else if(ev.key==='Escape'){ev.preventDefault();tanca();}};
    inp.focus();inp.select();
  }else{
    // Ja existeix: el nom es confirma al sortir del camp o amb Enter, no a cada lletra, que si
    // no el desfes s'ompliria d'un pas per pulsacio.
    inp.onchange=()=>renameColl(cid,inp.value);
    inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
                       else if(ev.key==='Escape'){inp.value=nom;inp.blur();}};
  }
  const dsc=$('#colldescin');
  if(dsc)dsc.onchange=()=>{   // la descripció d'una pròpia: es desa en sortir del camp. No passa pel Desfés (com els favorits).
    const c=COLLECTIONS.find(x=>x.id===cid&&x._mine);if(!c)return;
    const v=dsc.value.trim().slice(0,300);if(v===(c.desc||''))return;
    c.desc=v;c.updated=avuiISO();saveMyColls();
  };
  bindCollRm(d,cid);
  if(cc)bindCollAdd(d,cc);
  d.querySelectorAll('.dbtn').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const act=b.getAttribute('data-act');
    if(act==='save')saveCollDraft();
    else if(act==='cancel')tanca();
    else if(act==='del'){hideDetail();state.selectedColl=null;deleteColl(cid);}
    else if(act==='toggle'){hideDetail();state.selectedColl=null;toggleCollection(cid);}   // es tanca: que es vegi la línia
  });
  render();
}

// ── Afegir gent a una col·lecció PRÒPIA des de la seva fitxa (20/11/2026) ─────────────────────
// Membres per ordre de naixement; els que encara no tenim (sense nom) al final, amb el Q-id.
function collMembresHTML(wds){
  const ordre=[...wds].sort((a,b)=>{const pa=PEOPLE.find(x=>x.wd===a),pb=PEOPLE.find(x=>x.wd===b);
    return (pa?pa.birth:Infinity)-(pb?pb.birth:Infinity);});
  return ordre.map(q=>{
    const p=PEOPLE.find(x=>x.wd===q);
    return `<div class="collrow"><span class="swatch" style="background:${p?swatchBg(p):'var(--border-strong)'}"></span>`
      + `<span class="collnm${p?'':' unknown'}">${p?esc(L(p.name)):q}</span>`
      + (p?`<span class="collyr">${fmtY(p.birth)}–${isAlive(p)?'':fmtY(p.death)}</span>`:'')
      + `<button class="collrm" data-q="${q}" title="${t('cro_coll_rm_member')}">×</button></div>`;
  }).join('')||`<div class="empty">${t('cro_coll_empty_members')}</div>`;
}
function collBarInner(c){
  const on=state.collections.has(c.id);
  return `<div class="collchips">${collChips(c.wds)}</div>`
    +(c.wds.length?`<button class="dbtn${on?'':' primary'}" data-act="toggle">${t(on?'cro_coll_deactivate':'cro_coll_activate')}</button>`:'');
}
function bindCollRm(d,cid){
  d.querySelectorAll('.collrm').forEach(b=>b.onclick=()=>{
    const q=b.getAttribute('data-q');
    if(!cid){collDraft.wds=collDraft.wds.filter(x=>x!==q);drawCollCard(collDraft.name,collDraft.wds,null,null);}
    else removeFromColl(cid,q);
  });
}
// El cercador de la fitxa: mateix motor que el de dalt (cercaLocal + wdBusca), però el que tries va a la
// COL·LECCIÓ, no a la línia. Queda obert per anar afegint, i un + es torna ✓ quan la persona ja hi és.
var collCercaCid=null, collCercaTxt='', collWdRes=[], collWdStatus='idle', collWdSeq=0, collWdTimer=null;
const collNView=c=>viewQids().filter(q=>!c.wds.includes(q)).length;
function collAddHTML(c){
  const nv=collNView(c);
  return `<div class="colladd">${collCercaCid===c.id
      ?`<input class="newcolin collq" id="collq" type="text" autocomplete="off" placeholder="${t('cro_search_ph')}" value="${esc(collCercaTxt)}"><div class="collres" id="collres"></div>`
      :`<button class="newcol" type="button" data-act="addopen">${t('cro_coll_add_people')}</button>`}`
    +(nv?`<button class="newcol" type="button" data-act="addview">${t('cro_coll_add_view',{n:nv})}</button>`:'')+`</div>`;
}
function collResHTML(c){
  const term=collCercaTxt.trim();if(!term)return '';
  const fila=(qid,nom,b,dth,color)=>{const dins=c.wds.includes(qid);
    return `<div class="collresrow${dins?' in':''}" data-addq="${esc(qid)}"><span class="swatch" style="background:${color}"></span>`
      +`<span class="collnm">${esc(nom)}</span><span class="collyr">${b!=null?fmtY(b)+'–'+(dth!=null?fmtY(dth):''):''}</span>`
      +`<span class="colladdmark" aria-hidden="true">${dins?'✓':'+'}</span></div>`;};
  // Només qui té Q-id: una col·lecció guarda Q-ids (el «bernat» de la BD no s'hi pot posar).
  let h=cercaLocal(term).filter(p=>/^Q\d+$/.test(p.wd||'')).slice(0,8).map(p=>fila(p.wd,L(p.name),p.birth,p.death,swatchBg(p))).join('');
  if(collWdStatus==='loading')h+=`<div class="collresrow muted">${t('searching_wikidata')}</div>`;
  else if(collWdStatus==='error')h+=`<div class="collresrow muted">${t('cro_wd_fail')}</div>`;
  else if(collWdStatus==='done')h+=collWdRes.filter(w=>!w.nodate&&w.birth!=null).slice(0,8).map(w=>fila(w.qid,w.name,w.birth,w.death,NOCAT_COLOR)).join('');
  return h||`<div class="collresrow muted">${t('cro_no_match')}</div>`;
}
function pintaCollRes(c){const r=$('#collres');if(r)r.innerHTML=collResHTML(c);}
function cercaColl(c){
  const term=collCercaTxt.trim();
  clearTimeout(collWdTimer);collWdRes=[];collWdStatus=term.length>=2?'loading':'idle';
  const seq=++collWdSeq;
  pintaCollRes(c);
  if(term.length<2)return;
  collWdTimer=setTimeout(()=>{
    wdBusca(term).then(out=>{if(seq!==collWdSeq)return;collWdRes=out;collWdStatus='done';pintaCollRes(c);})
      .catch(()=>{if(seq!==collWdSeq)return;collWdStatus='error';pintaCollRes(c);});
  },300);
}
// Després d'afegir: es refà el que ha canviat (xips, botó, membres, drecera, ✓) SENSE tocar el camp de
// cerca. Tornar-lo a crear li prendria el focus i, al mòbil, tancaria el teclat (veure «Paranys»).
function refrescaCollCard(c){
  const d=$('#detail');if(state.selectedColl!==c.id)return;
  const bar=d.querySelector('.collbar');if(bar){bar.innerHTML=collBarInner(c);bindCollToggle(d,c.id);}
  const m=d.querySelector('.collmembers');if(m){m.innerHTML=collMembresHTML(c.wds);bindCollRm(d,c.id);}
  const av=d.querySelector('[data-act="addview"]'),nv=collNView(c);
  if(av){if(nv)av.textContent=t('cro_coll_add_view',{n:nv});else av.remove();}
  const f=d.querySelector('.collfoottx');if(f)f.textContent=collFoot(c);
  pintaCollRes(c);
  render();   // el comptador de la col·lecció al lateral (render() no toca la fitxa)
}
function bindCollToggle(d,cid){
  const b=d.querySelector('.collbar [data-act="toggle"]');
  if(b)b.onclick=ev=>{ev.stopPropagation();hideDetail();state.selectedColl=null;toggleCollection(cid);};
}
function bindCollAdd(d,c){
  const box=d.querySelector('.colladd');if(!box)return;
  box.onclick=ev=>{
    const b=ev.target.closest('[data-act]');
    if(b&&b.dataset.act==='addopen'){ev.stopPropagation();collCercaCid=c.id;collCercaTxt='';collWdStatus='idle';
      box.outerHTML=collAddHTML(c);bindCollAdd(d,c);const i=$('#collq');if(i)i.focus();return;}
    if(b&&b.dataset.act==='addview'){ev.stopPropagation();if(addMembers(c.id,viewQids()))refrescaCollCard(c);return;}
    const r=ev.target.closest('[data-addq]');
    if(r&&!r.classList.contains('in')){
      ev.stopPropagation();
      const w=collWdRes.find(x=>x.qid===r.dataset.addq);if(w)wdAPersona(w);   // de Wikidata: que tingui nom a la llista
      if(setMember(c.id,r.dataset.addq,true)){
        // Afegit: la cerca es buida per començar el següent (decisió d'en Bernat). El camp NO es refà,
        // només se'n buida el valor: així conserva el focus i, al mòbil, el teclat.
        clearTimeout(collWdTimer);collWdSeq++;collCercaTxt='';collWdRes=[];collWdStatus='idle';
        const i=$('#collq');if(i){i.value='';i.focus();}
        refrescaCollCard(c);
      }
    }
  };
  const i=$('#collq');
  if(i){
    i.oninput=()=>{collCercaTxt=i.value;cercaColl(c);};
    i.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();collCercaCid=null;collCercaTxt='';const bx=d.querySelector('.colladd');bx.outerHTML=collAddHTML(c);bindCollAdd(d,c);}};
    if(collCercaTxt)pintaCollRes(c);   // la fitxa s'ha redibuixat sencera (p. ex. en treure algú): els resultats hi tornen
  }
}
// Afegir-ne uns quants d'un cop (la drecera «els N de la vista»): UN sol pas al Desfés.
function addMembers(cid,qids){
  const c=COLLECTIONS.find(x=>x.id===cid&&x._mine);if(!c)return false;
  const nous=[...new Set(qids)].filter(q=>!c.wds.includes(q));if(!nous.length)return false;
  pushUndo('undo_coll_add',{name:c.name});
  c.wds.push(...nous);c.updated=avuiISO();
  saveMyColls();recomputePresent();clearFitLatch();scheduleSave();
  return true;
}

function saveCollDraft(){
  if(!collDraft)return;
  const name=(collDraft.name||'').trim().slice(0,60);
  if(!name){showToast(t('cro_coll_needname'));const i=$('#collname');if(i)i.focus();return;}
  const wds=[...collDraft.wds];
  let i=1,id;do{id='my'+(i++);}while(COLLECTIONS.some(c=>c.id===id));
  pushUndo('undo_coll_new',{name});
  COLLECTIONS.push({id,name,wds,vis:'private',_mine:true,desc:'',created:avuiISO(),updated:avuiISO()});
  collDraft=null;
  saveMyColls();scheduleSave();hideDetail();state.selectedColl=null;render();
  showToast(wds.length?t('cro_coll_saved',{name,n:wds.length}):t('cro_coll_saved_empty',{name}));
}

function renameColl(cid,nom){
  const c=COLLECTIONS.find(x=>x.id===cid&&x._mine);if(!c)return;
  const name=(nom||'').trim().slice(0,60);
  if(!name||name===c.name){openCollDetail(cid);return;}   // buit o igual: es deixa com estava
  pushUndo('undo_coll_rename',{name:c.name});
  c.name=name;c.updated=avuiISO();saveMyColls();scheduleSave();openCollDetail(cid);
  showToast(t('cro_coll_renamed',{name}));
}

// Afegir i treure passen tots dos per aqui, cridat des de la fitxa i des dels menus.
// Retorna si ha canviat res, perque qui crida pugui decidir si avisa.
function setMember(cid,qid,on){
  const c=COLLECTIONS.find(x=>x.id===cid&&x._mine);if(!c)return false;
  const i=c.wds.indexOf(qid);
  if(on){
    if(i>=0)return false;
    pushUndo('undo_coll_add',{name:c.name});
    c.wds.push(qid);
  }else{
    if(i<0)return false;
    pushUndo('undo_coll_rm',{name:c.name});
    c.wds.splice(i,1);
    // ⚠️ NO es treu de la vista. Editar una llista i mirar el cronograma son dues coses: treure
    // algu d'una colleccio no ha de fer-lo desapareixer de sota els peus. Qui el vulgui fora de
    // la vista te la ✕ d'«A la vista». (Desactivar la colleccio SENCERA si que se l'emporta.)
  }
  c.updated=avuiISO();
  saveMyColls();recomputePresent();clearFitLatch();scheduleSave();
  return true;
}
function removeFromColl(cid,qid){ if(setMember(cid,qid,false))openCollDetail(cid); }

// ===== «Afegeix a…» =====
// Nomes surten les colleccions PROPIES: les de serie son contingut d'autor i s'editen al
// dashboard. Reaprofita el menu flotant de les barres, que ja es generic.
const myColls=()=>COLLECTIONS.filter(c=>c._mine);
// La descripcio s'escapa sencera i NOMES es deixa passar el <br>: les descripcions son
// text pla (moltes venen de Wikidata, que es public i editable) pero les d'autor poden
// voler un salt de linia. Qualsevol altra etiqueta es queda escapada i es veu tal qual.
const descHtml=v=>esc(v).replace(/&lt;br\s*\/?&gt;/gi,'<br>');

function personQid(pid){
  const p=PEOPLE.find(x=>x.id===pid);
  return (p&&/^Q\d+$/.test(p.wd||''))?p.wd:null;
}
// La llista de colleccions propies per a un personatge, amb ✓ a les que ja el tenen.
// La comparteixen el menu propi (des del + i des de la fitxa) i el desplegable del ⋮.
function collListHTML(q){
  return myColls().map(c=>`<button class="bmsub" data-act="addto" data-cid="${c.id}" data-q="${q}">`
      +`<span class="bmtick">${c.wds.includes(q)?'✓':''}</span>${esc(c.name)}</button>`).join('')
    +`<button class="bmsub bmnew" data-act="addnew" data-q="${q}">${t('cro_coll_addnew')}</button>`;
}
// Des del ⋮ el submenu es DESPLEGA a dins, no substitueix el menu: substituir-lo et deixava una
// llista flotant sense context ni manera de tornar enrere.
function expandAddInMenu(pid,itemEl){
  const q=personQid(pid);
  if(!q){showToast(t('cro_coll_noqid'));return;}

  const box=document.createElement('div');

function openAddToColl(pid,anchorEl){

  if(!q){showToast(t('cro_coll_noqid'));closeBarMenu();return;}   // sense QID no es pot tornar a resoldre
  // ⚠️ El rectangle es llegeix ABANS de reescriure l'innerHTML: si l'ancoratge fos un node

// Des dels menus, una colleccio nova s'obre en ESBORRANY (no es crea fins que prems Desa).
function newCollWith(q){ closeBarMenu();openNewCollCard(q); }

// ============================================================
// [7] SEARCH (add a person to the timeline by name)
// ============================================================
const q=$('#q'),results=$('#results');
const deaccent=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();   // case- & accent-insensitive
let searchIdx=-1, wdTerm='', wdResults=[], wdStatus='idle', wdTimer=null, wdSeq=0;
const wdCache=new Map();   // cau de resultats de cerca per terme normalitzat (només memòria): repetir una cerca és instantani, sense xarxa
const dropKnown=arr=>{const inDB=new Set(PEOPLE.map(p=>p.wd).filter(Boolean));return arr.filter(w=>!inDB.has(w.qid));};   // del cau, treu qui ja tinguem/afegit
// ── Peces COMPARTIDES entre el cercador de dalt i el de la fitxa d'una col·lecció (20/11/2026).
// Cada cercador només posa la manera de pintar els resultats i què fa en triar-ne un.
const cercaLocal=term=>{const tt=deaccent((term||'').trim());return tt?PEOPLE.filter(p=>deaccent(L(p.name)).includes(tt)):[];};
// Wikidata: primer autocompletat (bon rànquing) i, si no troba res, text complet. Amb cau per terme.
// Els errors NO es guarden a la cau: la propera vegada es torna a provar.
function wdBusca(term){
  const key=deaccent(term.trim());
  if(wdCache.has(key))return Promise.resolve(dropKnown(wdCache.get(key)));
  if(typeof gtag!=='undefined')gtag('event','cerca_wikidata',{text:term.trim()});
  return entitySearch(term).then(out=>out.length?out:fulltextSearch(term)).then(out=>{wdCache.set(key,out);return out;});
}
// Un resultat de Wikidata passa a ser una persona de PEOPLE (de sessió). Torna l'id.
function wdAPersona(w){
  const id='wd_'+w.qid;
  if(!PEOPLE.some(p=>p.id===id))PEOPLE.push({id,wd:w.qid,name:w.name,birth:w.birth,death:w.death,cats:guessCats(w.desc),gender:'',wiki:w.article,desc:w.desc||'',_lang:LANG,_session:true,_ts:Date.now()});
  return id;
}

const localRow=p=>{const added=state.present.has(p.id);return `<div class="row ${added?'disabled':''}" data-add="${p.id}"><span class="swatch" style="background:${swatchBg(p)}"></span>${esc(L(p.name))}<span class="yr">${added?t('cro_already_added'):p.birth+'\u2013'+(p.death==null?'':p.death)}</span></div>`;};
// Igual que localRow/#onview/la fitxa: el nom ve de Wikidata (public i editable) i va a
// innerHTML, aixi que passa per esc(). Era l'unica fila que no ho feia. birth/death son
// numeros (parseInt a wdYear), no cal.
// Dues formes: la normal i la de qui existeix pero no te dates. Aquesta darrera va
// DESACTIVADA (no es pot afegir a una linia de temps algu de qui no saps quan va viure)
// pero es mostra igualment, amb el motiu i un enllac per completar-ho a Wikidata. Amagar-lo
// era pitjor: la cerca deia «cap persona trobada» quan la persona hi era.
const wdExtIco='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3"/><path d="M10 2h4v4M14 2L8 8"/></svg>';
const wdRow=w=>w.nodate
  ? `<div class="row disabled nodate" title="${esc(t('cro_wd_nodate_why'))}"><span class="swatch" style="background:${NOCAT_COLOR}"></span><span class="who">${esc(w.name)}</span><span class="yr">${t('cro_wd_nodate')}</span><a class="extlink" href="${esc(w.article)}" target="_blank" rel="noopener" title="${esc(t('cro_wd_nodate_cta'))}" onclick="event.stopPropagation()">${wdExtIco}</a></div>`

function renderDropdown(){
  const term=deaccent(q.value.trim());
  if(!term){results.classList.remove('open');return;}
  const local=cercaLocal(q.value);
  const localEv=EVENTS.filter(ev=>deaccent(L(ev.name)).includes(term));
  let html=local.map(localRow).join('');
  if(localEv.length)html+=`<div class="rowsep">${t('cro_events')}</div>`+localEv.map(evSearchRow).join('');
  // Wikidata: mostrem l'estat de la xarxa (engegat només a partir de 2 lletres → wdStatus!=='idle')
  if(wdStatus!=='idle'){
    if(local.length||localEv.length)html+=`<div class="rowsep">Wikidata</div>`;
    if(wdStatus==='loading')html+=`<div class="row loading">${t('searching_wikidata')}</div>`;
    else if(wdStatus==='error')html+=`<div class="row wderror"><span>${t('cro_wd_fail')}</span><button type="button" class="retry" data-retry>${t('retry')}</button></div>`;
    else if(wdStatus==='done'){html+=wdResults.map(wdRow).join('');if(!wdResults.length)html+=`<div class="row disabled">${t('cro_wd_none')}</div>`;}
  }
  if(!html)html=`<div class="row disabled">${t('cro_no_match')}</div>`;
  results.innerHTML=html;results.classList.add('open');highlightSearch(0);
}
function runSearch(){
  const term=q.value.trim();
  if(!term){results.classList.remove('open');return;}
  const norm=deaccent(term);
  if(norm!==wdTerm){
    wdTerm=norm;wdResults=[];
    if(term.length>=2&&wdCache.has(norm)){          // cau: servim a l'instant, sense crida ni spinner
      clearTimeout(wdTimer);wdSeq++;                 // cancel·la el debounce pendent i invalida respostes en vol
      wdResults=dropKnown(wdCache.get(norm));wdStatus='done';
    }else{
      wdStatus=term.length>=2?'loading':'idle';scheduleWikidata(term);
    }
  }
  renderDropdown();
}

// --- Wikidata live search: humans only (P31=Q5), Catalan labels with es/en fallback ---
const wdYear=iso=>{const m=/^(-?\d+)/.exec(iso);if(!m)return null;const y=parseInt(m[1],10);return y<=0?y-1:y;};   // ISO astronomical -> our aC convention
const WDQ='https://query.wikidata.org/sparql?format=json&query=';
// Els camps de la SPARQL depenen de l'idioma actiu, aixi que es construeixen a cada crida
// (no es poden precalcular en una const: setLang() els invalidaria).
//   - wikibase:language vol llista separada per COMES, no per barres com wdLangs().
//   - l'article de Viquipedia surt del wiki de l'idioma actiu.
function wdFields(){
  const csv=wdLangs().split('|').join(',');
  return 'OPTIONAL { ?item wdt:P569 ?birth. } OPTIONAL { ?item wdt:P570 ?death. } OPTIONAL { ?article schema:about ?item ; schema:isPartOf <https://'+LANG+'.wikipedia.org/> . } SERVICE wikibase:label { bd:serviceParam wikibase:language "'+csv+'". }';
}
function scheduleWikidata(term){clearTimeout(wdTimer);if(term.trim().length<2)return;wdTimer=setTimeout(()=>fetchWikidata(term.trim()),300);}
function wdParse(data,keepKnown){
  const binds=(data&&data.results&&data.results.bindings)||[], seen=new Set(), inDB=new Set(PEOPLE.map(p=>p.wd).filter(Boolean)), out=[];
  for(const b of binds){
    const qid=b.item.value.split('/').pop();
    if(seen.has(qid)||(!keepKnown&&inDB.has(qid)))continue;
    // ⚠️ No n'hi ha prou de mirar si ?birth existeix. Quan a Wikidata la declaracio PREFERIDA
    // de P569 es «valor desconegut», la SPARQL no deixa el camp buit: hi lliga un NODE EN BLANC
    // (una URI .well-known/genid/...). Es truthy, aixi que passava el guard, i despres wdYear()
    // en treia null: al desplegable hi sortia «null–» i la fila, en clicar-la, no feia res
    // (addWikidataPerson surt amb birth==null). Passa amb Zaratustra, les dates del qual son
    // disputades de debo. Per tant es parseja PRIMER i es descarta si no en surt un any.
    const by=b.birth?wdYear(b.birth.value):null;
    seen.add(qid);
    // Sense any no es pot posar a la linia, pero SI que existeix: es marca i el desplegable
    // el mostra desactivat amb el motiu. Descartar-lo aqui feia que la cerca digues «cap
    // persona trobada», que es fals. Els altres consumidors (toggleCollection, refreshStale)
    // ja salten els birth==null pel seu compte, aixi que no se'ls cola ningu sense any.
    if(by==null){out.push({qid,name:(b.itemLabel&&b.itemLabel.value)||qid,desc:(b.itemDescription&&b.itemDescription.value)||'',birth:null,death:null,nodate:true,article:'https://www.wikidata.org/wiki/'+qid});continue;}
    // La mort pot venir pel mateix cami; si no es parseja queda null, que al nostre model vol
    // dir VIU. Es assumible perque son casos rars, pero si algun dia cal distingir «viu» de
    // «data desconeguda» el model de PEOPLE ha de canviar, no aixo.
    out.push({qid,name:(b.itemLabel&&b.itemLabel.value)||qid,desc:(b.itemDescription&&b.itemDescription.value)||'',birth:by,death:b.death?wdYear(b.death.value):null,article:(b.article&&b.article.value)||('https://www.wikidata.org/wiki/'+qid)});
  }
  return out;
}
// one place for network policy: 9 s timeout + non-2xx = failure, so the UI can tell a real error from "no results"
function wdFetch(url,opts){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),9000);
  return fetch(url,Object.assign({signal:ctl.signal},opts||{}))
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .finally(()=>clearTimeout(t));
}
// resolve a list of Q-ids to {name,dates,article} via a fast VALUES query (optionally keep only humans)
function byIds(ids,humansOnly,keepKnown){
  if(!ids.length)return Promise.resolve([]);
  // Tots els ids van en UNA consulta, i Wikidata la talla per llargada d'URL (414 URI Too
  // Long a partir d'uns 9KB). Amb WD_IDS_MAX no hi arribem mai; si algu passa una llista
  // mes llarga val mes perdre'n la cua —i dir-ho— que rebre un 414 i quedar-se sense res.
  if(ids.length>WD_IDS_MAX){
    console.error('[HB] byIds() ha rebut '+ids.length+' Q-ids i el maxim per consulta es '
      +WD_IDS_MAX+': es demanen nomes els '+WD_IDS_MAX+' primers. Cal partir la peticio.');
    ids=ids.slice(0,WD_IDS_MAX);
  }
  const query=`SELECT ?item ?itemLabel ?itemDescription ?birth ?death ?article WHERE { VALUES ?item { ${ids.map(q=>'wd:'+q).join(' ')} } ${humansOnly?'?item wdt:P31 wd:Q5.':''} ${wdFields()} }`;
  return wdFetch(WDQ+encodeURIComponent(query),{headers:{Accept:'application/sparql-results+json'}}).then(data=>{
    const byq={};wdParse(data,keepKnown).forEach(x=>byq[x.qid]=x);
    return ids.map(q=>byq[q]).filter(Boolean);   // preserve the search-relevance order
  });
}
// primary: fast label/alias autocomplete (great ranking), then keep only humans
function entitySearch(term){
  const url='https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=15&language='+LANG+'&uselang='+LANG+'&search='+encodeURIComponent(term);
  return wdFetch(url).then(d=>byIds(((d.search||[]).map(x=>x.id).filter(t=>/^Q\d+$/.test(t))),true));
}
// fallback: full-text search (finds people by surname / mid-name that the autocomplete buries under common words)
function fulltextSearch(term){
  const safe=term.replace(/[^\p{L}\p{N} ]/gu,'').trim();if(!safe)return Promise.resolve([]);
  const url='https://www.wikidata.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=0&srlimit=10&srsearch='+encodeURIComponent(safe+'* haswbstatement:P31=Q5');
  return wdFetch(url).then(d=>byIds((((d.query&&d.query.search)||[]).map(x=>x.title).filter(t=>/^Q\d+$/.test(t))),false));
}
function fetchWikidata(term){
  const seq=++wdSeq;
  wdBusca(term).then(out=>{if(seq!==wdSeq)return;wdResults=out;wdStatus='done';renderDropdown();})   // seq: una cerca més nova la substitueix
    .catch(()=>{if(seq!==wdSeq)return;wdResults=[];wdStatus='error';renderDropdown();});
}

// Etiquetes «sticky»: quan un bloc (era o marc) és més ample que la pantalla i hi fas zoom/scroll,
// el nom segueix el marge esquerre visible en lloc de marxar amb l'inici del bloc (deixant una caixa buida).
// Si el bloc és més estret que el nom, no es mou (evita comportaments estranys).
function stickLabels(){
  const sl=scroll.scrollLeft;
  eraTracksEl.querySelectorAll('.blockzone').forEach(bz=>{
    const lab=bz.querySelector('.blabel');if(!lab)return;
    const pad=14,room=bz.offsetWidth-lab.offsetWidth-pad*2;
    const s=Math.max(0,Math.min(sl-bz.offsetLeft,room));
    lab.style.left=(pad+s)+'px';
  });
  eraTracksEl.querySelectorAll('.seg').forEach(sg=>{
    const name=sg.querySelector('.segname');if(!name)return;
    const years=sg.querySelector('.segyears');
    const pad=13,room=sg.offsetWidth-name.offsetWidth-pad*2;
    const s=Math.max(0,Math.min(sl-sg.offsetLeft,room));

    name.style.transform=tx;if(years)years.style.transform=tx;
  });
}

// [9] ZOOM & PAN
// ============================================================
function fitPx(){const vw=scroll.clientWidth-24;return Math.max(0.005,vw/(YEAR_MAX-YEAR_MIN));}          // zoom that fits the whole span
const FOCUS_FROM=window.matchMedia('(pointer:coarse)').matches?1760:1500;   // phones: start more zoomed-in (fewer years across the smaller screen)
const FUTURE_MARGIN_PX=240;   // fixed px reserved past "today" so grown living-pills + fade never hug/clip the right edge
function focusPx(){const vw=Math.max(60,scroll.clientWidth-24-FUTURE_MARGIN_PX);return Math.max(fitPx(),Math.min(20,vw/(NOW_YEAR-FOCUS_FROM)));}   // default focus ~1500→today, with future margin
function defaultView(){pxPerYear=focusPx();render();scroll.scrollLeft=Math.min(Math.max(0,x(FOCUS_FROM)-16),maxScroll());}   // clamp: the focus target can sit past the canvas end and leave a sliver of blank on the right
function setZoom(v){pxPerYear=Math.max(fitPx(),Math.min(20,v));render();clampScroll();}
// Max scroll is measured against OUR canvas width, not scrollWidth: any stray absolutely-positioned
// leftover (a hover guide parked at an old zoom, an overflowing label) inflates scrollWidth and would
// hand back a bogus, far too large limit — which is exactly how the runaway scroll happened.
function maxScroll(){return Math.max(0,(parseFloat(inner.style.width)||scroll.scrollWidth)-scroll.clientWidth);}
function clampScroll(){const max=maxScroll();if(scroll.scrollLeft>max)scroll.scrollLeft=max;}   // keep scrollLeft in range so zooming out doesn't leave it parked past the end
// Pan (no zoom change) so a person's bar is centred on screen.
function panToPerson(id){
  const p=PEOPLE.find(x=>x.id===id);
  if(!p||p._startX==null)return;
  const cx=p._startX+p._pillW/2;            // horizontal centre of the bar
  // ROW_H i BAR_H, NO 34 i 13: applyMetrics() els baixa a 25 i 20 quan la pantalla es
  // baixa (max-height:560px — el mobil en horitzontal), i amb els numeros clavats el
  // scroll requeia lane*9+13-BAR_H/2 px per sota. Mesurat amb la BD sencera: 165px al
  // carril 18, mes de mitja pantalla — el personatge que demanaves centrar quedava fora.
  const cy=barsTop()+p._lane*ROW_H+BAR_H/2;
  scroll.scrollTo({left:cx-scroll.clientWidth/2,top:cy-scroll.clientHeight/2,behavior:'smooth'});
}

// Remove a person from the canvas (same as the × in "A la vista"). Seed-pinned people can't be removed.
// opts.batch: NO fa pushUndo ni render, i els deixa a qui crida. Es per treure diverses
// persones d'un sol gest (la ✕ del jocBar): un clic ha de ser UNA passa de «Desfés» i un
// sol repintat, no una passa i un repintat per nom.
function removePerson(id,opts){
  if(SEED_PINNED.includes(id))return;
  const batch=!!(opts&&opts.batch);
  if(!batch)pushUndo('cro_act_remove',{name:L((PEOPLE.find(p=>p.id===id)||{}).name)});
  state.pinned.delete(id);
  clearFitLatch();
  if(state.focus===id)state.focus=null;   // si treus l'original, ja no hi ha focus fixat a dalt
  recomputePresent();closeDetailIfGone();
  // La URL es neteja comparant el QID REAL de l'entrada, no l'id sintetic 'wd_<QID>': si el
  // personatge ja era a PEOPLE (Aristotil, p.ex.) mostraPersonatge reutilitza el seu id de la BD
  // ('aristotil'), i la comparacio amb 'wd_Q868' no lligava mai => el ?person= es quedava penjat.
  if(_pbarId&&id===_pbarId){_pbarId=null;
    const _wd=(PEOPLE.find(x=>x.id===id)||{}).wd;
    if(PERSON_QID&&(_wd===PERSON_QID||id==='wd_'+PERSON_QID))history.replaceState(null,'',location.pathname);
    pbar.textContent='';pbar.classList.remove('on');delete pbar.dataset.state;}
  scheduleSave();if(!batch)render();
}
// "Show context": add every SEED-DB person whose life overlaps, or is within 20 years of, this person.
// DETERMINISTA: recorre només la BD original (salta els `_session` baixats de Wikidata/localStorage),
// així "Mostra context" dóna el mateix resultat per a tothom, independentment de l'historial de cerques.
// El dataset canònic el controla l'autor editant la llista PEOPLE; qui vulgui més gent l'afegeix a mà.
function showContext(id){
  const t=PEOPLE.find(p=>p.id===id);if(!t)return;
  pushUndo('cro_act_context');
  hideDetail();   // tanca el panell de detall perquè es vegi el context que s'afegeix (mòbil i desktop)
  state.focus=id;   // l'original queda fixat al carril de dalt; els personatges de context, a sota
  const a1=t.birth,a2=deathOf(t);
  PEOPLE.forEach(o=>{
    if(o._session)return;                          // ← només BD original, mai el que s'hagi baixat en local
    if(o.id===id||state.present.has(o.id))return;
    const gap=Math.max(0,Math.max(o.birth-a2,a1-deathOf(o)));   // 0 if the lifespans overlap
    if(gap<=20)state.pinned.add(o.id);
  });
  clearFitLatch();
  recomputePresent();render();panToPerson(id);
}
