<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cronograma — prova</title>
<style>
  /* ============================================================
     DESIGN TOKENS
     Change look & feel from here. Scale: 16/14/12/11 px · weights 600/500/400.
     Radii: --r-card (rectangles) · --r-pill (round). Structure = slate; data = colour.
     ============================================================ */
  :root{
    --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
    --surface:#F0EFED; --border:#E6E5E3; --blue:#2783DE; --blueSoft:#E5F2FC;
    /* collection (people) colours — the vivid "data" layer */
    --philosophy:#5E9FE8; --music:#BF8EDA; --literature:#DE9255;
    --science:#72BC8F; --politics:#DF84A8; --painting:#D4A72C; --religion:#A24E5E;
    /* events + structure — the calm layer */
    --eventc:#4B4F57;
    --struct:#8B93AD; --struct-ink:#565D78; --band:#F3F4F7; --r-card:8px; --r-pill:999px;
  }

  /* ===== Base ===== */
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--canvas);font-size:14px;line-height:1.5;}
  .app{display:flex;flex-direction:column;height:100vh;min-height:640px;}

  /* ===== Top bar (brand · search · zoom controls) ===== */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--border);flex:0 0 auto;background:var(--canvas);z-index:5;}
  .brand{font-weight:600;font-size:16px;white-space:nowrap;}
  .brand .sub{color:var(--text2);font-weight:400;font-size:13px;margin-left:6px;}
  .search{position:relative;flex:1 1 auto;max-width:420px;}
  .search input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--soft);}
  .search input:focus{border-color:var(--blue);background:#fff;}
  .results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.06);max-height:280px;overflow:auto;display:none;z-index:20;}
  .results.open{display:block;}
  .results .row{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;}
  .results .row:hover{background:var(--soft);}
  .results .row.active{background:var(--blueSoft);}
  .results .rowsep{padding:7px 12px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);border-top:1px solid var(--border);}
  .results .row.loading{color:var(--text2);font-style:italic;cursor:default;}
  .results .row .yr{color:var(--text2);font-size:12px;margin-left:auto;}
  .results .row.disabled{opacity:.5;cursor:default;}
  .controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .hint{font-size:11px;color:var(--text2);white-space:nowrap;margin-left:2px;}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--text);min-width:36px;min-height:36px;}
  .btn:hover{background:var(--soft);}

  /* ===== Sidebar (marcs · col·leccions · a la vista) ===== */
  .body{display:flex;flex:1 1 auto;min-height:0;}
  .sidebar{flex:0 0 240px;border-right:1px solid var(--border);padding:16px;overflow:auto;background:var(--soft);}
  .sidebar h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:0 0 10px;font-weight:600;}
  .sidebar section{margin-bottom:24px;}
  .filter{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:14px;}
  .filter input{width:16px;height:16px;accent-color:var(--blue);}
  .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}

  .areaList{display:flex;flex-direction:column;gap:7px;}
  .areaTag{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-card);border:1px solid var(--border);cursor:pointer;font-size:14px;user-select:none;background:#fff;transition:opacity .12s,background .12s,border-color .12s,box-shadow .12s;}
  .areaTag .swatch{width:13px;height:13px;border-radius:3px;}
  .areaTag .cnt{margin-left:auto;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;}
  .areaTag.on{font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .areaTag.off{opacity:.4;filter:grayscale(.5);}
  .areaTag.off:hover{opacity:.7;}
  .areaTag.on:hover{filter:brightness(.98);}

  .onview .item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;}
  .onview .item .x{margin-left:auto;color:var(--text2);cursor:pointer;border:none;background:none;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px;}
  .onview .item .x:hover{background:var(--surface);color:var(--text);}
  .onview .empty{color:var(--text2);font-size:13px;font-style:italic;}

  /* ===== Stage: the scrolling timeline canvas ===== */
  .stage{flex:1 1 auto;position:relative;min-width:0;display:flex;flex-direction:column;}
  .scroll{flex:1 1 auto;overflow:auto;position:relative;cursor:grab;user-select:none;}
  .scroll.grabbing,.scroll.grabbing *{cursor:grabbing;}
  .inner{position:relative;}

  /* ===== Era strata =====
     ERES backbone = pale wash spanning the whole canvas (the "ruler", always on).
     MARC blocks = opaque bordered cards on top, coloured per marc; the canvas grows with the lanes. */
  .eraPanel{position:absolute;left:0;top:0;background:var(--band);border-bottom:1px solid var(--border);box-shadow:0 8px 14px -10px rgba(40,44,60,.22);}
  .eraTracks{position:absolute;top:0;left:0;}
  .segwrap{position:absolute;inset:0;}
  .blockzone{position:absolute;top:0;overflow:hidden;pointer-events:none;}
  .blockzone .blabel{position:absolute;top:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;opacity:.9;}
  .seg{position:absolute;top:0;display:flex;flex-direction:column;justify-content:center;padding:0 14px;overflow:hidden;border-right:1px solid rgba(0,0,0,.06);}
  .seg .segname{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--struct-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;}
  .seg .segyears{font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;margin-top:2px;line-height:1.2;}
  .seg.mov{border-right:none;border-radius:var(--r-card) var(--r-card) 0 0;padding:0 10px;}
  .seg.mov .segname{font-size:12px;letter-spacing:.03em;}
  .seg.mov .segyears{font-size:11px;margin-top:0;}

  /* ===== Events (vertical markers: name on top, year at the foot) ===== */
  .eventsRail{position:absolute;left:0;top:0;pointer-events:none;}
  .event{position:absolute;top:0;}
  .event .eline{position:absolute;left:0;width:2px;margin-left:-1px;background:linear-gradient(to bottom,var(--eventc),rgba(44,44,43,.22));border-radius:2px;}
  .event .edot{position:absolute;left:0;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--eventc);box-shadow:0 0 0 4px rgba(44,44,43,.13);}
  .event .ename{position:absolute;left:10px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--eventc);cursor:pointer;pointer-events:auto;}
  .event .ename:hover{text-decoration:underline;}
  .event .eyear{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:600;color:var(--eventc);background:#fff;border:1.5px solid var(--eventc);padding:2px 9px;border-radius:var(--r-card);font-variant-numeric:tabular-nums;}

  /* ===== People bars (the "data": a bar per lifespan; living ones fade to the future) ===== */
  .bars{position:absolute;left:0;}
  .bar{position:absolute;height:26px;border-radius:var(--r-card);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:500;color:#fff;cursor:pointer;white-space:nowrap;overflow:visible;transition:opacity .12s;box-shadow:0 1px 3px rgba(40,44,60,.18);}
  .bar .lbl{pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.42);}
  .bar.sel{outline:2px solid var(--text);outline-offset:1px;}
  .bar.alive{box-shadow:none;border-top-right-radius:0;border-bottom-right-radius:0;}
  @keyframes barPop{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(39,131,222,.6);}6%{transform:scale(1.12);}16%{transform:scale(1);box-shadow:0 0 0 12px rgba(39,131,222,0);}24%{box-shadow:0 0 0 0 rgba(39,131,222,.5);}40%{box-shadow:0 0 0 11px rgba(39,131,222,0);}50%{box-shadow:0 0 0 0 rgba(39,131,222,.42);}68%{box-shadow:0 0 0 11px rgba(39,131,222,0);}78%{box-shadow:0 0 0 0 rgba(39,131,222,.34);}100%{box-shadow:0 0 0 10px rgba(39,131,222,0);}}
  .bar.justAdded{animation:barPop 4s ease-out;z-index:9;}
  .bar .menu{position:absolute;right:1px;top:50%;transform:translateY(-50%);display:none;width:20px;height:20px;padding:0;border:none;border-radius:5px;background:rgba(255,255,255,.92);color:var(--text);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .bar:hover .menu{display:flex;align-items:center;justify-content:center;}
  .bar .fade{position:absolute;top:0;bottom:0;pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent);}
  .emptyState{position:absolute;left:24px;font-size:14px;color:var(--text2);font-style:italic;pointer-events:none;}
  /* Floating context menu (bar ⋮ button) */
  .barmenu{position:fixed;display:none;background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:30;overflow:hidden;min-width:150px;}
  .barmenu.open{display:block;}
  .barmenu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;}
  .barmenu button:hover{background:var(--soft);}
  .barmenu button.danger{color:#C0392B;}

  /* ===== Hover guide + "today" line ===== */
  .guide{position:absolute;top:0;width:1px;background:var(--blue);pointer-events:none;display:none;z-index:8;}
  .guide .yr{position:absolute;top:2px;left:3px;background:var(--blue);color:#fff;font-size:11px;padding:2px 7px;border-radius:var(--r-card);white-space:nowrap;}
  .nowline{position:absolute;top:0;width:0;border-left:2px solid rgba(30,30,29,.4);pointer-events:none;}
  .nowline .lbl{position:absolute;top:2px;left:5px;background:var(--text);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-card);white-space:nowrap;}

  /* ===== Axis (sticks to the viewport bottom when content overflows) ===== */
  .axis{position:sticky;bottom:0;height:32px;border-top:1px solid var(--border);background:var(--canvas);z-index:7;}
  .axis .inner2{position:absolute;top:0;left:0;height:100%;}
  .tick{position:absolute;top:0;height:100%;border-left:1px solid var(--border);padding-left:5px;font-size:11px;color:var(--text2);display:flex;align-items:center;}
  .tick.tinf{border-left:none;color:var(--text2);font-weight:600;letter-spacing:.05em;}
  .tick.tbound{border-left:2px dashed var(--border);color:var(--text);font-weight:700;}

  /* ===== Detail panel (right side, opens on click) ===== */
  .detail{flex:0 0 280px;border-left:1px solid var(--border);padding:20px;overflow:auto;background:#fff;display:none;}
  .detail.open{display:block;}
  .detail .close{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--text2);}
  .detail h2{font-size:16px;font-weight:600;margin:0 0 4px;}
  .detail .life{color:var(--text2);font-size:12px;margin-bottom:14px;}
  .detail .areas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .detail .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:var(--r-card);background:var(--soft);border:1px solid var(--border);}
  .detail .meta{font-size:12px;color:var(--text2);margin:6px 0;}
  .detail .desc{font-size:14px;margin:14px 0;}
  .detail a.wiki{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-size:14px;}
  .detail a.wiki:hover{text-decoration:underline;}
  .detail .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .detail .dbtn{border:1px solid var(--border);background:#fff;border-radius:var(--r-card);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text);}
  .detail .dbtn:hover{background:var(--soft);}
  .detail .dbtn.danger{color:#C0392B;border-color:#E7B7B0;}
  .detail .dbtn.danger:hover{background:#FBEDEB;}
</style>
</head>
<body>
<!-- ============================================================
     MARKUP — static shell; every dynamic region is filled by render()
     ============================================================ -->
<div class="app">
  <header class="topbar">
    <div class="brand">🕰️ Cronograma<span class="sub">prova · Il·lustració → s. XX</span></div>
    <div class="search">
      <input id="q" type="text" placeholder="Cerca i afegeix un personatge…" autocomplete="off" />
      <div class="results" id="results"></div>
    </div>
    <div class="controls">
      <button class="btn" id="zoomOut" title="Allunya">−</button>
      <button class="btn" id="zoomIn" title="Apropa">+</button>
      <button class="btn" id="reset" title="Restableix">Reset</button>
      <span class="hint">⌘/pinça per fer zoom</span>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <section>
        <h3>Marcs històrics</h3>
        <div id="regions"></div>
      </section>
      <section>
        <h3>Col·leccions · clica per activar</h3>
        <div class="areaList" id="filters"></div>
      </section>
      <section>
        <h3>A la vista</h3>
        <div class="onview" id="onview"></div>
      </section>
    </aside>
    <main class="stage">
      <div class="scroll" id="scroll">
        <div class="inner" id="inner">
          <div class="eraPanel" id="eraPanel"></div>
          <div class="eraTracks" id="eraTracks"></div>
          <div class="eventsRail" id="eventsRail"></div>
          <div class="nowline" id="nowline"><span class="lbl"></span></div>
          <div class="bars" id="barsLayer"></div>
          <div class="guide" id="guide"><span class="yr"></span></div>
        </div>
        <div class="axis" id="axis"><div class="inner2" id="axisInner"></div></div>
      </div>
    </main>
    <aside class="detail" id="detail"></aside>
  </div>
</div>
<div class="barmenu" id="barmenu"></div>
<script>
// ============================================================
// [1] DATA  —  edit here to add eras, events and people.
// Years: negative = aC. A person with death:null is alive (fades to the future).
// Apostrophes inside these strings MUST be written ' (single-quoted JS literals).
// ============================================================
const AREA_COLORS={
  'Filosofia':'#5E9FE8','Música':'#BF8EDA','Literatura':'#DE9255',
  'Ciència':'#72BC8F','Política':'#DF84A8','Pintura':'#D4A72C','Religió':'#A24E5E'
};
const NOW_YEAR=new Date().getFullYear();

// ERES: the always-on backbone — the macro-eras that act as the "ruler" of the timeline.
// Not a toggleable marc; rendered as a pale wash spanning the whole eras canvas.
const ERAS_COLOR='#8B93AD';
const ERAS=[
  {name:'Prehistòria',start:-12000,end:-3300},
  {name:'Edat Antiga',start:-3300,end:476},
  {name:'Edat Mitjana',start:476,end:1492},
  {name:'Edat Moderna',start:1492,end:1789},
  {name:'Edat Contemporània',start:1789,end:NOW_YEAR}
];
// MARCS: toggleable historical frames. Each is a set of period `blocks`, told apart by colour.
// All blocks render identically (same size/shape) and share the same stacking area over the eras.
// Add more frames here later (Amèrica, Àsia…) — each just needs a colour and its blocks.
const MARCS=[
  {id:'west',name:'Occident',color:'#5E9FE8',blocks:[
    {name:'Paleolític',start:-12000,end:-9000},
    {name:'Neolític',start:-9000,end:-3000},
    {name:'Edat dels Metalls',start:-3000,end:-800},
    {name:'Primeres civilitzacions',start:-3300,end:-500},
    {name:'Grècia clàssica',start:-800,end:-323},
    {name:'Hel·lenisme',start:-323,end:-31},
    {name:'República romana',start:-509,end:-27},
    {name:'Imperi Romà',start:-27,end:476},
    {name:'Alta edat mitjana',start:476,end:1000},
    {name:'Plena edat mitjana',start:1000,end:1300},
    {name:'Baixa edat mitjana',start:1300,end:1492},
    {name:'Renaixement',start:1400,end:1600},
    {name:'Barroc',start:1600,end:1750},
    {name:'Il·lustració',start:1685,end:1789},
    {name:'Romanticisme',start:1800,end:1850},
    {name:'Realisme i positivisme',start:1850,end:1900},
    {name:'Avantguardes',start:1905,end:1945},
    {name:'Món contemporani',start:1945,end:NOW_YEAR}
  ]},
  {id:'es',name:'Espanya',color:'#C2A07C',blocks:[
    {name:'Antic Règim borbònic',start:1700,end:1808},
    {name:'Convulsió liberal',start:1808,end:1874},
    {name:'Restauració',start:1874,end:1931},
    {name:'II República',start:1931,end:1939},
    {name:'Franquisme',start:1939,end:1975}
  ]}
];
const EVENTS=[
  {id:'revfr',name:'Revolució Francesa',year:1789,wiki:'https://ca.wikipedia.org/wiki/Revolució_Francesa',desc:'Procés revolucionari que va enderrocar l\u0027Antic Règim a França i va escampar per Europa els ideals de llibertat, igualtat i fraternitat.'},
  {id:'wwi',name:'Inici de la Primera Guerra Mundial',year:1914,wiki:'https://ca.wikipedia.org/wiki/Primera_Guerra_Mundial',desc:'Esclat del primer conflicte a escala global, que va redibuixar el mapa polític i social del segle XX.'},
  {id:'delt',name:'Fundació de DELT',year:2022,wiki:'https://deltproject.com/',desc:'Projecte sense ànim de lucre que combina intel·ligència artificial i drons per ajudar organitzacions de conservació de fauna, sobretot la detecció i protecció de tortugues marines davant la caça furtiva.'}
];
const PEOPLE=[
  {id:'socrates',wd:'Q913',name:'Sòcrates',birth:-470,death:-399,areas:['Filosofia'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Sòcrates',desc:'Filòsof atenès que no deixà escrits propis, considerat el pare de la filosofia occidental i del mètode socràtic.'},
  {id:'plato',wd:'Q859',name:'Plató',birth:-428,death:-348,areas:['Filosofia'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Plató',desc:'Filòsof atenès, deixeble de Sòcrates i fundador de l\u0027Acadèmia, autor de La República.'},
  {id:'diogenes',wd:'Q59180',name:'Diògenes',birth:-412,death:-323,areas:['Filosofia'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Diògenes_de_Sinope',desc:'Filòsof cínic grec, conegut per la seva vida austera i les seves crítiques mordaces a les convencions socials.'},
  {id:'aristotil',wd:'Q868',name:'Aristòtil',birth:-384,death:-322,areas:['Filosofia','Ciència'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Aristòtil',desc:'Filòsof i científic grec, deixeble de Plató i tutor d\u0027Alexandre Magne, sistematitzà gran part del saber antic.'},
  {id:'alexandre',wd:'Q8409',name:'Alexandre el Gran',birth:-356,death:-323,areas:['Política'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Alexandre_el_Gran',desc:'Rei de Macedònia, conquerí un dels imperis més vastos de l\u0027antiguitat abans dels 33 anys.'},
  {id:'epicur',wd:'Q43216',name:'Epicur',birth:-341,death:-270,areas:['Filosofia'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Epicur',desc:'Filòsof grec, fundador de l\u0027epicureisme, defensor d\u0027una vida senzilla orientada a la recerca del plaer moderat.'},
  {id:'cesar',wd:'Q1048',name:'Juli Cèsar',birth:-100,death:-44,areas:['Política'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Juli_Cèsar',desc:'General i dictador romà, la seva figura marca la transició de la República a l\u0027Imperi Romà.'},
  {id:'cleopatra',wd:'Q635',name:'Cleopatra',birth:-69,death:-30,areas:['Política'],gender:'F',wiki:'https://ca.wikipedia.org/wiki/Cleòpatra',desc:'Última reina ptolemaica d\u0027Egipte, coneguda per les seves aliances amb Juli Cèsar i Marc Antoni.'},
  {id:'jesucrist',wd:'Q302',name:'Jesucrist',birth:-4,death:30,areas:['Religió'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Jesús_de_Natzaret',desc:'Predicador i mestre jueu del segle I, figura central del cristianisme i un dels personatges més influents de la civilització occidental.'},
  {id:'gengiskhan',wd:'Q720',name:'Gengis Khan',birth:1162,death:1227,areas:['Política'],gender:'M',wiki:'https://ca.wikipedia.org/wiki/Gengis_Khan',desc:'Fundador i primer gran khan de l\u0027Imperi Mongol, el més extens de la història en superfície contínua.'},

// ============================================================
// [2] RANGE, CONFIG & STATE
// ============================================================
// Data extent → the drawable year window (with a little gutter each side).
const _blocks=[...ERAS,...MARCS.flatMap(m=>m.blocks)];
const _starts=[..._blocks.map(b=>b.start),...EVENTS.map(e=>e.year),...PEOPLE.map(p=>p.birth)];
const _ends=[..._blocks.map(b=>b.end),...EVENTS.map(e=>e.year),...PEOPLE.map(p=>p.death==null?NOW_YEAR:p.death)];
const DATA_MIN=Math.min(..._starts), DATA_MAX=Math.max(..._ends);
const GUTTER_YEARS=14;
const RIGHT_PAD_YEARS=150;   // must outlast FUTURE_MARGIN_PX in years at default zoom, or the browser clamps scrollLeft before the margin is reached
const YEAR_MIN=DATA_MIN-GUTTER_YEARS, YEAR_MAX=DATA_MAX+RIGHT_PAD_YEARS;
let pxPerYear=4;               // current zoom (pixels per year); set by defaultView()/setZoom()
const SEED_PINNED=['bernat'];  // always present, never removable
const DEFAULT_MARCS=['west'];  // marcs shown on load / after Reset (the eras backbone is always on)
const FUTURE_FADE=72;          // px the living bars (and the era band) fade out past "today"
const deathOf=p=>p.death==null?NOW_YEAR:p.death;
const isAlive=p=>p.death==null;

const state={present:new Set(),activeCols:new Set(),pinned:new Set(SEED_PINNED),hidden:new Set(),marcs:new Set(DEFAULT_MARCS),showEvents:true,selected:null};

// ============================================================
// [3] DOM REFS & SMALL HELPERS (coords, colours, formatting)
// ============================================================
const $=s=>document.querySelector(s);
const inner=$('#inner'),barsLayer=$('#barsLayer'),eraTracksEl=$('#eraTracks'),eraPanel=$('#eraPanel'),eventsRail=$('#eventsRail'),axisEl=$('#axis'),axisInner=$('#axisInner'),guide=$('#guide'),nowline=$('#nowline');
const x=y=>(y-YEAR_MIN)*pxPerYear;                 // year → x px
const totalW=()=>(YEAR_MAX-YEAR_MIN)*pxPerYear;    // full canvas width px

const NOCAT_COLOR='#4FB0A6';                        // people without a collection
const hasCat=p=>Array.isArray(p.areas)&&p.areas.length>0;
const stripeBg=(cols,seg)=>cols.length<2?cols[0]:`repeating-linear-gradient(135deg, ${cols.map((c,i)=>`${c} ${i*seg}px ${(i+1)*seg}px`).join(', ')})`;
const barBg=p=>hasCat(p)?stripeBg(p.areas.map(a=>AREA_COLORS[a]),14):NOCAT_COLOR;   // multi-collection → diagonal stripes
const swatchBg=p=>hasCat(p)?stripeBg(p.areas.map(a=>AREA_COLORS[a]),7):NOCAT_COLOR;
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};                                   // hex → translucent rgba
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return `rgb(${r},${g},${b})`;};   // darken toward black
const mix=(hex,f)=>{const n=parseInt(hex.slice(1),16);const m=v=>Math.round(255+(v-255)*f);return `rgb(${m((n>>16)&255)},${m((n>>8)&255)},${m(n&255)})`;};   // opaque tint toward white (f=0 white … 1 full colour)
const fmtY=y=>y<0?(-y)+' aC':''+y;
const linkLabel=url=>/wikipedia\.org/.test(url)?'Wikipedia':/wikidata\.org/.test(url)?'Wikidata':'Web';   // adaptive label for the detail link

// Guess categories from Wikidata itemDescription (conservative keyword matching)
const guessAreas=desc=>{if(!desc)return[];const d=desc.toLowerCase(),a=[];
  if(/filòsof|filósofo|philosopher/.test(d))a.push('Filosofia');
  if(/compositor|composer|música|music/.test(d))a.push('Música');
  if(/escriptor|escritor|writer|poeta|poet|dramaturgo|dramaturg|novel·lista|novelist/.test(d))a.push('Literatura');
  if(/físic|physicist|matemàtic|mathematician|astrònom|astronomer|científic|scientist|naturalista|naturalist/.test(d))a.push('Ciència');
  if(/rei|king|emperador|emperor|dictador|dictator|militar|military|president|independentista/.test(d))a.push('Política');
  if(/pintor|painter|escultor|sculptor/.test(d))a.push('Pintura');
  if(/profeta|prophet|religiós|religious|sant|saint/.test(d))a.push('Religió');
  return [...new Set(a)];};
const peopleOfArea=a=>PEOPLE.filter(p=>p.areas.includes(a));

// Which people are on the timeline right now = (in an active collection OR pinned) AND not hidden.
function recomputePresent(){const s=new Set();PEOPLE.forEach(p=>{const inActive=p.areas.some(a=>state.activeCols.has(a));if((inActive||state.pinned.has(p.id))&&!state.hidden.has(p.id))s.add(p.id);});state.present=s;}
function deactivateEmptyCols(){[...state.activeCols].forEach(a=>{if(!peopleOfArea(a).some(p=>state.present.has(p.id)))state.activeCols.delete(a);});}

// ============================================================
// [4] LAYOUT MATH (lane packing + vertical geometry)
// ============================================================
const MOV_LANE_H=40, MOV_BAR_H=34, MOV_PAD_BOT=6, ERAS_TOP=16, ERA_LABEL_H=26, EVENT_LABEL_H=38, GAP_AFTER=14;
// Greedy lane assignment so overlapping intervals stack instead of colliding.
function packSegs(segs){const arr=segs.map((s,idx)=>({idx,start:s.start,end:s.end})).sort((a,b)=>a.start-b.start);const ends=[];const lane=new Array(segs.length).fill(0);for(const it of arr){let placed=false;for(let l=0;l<ends.length;l++){if(it.start>=ends[l]){lane[it.idx]=l;ends[l]=it.end;placed=true;break;}}if(!placed){lane[it.idx]=ends.length;ends.push(it.end);}}return {lane,nLanes:Math.max(1,ends.length)};}
// All period blocks from the active marcs, pooled into one list and tagged with their marc's colour.
function activeBlocks(){const out=[];MARCS.forEach(m=>{if(state.marcs.has(m.id))m.blocks.forEach(b=>out.push({name:b.name,start:b.start,end:b.end,color:m.color}));});return out;}
function blockLanes(){const b=activeBlocks();return b.length?packSegs(b).nLanes:0;}
// The eras canvas grows with the number of block lanes (just like the people canvas).
function erasBlockH(){return ERAS_TOP+ERA_LABEL_H+blockLanes()*MOV_LANE_H+MOV_PAD_BOT;}
function eventLabelTop(){return erasBlockH()+6;}
function barsTop(){return eventLabelTop()+EVENT_LABEL_H+GAP_AFTER;}

function visiblePeople(){return PEOPLE.filter(p=>state.present.has(p.id));}
// Stack people into rows. Living pills grow to fit the name; dead bars keep their real lifespan
// (the label just overflows). Lanes pack by the bar, so overlapping names are allowed (click to disambiguate).
function packLanes(people){
  const sorted=[...people].sort((a,b)=>a.birth-b.birth);
  const laneEnds=[];
  sorted.forEach(p=>{
    const startX=x(p.birth);
    const nameW=p.name.length*7+20;
    const lifeW=Math.max(x(deathOf(p))-startX,8);
    const alive=isAlive(p);
    const pillW=alive?Math.max(lifeW,nameW):lifeW;
    const endX=startX+pillW+(alive?FUTURE_FADE:0);
    let lane=laneEnds.findIndex(e=>e+8<startX);
    if(lane===-1){lane=laneEnds.length;laneEnds.push(endX);}
    else laneEnds[lane]=endX;
    p._lane=lane;p._startX=startX;p._endX=endX;p._pillW=pillW;p._alive=alive;
  });
  return laneEnds.length;
}

// ============================================================
// [5] RENDER — rebuilds the whole view from `state` + `pxPerYear`
// ============================================================
function render(){
  recomputePresent();
  const nowX=x(NOW_YEAR);
  const W=Math.max(totalW(),nowX+FUTURE_FADE+8);   // ensure the future-fade always fits
  inner.style.width=W+'px';

  // --- Era strata: always-on eras backbone + pooled marc blocks (canvas grows with lanes) ---
  const erasH=erasBlockH();
  eraPanel.style.width=W+'px';
  eraPanel.style.height=erasH+'px';
  const futureMask=`linear-gradient(to right,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;   // band fades out at "today"
  eraPanel.style.webkitMaskImage=futureMask;
  eraPanel.style.maskImage=futureMask;
  eraTracksEl.style.width=W+'px';
  eraTracksEl.style.height=erasH+'px';
  const gw=x(DATA_MIN), FADE=72;
  const maskGrad=`linear-gradient(to right,transparent ${gw}px,#000 ${gw+FADE}px,#000 ${nowX}px,transparent ${nowX+FUTURE_FADE}px)`;  // fade both ends (past ∞ / future)
  const maskCss=`-webkit-mask-image:${maskGrad};mask-image:${maskGrad};`;
  // eras backbone: the macro-eras as a pale wash spanning the whole canvas, names at the top
  const backboneEls=ERAS.map((b,k)=>{
    const bl=x(b.start),bw=Math.max(x(b.end)-x(b.start),2);
    const tint=hexA(ERAS_COLOR,k%2?0.13:0.06);
    const dv=k>0?`border-left:1px solid ${hexA(ERAS_COLOR,.26)};`:'';
    return `<div class="blockzone" style="left:${bl}px;width:${bw}px;height:${erasH}px;background:${tint};${dv}"><span class="blabel" style="left:14px;top:${ERAS_TOP}px;color:${shade(ERAS_COLOR,.55)}">${b.name}</span></div>`;
  }).join('');
  // marc blocks: every active marc pooled into shared lanes, identical style, coloured per marc
  const blocks=activeBlocks();
  const bpk=blocks.length?packSegs(blocks):{lane:[]};
  const blockEls=blocks.map((b,j)=>{
    const left=x(b.start),w=Math.max(x(b.end)-x(b.start),2);
    const rowTop=ERAS_TOP+ERA_LABEL_H+bpk.lane[j]*MOV_LANE_H;
    const c=b.color;
    return `<div class="seg mov" style="left:${left+1}px;width:${Math.max(w-2,2)}px;top:${rowTop}px;height:${MOV_BAR_H}px;background:${mix(c,.28)};border:1px solid ${mix(c,.55)};border-bottom:3px solid ${c};" title="${b.name} (${fmtY(b.start)}–${fmtY(b.end)})"><span class="segname">${b.name}</span><span class="segyears">${fmtY(b.start)}–${fmtY(b.end)}</span></div>`;
  }).join('');
  eraTracksEl.innerHTML=`<div class="segwrap" style="${maskCss}">${backboneEls}${blockEls}</div>`;

  // --- People (measure first so we know the content height) ---
  eventsRail.style.width=W+'px';
  const people=visiblePeople();
  const lanes=packLanes(people);
  const rowH=26+8;
  const peopleH=people.length?lanes*rowH+16:46;
  const EVENT_YEAR_BAND=32;   // breathing room so event-year pills clear the lowest bar row
  const contentH=barsTop()+peopleH+EVENT_YEAR_BAND;

  // --- Events (name on top, full line, year pill at the foot; two rows to avoid name overlap) ---
  const evNameTop=eventLabelTop(), evYearTop=contentH-24;
  const evRowRight=[-1e9,-1e9];
  const evPlaced=EVENTS.map(ev=>({ev,left:x(ev.year),w:ev.name.length*7+16})).sort((a,b)=>a.left-b.left);
  evPlaced.forEach(o=>{
    let row=evRowRight.findIndex(r=>r+12<o.left);
    if(row===-1)row=evRowRight[0]<=evRowRight[1]?0:1;
    o.row=row;evRowRight[row]=o.left+o.w;
  });
  eventsRail.innerHTML=state.showEvents?evPlaced.map(o=>{
    const ev=o.ev,left=o.left,nameTop=evNameTop+o.row*16,dotTop=nameTop+18,lineTop=dotTop+3;
    const lineH=Math.max(evYearTop-lineTop-2,0);
    return `<div class="event" style="left:${left}px"><div class="ename" data-ev="${ev.id}" style="top:${nameTop}px">${ev.name}</div><div class="edot" style="top:${dotTop}px"></div><div class="eline" style="top:${lineTop}px;height:${lineH}px"></div><div class="eyear" style="top:${evYearTop}px">${ev.year}</div></div>`;
  }).join(''):'';

  // --- People bars ---
  barsLayer.style.top=barsTop()+'px';
  barsLayer.style.width=W+'px';
  if(people.length){
    barsLayer.innerHTML=people.map(p=>{
      const top=p._lane*rowH;
      const pillW=p._pillW, alive=p._alive;
      const col=barBg(p);
      const fade=alive?`<span class="fade" style="left:${pillW}px;width:${FUTURE_FADE}px;background:${col}"></span>`:'';   // future fade for the living
      return `<div class="bar${alive?' alive':''}${state.selected===p.id?' sel':''}" data-id="${p.id}" style="left:${p._startX}px;top:${top}px;width:${pillW}px;background:${col}">${fade}<span class="lbl">${p.name}</span><button class="menu" data-menu="${p.id}" title="Opcions">⋮</button></div>`;
    }).join('');
  }else{
    barsLayer.innerHTML=`<div class="emptyState" style="top:6px">Clica una col·lecció a l\u0027esquerra o cerca un personatge — o estudia només els períodes.</div>`;
  }
  inner.style.height=contentH+'px';

  // --- Today line ---
  nowline.style.left=nowX+'px';
  nowline.style.height=contentH+'px';
  nowline.querySelector('.lbl').textContent='avui · '+NOW_YEAR;

  // --- Axis ticks (step chosen so labels are ~>=70px apart) ---
  axisEl.style.width=W+'px';
  axisInner.style.width=W+'px';
  const STEPS=[1,2,5,10,25,50,100,250,500,1000,2000,5000,10000];
  let step=STEPS[STEPS.length-1];
  for(const st of STEPS){if(st*pxPerYear>=70){step=st;break;}}
  let ticks=`<div class="tick tinf" style="left:2px">∞···</div><div class="tick tbound" style="left:${x(DATA_MIN)}px">${fmtY(DATA_MIN)}</div>`;
  const firstTick=Math.ceil((DATA_MIN+step*0.4)/step)*step;
  for(let y=firstTick;y<=YEAR_MAX;y+=step){ticks+=`<div class="tick" style="left:${x(y)}px">${fmtY(y)}</div>`;}
  axisInner.innerHTML=ticks;
  guide.style.height=contentH+'px';

  renderSidebar();
}

// Sidebar lists (rebuilt on every render so counts / checked states stay in sync).
function renderSidebar(){
  $('#regions').innerHTML=`<label class="filter"><input type="checkbox" data-events ${state.showEvents?'checked':''}><span class="swatch" style="background:var(--eventc)"></span>Esdeveniments</label>`+MARCS.map(m=>`<label class="filter"><input type="checkbox" data-marc="${m.id}" ${state.marcs.has(m.id)?'checked':''}><span class="swatch" style="background:${m.color}"></span>${m.name}</label>`).join('');
  $('#filters').innerHTML=Object.keys(AREA_COLORS).map(a=>{
    const pp=peopleOfArea(a);
    const on=state.activeCols.has(a);
    const onCount=pp.filter(p=>state.present.has(p.id)).length;
    const style=on?`background:${hexA(AREA_COLORS[a],.16)};border-color:${AREA_COLORS[a]};`:'';
    return `<div class="areaTag ${on?'on':'off'}" data-area="${a}" style="${style}"><span class="swatch" style="background:${AREA_COLORS[a]}"></span>${a}<span class="cnt">${onCount}/${pp.length}</span></div>`;
  }).join('');
  const present=PEOPLE.filter(p=>state.present.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'ca'));   // always alphabetical
  $('#onview').innerHTML=present.length?present.map(p=>`<div class="item"><span class="swatch" style="background:${swatchBg(p)}"></span>${p.name}${SEED_PINNED.includes(p.id)?'':`<button class="x" data-remove="${p.id}" title="Treu">×</button>`}</div>`).join(''):'<div class="empty">Cap personatge. Clica una col·lecció o cerca\u0027n un.</div>';
}

// ============================================================
// [6] DETAIL PANEL
// ============================================================
function closeDetailIfGone(){if(state.selected && !state.present.has(state.selected)){state.selected=null;$('#detail').classList.remove('open');}}

// Which movement/era a given year falls in (falls back to the macro-block, which has no gaps).
function eraLabel(year){
  const w=MARCS.find(m=>m.id==='west');
  const blk=w&&w.blocks.find(b=>year>=b.start&&year<b.end);   // Western movement, if any
  if(blk)return blk.name;
  const era=ERAS.find(e=>year>=e.start&&year<e.end);           // else the macro-era backbone
  return era?era.name:'—';
}

function openDetail(p){
  state.selected=p.id;
  const d=$('#detail');d.classList.add('open');
  d.innerHTML=`<button class="close" id="closeDetail">×</button>
    <h2>${p.name}</h2>
    <div class="life">${p.birth} – ${isAlive(p)?'actualitat':p.death}</div>
    <div class="areas">${hasCat(p)?p.areas.map(a=>`<span class="chip"><span class="swatch" style="background:${AREA_COLORS[a]}"></span>${a}</span>`).join(''):`<span class="chip"><span class="swatch" style="background:${NOCAT_COLOR}"></span>Sense categoria</span>`}</div>
    <div class="meta">Marc (Occident): ${eraLabel(p.birth)}</div>
    ${p.gender?`<div class="meta">Gènere: ${p.gender}</div>`:''}
    <div class="desc">${p.desc}</div>
    ${p.wiki?`<a class="wiki" href="${p.wiki}" target="_blank" rel="noopener">🔗 ${linkLabel(p.wiki)}</a>`:''}
    <div class="actions">
      <button class="dbtn" data-act="context">Mostra context</button>
      ${SEED_PINNED.includes(p.id)?'':`<button class="dbtn danger" data-act="remove">Elimina</button>`}
    </div>`;
  $('#closeDetail').onclick=()=>{d.classList.remove('open');state.selected=null;render();};
  d.querySelectorAll('.dbtn').forEach(btn=>btn.onclick=()=>{
    if(btn.getAttribute('data-act')==='remove')removePerson(p.id);else showContext(p.id);
  });
  render();
}

function openEvent(ev){
  state.selected=null;
  const d=$('#detail');d.classList.add('open');
  d.innerHTML=`<button class="close" id="closeDetail">×</button>
    <h2>${ev.name}</h2>
    <div class="life">Fita històrica · ${ev.year}</div>
    <div class="meta">Marc (Occident): ${eraLabel(ev.year)}</div>
    ${ev.desc?`<div class="desc">${ev.desc}</div>`:''}
    ${ev.wiki?`<a class="wiki" href="${ev.wiki}" target="_blank" rel="noopener">🔗 ${linkLabel(ev.wiki)}</a>`:''}`;
  $('#closeDetail').onclick=()=>{d.classList.remove('open');render();};
  render();
}

// ============================================================
// [7] SEARCH (add a person to the timeline by name)
// ============================================================
const q=$('#q'),results=$('#results');
const deaccent=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();   // case- & accent-insensitive
let searchIdx=-1, wdTerm='', wdResults=[], wdLoading=false, wdTimer=null, wdSeq=0;

const localRow=p=>{const added=state.present.has(p.id);return `<div class="row ${added?'disabled':''}" data-add="${p.id}"><span class="swatch" style="background:${swatchBg(p)}"></span>${p.name}<span class="yr">${added?'ja afegit':p.birth+'\u2013'+(p.death==null?'':p.death)}</span></div>`;};
const wdRow=w=>`<div class="row" data-wd="${w.qid}"><span class="swatch" style="background:${NOCAT_COLOR}"></span>${w.name}<span class="yr">${w.birth}${w.death!=null?'\u2013'+w.death:'\u2013'}</span></div>`;
function renderDropdown(){
  const term=deaccent(q.value.trim());
  if(!term){results.classList.remove('open');return;}
  const local=PEOPLE.filter(p=>deaccent(p.name).includes(term));
  let html=local.map(localRow).join('');
  if((wdResults.length||wdLoading)&&local.length)html+=`<div class="rowsep">Wikidata</div>`;
  html+=wdResults.map(wdRow).join('');
  if(wdLoading)html+=`<div class="row loading">Cercant a Wikidata\u2026</div>`;
  if(!local.length&&!wdResults.length&&!wdLoading)html=`<div class="row disabled">Cap coincid\u00e8ncia</div>`;
  results.innerHTML=html;results.classList.add('open');highlightSearch(0);
}
function runSearch(){
  const term=q.value.trim();
  if(!term){results.classList.remove('open');return;}
  if(deaccent(term)!==wdTerm){wdTerm=deaccent(term);wdResults=[];wdLoading=term.length>=2;scheduleWikidata(term);}
  renderDropdown();
}
// keyboard navigation over both local and Wikidata rows
const searchRows=()=>[...results.querySelectorAll('.row[data-add]:not(.disabled),.row[data-wd]')];
function highlightSearch(i){
  const rows=searchRows();
  results.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  if(!rows.length){searchIdx=-1;return;}
  searchIdx=(i+rows.length)%rows.length;
  rows[searchIdx].classList.add('active');
  rows[searchIdx].scrollIntoView({block:'nearest'});
}
function activateRow(r){if(!r)return;if(r.dataset.add)addFromSearch(r.dataset.add);else if(r.dataset.wd)addWikidataPerson(r.dataset.wd);}
function addFromSearch(id){
  if(!id||state.present.has(id))return;
  state.pinned.add(id);state.hidden.delete(id);q.value='';results.classList.remove('open');wdTerm='';wdResults=[];render();revealPerson(id);
}
// Wikidata person -> session-only entry in PEOPLE (no category; lost on reload)
function addWikidataPerson(qid){
  const w=wdResults.find(x=>x.qid===qid);if(!w||w.birth==null)return;
  const id='wd_'+qid;
  if(!PEOPLE.some(p=>p.id===id))PEOPLE.push({id,wd:qid,name:w.name,birth:w.birth,death:w.death,areas:guessAreas(w.desc),gender:'',wiki:w.article,desc:w.desc||'',_session:true});
  addFromSearch(id);
}

// --- Wikidata live search: humans only (P31=Q5), Catalan labels with es/en fallback ---
const wdYear=iso=>{const m=/^(-?\d+)/.exec(iso);if(!m)return null;const y=parseInt(m[1],10);return y<=0?y-1:y;};   // ISO astronomical -> our aC convention
const WDQ='https://query.wikidata.org/sparql?format=json&query=';
const WD_FIELDS='OPTIONAL { ?item wdt:P569 ?birth. } OPTIONAL { ?item wdt:P570 ?death. } OPTIONAL { ?article schema:about ?item ; schema:isPartOf <https://ca.wikipedia.org/> . } SERVICE wikibase:label { bd:serviceParam wikibase:language "ca,es,en". }';
function scheduleWikidata(term){clearTimeout(wdTimer);if(term.trim().length<2)return;wdTimer=setTimeout(()=>fetchWikidata(term.trim()),300);}
function wdParse(data){
  const binds=(data&&data.results&&data.results.bindings)||[], seen=new Set(), inDB=new Set(PEOPLE.map(p=>p.wd).filter(Boolean)), out=[];
  for(const b of binds){
    const qid=b.item.value.split('/').pop();
    if(seen.has(qid)||inDB.has(qid)||!b.birth)continue;   // dedup vs DB; need a birth year to place it
    seen.add(qid);
    out.push({qid,name:(b.itemLabel&&b.itemLabel.value)||qid,desc:(b.itemDescription&&b.itemDescription.value)||'',birth:wdYear(b.birth.value),death:b.death?wdYear(b.death.value):null,article:(b.article&&b.article.value)||('https://www.wikidata.org/wiki/'+qid)});
  }
  return out;
}
// resolve a list of Q-ids to {name,dates,article} via a fast VALUES query (optionally keep only humans)
function byIds(ids,humansOnly){
  if(!ids.length)return Promise.resolve([]);
  const query=`SELECT ?item ?itemLabel ?itemDescription ?birth ?death ?article WHERE { VALUES ?item { ${ids.map(q=>'wd:'+q).join(' ')} } ${humansOnly?'?item wdt:P31 wd:Q5.':''} ${WD_FIELDS} }`;
  return fetch(WDQ+encodeURIComponent(query),{headers:{Accept:'application/sparql-results+json'}}).then(r=>r.json()).then(data=>{
    const byq={};wdParse(data).forEach(x=>byq[x.qid]=x);
    return ids.map(q=>byq[q]).filter(Boolean);   // preserve the search-relevance order
  }).catch(()=>[]);
}
// primary: fast label/alias autocomplete (great ranking), then keep only humans
function entitySearch(term){
  const url='https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=15&language=ca&uselang=ca&search='+encodeURIComponent(term);
  return fetch(url).then(r=>r.json()).then(d=>byIds(((d.search||[]).map(x=>x.id).filter(t=>/^Q\d+$/.test(t))),true)).catch(()=>[]);
}
// fallback: full-text search (finds people by surname / mid-name that the autocomplete buries under common words)
function fulltextSearch(term){
  const safe=term.replace(/[^\p{L}\p{N} ]/gu,'').trim();if(!safe)return Promise.resolve([]);
  const url='https://www.wikidata.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=0&srlimit=10&srsearch='+encodeURIComponent(safe+'* haswbstatement:P31=Q5');
  return fetch(url).then(r=>r.json()).then(d=>byIds((((d.query&&d.query.search)||[]).map(x=>x.title).filter(t=>/^Q\d+$/.test(t))),false)).catch(()=>[]);
}
function fetchWikidata(term){
  const seq=++wdSeq;
  entitySearch(term).then(out=>{
    if(seq!==wdSeq)return;   // a newer search superseded this one
    if(out.length){wdResults=out;wdLoading=false;renderDropdown();return;}
    fulltextSearch(term).then(out2=>{if(seq!==wdSeq)return;wdResults=out2;wdLoading=false;renderDropdown();});
  });
}

q.addEventListener('input',runSearch);
q.addEventListener('focus',runSearch);
q.addEventListener('keydown',e=>{
  if(!results.classList.contains('open'))return;
  if(e.key==='ArrowDown'){e.preventDefault();highlightSearch(searchIdx+1);}
  else if(e.key==='ArrowUp'){e.preventDefault();highlightSearch(searchIdx-1);}
  else if(e.key==='Enter'){e.preventDefault();activateRow(searchRows()[searchIdx]);}
  else if(e.key==='Escape'){results.classList.remove('open');}
});
results.addEventListener('click',e=>{const row=e.target.closest('[data-add],[data-wd]');if(row)activateRow(row);});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.classList.remove('open');});

// ============================================================
// [8] EVENT LISTENERS (sidebar toggles · bar & event clicks)
// ============================================================
$('#regions').addEventListener('change',e=>{
  if(e.target.hasAttribute('data-events')){state.showEvents=e.target.checked;render();return;}   // events on/off
  const m=e.target.getAttribute('data-marc');if(!m)return;
  if(e.target.checked)state.marcs.add(m);else state.marcs.delete(m);render();
});
$('#filters').addEventListener('click',e=>{
  const tag=e.target.closest('[data-area]');if(!tag)return;
  const a=tag.getAttribute('data-area');
  if(state.activeCols.has(a)){state.activeCols.delete(a);}
  else{state.activeCols.add(a);peopleOfArea(a).forEach(p=>state.hidden.delete(p.id));}
  recomputePresent();closeDetailIfGone();render();
});
$('#onview').addEventListener('click',e=>{
  const b=e.target.closest('[data-remove]');if(!b)return;
  removePerson(b.getAttribute('data-remove'));
});
barsLayer.addEventListener('click',e=>{
  if(suppressClick)return;   // a drag just happened — don't treat the release as a click
  const mb=e.target.closest('.menu');           // the ⋮ button opens the context menu, not the detail
  if(mb){e.stopPropagation();openBarMenu(mb.getAttribute('data-menu'),mb);return;}
  const bar=e.target.closest('.bar');if(!bar)return;
  const p=PEOPLE.find(x=>x.id===bar.getAttribute('data-id'));if(p)openDetail(p);
});
document.addEventListener('click',e=>{if(!e.target.closest('.barmenu')&&!e.target.closest('.menu'))closeBarMenu();});
eventsRail.addEventListener('click',e=>{
  const el=e.target.closest('[data-ev]');if(!el)return;   // only the name is clickable (not the year)
  const ev=EVENTS.find(x=>x.id===el.getAttribute('data-ev'));if(ev)openEvent(ev);
});

// ============================================================
// [9] ZOOM & PAN
// ============================================================
const scroll=$('#scroll');
function fitPx(){const vw=scroll.clientWidth-24;return Math.max(0.005,vw/(YEAR_MAX-YEAR_MIN));}          // zoom that fits the whole span
const FOCUS_FROM=1500;
const FUTURE_MARGIN_PX=240;   // fixed px reserved past "today" so grown living-pills + fade never hug/clip the right edge
function focusPx(){const vw=Math.max(60,scroll.clientWidth-24-FUTURE_MARGIN_PX);return Math.max(fitPx(),Math.min(20,vw/(NOW_YEAR-FOCUS_FROM)));}   // default focus ~1500→today, with future margin
function defaultView(){pxPerYear=focusPx();render();scroll.scrollLeft=Math.max(0,x(FOCUS_FROM)-16);}
function setZoom(v){pxPerYear=Math.max(fitPx(),Math.min(20,v));render();}
// Pan (no zoom change) so a person's bar is centred on screen.
function panToPerson(id){
  const p=PEOPLE.find(x=>x.id===id);
  if(!p||p._startX==null)return;
  const cx=p._startX+p._pillW/2;            // horizontal centre of the bar
  const cy=barsTop()+p._lane*34+13;         // vertical centre (rowH 34, bar 26 → +13)
  scroll.scrollTo({left:cx-scroll.clientWidth/2,top:cy-scroll.clientHeight/2,behavior:'smooth'});
}
// Flash a bar so it's easy to spot among others.
function flashBar(id){
  const b=barsLayer.querySelector(`.bar[data-id="${id}"]`);
  if(b){b.classList.remove('justAdded');void b.offsetWidth;b.classList.add('justAdded');setTimeout(()=>b.classList.remove('justAdded'),4100);}
}
function revealPerson(id){panToPerson(id);flashBar(id);}

// Remove a person from the canvas (same as the × in "A la vista"). Seed-pinned people can't be removed.
function removePerson(id){
  if(SEED_PINNED.includes(id))return;
  state.pinned.delete(id);state.hidden.add(id);
  recomputePresent();deactivateEmptyCols();closeDetailIfGone();render();
}
// "Show context": add every DB person whose life overlaps, or is within 20 years of, this person.
function showContext(id){
  const t=PEOPLE.find(p=>p.id===id);if(!t)return;
  const a1=t.birth,a2=deathOf(t);
  PEOPLE.forEach(o=>{
    if(o.id===id||state.present.has(o.id))return;
    const gap=Math.max(0,Math.max(o.birth-a2,a1-deathOf(o)));   // 0 if the lifespans overlap
    if(gap<=20){state.pinned.add(o.id);state.hidden.delete(o.id);}
  });
  recomputePresent();render();panToPerson(id);
}

// Little ⋮ menu anchored to a bar (or opened from the detail panel).
const barmenu=$('#barmenu');
function openBarMenu(id,anchorEl){
  const rm=SEED_PINNED.includes(id)?'':`<button class="danger" data-act="remove" data-id="${id}">Elimina</button>`;
  barmenu.innerHTML=`<button data-act="context" data-id="${id}">Mostra context</button>${rm}`;
  const r=anchorEl.getBoundingClientRect();
  barmenu.style.left=Math.min(r.left,window.innerWidth-170)+'px';
  barmenu.style.top=(r.bottom+4)+'px';
  barmenu.classList.add('open');
}
function closeBarMenu(){barmenu.classList.remove('open');}
barmenu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.getAttribute('data-id');
  if(b.getAttribute('data-act')==='remove')removePerson(id);else showContext(id);
  closeBarMenu();
});
// Zoom keeping the year under the pointer fixed.
function zoomAt(clientX,factor){
  const rect=scroll.getBoundingClientRect();
  const pointerInner=(clientX-rect.left)+scroll.scrollLeft;
  const yearAt=YEAR_MIN+pointerInner/pxPerYear;
  setZoom(pxPerYear*factor);
  const newInner=(yearAt-YEAR_MIN)*pxPerYear;
  scroll.scrollLeft=newInner-(clientX-rect.left);
}
$('#zoomIn').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1.4);};
$('#zoomOut').onclick=()=>{const r=scroll.getBoundingClientRect();zoomAt(r.left+scroll.clientWidth/2,1/1.4);};
$('#reset').onclick=()=>{state.present=new Set();state.activeCols=new Set();state.pinned=new Set(SEED_PINNED);state.hidden=new Set();state.marcs=new Set(DEFAULT_MARCS);state.showEvents=true;state.selected=null;$('#detail').classList.remove('open');defaultView();};

// Trackpad pinch / ⌘+wheel → zoom.
scroll.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const factor=Math.exp(-e.deltaY*0.01);
  zoomAt(e.clientX,factor);
},{passive:false});

// Hover guide (vertical year line). Suppressed while dragging.
scroll.addEventListener('mousemove',e=>{
  if(drag)return;
  const rect=inner.getBoundingClientRect();
  const offX=e.clientX-rect.left;
  if(offX<0||offX>totalW()){guide.style.display='none';return;}
  const year=Math.round(YEAR_MIN+offX/pxPerYear);
  guide.style.display='block';
  guide.style.left=offX+'px';
  guide.querySelector('.yr').textContent=year;
});
scroll.addEventListener('mouseleave',()=>{guide.style.display='none';});

// Click-and-drag panning. Not started over a person bar (there, click = open detail).
let drag=null,suppressClick=false;
scroll.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.closest('.bar'))return;
  guide.style.display='none';
  drag={x:e.clientX,y:e.clientY,sl:scroll.scrollLeft,st:scroll.scrollTop,moved:false};
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;scroll.classList.add('grabbing');guide.style.display='none';}
  if(drag.moved){scroll.scrollLeft=drag.sl-dx;scroll.scrollTop=drag.st-dy;e.preventDefault();}
});
window.addEventListener('mouseup',()=>{
  if(!drag)return;
  const moved=drag.moved;drag=null;scroll.classList.remove('grabbing');
  if(moved){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}   // swallow the click that follows a real drag
});

// ============================================================
// [10] BOOT (wait for a real width before the first fit)
// ============================================================
function bootDefault(){if(scroll.clientWidth>0){defaultView();}else{requestAnimationFrame(bootDefault);}}
bootDefault();
window.addEventListener('resize',render);
</script>
</body>
