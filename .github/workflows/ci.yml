name: CI

on:
  push:
    branches: [main]

# El desplegament a Pages necessita escriure-hi i demanar un token OIDC. La resta de feines
# nomes llegeixen el codi. Posar-ho a dalt val per a totes.
permissions:
  contents: read
  pages: write
  id-token: write

# Nomes un desplegament a la vegada, i SENSE cancel·lar el que ja corre: si es cancel·la a
# mitges, Pages es pot quedar amb un desplegament penjat.
concurrency:
  group: pages
  cancel-in-progress: false

# Accions a versions que corren amb Node 24 (16/11/2026): les @v4 i companyia eren Node 20 i
# GitHub en donava un avís de deprecació a cada execució. upload-pages-artifact@v5 ja no posa els
# fitxers que comencen per punt al paquet: el web no en fa servir cap.
# Sistema fixat a ubuntu-24.04: ubuntu-latest passa a Ubuntu 26 i GitHub ho avisava a cada
# execució. Canviar de versió ha de ser una decisió, no una sorpresa al CI.
jobs:
  structural:
    name: Checks estructurals
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Codificació — U+FFFD i UTF-8 vàlid
        run: |
          python3 - <<'EOF'
          import sys, os
          EXTS = (".html", ".js", ".css", ".json", ".md")
          SKIP = {"node_modules", ".git", "dist", "build", "playwright-report"}
          def ctx(t, i, pad=40):
              a=max(0,i-pad); b=min(len(t),i+pad+1)
              return t[a:i]+"[[»"+t[i]+"«]]"+t[i+1:b]
          problems=0; checked=0
          for root, dirs, files in os.walk("."):
              dirs[:]=[d for d in dirs if d not in SKIP]
              for name in files:
                  if not name.endswith(EXTS): continue
                  path=os.path.join(root,name); raw=open(path,"rb").read()
                  try: text=raw.decode("utf-8")
                  except UnicodeDecodeError as e:
                      print(f"❌ {path}: bytes UTF-8 invàlids a l'offset {e.start}: {e.reason}"); problems+=1
                      text=raw.decode("utf-8","replace")
                  line=1; col=0
                  for i,ch in enumerate(text):
                      if ch=="\n": line+=1; col=0; continue
                      col+=1
                      if ch=="�":
                          print(f"❌ {path}:{line} U+FFFD (col {col}) → ...{ctx(text,i).replace(chr(10),'⏎')}...")
                          problems+=1
                  checked+=1
          if problems: print(f"\n{problems} problema(es)."); sys.exit(1)
          print(f"✓ Cap U+FFFD, UTF-8 vàlid — {checked} fitxers")
          EOF

      # Aquest check estava TRENCAT i sempre passava en verd: el sed buscava
      # "===== Bloc compartit", i els marcadors reals son "===== BLOC COMPARTIT"
      # (majuscules) i "===== Botons de seccio". No lligava amb cap dels dos, aixi
      # que extreia 0 linies dels dos fitxers i feia el diff de dues cadenes buides.
      # Per aixo una divergencia real del bloc JS va passar mesos desapercebuda.
      # Ara: es busquen els marcadors de veritat, es comproven ELS DOS blocs (CSS i
      # JS) i els 11 tokens compartits del :root, i es PETA si un marcador no hi es
      # — que no trobar el bloc no pot tornar a comptar com a "identics".
      - name: Bloc compartit byte-idèntic (index ↔ joc)
        run: |
          python3 - <<'EOF'
          import sys

          FILES = ('index.html', 'joc.html')
          BLOCKS = (
              ('CSS (botons de seccio)', '/* ===== Botons de secció', '/* ===== fi del bloc compartit ===== */'),
              ('JS (compressio topbar)', '// ===== BLOC COMPARTIT',   '// ===== fi del bloc compartit ====='),
          )

          src = {f: open(f, encoding='utf-8').read() for f in FILES}
          fail = []

          def extract(text, path, ini, fi):
              i = text.find(ini)
              if i < 0:
                  return None, 'no hi ha el marcador d\'inici %r' % ini
              j = text.find(fi, i)
              if j < 0:
                  return None, 'no hi ha el marcador de fi %r' % fi
              return text[i:j + len(fi)], None

          for label, ini, fi in BLOCKS:
              got = {}
              for f in FILES:
                  blk, err = extract(src[f], f, ini, fi)
                  if err:
                      fail.append('%s a %s: %s' % (label, f, err))
                  else:
                      got[f] = blk
              if len(got) == 2:
                  a, b = got['index.html'], got['joc.html']
                  if a != b:
                      import difflib
                      fail.append('%s divergeix (index %d bytes, joc %d bytes):\n%s' % (
                          label, len(a), len(b),
                          '\n'.join(list(difflib.unified_diff(
                              a.split('\n'), b.split('\n'),
                              'index.html', 'joc.html', lineterm='', n=1))[:40])))
                  else:
                      print('OK: %s identic (%d bytes)' % (label, len(a)))

          # Tokens compartits del :root: duplicats als dos fitxers a ma, i divergeixen
          # sense avisar (CLAUDE.md). Es comproven nomes els que surten als DOS.
          import re
          def toks(text):
              m = re.search(r':root\{(.*?)\}', text, re.S)
              if not m:
                  return None
              return dict((k, v.strip()) for k, v in re.findall(r'(--[\w-]+)\s*:\s*([^;]+);', m.group(1)))

          ta, tb = toks(src['index.html']), toks(src['joc.html'])
          if ta is None or tb is None:
              fail.append('no trobo el bloc :root a %s' % ('index.html' if ta is None else 'joc.html'))
          else:
              shared = sorted(set(ta) & set(tb))
              if not shared:
                  fail.append(':root sense cap token compartit — el regex ja no lliga?')
              bad = [(k, ta[k], tb[k]) for k in shared if ta[k] != tb[k]]
              for k, x, y in bad:
                  fail.append('token %s despariat: index=%s / joc=%s' % (k, x, y))
              if not bad:
                  print('OK: %d tokens :root compartits, tots iguals' % len(shared))

          if fail:
              sys.exit('ERROR bloc compartit:\n- ' + '\n- '.join(fail))
          print('OK: blocs compartits i tokens sincronitzats')
          EOF

      # El guard de db.js talla les col·leccions massa grosses i ho diu per consola,
      # pero aixo ja es en viu. Aqui hi petem, que es el moment bo: una col·leccio de 500
      # persones ni carregaria (byIds fa UNA consulta SPARQL i Wikidata dona 414 a partir
      # d'uns 600 Q-ids) ni es podria llegir (carrils ~ persones en el pitjor cas, i 60
      # carrils ja son 3 pantalles de scroll vertical). El sostre viu a l'index.html com a
      # COLL_MAX i es llegeix d'alla: un sol lloc per canviar-lo.
      - name: Col·leccions dins del sostre
        run: |
          python3 - <<'EOF'
          import re, sys

          src = open('db.js', encoding='utf-8').read()

          m = re.search(r'const\s+COLL_MAX\s*=\s*(\d+)\s*,\s*WD_IDS_MAX\s*=\s*(\d+)', src)
          if not m:
              sys.exit("ERROR: no trobo COLL_MAX/WD_IDS_MAX a db.js "
                       "(s'han renombrat? el check els llegeix d'alla)")
          COLL_MAX, WD_IDS_MAX = int(m.group(1)), int(m.group(2))
          if COLL_MAX > WD_IDS_MAX:
              sys.exit("ERROR: COLL_MAX (%d) no pot passar de WD_IDS_MAX (%d)" % (COLL_MAX, WD_IDS_MAX))

          i = src.find('const COLLECTIONS=[')
          if i < 0:
              sys.exit("ERROR: no trobo COLLECTIONS a db.js")
          depth, end = 0, None
          for k in range(i + len('const COLLECTIONS='), len(src)):
              if src[k] == '[':
                  depth += 1
              elif src[k] == ']':
                  depth -= 1
                  if depth == 0:
                      end = k
                      break
          if end is None:
              sys.exit("ERROR: el bloc COLLECTIONS no tanca")
          blk = src[i:end + 1]

          starts = [x.start() for x in re.finditer(r"\{id:'", blk)] + [len(blk)]
          fail, seen = [], set()
          for n in range(len(starts) - 1):
              seg = blk[starts[n]:starts[n + 1]]
              cid = re.search(r"\{id:'([^']+)'", seg).group(1)
              qids = re.findall(r"'(Q\d+)'", seg)
              if cid in seen:
                  fail.append("id de col·leccio repetit: '%s'" % cid)
              seen.add(cid)
              if not qids:
                  fail.append("'%s' no te cap Q-id" % cid)
              dup = len(qids) - len(set(qids))
              if dup:
                  fail.append("'%s' te %d Q-id(s) repetits" % (cid, dup))
              if len(qids) > COLL_MAX:
                  fail.append("'%s' te %d persones i el sostre es %d "
                              "(parteix-la, o apuja COLL_MAX a db.js si saps que fas)"
                              % (cid, len(qids), COLL_MAX))
              print("  %-18s %3d persones" % (cid, len(qids)))

          if fail:
              sys.exit("ERROR col·leccions:\n- " + "\n- ".join(fail))
          print("OK: %d col·leccions, cap passa de COLL_MAX=%d" % (len(seen), COLL_MAX))
          EOF

      # Diccionari i18n. t() d'una clau que no existeix torna '' (un botó en blanc, sense cap
      # error) i una clau que falta en un idioma cau al català sense dir res: tots dos buits són
      # invisibles al navegador. Aquí: (1) cada clau que el codi fa servir existeix al català;
      # (2) cada idioma té EXACTAMENT les mateixes claus que el català. El de text per pantalla
      # (el que s'escapa del diccionari) el fa tests/i18n.spec.js amb la pseudotraducció.
      - name: Diccionari i18n — claus
        run: |
          python3 - <<'EOF'
          import re, sys

          KEY = re.compile(r"(?m)(?:^\s*|[,{]\s*)([a-z][a-z0-9_]*)\s*:(?![:/])")
          LANGHDR = re.compile(r"(?m)^\s*([a-z]{2,3}):\{\s*$")
          fail = []
          db = open('db.js', encoding='utf-8').read()
          for f in ['index.html', 'joc.html']:
              s = open(f, encoding='utf-8').read()
              i = s.find('const I18N={'); j = s.find('function detectLang', i)
              if i < 0 or j < 0:
                  sys.exit("ERROR: no trobo 'const I18N={' ... 'function detectLang' a %s "
                           "(s'ha renombrat? el check llegeix el diccionari d'alla)" % f)
              blk = s[i:j]
              hdr = list(LANGHDR.finditer(blk))
              if not hdr or hdr[0].group(1) != 'ca':
                  sys.exit("ERROR: %s: el primer idioma del diccionari hauria de ser 'ca'" % f)
              langs = {}
              for n, h in enumerate(hdr):
                  seg = blk[h.end():(hdr[n + 1].start() if n + 1 < len(hdr) else len(blk))]
                  ks = KEY.findall(seg)
                  dup = sorted({k for k in ks if ks.count(k) > 1})
                  if dup:
                      fail.append("%s [%s]: claus repetides: %s" % (f, h.group(1), ', '.join(dup)))
                  langs[h.group(1)] = set(ks)
              ca = langs['ca']
              if len(ca) < 50:
                  sys.exit("ERROR: %s: només trobo %d claus al català; el parser s'ha quedat cec" % (f, len(ca)))

              # (2) mateixes claus a tots els idiomes
              for lg, ks in langs.items():
                  if lg == 'ca':
                      continue
                  falten, sobren = sorted(ca - ks), sorted(ks - ca)
                  if falten:
                      fail.append("%s [%s]: falten %d claus: %s" % (f, lg, len(falten), ', '.join(falten[:30])))
                  if sobren:
                      fail.append("%s [%s]: claus que el català no té: %s" % (f, lg, ', '.join(sobren[:30])))

              # (1) les que el codi fa servir, existeixen
              code = s[:i] + s[j:]
              usats = set(re.findall(r"\bt\('([a-z0-9_]+)'\s*[,)]", code))
              usats |= set(re.findall(r'data-i18n(?:-title|-aria)?="([a-z0-9_]+)"', code))
              usats |= set(re.findall(r"(?:titleKey|descKey)\s*:\s*'([a-z0-9_]+)'", code))
              usats |= set(re.findall(r"pushUndo\('([a-z0-9_]+)'", code))
              for k in sorted(usats - ca):
                  fail.append("%s: el codi fa servir t('%s') i no existeix al diccionari" % (f, k))
              # claus fetes a trossos: t('prefix'+x) -> ha d'haver-n'hi alguna amb el prefix
              for p in sorted(set(re.findall(r"\bt\('([a-z0-9_]+)'\s*\+", code))):
                  if not any(k.startswith(p) for k in ca):
                      fail.append("%s: t('%s'+...) i cap clau comença per '%s'" % (f, p, p))
              print("  %-10s %s · %d claus usades directament" % (
                  f, ' · '.join('%s %d' % (lg, len(ks)) for lg, ks in langs.items()), len(usats)))

              # categories: cada slug de CAT_COLORS ha de tenir la seva etiqueta (només a l'index)
              if f == 'index.html':
                  m = re.search(r"const CAT_COLORS\s*=\s*\{([^}]*)\}", db)
                  if not m:
                      sys.exit("ERROR: no trobo CAT_COLORS a db.js")
                  for slug in re.findall(r"([a-z]+)\s*:", m.group(1)):
                      if 'cat_' + slug not in ca:
                          fail.append("index.html: falta l'etiqueta cat_%s (CAT_COLORS en té el slug)" % slug)

          if fail:
              sys.exit("ERROR i18n:\n- " + "\n- ".join(fail))
          print("OK: diccionaris complets i coherents")
          EOF

      # Contingut de db.js en castella (fase 3 de l'i18n, 22/11/2026). Cada camp traduible porta
      # un germa amb sufix (name_es, desc_es, wiki_es) que la pagina posa al seu lloc en castella.
      # Si falta, la pagina en castella ensenya el catala sense dir res. El dashboard els escriu
      # sols en afegir una persona; aqui es comprova que cap no se n'escapi (afegida a ma, p.ex.).
      # '' es valid: vol dir «no n'hi ha» (desc sense castella ni angles, persona sense article).
      - name: Contingut en castellà (db.js)
        run: |
          python3 - <<'EOF'
          import re, sys
          src = open('db.js', encoding='utf-8').read()

          def seccio(nom):
              m = re.search(r"\nconst " + nom + r"\s*=\s*\[", src)
              if not m:
                  sys.exit("ERROR: no trobo 'const %s=[' a db.js" % nom)
              j = src.find('\n];', m.start())
              return src[m.start():j]

          def falten(o):
              return [f + '_es' for f in ('name', 'desc', 'wiki')
                      if re.search(r"\b" + f + r":'", o) and not re.search(r"\b" + f + r"_es:'", o)]

          fail, compte = [], {}
          # Una linia = un objecte a PEOPLE, EVENTS, ERAS i MARCS (marc i blocs).
          for nom in ('PEOPLE', 'EVENTS', 'ERAS', 'MARCS'):
              objs = [l for l in seccio(nom).split('\n') if re.search(r"\bname:'", l)]
              compte[nom] = len(objs)
              for o in objs:
                  qui = (re.search(r"\{id:'([^']+)'", o) or re.search(r"name:'([^']+)'", o)).group(1)
                  if falten(o):
                      fail.append("%s · %s: falta %s" % (nom, qui, ', '.join(falten(o))))
          # Les COLLECTIONS no hi son a posta: son com playlists, es respecta el nom i la
          # descripcio que els va posar qui les va crear, en el seu idioma (decisio d'en Bernat).
          # Els homenatges del Contemporanis (CON_PINNED, a joc.html) porten nom i descripcio propis:
          # el dashboard els escriu amb el castella, pero un d'escrit a ma se'n podria escapar.
          joc = open('joc.html', encoding='utf-8').read()
          mc = re.search(r"const\s+CON_PINNED\s*=\s*\{(.*?)\n[ \t]*\};", joc, re.S)
          if not mc:
              sys.exit("ERROR: no trobo CON_PINNED a joc.html")
          pins = [l for l in mc.group(1).split('\n') if re.search(r"\bname:'", l)]
          compte['CON_PINNED'] = len(pins)
          for o in pins:
              if falten(o):
                  fail.append("CON_PINNED · %s: falta %s" % (re.search(r"'(\d{4}-\d{2}-\d{2})'", o).group(1), ', '.join(falten(o))))
          if compte['PEOPLE'] < 50 or compte['EVENTS'] < 20 or compte['ERAS'] < 3:
              sys.exit("ERROR: el parser s'ha quedat cec: %r" % compte)
          if fail:
              sys.exit("ERROR: contingut sense castella (les persones, pel dashboard, que ho omple sol):\n- "
                       + "\n- ".join(fail))
          print("OK: tot el contingut amb castella · " + " · ".join("%s %d" % kv for kv in compte.items()))
          EOF

      - name: Sintaxi JS — claus equilibrades
        run: |
          python3 - <<'EOF'
          import re, sys
          # db.js tambe: des que la BD en va sortir, te el 21% del codi i un error alla
          # deixa les dues pagines sense dades.
          trossos = []
          html = open('index.html').read()
          m = re.search(r'<script>(.*)</script>', html, re.DOTALL)
          if not m:
              sys.exit('ERROR: no s\'ha trobat el bloc <script> de index.html')
          trossos.append(('index.html <script>', m.group(1)))
          trossos.append(('db.js', open('db.js', encoding='utf-8').read()))
          for nom, s in trossos:
              if s.count('{') != s.count('}'):
                  sys.exit(f'ERROR: claus desequilibrades a {nom} ({s.count("{")} open vs {s.count("}")} close)')
              print(f'OK: {nom} {len(s):,} chars, claus equilibrades')
          EOF

  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-portrait, mobile-landscape]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instal·la dependències
        run: npm install

      - name: Instal·la Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Corre els tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      # tests/noscroll.spec.js no peta mai: si una pantalla dels jocs fa scroll, ho apunta a
      # noscroll-warnings.txt i aqui es converteix en un avis groc a la pagina de l'execucio.
      - name: Avisos de scroll als jocs
        if: always() && matrix.project == 'desktop'
        run: |
          if [ -s noscroll-warnings.txt ]; then
            sort -u noscroll-warnings.txt | while IFS= read -r l; do echo "::warning title=Fa scroll::$l"; done
          else
            echo "Cap pantalla dels jocs fa scroll."
          fi

      - name: Puja l'informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # ⚠️ Fins al 27/09/2026 Pages anava en mode «deploy from a branch», i aixo volia dir que el
  # web s'actualitzava a CADA push, sense esperar ningu. Comprovat en directe: el
  # pages-build-deployment acabava ABANS que el CI comences els tests, aixi que un CI vermell
  # ho haurien sabut d'una cosa que ja feia minuts que era publica.
  # Ara el desplegament es una feina mes i depen de les altres: si els tests peten, el web es
  # queda amb l'ultima versio bona. El preu son els ~2 minuts que triga el CI.
  deploy:
    name: Publica a GitHub Pages
    needs: [structural, playwright]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ⚠️ Aixo NO hi era abans i cal. El mode antic passava per Jekyll, que ignora les
      # carpetes que comencen per «_», i per aixo _tools/ donava 404 al web. Desplegant per
      # Actions no hi ha Jekyll i es publicaria TOT: el dashboard i el dash.py inclosos.
      # S'hi afegeix tests/ i la configuracio, que tampoc pinten res al web (el
      # tests/smoke.spec.js si que s'hi servia, i no ha de servir-s'hi).
      - name: Treu del paquet el que no es el web
        run: rm -rf _tools tests .github playwright.config.js package.json package-lock.json node_modules

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
